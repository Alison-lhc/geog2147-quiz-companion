<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}html,body{margin:0}</style>
<title>GEOG2147 Quiz Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap">
<style>
/* Layout: card-catalogue drawer on the left (tabs, search, term rows); the opened card on the right
   shows slide content, study notes and key terms as English/Chinese point pairs. Phones: drawer, then card. */
:root {
  --bg: #f3f5f6; --paper: #ffffff; --ink: #17222a; --muted: #5d6c75; --line: #d7dfe3; --hit: #fff3c4; --sel: #e8f0f6;
  --zh: #4b5a63; --gloss: #0d7a72;
  --L1: #1f5f8b; --L2: #26735f; --L3: #5a4f9a; --L4: #9a4f1f; --L5: #8a2f5b; --L6: #2f6f73; --az: #17222a;
  --ex: #a8461c; --note: #c2416f; --key: #23805a; --tip: #b07614; --exp: #2e62a8;
  --f-ui: "IBM Plex Sans Condensed", "Noto Sans TC", system-ui, sans-serif;
  --f-zh: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181c; --paper: #172026; --ink: #e2e9ec; --muted: #94a4ac; --line: #2a373e; --hit: #4a3f12; --sel: #1d2b34;
  --zh: #b9c5cb; --gloss: #5ccbc1;
  --L1: #7fb8e0; --L2: #79c7ad; --L3: #b3a9ec; --L4: #efa874; --L5: #e78fb6; --L6: #7ccacf; --az: #e2e9ec;
  --ex: #f0a27c; --note: #e985a9; --key: #6cc79a; --tip: #e2b25a; --exp: #82aee6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11181c; --paper: #172026; --ink: #e2e9ec; --muted: #94a4ac; --line: #2a373e; --hit: #4a3f12; --sel: #1d2b34;
  --zh: #b9c5cb; --gloss: #5ccbc1;
  --L1: #7fb8e0; --L2: #79c7ad; --L3: #b3a9ec; --L4: #efa874; --L5: #e78fb6; --L6: #7ccacf; --az: #e2e9ec;
  --ex: #f0a27c; --note: #e985a9; --key: #6cc79a; --tip: #e2b25a; --exp: #82aee6; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; }
.EX { --c: var(--ex); } .L1 { --c: var(--L1); } .L2 { --c: var(--L2); } .L3 { --c: var(--L3); } .L4 { --c: var(--L4); } .L5 { --c: var(--L5); } .L6 { --c: var(--L6); }
button { font: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--L1); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(300px, 400px) 1fr; height: 100%; }
.drawer { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--bg); }
.dhead { padding-block: 14px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-bottom: 1px solid var(--line); }
.k { font: 600 11.5px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--L1); }
h1 { font-size: 22px; margin: 2px 0 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { flex: none; font-weight: 600; font-size: 13.5px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--paper); background: var(--c); border-color: var(--c); }
.srch { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
#q { flex: 1; min-width: 0; font: 15px var(--f-ui); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
#count { font: 500 11.5px var(--f-mono); color: var(--muted); white-space: nowrap; }
.list { flex: 1; overflow-y: auto; padding-block: 6px 40px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: 8px; }
.gh { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; font-weight: 600; margin: 8px 0 2px; padding: 3px 8px; color: var(--paper); background: var(--c); border-radius: 4px; }
.gh.az { --c: var(--az); width: 2.2em; justify-content: center; }
.gh small { margin-left: auto; font: 500 10.5px var(--f-mono); opacity: .85; }
.row { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: baseline; text-align: left; color: var(--ink); background: none; border: 0; border-bottom: 1px dotted var(--line); padding: 6px 6px; cursor: pointer; border-radius: 4px; }
.row:hover { background: var(--sel); }
.row[aria-current="true"] { background: var(--sel); box-shadow: inset 3px 0 0 var(--c); }
.row.hit .tm b { background: var(--hit); }
.tg { font: 600 10px var(--f-mono); color: var(--paper); background: var(--c); border-radius: 3px; padding: 1px 4px; }
.tm { min-width: 0; }
.tm b { font-weight: 600; }
.tm i { display: block; font-style: normal; font-family: var(--f-zh); color: var(--muted); font-size: 12.5px; }
.nm { font: 600 12.5px var(--f-mono); color: var(--c); white-space: nowrap; font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 16px 8px; }

.card { min-width: 0; overflow-y: auto; background: var(--paper); }
.cin { max-width: 46rem; margin: 0 auto; padding-block: 18px 80px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.back { display: none; }
.chead { border-left: 5px solid var(--c); padding: 2px 0 2px 14px; margin-bottom: 12px; }
.chead .meta { font: 600 12px var(--f-mono); color: var(--c); letter-spacing: .02em; }
.chead h2 { font-size: 25px; line-height: 1.2; margin: 4px 0 2px; text-wrap: balance; }
.chead .z { font-family: var(--f-zh); color: var(--zh); font-size: 17px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.pill { font: 600 12.5px var(--f-mono); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--ink); background: var(--bg); }
.pill b { color: var(--c); }
.jump { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 16px; position: sticky; top: 0; background: var(--paper); padding-block: 6px; z-index: 1; border-bottom: 1px solid var(--line); }
.jump a { font-size: 13px; font-weight: 600; text-decoration: none; color: var(--c); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; background: var(--paper); }
.sec { margin: 0 0 26px; scroll-margin-top: 52px; }
.sech { display: flex; align-items: baseline; gap: 10px; font-size: 18px; margin: 0 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--c); }
.sech small { font-family: var(--f-zh); color: var(--zh); font-weight: 500; font-size: 14.5px; }
.sl { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px 4px; margin: 0 0 12px; background: var(--bg); }
.slh { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.sn { flex: none; font: 600 11px var(--f-mono); color: var(--paper); background: var(--c); border-radius: 3px; padding: 2px 6px; }
.slh b { font-size: 15.5px; }
.slh .z { display: block; font-family: var(--f-zh); color: var(--zh); font-size: 13.5px; font-weight: 500; }
.subh { font-weight: 600; color: var(--c); margin: 12px 0 4px; }
.subh span { font-family: var(--f-zh); color: var(--zh); font-weight: 500; margin-left: 8px; font-size: .92em; }
.pt { display: grid; grid-template-columns: 1.1em 1fr; gap: 6px; margin: 0 0 8px; }
.pt.l1 { margin-left: 20px; } .pt.l2 { margin-left: 40px; }
.mk { color: var(--c); font: 600 11px/1.9 var(--f-mono); text-align: right; }
.pt .e { margin: 0; }
.pt .zline { margin: 1px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; line-height: 1.65; border-left: 2px solid color-mix(in srgb, var(--c) 50%, transparent); padding-left: 8px; }
.pt.row1 .e { font-size: 14.5px; }
.cl { font: 600 11px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 4px; }
.k-note { color: var(--note); } .k-key { color: var(--key); } .k-tip { color: var(--tip); } .k-ex, .k-explain { color: var(--exp); }
.pt.note .mk { color: var(--note); } .pt.note .zline { border-left-color: var(--note); }
.gl { color: var(--gloss); font-family: var(--f-zh); font-size: .9em; }
.gl::before { content: "（"; } .gl::after { content: "）"; }
.terms .t { border-bottom: 1px dotted var(--line); padding: 7px 0; }
.terms .t b { display: block; }
.terms .t .tz { font-family: var(--f-zh); color: var(--gloss); font-weight: 600; }
.terms .t p { margin: 2px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; }
.none { color: var(--muted); font-size: 14px; }
.nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 24px; }
.btn { font-weight: 600; font-size: 13.5px; color: var(--c, var(--L1)); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--c, var(--L1)); }
.welcome h2 { font-size: 24px; margin: 6px 0; }
.welcome p { color: var(--muted); max-width: 36rem; }
.welcome .zh { font-family: var(--f-zh); }

.ans { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px 14px; margin: 0 0 16px; background: var(--paper); box-shadow: 0 1px 0 var(--line); }
.aq { margin: 0 0 10px; padding-left: 3.6em; text-indent: -3.6em; }
.aq .sqn { display: inline-block; width: 3.2em; text-indent: 0; font: 600 13px var(--f-mono); color: var(--ex); }
.aq b { font-size: 15.5px; }
.mks { color: var(--zh); font-size: 13.5px; }
.aqz { display: block; text-indent: 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; margin-top: 2px; }
.ah { font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
.ah small { font-weight: 500; color: var(--muted); font-size: 12px; margin-left: 6px; }
.k-ex2 { color: var(--ex); }
.ap { display: grid; grid-template-columns: 1.4em 1fr; gap: 4px; margin: 0 0 9px 1.2em; }
.ap .tick { color: var(--key); font-weight: 700; }
.ap.exr .tick { color: var(--ex); }
.ap.exr.on { background: var(--hit); border-radius: 6px; padding: 4px 6px; margin-left: calc(1.2em - 6px); }
.ap .e { margin: 0; }
.ap .zline, .samp .zline { margin: 2px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; }
.ap .chips { margin: 4px 0 0; }
.ap .xn { font-size: inherit; }
.stag { font: italic 500 11.5px var(--f-mono); color: var(--muted); }
.stag.out { color: var(--note); }
.samp { margin: 12px 0 0 1.2em; padding: 8px 12px; border-radius: 6px; background: color-mix(in srgb, var(--key) 12%, var(--paper)); }
.samp .e { margin: 0; } .samp b { color: var(--key); font-size: 13px; }
.xg { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 0 0 12px; background: var(--bg); }
.xq { font-weight: 600; margin: 0 0 6px; }
.xq span { display: block; font-family: var(--f-zh); color: var(--zh); font-weight: 500; font-size: 14px; }
.xq .sqn { display: inline; font: 600 11px var(--f-mono); color: var(--paper); background: var(--ex); border-radius: 3px; padding: 2px 6px; margin-right: 4px; }
.xi { border-top: 1px dotted var(--line); padding: 8px 0 4px; }
.xn { font-weight: 600; font-size: 15.5px; background: none; border: 0; padding: 0; color: var(--ex); cursor: pointer; text-align: left; text-decoration: underline dotted; text-underline-offset: 3px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 6px 6px; vertical-align: middle; }
.chips.big { margin-left: 0; }
.chip { font: 500 11.5px var(--f-ui); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--ink); background: var(--paper); cursor: pointer; }
.chip:hover { border-color: var(--ex); }
.src { font: 500 11px var(--f-mono); color: var(--muted); margin: -2px 0 2px 1.6em; }
.model { margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--tip); background: var(--paper); border-radius: 0 6px 6px 0; }
.model .cl { margin-top: 0; }
.model .e { margin: 0; }
.model .zline { margin: 2px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; }
.rli { border-bottom: 1px dotted var(--line); padding-bottom: 8px; margin-bottom: 4px; }
.rli .row { border-bottom: 0; }
.why { font-size: 14px; margin: 4px 0 6px; padding: 6px 10px; background: var(--bg); border-radius: 6px; border-left: 3px solid var(--ex); }
.rli .why { margin-left: 6px; }
.why b { color: var(--ex); font-size: 12.5px; margin-right: 4px; }
.why .zline { display: block; margin: 2px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 13.5px; }

.mp { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px 10px; margin: 0 0 16px; background: var(--paper); box-shadow: 0 1px 0 var(--line); }
.mpq { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; margin: 0 0 8px; font-size: 15.5px; }
.mpq .sqn { font: 600 12px var(--f-mono); color: var(--paper); background: var(--ex); border-radius: 3px; padding: 2px 6px; }
.mpq .mks { color: var(--muted); font-weight: 500; font-size: 13.5px; }
.mpq .z { display: block; font-family: var(--f-zh); color: var(--zh); font-size: 14px; margin-top: 2px; }
.mph { font-weight: 600; font-size: 14px; margin: 12px 0 6px; padding-bottom: 3px; border-bottom: 1px dashed var(--line); }
.mph small { font-family: var(--f-zh); font-weight: 500; margin-left: 6px; }
.mph.ok { color: var(--key); } .mph.exh { color: var(--ex); }
.ma, .xi { display: grid; grid-template-columns: 1.3em 1fr; gap: 6px; margin: 0 0 9px; }
.tick { color: var(--key); font-weight: 700; }
.tri { color: var(--ex); font-weight: 700; }
.ma .e, .xi .e { margin: 0; }
.ma .zline, .xi .zline, .ss .zline, .xd .zline { margin: 2px 0 0; font-family: var(--f-zh); color: var(--zh); font-size: 14px; line-height: 1.6; }
.xi { border-top: 1px dotted var(--line); padding-top: 8px; }
.xi.rel { background: color-mix(in srgb, var(--ex) 7%, transparent); border-radius: 6px; padding: 8px 6px 4px; }
.xb { font-weight: 700; }
.relt { font: 600 10.5px var(--f-ui); color: var(--paper); background: var(--ex); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 1px; }
.src.out { color: var(--note); }
.src { display: inline; margin: 0; font-style: italic; }
.chips { margin-left: 0; }
.xd { margin: 4px 0 2px; padding-left: 18px; font-size: 14px; }
.xd li { margin: 0 0 6px; color: var(--ink); }
.xd li::marker { color: var(--ex); }
.xd.big { font-size: 15px; margin-left: 1.6em; }
.ss { margin: 10px 0 2px; padding: 8px 12px; border-left: 3px solid var(--key); background: color-mix(in srgb, var(--key) 9%, transparent); border-radius: 0 6px 6px 0; }
.ss p { margin: 0; }
.ss b { color: var(--key); font-size: 13.5px; margin-right: 4px; }
.mptag { font: 600 11px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--ex); margin: 0 0 6px; }
.mp.px { border-style: dashed; }
.mp.px .mptag { color: var(--L3); }
.mp.px .sqn { background: var(--L3); }
.QS { --c: var(--ex); } .QS.px { --c: var(--L3); }
mark { background: var(--hit); color: inherit; border-radius: 2px; padding: 0 1px; }

@media (max-width: 860px) {
  .app { display: block; }
  .drawer { height: 100%; border-right: 0; }
  .card { position: fixed; inset: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); }
  .app:not(.open) .card { display: none; }
  .back { display: inline-block; margin-bottom: 10px; }
}
</style>

</head>
<body>
<div class="app" id="app">
  <aside class="drawer">
    <div class="dhead">
      <div class="k">GEOG2147 · Open-book quiz · 20 Oct</div>
      <h1>Quiz Companion</h1>
      <div class="tabs" role="tablist" aria-label="Index views">
        <button class="tab" role="tab" data-v="az" style="--c:var(--az)">A–Z</button>
        <button class="tab" role="tab" data-v="lec" style="--c:var(--L1)">By lecture</button>
        <button class="tab" role="tab" data-v="L1" style="--c:var(--L1)">L1</button>
        <button class="tab" role="tab" data-v="L2" style="--c:var(--L2)">L2</button>
        <button class="tab" role="tab" data-v="L3" style="--c:var(--L3)">L3</button>
        <button class="tab" role="tab" data-v="L4" style="--c:var(--L4)">L4</button>
        <button class="tab" role="tab" data-v="L5" style="--c:var(--L5)">L5</button>
        <button class="tab" role="tab" data-v="L6" style="--c:var(--L6)">L6</button>
        <button class="tab" role="tab" data-v="pl" style="--c:var(--ex)">📍 Places 地點</button>
        <button class="tab" role="tab" data-v="qs" style="--c:var(--L3)">📝 Questions 題目</button>
      </div>
      <div class="srch"><input id="q" type="search" placeholder="Search terms, places or question words – e.g. buffer, Singapore, 私隱" autocomplete="off" aria-label="Search terms"><span id="count"></span></div>
    </div>
    <nav class="list" id="list" aria-label="Terms"></nav>
  </aside>
  <section class="card" id="card" aria-live="polite"><div class="cin" id="cin"></div></section>

源、房屋、交通、就業、公共服務等資源受壓","lvl":0,"num":false},{"en":"Citizens demand higher {transparency|透明度} of Government","zh":"市民要求政府提高透明度","lvl":0,"num":false}]},"22":{"n":22,"en":"Climate Change is Widespread, Rapid, and Intensifying – and it's down to us","zh":"氣候變化廣泛、急速並不斷加劇——責任在我們","p":[{"h":1,"en":"\"Code Red for Humanity\" – UN report gives {stark|嚴峻的} warning (IPCC, Climate Change 2021)","zh":"「人類紅色警報」——聯合國報告發出嚴峻警告（IPCC《氣候變化 2021》）"},{"en":"Global temperature is likely to rise ~1.5°C in the next 20 years (10 years earlier than previously expected)","zh":"全球氣溫很可能在未來 20 年上升約 1.5°C（比之前預期早 10 年）","lvl":0,"num":false},{"en":"Once-in-50-year heat waves could happen every decade","zh":"五十年一遇的熱浪可能每十年發生一次","lvl":0,"num":false},{"en":"Previously once-in-a-decade {droughts|旱災} could happen every 5 or 6 years","zh":"以往十年一遇的旱災可能每 5 至 6 年發生一次","lvl":0,"num":false},{"en":"Intergovernmental Panel on Climate Change (IPCC): over 14,000 scientific papers are referenced in the report","zh":"政府間氣候變化專門委員會（IPCC）：報告引用了超過 14,000 篇科學論文","lvl":0,"num":false},{"h":1,"en":"COP30 – Belém, Brazil, 10–21 Nov 2025","zh":"第 30 屆聯合國氣候變化大會——巴西貝倫，2025 年 11 月 10–21 日"},{"en":"$1.3 trillion Climate Finance by 2035 – largest {commitment|承諾} ever to help developing nations","zh":"到 2035 年提供 1.3 萬億美元氣候融資——有史以來幫助發展中國家的最大承諾","lvl":0,"num":false},{"en":"Nature-based solutions are center-stage. Protecting and restoring forests, {mangroves|紅樹林} & {wetlands|濕地} can reduce emissions by about 37% – making them essential to climate strategy","zh":"以自然為本的方案成為焦點。保護和修復森林、紅樹林及濕地可減少約 37% 排放——因此是氣候策略的關鍵","lvl":0,"num":false},{"en":"{Fossil fuel|化石燃料} roadmap remains a work in progress – no concrete, {binding|有約束力的} timetable","zh":"化石燃料路線圖仍在制定中——沒有具體、有約束力的時間表","lvl":0,"num":false},{"en":"Source: https://www.un.org/en/climatechange/reports","zh":"資料來源：https://www.un.org/en/climatechange/reports","lvl":0,"num":false}]},"23":{"n":23,"en":"Global – Climate Change is Widespread, Rapid, and Intensifying","zh":"全球——氣候變化廣泛、急速並不斷加劇","p":[{"en":"**Dubai:** the desert nation of UAE records its most rain ever, flooding highways and Dubai's airport","zh":"杜拜：沙漠國家阿聯酋錄得有史以來最多雨量，高速公路和杜拜機場被淹","lvl":0,"num":false},{"en":"**Australia:** bushfires (Victoria)","zh":"澳洲：山火（維多利亞州）","lvl":0,"num":false},{"en":"**Texas Floods 2025 (4 July):** 10\" of rain in hours; Guadalupe River rose 9 m in \u003c 1 hr; 1.8 trillion gallons of rain in 4 hrs (≈ 2.7 m Olympic pools)","zh":"2025 年德州水災（7 月 4 日）：數小時內下了 10 吋雨；瓜達盧佩河在不到 1 小時內上漲 9 米；4 小時內降下 1.8 萬億加侖雨水（約 270 萬個奧運泳池）","lvl":0,"num":false},{"en":"**UK & Ireland:** 14 {consecutive|連續的} storms led to widespread flooding, power {outages|停電}, and crop damage (Oct 2023 – Mar 2024). Named storms per season: 2016/17: 5, 2017/18: 8, 2018/19: 8, 2019/20: 6, 2020/21: 5, 2021/22: 6, 2022/23: 2, 2023/24: 14","zh":"英國及愛爾蘭：14 個連續風暴造成大範圍水浸、停電和農作物損毀（2023 年 10 月至 2024 年 3 月）。每季命名風暴數目：2016/17：5、2017/18：8、2018/19：8、2019/20：6、2020/21：5、2021/22：6、2022/23：2、2023/24：14","lvl":0,"num":false}]},"24":{"n":24,"en":"Hong Kong – Climate Change is Widespread, Rapid, and Intensifying","zh":"香港——氣候變化廣泛、急速並不斷加劇","p":[{"en":"Sept 2018 – Super Typhoon Mangkhut (tree collapse, landslide)","zh":"2018 年 9 月——超強颱風山竹（塌樹、山泥傾瀉）","lvl":0,"num":false},{"en":"Sept 2023 – \"Once-in-500-years\" rainstorm (flooding, road collapse)","zh":"2023 年 9 月——「五百年一遇」暴雨（水浸、道路塌陷）","lvl":0,"num":false},{"en":"Oct 2025 – Hottest October: average temperature 27.4°C (record-breaking); average max. 29.9°C; average min. 25.6°C","zh":"2025 年 10 月——最熱十月：平均氣溫 27.4°C（破紀錄）；平均最高 29.9°C；平均最低 25.6°C","lvl":0,"num":false},{"en":"Photo credits: SCMP, Reuters, HKSAR Govt","zh":"相片來源：南華早報、路透社、香港特區政府","lvl":0,"num":false}]},"25":{"n":25,"en":"4 Typhoons Active at the Same Time in November","zh":"十一月四個颱風同時出現","p":[{"en":"Nov 2024: 4 storms {churned|翻騰} {simultaneously|同時} in the Western Pacific Ocean – Yin Xing (銀杏), Toraji (桃芝), Usagi (天兔), Man Yi (萬宜)","zh":"2024 年 11 月：四個風暴同時在西北太平洋翻騰——銀杏、桃芝、天兔、萬宜","lvl":0,"num":false},{"en":"The first time in history that 4 typhoons were active at the same time in November.","zh":"歷史上首次在十一月有四個颱風同時活躍。","lvl":0,"num":false},{"en":"Weather satellite imagery from NOAA (National Oceanic and Atmospheric Administration)","zh":"美國國家海洋和大氣管理局（NOAA）氣象衞星圖","lvl":0,"num":false}]},"26":{"n":26,"en":"The Challenges of Hong Kong","zh":"香港面對的挑戰","p":[{"en":"Aging Population · 2015: 1 in 10 aged 65+ · 2025: 1 in 4 aged 65+ · 2046: 1 in 2.8 aged 65+ (36%) · CSD 政府統計處","zh":"人口老化","row":1},{"en":"Aging Buildings · 2046: 326K private units aged 70+ (300 times increase from 2015) · DEVB 發展局","zh":"樓宇老化","row":1},{"en":"Aging Lifts · ~73K lifts in HK; ~67% (~48K) aged 21+ · LegCo Secretariat 立法會秘書處","zh":"升降機老化","row":1}]},"27":{"n":27,"en":"What is a Smart City? Technology & Innovation could make a city smart","zh":"甚麼是智慧城市？科技與創新可令城市變得智慧","p":[{"en":"The use of ICT (Information and Communications Technology) to improve the quality of life and city services, making the city more {livable|宜居}.","zh":"運用資訊及通訊科技（ICT）改善生活質素和城市服務，令城市更宜居。","lvl":0,"num":false},{"en":"Ultimate goals:","zh":"最終目標：","lvl":0,"num":false},{"en":"Enhance quality of life","zh":"提升生活質素","lvl":1,"num":false},{"en":"{Foster|促進} sustainable growth","zh":"促進可持續增長","lvl":1,"num":false},{"en":"Key word: **{SUSTAINABILITY|可持續性}**","zh":"關鍵詞：可持續性","lvl":0,"num":false}]},"28":{"n":28,"en":"Sustainability Requires… One Single Ecosystem – Mapping Common Ground","zh":"可持續發展需要⋯⋯單一生態系統——繪製共同基礎","p":[{"en":"We see the world as One Single {Ecosystem|生態系統}. Geography provides the science & language to do this.","zh":"我們把世界視為一個單一生態系統。地理學提供做到這點的科學和語言。","lvl":0,"num":false},{"en":"Three connected systems: **Social** (peace, health & welfare, equity & equality, population, education), **Economic** (development, industrialization, energy, infrastructure, financial), **Environmental** (oceans, climate, biodiversity, forests, water, ecosystem services)","zh":"三個互相連繫的系統：社會（和平、健康與福利、公平與平等、人口、教育）、經濟（發展、工業化、能源、基建、金融）、環境（海洋、氣候、生物多樣性、森林、水、生態系統服務）","lvl":0,"num":false},{"en":"GIS roles: Organizing & Integrating All the Factors; Providing a Framework for Understanding and Applying Our Knowledge; {Illuminating|揭示} Patterns & Discovering Relationships; Enabling","zh":"GIS 的角色：組織和整合所有因素；提供理解和應用知識的框架；揭示規律及發現關係；賦能","lvl":0,"num":false},{"en":"**One Map Planning** – GIS enables… **The Geographic Approach**: a way of thinking & problem solving that integrates geographic science & information into how we understand and manage our planet","zh":"「一張地圖規劃」——GIS 實現⋯⋯「地理方法」：一種把地理科學和資訊融入我們理解和管理地球方式的思考及解難方法","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Use GIS to map the world as one single ecosystem.","zh":"用 GIS 把世界繪成一個單一生態系統。","kind":"note"}]},"29":{"n":29,"en":"Leverage on Technologies for Better City Management","zh":"善用科技，改善城市管理","p":[{"en":"ICT is the {backbone|骨幹} of any society that wants to achieve \"smart\" status","zh":"ICT 是任何想達到「智慧」水平的社會的骨幹","lvl":0,"num":false},{"en":"Technologies shown: **IoT**, **Big Data**, **AI** – all on a **GIS** platform","zh":"圖中技術：物聯網、大數據、人工智能——全部建基於 GIS 平台","lvl":0,"num":false}]},"30":{"n":30,"en":"Smart City Components & 3 Phases of Smart City – Dr. Boyd Cohen","zh":"智慧城市的組成部分及三個階段——Boyd Cohen 博士","p":[{"en":"6 components: Smart People, Smart Economy, Smart Mobility, Smart Environment, Smart Living, Smart Government","zh":"六大組成部分：智慧市民、智慧經濟、智慧出行、智慧環境、智慧生活、智慧政府","lvl":0,"num":false},{"en":"Smart City 1.0 – Technology-driven","zh":"智慧城市 1.0——科技主導","lvl":0,"num":false},{"en":"Smart City 2.0 – Government-driven","zh":"智慧城市 2.0——政府主導","lvl":0,"num":false},{"en":"Smart City 3.0 – Citizen-driven. **Smart City 3.0 is the ultimate goal!**","zh":"智慧城市 3.0——市民主導。智慧城市 3.0 是終極目標！","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Data-driven city: hope the government can provide more open data for citizens to use and build maps, link the data, and be equipped with AI.","zh":"數據驅動城市：希望政府能提供更多開放數據，讓市民使用和製作地圖、連結數據，並配備 AI。","kind":"note"},{"en":"Use GIS to build up these 6 pillars. Citizens should know about the bottom-up approach.","zh":"用 GIS 建立這六大支柱。市民應認識由下而上的方式。","kind":"note"},{"h":2,"kind":"tip","en":"Spelling","zh":""},{"en":"The slide writes \"Dr. Boyed Cohen\" and \"3 Phrases\"; the correct forms are **Boyd Cohen** and **3 Phases**. Use the correct spelling in your report.","zh":"投影片寫成「Boyed Cohen」和「3 Phrases」；正確寫法是 Boyd Cohen 和 3 Phases（階段）。報告中請用正確拼法。","kind":"tip"}]},"31":{"n":31,"en":"Smart City Applications Improve Key Quality-of-Life Indicators by 10 to 30%","zh":"智慧城市應用可把主要生活質素指標改善 10% 至 30%","p":[{"en":"Smart city technologies have {substantial|大量的} unrealized potential to improve the quality of life","zh":"智慧城市技術在改善生活質素方面仍有大量未發揮的潛力","lvl":0,"num":false},{"en":"Source: \"Smart Cities: Digital Solutions For A More Livable Future\", June 2018, McKinsey Global Institute","zh":"資料來源：《智慧城市：打造更宜居未來的數碼方案》，2018 年 6 月，麥肯錫全球研究院","lvl":0,"num":false},{"en":"Environmental quality 環境質素 · GHG emissions ▼10–15%; water consumption ▼20–30%; unrecycled waste ▼10–20%","zh":"溫室氣體排放 ▼10–15%；用水 ▼20–30%；未回收廢物 ▼10–20%","row":1},{"en":"Health 健康 · Disease burden ▼8–15%","zh":"疾病負擔 ▼8–15%","row":1},{"en":"Time and convenience 時間與便利 · Commute time ▼15–20%; time spent interacting with healthcare and government ▼45–65%","zh":"通勤時間 ▼15–20%；與醫療及政府打交道的時間 ▼45–65%","row":1},{"en":"Safety 安全 · Fatalities ▼8–10%; crime incidents ▼30–40%; emergency response time ▼20–35%","zh":"死亡人數 ▼8–10%；罪案 ▼30–40%；緊急應變時間 ▼20–35%","row":1},{"en":"Cost of living 生活成本 · Citizen expenditures ▼1–3%","zh":"市民開支 ▼1–3%","row":1},{"en":"Jobs 就業 · Formal employment ▲1–3%","zh":"正式就業 ▲1–3%","row":1},{"en":"Social connectedness & civic participation · Citizens feel connected to local community ▲15 percentage points; to local government ▲25 p.p.","zh":"社會連繫與公民參與 · 市民對社區的歸屬感 ▲15 個百分點；對地方政府 ▲25 個百分點","row":1}]},"32":{"n":32,"en":"Setting Custom Metrics & Goals when Developing Smart Cities","zh":"發展智慧城市時訂立自訂指標和目標","p":[{"en":"Countries develop smart city initiatives with their own goals:","zh":"各國按自己的目標推行智慧城市措施：","lvl":0,"num":false},{"en":"**Copenhagen** (smart environment) – 80% emission cut since 2005; Climate Positive by 2035","zh":"哥本哈根（智慧環境）——自 2005 年起減排 80%；2035 年實現「氣候正效益」","lvl":1,"num":false},{"en":"**Sweden** (smart mobility) – Vision Zero; lowest {fatalities|死亡人數} rate in the EU","zh":"瑞典（智慧出行）——「零死亡願景」；歐盟中交通死亡率最低","lvl":1,"num":false},{"en":"**Dubai** – happiness","zh":"杜拜——幸福","lvl":1,"num":false},{"en":"**London** – FinTech capital","zh":"倫敦——金融科技之都","lvl":1,"num":false},{"en":"**Singapore** (smart government)","zh":"新加坡（智慧政府）","lvl":1,"num":false},{"en":"**China** – \"Beautiful China\" (美麗中國)","zh":"中國——「美麗中國」","lvl":1,"num":false}]},"33":{"n":33,"en":"Developing KPIs to Measure & Track Innovation & Technology Spending","zh":"制定關鍵績效指標，衡量及追蹤創新科技開支","p":[{"en":"KPI = Key Performance {Indicator|指標}","zh":"KPI ＝關鍵績效指標","lvl":0,"num":false},{"en":"No. of {Unicorns|獨角獸企業}; No. of Startups; Employment Figures; R&D {Expenditure|開支} (% of GDP); No. of {Patents|專利}; International Rankings; + more","zh":"獨角獸企業數目；初創數目；就業數字；研發開支（佔本地生產總值 %）；專利數目；國際排名；及其他","lvl":0,"num":false}]},"34":{"n":34,"en":"How about HK? What should be the positioning of HK as a smart city?","zh":"香港呢？香港作為智慧城市應如何定位？","p":[{"en":"**Smart People – Talent and Innotech Hub**","zh":"智慧市民——人才及創科樞紐","lvl":0,"num":false},{"en":"Questions to think about: What? When? How?","zh":"思考問題：做甚麼？何時做？怎樣做？","lvl":0,"num":false}]},"35":{"n":35,"en":"Hong Kong as a Smart & Competitive City","zh":"香港：智慧而具競爭力的城市","p":[{"en":"**IMD Smart City Index 2026 – HK No. 21.** Top 10: Zurich, Oslo, Geneva, London, Copenhagen, Dubai, Lausanne, Canberra, Singapore, Abu Dhabi. 11–21: Helsinki, Seoul, Prague, Stockholm, Hamburg, Beijing, Amsterdam, Ljubljana, Munich, Shanghai, Hong Kong.","zh":"IMD 智慧城市指數 2026——香港第 21 位。首十位：蘇黎世、奧斯陸、日內瓦、倫敦、哥本哈根、杜拜、洛桑、坎培拉、新加坡、阿布扎比。第 11–21 位：赫爾辛基、首爾、布拉格、斯德哥爾摩、漢堡、北京、阿姆斯特丹、盧布爾雅那、慕尼黑、上海、香港。","lvl":0,"num":false},{"en":"**IMD World Competitiveness 2026 – HK No. 2.** Top 10: Singapore (100.00), Hong Kong SAR (95.55), Switzerland, Taiwan, UAE, Denmark, Ireland, Netherlands, Sweden, USA.","zh":"IMD 世界競爭力年報 2026——香港第 2 位。首十位：新加坡（100.00）、香港特區（95.55）、瑞士、台灣、阿聯酋、丹麥、愛爾蘭、荷蘭、瑞典、美國。","lvl":0,"num":false}]},"36":{"n":36,"en":"Global Science & Technology Clusters: Shenzhen–Hong Kong–Guangzhou","zh":"全球科技集群：深圳—香港—廣州","p":[{"en":"Global Innovation Index (GII) 2025 – Top 5 Science and Technology {Clusters|集群} (rank change):","zh":"全球創新指數 2025——五大科技集群（排名變化）：","lvl":0,"num":false},{"en":"Shenzhen–Hong Kong–Guangzhou (+1)","zh":"深圳—香港—廣州（上升 1 位）","lvl":1,"num":true},{"en":"Tokyo–Yokohama (−1)","zh":"東京—橫濱（下跌 1 位）","lvl":1,"num":true},{"en":"San Jose–San Francisco (+3)","zh":"聖荷西—三藩市（上升 3 位）","lvl":1,"num":true},{"en":"Beijing (0)","zh":"北京（不變）","lvl":1,"num":true},{"en":"Seoul (0)","zh":"首爾（不變）","lvl":1,"num":true},{"en":"China (24) and the United States (22) lead on number of top 100 innovation clusters (others: Germany 7, India 4, Japan 3, etc.). Published by WIPO.","zh":"中國（24 個）和美國（22 個）擁有最多百強創新集群（其他：德國 7、印度 4、日本 3 等）。由世界知識產權組織發布。","lvl":0,"num":false}]},"37":{"n":37,"en":"China Unveiled Development Plan for Greater Bay Area (Feb 18, 2019)","zh":"中國公布大灣區發展規劃（2019 年 2 月 18 日）","p":[{"en":"\"Plan to Build Smart City Clusters\" (Ch. 5 Expediting Infrastructural {Connectivity|互聯互通}):","zh":"「建設智慧城市群」（第五章 加快基礎設施互聯互通）：","lvl":0,"num":false},{"en":"1. Open Data Portal 開放數據平台 · 8. Smart Communities 智慧社區","zh":"","row":1},{"en":"2. Spatial Information Service Platform (CSDI) 空間信息服務平台 · 9. National Big Data Integrated Pilot Zone 國家大數據綜合試驗區","zh":"","row":1},{"en":"3. Coordination Platform for Emergency (COP) 應急協調平台 · 10. Electronic Signature Certificates 電子簽名證書","zh":"","row":1},{"en":"4. Smart Cities Common Standards 智慧城市共同標準 · 11. Electronic Payment Systems 電子支付系統","zh":"","row":1},{"en":"5. Smart Transport System 智慧交通系統 · 12. Education and Talents Hub 教育和人才中心","zh":"","row":1},{"en":"6. Smart Energy 智慧能源 · 13. International Innovation and Technology Hub 國際科技創新中心","zh":"","row":1},{"en":"7. Smart Government Management 智慧政府管理 · 14. Modern Industrial System 現代產業體系（+ more 等）","zh":"","row":1},{"h":2,"kind":"key","en":"","zh":""},{"en":"HK must step up the pace on building \"CSDI – Common Spatial Data Infrastructure\" & \"COP – Common Operational Picture\" to further strengthen Hong Kong's position as a leading smart city.","zh":"香港必須加快建設「空間數據共享平台（CSDI）」和「共用運作圖（COP）」，進一步鞏固香港作為領先智慧城市的地位。","kind":"key"}]},"38":{"n":38,"en":"Hong Kong's Positioning of \"8 Centres\" under the National 14th Five-Year Plan (Mar 1, 2021)","zh":"國家「十四五」規劃下香港的「八大中心」定位（2021 年 3 月 1 日）","p":[{"en":"Four traditional sectors: International Financial Centre; International Trade Centre; International Transportation Centre; Centre for International Legal & Dispute Resolution Services","zh":"四個傳統範疇：國際金融中心；國際貿易中心；國際航運中心；亞太區國際法律及爭議解決服務中心","lvl":0,"num":false},{"en":"Four emerging sectors (★): International I&T Centre; International Aviation Hub; Regional IP Trading Centre; Centre for International Cultural Exchange","zh":"四個新興範疇（★）：國際創新科技中心；國際航空樞紐；區域知識產權貿易中心；中外文化藝術交流中心","lvl":0,"num":false}]},"39":{"n":39,"en":"Hong Kong is Committed to be a Leading Smart City","zh":"香港致力成為領先的智慧城市","p":[{"en":"Dec 2017 · HK Smart City Blueprint 1.0 · 6 areas, 70+ initiatives","zh":"6 個範疇，70 多項措施","row":1},{"en":"Feb 2019 · Outline Development Plan for the Guangdong–HK–Macao GBA · Plan to build smart city clusters","zh":"建設智慧城市群","row":1},{"en":"Dec 2020 · HK Smart City Blueprint 2.0 · 6 areas, 130+ initiatives","zh":"6 個範疇，130 多項措施","row":1},{"en":"Dec 2022 · HK Innovation & Technology Blueprint · 4 development directions, 8 major strategies","zh":"4 大發展方向，8 大策略","row":1},{"en":"Mar 2023 · Co-operation Agreement between Guangdong & the HKSAR on Co-developing a Smart City Cluster · 《粵港共建智慧城市群合作協議》","zh":"","row":1},{"en":"The Government has {unprecedentedly|前所未有地} invested **HK$210 bn** to promote I&T development.","zh":"政府以前所未有的力度投資 2,100 億港元推動創科發展。","lvl":0,"num":false}]},"40":{"n":40,"en":"Hong Kong Innovation and Technology Development Blueprint (Dec 22, 2022)","zh":"香港創新科技發展藍圖（2022 年 12 月 22 日）","p":[{"en":"To establish a clear development path for HK's I&T development over the next 5 to 10 years","zh":"為香港未來 5 至 10 年的創科發展訂立清晰路徑","lvl":0,"num":false},{"h":1,"en":"4 Broad Development Directions","zh":"四大發展方向"},{"en":"New Industrialization; I&T Talent Pool; Digital Economy & Smart City; Integrate into National Development, Bridge the East & West","zh":"新型工業化；創科人才庫；數字經濟及智慧城市；融入國家發展大局，連接東西","lvl":0,"num":false},{"h":1,"en":"8 Major Strategies","zh":"八大策略"},{"en":"Enhance the I&T ecosystem & promote interactive development of the upstream, midstream & downstream sectors","zh":"完善創科生態圈，推動上、中、下游的互動發展","lvl":0,"num":true},{"en":"Promote technology industry development & achieve \"new industrialisation\"","zh":"推動科技產業發展，實現「新型工業化」","lvl":0,"num":true},{"en":"{Diversify|多元化} venture financing channels & support the development of startups and industries","zh":"多元化創投融資渠道，支援初創和產業發展","lvl":0,"num":true},{"en":"Promote I&T culture for all & enhance the overall I&T atmosphere in the community","zh":"推廣全民創科文化，提升社會整體創科氛圍","lvl":0,"num":true},{"en":"Enrich I&T talent resources and develop an international talent hub","zh":"豐富創科人才資源，打造國際人才樞紐","lvl":0,"num":true},{"en":"Accelerate the development of digital economy & smart city to enhance citizens' quality of life","zh":"加快數字經濟及智慧城市發展，提升市民生活質素","lvl":0,"num":true},{"en":"Deepen I&T co-operation with the Mainland for better integration into the overall national development","zh":"深化與內地的創科合作，更好地融入國家整體發展","lvl":0,"num":true},{"en":"{Leverage|善用} HK's advantages as an international city to foster global I&T collaboration","zh":"善用香港作為國際城市的優勢，促進全球創科合作","lvl":0,"num":true}]},"41":{"n":41,"en":"The First Five-Year Plan for Hong Kong – Strategic Blueprint for 2026–2030","zh":"香港首個五年規劃——2026–2030 年策略藍圖","p":[{"en":"Hong Kong's First Five-Year Plan for Economic and Social Development","zh":"香港首個經濟及社會發展五年規劃","lvl":0,"num":false},{"en":"Aligned with the National 15th Five-Year Plan","zh":"與國家「十五五」規劃銜接","lvl":0,"num":false},{"h":1,"en":"Covers 6 major areas","zh":"涵蓋六大範疇"},{"en":"Northern Metropolis and Spatial Planning","zh":"北部都會區及空間規劃","lvl":0,"num":true},{"en":"Economy, Finance, and Trade","zh":"經濟、金融及貿易","lvl":0,"num":true},{"en":"Innovation, Technology, and Industry","zh":"創新、科技及產業","lvl":0,"num":true},{"en":"People's {Livelihood|民生} & Social Development","zh":"民生及社會發展","lvl":0,"num":true},{"en":"Regional Co-operation","zh":"區域合作","lvl":0,"num":true},{"en":"Culture, Sports, Tourism & Green Living","zh":"文化、體育、旅遊及綠色生活","lvl":0,"num":true}]},"42":{"n":42,"en":"Smart Economy – Northern Metropolis Action Agenda: Four Major Zones (30 Oct 2023)","zh":"智慧經濟——北部都會區行動綱領：四大區域（2023 年 10 月 30 日）","p":[{"en":"High-end Professional Services & Logistics Hub (e.g., Tin Shui Wai, Yuen Long, Hung Shui Kiu/Ha Tsuen, Yuen Long South, Lau Fau Shan/Tsim Bei Tsui/Pak Nai)","zh":"高端專業服務和物流樞紐（例如天水圍、元朗、洪水橋／厦村、元朗南、流浮山／尖鼻咀／白泥）","lvl":0,"num":false},{"en":"Innovation & Technology Zone (e.g., San Tin Technopole, Hong Kong–Shenzhen I&T Park in the Loop, Ngau Tam Mei)","zh":"創新科技地帶（例如新田科技城、河套港深創新及科技園、牛潭尾）","lvl":0,"num":false},{"en":"Boundary Commerce & Industry Zone (e.g., Fanling/Sheung Shui, Kwu Tung North/Fanling North, New Territories North New Town, Man Kam To, Ma Tso Lung)","zh":"口岸商貿及產業區（例如粉嶺／上水、古洞北／粉嶺北、新界北新市鎮、文錦渡、馬草壟）","lvl":0,"num":false},{"en":"Blue & Green Recreation, Tourism & Conservation Circle (e.g., Sha Tau Kok, Robin's Nest)","zh":"藍綠康樂旅遊生態圈（例如沙頭角、紅花嶺）","lvl":0,"num":false}]},"43":{"n":43,"en":"Smart Economy – Hong Kong has a Vibrant and Healthy Startup Ecosystem","zh":"智慧經濟——香港擁有充滿活力和健康的初創生態圈","p":[{"en":"**2025:** 5,221 startups (+39% vs 2021; ~1,500 in 2015); 19,753 employees (+43% vs 2021; ~3,700 in 2015); 141 co-work spaces/{incubators|培育中心}/{accelerators|加速器} (+14% vs 2021)","zh":"2025 年：5,221 間初創（比 2021 年多 39%；2015 年約 1,500 間）；19,753 名僱員（比 2021 年多 43%；2015 年約 3,700 名）；141 個共享工作空間／培育中心／加速器（比 2021 年多 14%）","lvl":0,"num":false},{"en":"Startups 初創 · 3,755 · 3,985 · 4,257 · 4,694 · 5,221","zh":"","row":1},{"en":"Staff 員工 · 13,804 · 14,932 · 16,453 · 17,651 · 19,753","zh":"","row":1},{"en":"Locations 地點 · 124 · 132 · 132 · 137 · 141","zh":"","row":1},{"en":"Major business sectors: FinTech 591 (13.3%); IT 529 (11.9%); biotechnology 326; education & learning 315; health & medical 313; e-commerce 300; professional/consultancy 275; sustainable/green tech 265; core/applied AI 186; data analytics 177; hardware (IoT, 3D printing) 175; social innovation 173; robotics/smart manufacturing 142; design 138; smart city 112; others 417","zh":"主要行業：金融科技 591（13.3%）；資訊科技 529（11.9%）；生物科技 326；教育 315；醫療健康 313；電子商貿 300；專業／顧問服務 275；可持續／綠色科技 265；核心／應用人工智能 186；數據分析 177；硬件（物聯網、3D 打印）175；社會創新 173；機械人／智能製造 142；設計 138；智慧城市 112；其他 417","lvl":0,"num":false},{"en":"Home to 1,200+ fintech companies & startups","zh":"香港有超過 1,200 間金融科技公司及初創","lvl":0,"num":false},{"en":"~20 **Unicorns** = startups valued at over 1 billion US dollars","zh":"約 20 間獨角獸企業＝估值超過 10 億美元的初創","lvl":0,"num":false},{"en":"Source: 香港初創生態圈 – StartmeupHK","zh":"資料來源：香港初創生態圈——StartmeupHK","lvl":0,"num":false}]},"44":{"n":44,"en":"Smart Economy – 7 Initiatives by HKMA to Bolster Fintech & Smart Banking Era (Sept 2017)","zh":"智慧經濟——金管局七項措施推動金融科技及智慧銀行新紀元（2017 年 9 月）","p":[{"en":"Deploy FPS (Faster Payment System)","zh":"推出「轉數快」","lvl":0,"num":true},{"en":"Upgrade Sandbox – FinTech Supervisory {Sandbox|沙盒} (FSS 2.0)","zh":"升級金融科技監管沙盒（FSS 2.0）","lvl":0,"num":true},{"en":"Banking Made Easy","zh":"「智慧銀行」便利措施（Banking Made Easy）","lvl":0,"num":true},{"en":"Enhance R&D","zh":"加強研發","lvl":0,"num":true},{"en":"Cross-border FinTech (e.g., Global Financial Innovation Network, FCA)","zh":"跨境金融科技合作（例如全球金融創新網絡、英國金融行為監管局）","lvl":0,"num":true},{"en":"Open API","zh":"開放應用程式介面","lvl":0,"num":true},{"en":"Introduce Virtual Banking","zh":"引入虛擬銀行","lvl":0,"num":true}]},"45":{"n":45,"en":"Smart Economy – The HKMA Unveils \"Fintech 2025\" Strategy (June 2021)","zh":"智慧經濟——金管局公布「金融科技 2025」策略（2021 年 6 月）","p":[{"en":"Fintech vision: financial sector to adopt technology comprehensively by 2025; and deliver fair and efficient financial services for the benefit of HK people and economy","zh":"金融科技願景：金融業在 2025 年前全面應用科技，為香港市民和經濟提供公平而高效的金融服務","lvl":0,"num":false},{"en":"Demand – drive fintech demand by facilitating banks' application of technology; Data – enhance data infrastructure to enable fintech application; Ecosystem – grow the ecosystem for the HK fintech industry","zh":"需求——推動銀行應用科技以帶動需求；數據——加強數據基建；生態——壯大香港金融科技生態圈","lvl":0,"num":false},{"en":"5 focus areas: All banks go fintech; Future-proofing for {CBDCs|央行數碼貨幣}; Creation of next-gen data infrastructure; Expanding fintech-savvy workforce; Nurturing ecosystem with funding & policies","zh":"五大重點：全面推動銀行應用金融科技；為央行數碼貨幣作好準備；建設新一代數據基建；擴大熟悉金融科技的人才隊伍；以資金和政策培育生態圈","lvl":0,"num":false}]},"46":{"n":46,"en":"Smart Economy – HKMA Launches \"Fintech 2030\" Strategy for HK's AI, Tokenisation Ambitions (Nov 3, 2025)","zh":"智慧經濟——金管局推出「金融科技 2030」策略（2025 年 11 月 3 日）","p":[{"en":"\"Reimagining finance to make Hong Kong future-ready\" – **DART**","zh":"「重塑金融，令香港為未來作好準備」——DART","lvl":0,"num":false},{"en":"**D – Data & Payment Infrastructure:** secure, {scalable|可擴展的} data sharing; cross-border payment connectivity; unlock credit & trade finance; personalised financial services","zh":"D——數據及支付基建：安全、可擴展的數據共享；跨境支付互聯；釋放信貸及貿易融資；個人化金融服務","lvl":0,"num":false},{"en":"**A – AI² (AI × Authorized Institutions):** comprehensive AI adoption; shared, scalable AI infrastructure; finance-specific AI models","zh":"A——AI²（人工智能 × 認可機構）：全面採用 AI；共享、可擴展的 AI 基建；金融專用 AI 模型","lvl":0,"num":false},{"en":"**R – {Resilience|抗逆力}:** fintech cybersecurity certification; real-time early warning systems; Post-Quantum {Cryptography|密碼學} (PQC) preparation for the quantum computing era; deploy quantum-resistant infrastructure","zh":"R——抗逆力：金融科技網絡安全認證；實時預警系統；為量子計算時代準備後量子密碼學；部署抗量子基建","lvl":0,"num":false},{"en":"**T – {Tokenisation|代幣化}:** tokenise real-world assets (RWAs); tokenise government bonds; e-HKD & tokenised deposits; Project Ensemble pilot","zh":"T——代幣化：把現實世界資產代幣化；把政府債券代幣化；數碼港元及代幣化存款；Ensemble 項目試行","lvl":0,"num":false}]},"48":{"n":48,"en":"Smart Economy – Hong Kong's Digital Asset Ecosystem","zh":"智慧經濟——香港的數字資產生態圈","p":[{"en":"Aim: to establish Hong Kong as a global hub for innovation in the digital asset (DA) field","zh":"目標：把香港建立為全球數字資產創新樞紐","lvl":0,"num":false},{"en":"**Policy Statement 1.0** (31 Oct 2022) & **2.0** (25 Jun 2025): transition to \"Digital Assets\" term; new \"LEAP\" framework – Legal & regulatory streamlining; Expanding tokenized products; Advancing use cases; People & partnership","zh":"政策宣言 1.0（2022 年 10 月 31 日）及 2.0（2025 年 6 月 25 日）：改用「數字資產」一詞；新的「LEAP」框架——法律及監管精簡化、擴大代幣化產品、推進應用場景、人才與夥伴合作","lvl":0,"num":false},{"en":"**Stablecoins Ordinance:** passed 21 May 2025, effective 1 Aug 2025 – {mandatory|強制性的} licensing for stablecoin issuers, strict reserve asset requirements, {redemption|贖回} rights for holders, and broad {enforcement|執法} powers for the HKMA","zh":"《穩定幣條例》：2025 年 5 月 21 日通過，8 月 1 日生效——穩定幣發行人須強制領牌、嚴格的儲備資產要求、持有人有贖回權，以及金管局有廣泛執法權力","lvl":0,"num":false},{"en":"**Licensing of Virtual Asset Service Providers (VASP)** (1 June 2023): as of Dec 2025, 11 platforms licensed by the SFC","zh":"虛擬資產服務提供者發牌制度（2023 年 6 月 1 日）：截至 2025 年 12 月，證監會已向 11 個平台發牌","lvl":0,"num":false},{"en":"Fintech and digital assets in HK: 1,200+ fintech companies, 8 digital banks, 4 virtual insurers, 11 licensed digital asset trading platforms","zh":"香港金融科技及數字資產：1,200 多間金融科技公司、8 間數字銀行、4 間虛擬保險公司、11 個持牌數字資產交易平台","lvl":0,"num":false}]},"49":{"n":49,"en":"Smart Mobility – Hong Kong Ranking: Transport and Infrastructure","zh":"智慧出行——香港交通及基建排名","p":[{"en":"World No. 1 Air Cargo Hub (Airports Council International: world busiest airport ranking 2025)","zh":"全球第一航空貨運樞紐（國際機場協會 2025 年全球最繁忙機場排名）","lvl":0,"num":false},{"en":"World No. 4 Airport (Business Traveller Asia-Pacific Awards 2025)","zh":"全球第四最佳機場（《Business Traveller》亞太區大獎 2025）","lvl":0,"num":false},{"en":"World No. 1 Public Transport System (2025) (Time Out magazine index survey)","zh":"全球第一公共交通系統（2025）（Time Out 雜誌指數調查）","lvl":0,"num":false},{"en":"World No. 4 International {Maritime|海事的} Centre (2025 Xinhua–Baltic International Shipping Centre Development Index)","zh":"全球第四國際航運中心（2025 新華・波羅的海國際航運中心發展指數）","lvl":0,"num":false},{"en":"Every day, more than 12 million passenger trips are made through different public transport services, representing close to 90% of daily {commutes|通勤}, which is among the highest rate of public transport usage in the world.","zh":"每天有超過 1,200 萬人次使用各種公共交通服務，佔每日通勤接近 90%，是全球公共交通使用率最高的地方之一。","lvl":0,"num":false}]},"50":{"n":50,"en":"Smart Mobility – Free-Flow Tolling System (FFTS)","zh":"智慧出行——不停車繳費系統","p":[{"en":"No stopping; no queuing up; no changing lanes; no admin fees","zh":"毋須停車；毋須排隊；毋須切線；沒有行政費","lvl":0,"num":false},{"en":"**HKeToll (易通行):** all government toll tunnels have fully implemented HKeToll","zh":"易通行：所有政府收費隧道已全面實施易通行","lvl":0,"num":false},{"en":"Applications of Toll Tag: Free-Flow Tolling; {Congestion|擠塞} Charging; Carpark Parking Fee; Electronic Road Pricing","zh":"繳費貼的應用：不停車繳費；擠塞收費；停車場泊車費；電子道路收費","lvl":0,"num":false},{"en":"Website: https://www.ffts.hk/en","zh":"網址：https://www.ffts.hk/en","lvl":0,"num":false}]},"51":{"n":51,"en":"Smart Mobility – Roadmap on Popularisation of Electric Vehicles","zh":"智慧出行——香港電動車普及化路線圖","p":[{"en":"Target: zero vehicular emissions before 2050, to act in concert with Hong Kong's target to achieve {carbon neutrality|碳中和} before 2050","zh":"目標：2050 年前實現車輛零排放，配合香港 2050 年前達至碳中和的目標","lvl":0,"num":false},{"en":"**E-private cars:** no new registration of fuel-propelled private cars including {hybrid|混合動力} vehicles in 2035 or earlier","zh":"電動私家車：2035 年或之前停止新登記燃油私家車（包括混合動力車）","lvl":0,"num":false},{"en":"**E-commercial vehicles:** promote trials for e-public transport and commercial vehicles; set a concrete way forward and timetable around 2025","zh":"電動商用車：推動電動公共交通及商用車試驗，約於 2025 年訂出具體路向及時間表","lvl":0,"num":false},{"en":"**Government fleet:** set EV as standard for government small and medium private cars to be {procured|採購} or replaced","zh":"政府車隊：以電動車作為政府採購或更換中小型私家車的標準","lvl":0,"num":false},{"en":"**Charging network:** develop a comprehensive EV charging network (public and private) and promote its {marketisation|市場化}","zh":"充電網絡：發展全面的電動車充電網絡（公共及私人），並推動市場化","lvl":0,"num":false},{"en":"**Maintenance services:** training and re-training to groom professionals and mechanics for EV technology","zh":"維修服務：提供培訓及再培訓，培育電動車專業人員及技工","lvl":0,"num":false},{"en":"**Battery recycling:** legislate a Producer Responsibility Scheme for retired EV batteries","zh":"電池回收：為退役電動車電池訂立生產者責任計劃","lvl":0,"num":false},{"en":"As at Dec 2025, the total no. of EVs is 140,000+, about 20% of the total no. of private cars.","zh":"截至 2025 年 12 月，電動車總數超過 14 萬輛，約佔私家車總數 20%。","lvl":0,"num":false}]},"52":{"n":52,"en":"Smart Mobility – Transport Strategy Blueprint (6 Feb 2026)","zh":"智慧出行——運輸策略藍圖（2026 年 2 月 6 日）","p":[{"en":"Advancing rail and road infrastructure under a new \"Eight Vertical & Eight Horizontal\" layout","zh":"以新的「八縱八橫」佈局推進鐵路和道路基建","lvl":0,"num":false},{"en":"Railway network: about 270 km now → nearly 390 km; major roads: about 265 km now → nearly 380 km","zh":"鐵路網絡：由現時約 270 公里增至接近 390 公里；主要道路：由約 265 公里增至接近 380 公里","lvl":0,"num":false},{"en":"Enhance public transport services; facilitate cross-boundary commuting; advance smart transformation; promote green low-carbon transport","zh":"提升公共交通服務；便利跨境通勤；推進智慧轉型；推廣綠色低碳交通","lvl":0,"num":false},{"en":"Vision: 享 Enjoyable journeys; 活 Healthy mobility; 連 Well-connected city","zh":"願景：享（愉快旅程）；活（健康出行）；連（四通八達的城市）","lvl":0,"num":false}]},"53":{"n":53,"en":"Smart Environment – Carbon Neutrality Strategies in Place","zh":"智慧環境——已實施的碳中和策略","p":[{"en":"Hong Kong's Climate Action Plan 2050: ~$240 bn to combat climate change; balance carbon emissions with carbon {offset|抵銷} → \"Carbon Neutral@HK\" (香港碳中和)","zh":"《香港氣候行動藍圖 2050》：約 2,400 億元應對氣候變化；以碳抵銷平衡碳排放 →「香港碳中和」","lvl":0,"num":false},{"en":"China's Climate Plan: carbon neutrality by 2060; Carbon Trading Market","zh":"國家氣候計劃：2060 年實現碳中和；碳交易市場","lvl":0,"num":false},{"en":"Targets of achieving carbon neutrality set by cities: Copenhagen 2025; London 2030; Hong Kong before 2050; New York/Tokyo/Seoul 2050; Singapore after 2050","zh":"各城市的碳中和目標：哥本哈根 2025 年；倫敦 2030 年；香港 2050 年前；紐約／東京／首爾 2050 年；新加坡 2050 年後","lvl":0,"num":false}]},"54":{"n":54,"en":"Smart Environment – The Strategy of Hydrogen Development in Hong Kong (17 Jun 2024)","zh":"智慧環境——香港氫能發展策略（2024 年 6 月 17 日）","p":[{"en":"4 strategies: Improving {Legislation|立法}; Establishing Standards; Aligning with the Market; Advancing with {Prudence|審慎}","zh":"四大策略：完善法例；制定標準；與市場接軌；積極審慎推進","lvl":0,"num":false},{"en":"The Gas Safety (Amendment) Ordinance 2025 was officially passed and {gazetted|刊憲} on July 25, 2025, legally establishing the safe regulatory framework for hydrogen used as a fuel.","zh":"《2025 年氣體安全（修訂）條例》於 2025 年 7 月 25 日正式通過及刊憲，在法律上確立氫作為燃料的安全規管框架。","lvl":0,"num":false},{"en":"EMSD plans to formulate and launch the definitive Green Hydrogen Standard Certification Scheme by 2027.","zh":"機電工程署計劃在 2027 年前制定並推出正式的綠氫標準認證計劃。","lvl":0,"num":false},{"en":"38 localized hydrogen trial projects approved as of May 2026.","zh":"截至 2026 年 5 月，已批准 38 個本地氫能試驗項目。","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Green (clean) tech, but it has limitations, like safety concerns.","zh":"綠色（潔淨）科技，但有局限，例如安全問題。","kind":"note"}]},"55":{"n":55,"en":"Smart Environment – Rivers and Basins Ecology Mapping","zh":"智慧環境——河流及流域生態地圖","p":[{"en":"Jockey Club Water Initiative on Sustainability and Engagement (JC-WISE)","zh":"賽馬會「水 · 識 · 涵」可持續發展及參與計劃（JC-WISE）","lvl":0,"num":false},{"en":"Interactive open-access, GIS-based database on HK's major rivers and {basins|流域} to enhance the public's knowledge and {appreciation|欣賞} of water's multiple values (e. 1,"num":true},{"en":"Capacity Building","zh":"能力建設","lvl":1,"num":true},{"en":"Collaborative Partnering","zh":"協作夥伴關係","lvl":1,"num":true},{"en":"Species recorded in HK (examples): vascular plants 3,300+; birds 580+; terrestrial mammals 55; butterflies 240+; dragonflies 130+; beetles 2,500+; amphibians 25; reptiles 91; freshwater fishes 200+; marine fishes 1,000+; hard corals 80+; seaweeds 264","zh":"香港錄得物種（例子）：維管植物 3,300 多種；雀鳥 580 多種；陸棲哺乳類 55 種；蝴蝶 240 多種；蜻蜓 130 多種；甲蟲 2,500 多種；兩棲類 25 種；爬行類 91 種；淡水魚 200 多種；海魚 1,000 多種；石珊瑚 80 多種；海藻 264 種","lvl":0,"num":false}]},"59":{"n":59,"en":"Smart Living – Leveraging Open Data to Combat COVID-19: Interactive Map Dashboards in HK (Gov't–Public Partnerships)","zh":"智慧生活——善用開放數據抗疫：香港互動地圖儀表板（政府與公眾合作）","p":[{"en":"First region in Asia to launch; same date as the WHO did (3 Feb 2020)","zh":"亞洲首個推出的地區；與世界衞生組織同日推出（2020 年 2 月 3 日）","lvl":0,"num":false},{"en":"Visits exceeded 81.84 million (~82 mil) as of 4 July 2022","zh":"截至 2022 年 7 月 4 日，瀏覽次數突破 8,184 萬（約 8,200 萬）","lvl":0,"num":false},{"en":"The HKSAR Government launched this Interactive Map Dashboard on Feb 3, jointly developed and managed by the Development Bureau, Lands Department and a group of volunteers from the Smart City Consortium.","zh":"香港特區政府於 2 月 3 日推出這個互動地圖儀表板，由發展局、地政總署及一群智慧城市聯盟義工共同開發和管理。","lvl":0,"num":false},{"en":"Source: 添馬台 Tama Talk, news.gov.hk","zh":"資料來源：添馬台，政府新聞網","lvl":0,"num":false}]},"60":{"n":60,"en":"Smart Living – Hong Kong's Territory-wide Sewage Surveillance Programme Won Gold Award at 2024 IWA Project Innovation Award","zh":"智慧生活——香港全港污水監測計劃榮獲 2024 年國際水協會項目創新金獎","p":[{"en":"GIS facilitates comprehensive real-time situational analysis","zh":"GIS 協助進行全面實時形勢分析","lvl":0,"num":false},{"en":"Dashboard for data visualization: daily test results; sampling locations; {sewerage catchment areas|污水收集區}","zh":"數據視覺化儀表板：每日檢測結果；採樣地點；污水收集區","lvl":0,"num":false},{"en":"HK's public health control strategy using water research stood out among 108 global submissions (EPD, l":0,"num":false}]},"65":{"n":65,"en":"Smart People – Members of Esri Startup Program: GeoAI Helps Spot a Missing Hiker","zh":"智慧市民——Esri 初創計劃成員：GeoAI 協助尋找失蹤行山人士","p":[{"en":"Showcasing how Hong Kong can boost startups and AI applications","zh":"展示香港如何推動初創企業及 AI 應用","lvl":0,"num":false},{"en":"GeoAI = AI-driven geospatial technology; drone images + AI were used to help search for a missing hiker (photos: FSD, HK01)","zh":"GeoAI ＝以 AI 驅動的地理空間技術；以無人機影像加 AI 協助搜尋失蹤行山人士（相片：消防處、香港01）","lvl":0,"num":false}]},"67":{"n":67,"en":"Smart People – Top-notch Universities with Strong Research Capability","zh":"智慧市民——研究實力強大的頂尖大學","p":[{"en":"5 universities amongst the world's top 100 (HKU, CUHK, HKUST, PolyU, CityU)","zh":"5 間大學躋身世界百強（港大、中大、科大、理大、城大）","lvl":0,"num":false},{"en":"QS World University Rankings 2027: HKU #11, CUHK #18 (ranking among 1,504 universities globally)","zh":"QS 世界大學排名 2027：港大第 11、中大第 18（全球 1,504 間大學）","lvl":0,"num":false},{"en":"Times Higher Education (THE) World University Rankings 2026 (ranking among 2,191 universities globally)","zh":"泰晤士高等教育世界大學排名 2026（全球 2,191 間大學）","lvl":0,"num":false}]},"68":{"n":68,"en":"Smart Government – Hong Kong Police Force for Mountain Search and Rescue","zh":"智慧政府——香港警務處山嶺搜救","p":[{"en":"The R-Map (Rescue Map) Solution: useful for coordinating large-scale, joint-departmental search & rescue missions","zh":"「救援地圖」（R-Map）方案：有助協調大規模、跨部門的搜救行動","lvl":0,"num":false},{"en":"Interactive map that visualizes key information on rescue missions","zh":"以互動地圖顯示救援行動的重要資訊","lvl":0,"num":false},{"en":"Real-time rescue {intelligence|情報}, search routes, {topography|地形}, live broadcast","zh":"實時救援情報、搜索路線、地形、直播","lvl":0,"num":false},{"en":"Demonstrated during a joint operation exercise in Sai Kung (source: HK Police Force YouTube channel)","zh":"在西貢一次聯合行動演習中示範（資料來源：香港警務處 YouTube 頻道）","lvl":0,"num":false}]},"69":{"n":69,"en":"Smart Government – HK Unveils Digital Policy Office (DPO) to Promote Data-driven Policies (25 Jul 2024)","zh":"智慧政府——香港成立數字政策辦公室，推動以數據驅動的政策（2024 年 7 月 25 日）","p":[{"en":"Three areas: Digital Government; Data {Governance|管治}; Digital Infrastructure","zh":"三大範疇：數字政府；數據管治；數字基建","lvl":0,"num":false},{"en":"Work areas: facilitating cross-boundary data flow within the GBA; iAM Smart; IT Innovation Lab in Schools; Smart Government Innovation Lab; Digital Government; promoting digital {inclusion|共融}; data sharing and application; information and cybersecurity; Mainland collaboration","zh":"工作範疇：促進大灣區跨境數據流通；智方便；學校 IT 創新實驗室；智慧政府創新實驗室；數字政府；推廣數碼共融；數據共享及應用；資訊及網絡安全；與內地合作","lvl":0,"num":false},{"en":"Slogan: 以數字政策驅動智慧創新 (drive smart innovation with digital policy)","zh":"口號：以數字政策驅動智慧創新","lvl":0,"num":false}]},"70":{"n":70,"en":"Smart Government – Smart Government Innovation Lab (Apr 2019)","zh":"智慧政府——智慧政府創新實驗室（2019 年 4 月）","p":[{"en":"CONNECT – I&T suppliers: find service needs, propose solutions","zh":"連繫——創科供應商：了解服務需要，提出方案","lvl":0,"num":false},{"en":"INSPIRE – Government departments: find I&T solutions, raise service needs","zh":"啟發——政府部門：尋找創科方案，提出服務需要","lvl":0,"num":false},{"en":"CO-CREATE together. Examples: City Dashboard; Tree Movement Monitoring Console","zh":"一起共創。例子：城市儀表板；樹木移動監察系統","lvl":0,"num":false}]},"71":{"n":71,"en":"Smart Government – iAM Smart (formerly eID) to Facilitate Smart City Services (29 Dec 2020)","zh":"智慧政府——「智方便」（前稱 eID）便利智慧城市服務（2020 年 12 月 29 日）","p":[{"en":"\"iAM Smart\" stands for \"internet Access by Mobile in a Smart way\"","zh":"「iAM Smart」代表「以流動裝置智能地使用互聯網」","lvl":0,"num":false},{"en":"Fully integrate an \"AI Assistant\" into the platform by the end of 2026","zh":"在 2026 年底前把「AI 助理」全面整合到平台","lvl":0,"num":false},{"en":"Registrations 4,603,000+; usage 301,951,000+; 1,437 services of government, public/private organisations and government e-forms","zh":"登記人數 460.3 萬以上；使用次數 3.0195 億以上；1,437 項政府、公私營機構服務及政府電子表格","lvl":0,"num":false}]},"72":{"n":72,"en":"Smart Government – Data-Driven Innovation through Open Government Data: Annual Open Data Plans (since 2019)","zh":"智慧政府——以政府開放數據推動數據驅動創新：每年開放數據計劃（自 2019 年起）","p":[{"en":"Explore Open Data on DATA.GOV.HK (資料一線通): 5,700+ datasets available; 2,500+ datasets with API; 120+ data providers; 85B+ downloads in 2025","zh":"在「資料一線通」探索開放數據：5,700 多個數據集；2,500 多個提供 API；120 多個數據提供者；2025 年下載超過 850 億次","lvl":0,"num":false},{"en":"Open data provides raw materials for Technology Research, City Innovation & Smart City Development","zh":"開放數據為科技研究、城市創新及智慧城市發展提供原材料","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"GIS has to be done with data → use data to make the map → open data is data that you can use for free.","zh":"GIS 必須依靠數據 → 用數據製作地圖 → 開放數據就是可以免費使用的數據。","kind":"note"}]},"73":{"n":73,"en":"Making Use of Open Data – High Value Data Domains","zh":"善用開放數據——高價值數據範疇","p":[{"en":"Ranking by commercial re-use of open data (high → low):","zh":"按開放數據的商業再用價值排名（高 → 低）：","lvl":0,"num":false},{"en":"Geographic Information – domain with the highest commercial value & can be used in other 13 different data categories using maps to create visualisations","zh":"地理資訊——商業價值最高的範疇，可透過地圖應用於其他 13 個數據類別，製作視覺化效果","lvl":1,"num":true},{"en":"Meteorological and Environmental Information","zh":"氣象及環境資訊","lvl":1,"num":true},{"en":"Economic & Business Information","zh":"經濟及商業資訊","lvl":1,"num":true},{"en":"Social Information","zh":"社會資訊","lvl":1,"num":true},{"en":"Traffic & Transport Information","zh":"交通及運輸資訊","lvl":1,"num":true},{"en":"Lower value: tourist and leisure; agricultural, farming, forestry and fisheries; natural resources; legal system; scientific and research data; educational; political; cultural content","zh":"價值較低：旅遊休閒；農業、林業及漁業；天然資源；法律制度；科學及研究數據；教育；政治；文化內容","lvl":0,"num":false},{"en":"Source: European Data Portal, European Commission, Nov 2015","zh":"資料來源：歐洲數據門戶網站，歐盟委員會，2015 年 11 月","lvl":0,"num":false}]},"74":{"n":74,"en":"Why Spatial Data is so Important? The Backbone of Smart City","zh":"為甚麼空間數據如此重要？智慧城市的骨幹","p":[{"en":"**80% of data is spatial**","zh":"80% 的數據是空間數據","lvl":0,"num":false},{"en":"Its importance: better city planning & management (prevention, monitor, rescue & recovering); unlock the wealth of existing knowledge and boost the economy; make right and {agile|靈活敏捷的} decisions","zh":"重要性：改善城市規劃與管理（預防、監察、救援及復原）；釋放現有知識的價值並推動經濟；作出正確而靈活的決定","lvl":0,"num":false},{"en":"Sources of spatial big data: GPS-enabled devices, satellite {remote sensing|遙感}; aerial surveying; radar, {Lidar|激光雷達}; sensor networks; digital cameras; location of readings of RFID, etc.","zh":"空間大數據來源：具備 GPS 的裝置、衞星遙感；航空測量；雷達、激光雷達；感應器網絡；數碼相機；RFID 讀數位置等","lvl":0,"num":false}]},"75":{"n":75,"en":"Backbone Technology for Spatial Data Management is GIS","zh":"空間數據管理的骨幹技術是 GIS","p":[{"en":"Geographic Information System functions: **Capture, Store, Query, Analyze, Display, Output**","zh":"地理資訊系統的功能：擷取、儲存、查詢、分析、顯示、輸出","lvl":0,"num":false},{"h":2,"kind":"tip","en":"Memory trick","zh":""},{"en":"Remember \"**CSQ-ADO**\": Capture → Store → Query → Analyze → Display → Output (the order data flows through a GIS).","zh":"記住「CSQ-ADO」：擷取 → 儲存 → 查詢 → 分析 → 顯示 → 輸出（數據在 GIS 中流動的次序）。","kind":"tip"}]},"77":{"n":77,"en":"Smart Government – CSDI Sharing Portal for Spatial Information Facilitates Smart City Development","zh":"智慧政府——空間數據共享平台促進智慧城市發展","p":[{"en":"As of 1/2025, 1,200+ spatial datasets made public by 71+ government departments","zh":"截至 2025 年 1 月，71 個以上政府部門公開了 1,200 多個空間數據集","lvl":0,"num":false},{"en":"CSDI Portal operates like a one-stop data \"supermarket\": portal.csdi.gov.hk","zh":"空間數據共享平台像一站式數據「超級市場」：portal.csdi.gov.hk","lvl":0,"num":false},{"en":"Example data: drainage/sewerage facilities, census datasets, road network, outline zoning plans, population distribution projections, public facilities, excavation permits","zh":"數據例子：渠務及污水設施、人口普查數據、道路網絡、分區計劃大綱圖、人口分佈推算、公共設施、掘路許可證","lvl":0,"num":false}]},"78":{"n":78,"en":"Smart Government – Geospatial Lab: An Innovation Platform for Geospatial Ideas","zh":"智慧政府——地理空間實驗室：地理空間創意的創新平台","p":[{"en":"The GeoLab is established by the Development Bureau and operated by Tung Wah Group of Hospitals for encouraging the public to make use of spatial data in developing smart applications, {dovetailing|配合} the CSDI initiative in support of smart city development (opened 10 May 2021).","zh":"地理空間實驗室由發展局成立、東華三院營運，鼓勵公眾利用空間數據開發智慧應用，配合空間數據共享平台措施，支援智慧城市發展（2021 年 5 月 10 日開幕）。","lvl":0,"num":false}]},"80":{"n":80,"en":"Low-Altitude Economy (LAE) 低空經濟","zh":"低空經濟","p":[{"en":"\"Low-altitude economy\" refers to manned and {unmanned|無人駕駛的} activities that take place within {airspace|空域} below 1,000 metres (3,280 feet), but the range can be extended to 3,000 metres depending on regional and practical needs.","zh":"「低空經濟」指在 1,000 米（3,280 呎）以下空域進行的載人及無人駕駛活動，但視乎地區和實際需要，範圍可延伸至 3,000 米。","lvl":0,"num":false},{"en":"Key sectors: Drones (UAVs = Unmanned Aerial Vehicles), eVTOL (electric vertical takeoff and landing)","zh":"主要行業：無人機（UAV）、電動垂直起降飛行器（eVTOL）","lvl":0,"num":false},{"en":"Diagram layers: \u003c 120 m (small drones); 120–300 m; 300–1,000 m; 1,000–3,000 m; above 3,000 m = commercial aviation","zh":"圖示分層：120 米以下（小型無人機）；120–300 米；300–1,000 米；1,000–3,000 米；3,000 米以上＝民航","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Restricted zones and many buildings (in HK). LAE creates new economies.","zh":"（香港）有禁飛區和大量建築物。低空經濟帶來新的經濟。","kind":"note"}]},"81":{"n":81,"en":"A Wide Array of Application Scenarios for Low-Altitude Economy","zh":"低空經濟的廣泛應用場景","p":[{"en":"Real-time data collection (weather, traffic, logistics, emergency incidents, etc.)","zh":"實時數據收集（天氣、交通、物流、緊急事故等）","lvl":0,"num":false},{"en":"Emergency rescue (fires, locating missing hikers, crowd control, transporting supplies, etc.)","zh":"緊急救援（火警、尋找失蹤行山人士、人群管理、運送物資等）","lvl":0,"num":false},{"en":"Maintenance and {supervision|監督} of buildings and public facilities","zh":"樓宇及公共設施的維修和監督","lvl":0,"num":false},{"en":"Waste management (monitoring illegal waste disposal)","zh":"廢物管理（監察非法棄置廢物）","lvl":0,"num":false},{"en":"Tree conservation (monitoring {hazardous|有危險的} trees)","zh":"樹木保育（監察有危險的樹木）","lvl":0,"num":false},{"en":"{Maritime|海事的} and coastal conservation","zh":"海事及海岸保育","lvl":0,"num":false},{"en":"Slope management","zh":"斜坡管理","lvl":0,"num":false},{"en":"Tourism … and more","zh":"旅遊⋯⋯及更多","lvl":0,"num":false}]},"82":{"n":82,"en":"Policies Support the Rapid Development of the LAE in China","zh":"政策支持中國低空經濟迅速發展","p":[{"en":"2024 is considered the first year of LAE","zh":"2024 年被視為「低空經濟元年」","lvl":0,"num":false},{"h":1,"en":"National level","zh":"國家層面"},{"en":"Feb 2021: LAE included in national planning","zh":"2021 年 2 月：低空經濟納入國家規劃","lvl":0,"num":false},{"en":"Dec 2023: designated as a strategic emerging industry at the Central Economic Work Conference","zh":"2023 年 12 月：中央經濟工作會議定為戰略性新興產業","lvl":0,"num":false},{"en":"Mar 2024: proposed as a new growth engine in the Government Work Report (首次寫入政府工作報告)","zh":"2024 年 3 月：首次寫入政府工作報告，定為新增長引擎","lvl":0,"num":false},{"en":"Jul 2024: development requirements outlined at the 3rd {Plenary|全體} Session of the 20th CPC Central Committee","zh":"2024 年 7 月：二十屆三中全會提出發展要求","lvl":0,"num":false},{"en":"Dec 2024: NDRC (國家發改委) establishes the LAE Development Department (低空司)","zh":"2024 年 12 月：國家發改委成立低空經濟發展司","lvl":0,"num":false},{"h":1,"en":"Local level","zh":"地方層面"},{"en":"Since 2024, LAE included in reports/policies of nearly 30 provinces and {municipalities|直轄市}","zh":"自 2024 年起，近 30 個省市把低空經濟寫入報告或政策","lvl":0,"num":false},{"en":"15 cities, including Beijing, Shanghai, Hangzhou and Hefei, collaborating with enterprises on LAE ecosystem","zh":"包括北京、上海、杭州、合肥在內的 15 個城市與企業合作建設低空經濟生態","lvl":0,"num":false},{"en":"Some local governments have established special industrial funds","zh":"部分地方政府設立專項產業基金","lvl":0,"num":false},{"en":"Guangdong Province Action Plan for Promoting High-Quality Development of the Low-altitude Economy (2024–2026)","zh":"《廣東省推動低空經濟高質量發展行動方案（2024–2026 年）》","lvl":0,"num":false}]},"83":{"n":83,"en":"From Growth Engine to Emerging Pillar Industry (新興支柱產業) – China's LAE Takes Center Stage","zh":"由增長引擎到新興支柱產業——中國低空經濟成為焦點","p":[{"en":"The 15th Five-Year Plan (2026–2030) calls for the healthy and orderly development of the LAE.","zh":"「十五五」規劃（2026–2030）要求低空經濟健康有序發展。","lvl":0,"num":false},{"en":"The 2026 Government Work Report designates the LAE as an emerging pillar industry.","zh":"2026 年政府工作報告把低空經濟定為新興支柱產業。","lvl":0,"num":false},{"en":"3rd {consecutive|連續的} year in the Government Work Report; status rising from a \"new growth engine\" (2024) → an \"emerging industry\" (2025) → an \"emerging pillar industry\" (2026).","zh":"連續第三年寫入政府工作報告；地位由「新增長引擎」（2024）→「新興產業」（2025）→「新興支柱產業」（2026）。","lvl":0,"num":false}]},"84":{"n":84,"en":"The Growth of China's Low-altitude Economy","zh":"中國低空經濟的增長","p":[{"en":"2023 · RMB 500 billion (US$70B)","zh":"","row":1},{"en":"2025 · RMB 1.5 trillion (US$209B)","zh":"","row":1},{"en":"2030 · RMB 2 trillion (US$278B)","zh":"","row":1},{"en":"2035 · RMB 3.5 trillion (US$487B)","zh":"","row":1},{"en":"Source: Civil Aviation Administration of China (CAAC, 中國民航局)","zh":"資料來源：中國民用航空局","lvl":0,"num":false},{"en":"\"There is currently a talent gap of 1 million for drone pilots in China\" – NDRC (國家發改委)","zh":"「中國目前無人機操作員人才缺口達 100 萬」——國家發改委","lvl":0,"num":false}]},"85":{"n":85,"en":"Accelerating LAE Development in Hong Kong","zh":"加快香港低空經濟發展","p":[{"en":"Greater Bay Area Low Altitude Economy Alliance; LAE Development Working Group; 38 LAE Regulatory Sandbox Pilot Projects; Regulatory Sandbox X","zh":"大灣區低空經濟聯盟；低空經濟發展工作組；38 個低空經濟監管沙盒試點項目；「監管沙盒 X」","lvl":0,"num":false},{"en":"Commence the study of {legislative|立法的} work (relax rules on Beyond Visual Line of Sight (BVLOS) flight and drone weight & cargo limits)","zh":"展開立法研究（放寬「超視距飛行」及無人機重量和載貨限制）","lvl":0,"num":false},{"en":"Streamlining Low Earth Orbit (LEO) satellite licence {vetting|審批}","zh":"精簡低地球軌道衞星牌照審批","lvl":0,"num":false},{"en":"Legislative amendments effective from 18 Jul 2025: Small Unmanned Aircraft (SUA) Order (Cap. 448G); Air Navigation (Hong Kong) Order (Cap. 448C)","zh":"2025 年 7 月 18 日生效的法例修訂：《小型無人機令》（第 448G 章）；《飛航（香港）令》（第 448C 章）","lvl":0,"num":false}]},"89":{"n":89,"en":"Smart City Development in China","zh":"中國的智慧城市發展","p":[{"en":"State-led initiatives (Top-Down Approach): China has implemented smart city policies since 2012","zh":"國家主導（由上而下）：中國自 2012 年起推行智慧城市政策","lvl":0,"num":false},{"en":"High urbanization rates foster the need for efficient & sustainable urban management","zh":"高城市化率令高效及可持續的城市管理需求增加","lvl":0,"num":false},{"en":"Leading tech giants like Alibaba, Tencent, Baidu & Huawei have been {instrumental|起重要作用的} in developing smart city technologies","zh":"阿里巴巴、騰訊、百度及華為等科技巨頭在發展智慧城市技術方面起了重要作用","lvl":0,"num":false},{"en":"Policies & standards of smart cities (GB national standards); 900+ smart cities","zh":"智慧城市政策及標準（GB 國家標準）；900 多個智慧城市","lvl":0,"num":false},{"en":"By 2028, China's smart city market investment scale will reach RMB 1,232.54 billion, with CAGR (compound annual growth rate) of 7.1% from 2023 to 2028 (IDC).","zh":"到 2028 年，中國智慧城市市場投資規模將達 12,325.4 億元人民幣，2023–2028 年複合年增長率為 7.1%（IDC）。","lvl":0,"num":false}]},"90":{"n":90,"en":"President Xi Laid Out China's Vision for Smart Cities at the Belt & Road Initiative","zh":"習主席在「一帶一路」倡議中闡述中國的智慧城市願景","p":[{"en":"President Xi's speech at the opening of the Belt & Road Forum (14 May 2017)","zh":"習主席在「一帶一路」國際合作高峰論壇開幕式的演講（2017 年 5 月 14 日）","lvl":0,"num":false},{"en":"5 principles to steer the initiative toward greater success – build the Belt & Road into a road for: (1) peace; (2) {prosperity|繁榮}; (3) opening up; (4) connecting different {civilizations|文明}; (5) innovation","zh":"五大原則，推動倡議更加成功——把「一帶一路」建成：(1) 和平之路；(2) 繁榮之路；(3) 開放之路；(4) 文明之路；(5) 創新之路","lvl":0,"num":false},{"en":"\"We should advance the development of big data, cloud computing & smart cities to transform them into a 21st-Century digital silk road.\"","zh":"「我們要推動大數據、雲計算、智慧城市建設，連接成二十一世紀的數字絲綢之路。」","lvl":0,"num":false},{"en":"Source: http://beltandroadforum.org/english/index.html","zh":"資料來源：http://beltandroadforum.org/english/index.html","lvl":0,"num":false}]},"91":{"n":91,"en":"Smart Economy – 2025 Top 5 Most Competitive Cities in China: Cluster in the World's Largest Bay Area","zh":"智慧經濟——2025 年中國最具競爭力五大城市：世界最大灣區的城市群","p":[{"en":"2025 GN China City Comprehensive Competitiveness Index (第二十五屆): No. 1 Shenzhen; No. 2 Hong Kong; No. 3 Shanghai; No. 4 Beijing; No. 5 Guangzhou","zh":"2025 年第二十五屆 GN 中國城市綜合競爭力評價：第 1 深圳；第 2 香港；第 3 上海；第 4 北京；第 5 廣州","lvl":0,"num":false},{"en":"3 of the top 5 (Shenzhen, Hong Kong, Guangzhou) are in the Greater Bay Area.","zh":"首五位中有 3 個（深圳、香港、廣州）位於大灣區。","lvl":0,"num":false}]},"92":{"n":92,"en":"Smart Economy – The State Council Releases Plan for Shenzhen Section of Hetao Sci-Tech Zone (Aug 29, 2023)","zh":"智慧經濟——國務院發布河套深圳園區發展規劃（2023 年 8 月 29 日）","p":[{"h":1,"en":"2 milestones","zh":"兩個里程碑"},{"en":"By 2025, SZ & HK will establish an efficient collaboration mechanism for sci-tech innovation","zh":"2025 年前，深港建立高效的科技創新合作機制","lvl":0,"num":false},{"en":"By 2035, comprehensive collaboration with HK's parks, grow into a world-class science research hub","zh":"2035 年前，與香港園區全面合作，發展為世界級科研樞紐","lvl":0,"num":false},{"h":1,"en":"3 key positionings","zh":"三大定位"},{"en":"Pioneering zone for sci-tech innovation & cooperation; testing ground for international advanced sci-tech innovation rules; hub for pilot-scale tests and transformation in the GBA","zh":"科技創新合作的先行區；國際先進科技創新規則的試驗田；大灣區中試轉化集聚區","lvl":0,"num":false},{"h":1,"en":"4 major tasks","zh":"四大任務"},{"en":"Enhance the strengths of universities in HK & Macao in key {disciplines|學科}","zh":"發揮港澳高校在重點學科的優勢","lvl":0,"num":true},{"en":"Industrial pilot-scale tests and transformation in the new generation of IT industries, biomedicine technology, AI & digital economy","zh":"在新一代資訊科技、生物醫藥、人工智能及數字經濟領域進行產業中試及轉化","lvl":0,"num":true},{"en":"Set up systems and mechanisms for: movement of researchers; segmented management of goods; cross-border flow of research funds; cross-border flow of data; higher-level IP protection; tax environment aligned with HK; international employment & social security policies; global research management systems; highly convenient market access","zh":"建立以下制度和機制：科研人員往來；貨物分線管理；科研資金跨境流動；數據跨境流動；更高水平知識產權保護；與香港接軌的稅制環境；國際化就業及社會保障政策；國際科研管理制度；高度便利的市場准入","lvl":0,"num":true},{"en":"Build an international talent hub for innovation","zh":"建設國際創新人才樞紐","lvl":0,"num":true}]},"93":{"n":93,"en":"Smart Economy – Development Outline for HK Park of Hetao Shenzhen–HK Science and Technology Innovation Co-operation Zone (Nov 20, 2024)","zh":"智慧經濟——《河套深港科技創新合作區香港園區發展綱要》（2024 年 11 月 20 日）","p":[{"en":"2024: the first Phase 1 buildings will start operations in late 2024","zh":"2024 年：首批第一期大樓於 2024 年底開始運作","lvl":0,"num":false},{"en":"2030: establish a mechanism with Shenzhen Park to enhance cross-border innovation","zh":"2030 年：與深圳園區建立機制，加強跨境創新","lvl":0,"num":false},{"en":"2035: create a {vibrant|充滿活力的} I&T ecosystem in HK Park to position the Hetao Co-operation Zone as a global I&T leader with SZ","zh":"2035 年：在香港園區建立充滿活力的創科生態圈，與深圳一起把河套合作區打造成全球創科領導者","lvl":0,"num":false},{"en":"Concept: \"One River, Two Banks; One Zone, Two Parks\" (一河兩岸、一區兩園)","zh":"概念：「一河兩岸、一區兩園」","lvl":0,"num":false}]},"94":{"n":94,"en":"Smart Economy – Regional Development of China's LAE: Greater Bay Area","zh":"智慧經濟——中國低空經濟的區域發展：大灣區","p":[{"en":"Guangdong Province: target economic scale exceeding RMB 300 billion by 2026 (US$42B) – \"Guangdong Province Action Plan for Promoting High-Quality Development of the Low-altitude Economy (2024–2026)\"","zh":"廣東省：2026 年目標經濟規模超過 3,000 億元人民幣（420 億美元）——《廣東省推動低空經濟高質量發展行動方案（2024–2026 年）》","lvl":0,"num":false},{"en":"Guangzhou's LAE vision: \"2027 飛起來, 2030 滿天飛\" (take off by 2027, fill the skies by 2030)","zh":"廣州低空經濟願景：「2027 飛起來，2030 滿天飛」","lvl":0,"num":false},{"en":"Shenzhen 2023: 1,700 drone companies; annual output RMB 96 billion (63% of national total, US$13B); year-on-year growth 28%; top city in China for drone industry","zh":"深圳 2023 年：1,700 間無人機公司；年產值 960 億元人民幣（佔全國 63%，130 億美元）；按年增長 28%；全國無人機產業第一城","lvl":0,"num":false},{"en":"Shenzhen 2024: China's first legal framework for the low-altitude economy; completed first eVTOL cross-sea and cross-city flight","zh":"深圳 2024 年：全國首個低空經濟法規框架；完成首次 eVTOL 跨海跨城飛行","lvl":0,"num":false}]},"95":{"n":95,"en":"Smart Mobility – Shenzhen Has 16,000 Electric Buses & 22,000 Electric Taxis","zh":"智慧出行——深圳擁有 16,000 輛電動巴士及 22,000 輛電動的士","p":[{"en":"Shenzhen is the world's first city with a fully electric bus {fleet|車隊} in 2017","zh":"深圳在 2017 年成為全球首個全電動巴士車隊的城市","lvl":0,"num":false},{"en":"More than 16,000 electric buses & 22,000 electric taxis in operation","zh":"超過 16,000 輛電動巴士及 22,000 輛電動的士投入服務","lvl":0,"num":false},{"en":"Shenzhen is the home base of BYD, one of the largest electric vehicle makers in the world","zh":"深圳是比亞迪的總部所在地，比亞迪是全球最大的電動車製造商之一","lvl":0,"num":false},{"en":"Chart: Shenzhen 16,359 e-buses vs New York City 5,710, Los Angeles County 2,633, New Jersey Transit 2,392, Toronto 1,926, Chicago Transit Authority 1,864 (Shenzhen's e-buses {eclipse|超越} other cities' entire fleets)","zh":"圖表：深圳 16,359 輛電動巴士，對比紐約 5,710、洛杉磯縣 2,633、新澤西運輸 2,392、多倫多 1,926、芝加哥運輸局 1,864（深圳的電動巴士數目超越其他城市的整個車隊）","lvl":0,"num":false}]},"96":{"n":96,"en":"Smart Living – Tencent MIAIS (騰訊覓影): AI & Medical Large Language Models (LLM) in Healthcare","zh":"智慧生活——騰訊覓影：醫療 AI 及大型語言模型","p":[{"en":"Medical AI & Large Language Models (LLMs)","zh":"醫療 AI 及大型語言模型","lvl":0,"num":false},{"en":"Full-lifecycle diagnosis & screening (covers over 20 disease types including early cancer screening, {glaucoma|青光眼}, {cerebrovascular|腦血管的} diseases)","zh":"全周期診斷及篩查（涵蓋超過 20 種疾病，包括早期癌症篩查、青光眼、腦血管疾病）","lvl":0,"num":false},{"en":"Extensive nationwide deployment (AI imaging deployed in 500+ top hospitals, while LLM-powered {triage|分流}/consultation services connect 10,000+ medical facilities across China)","zh":"全國廣泛應用（AI 影像已部署於 500 多間頂級醫院，以大型語言模型支援的分流／諮詢服務連接全國 10,000 多間醫療機構）","lvl":0,"num":false},{"en":"By merging DeepSeek and Hunyuan LLMs during 2025–2026, Tencent MIAIS has advanced beyond standard computer vision to deliver comprehensive, {multimodal|多模態} generative AI capabilities in healthcare.","zh":"在 2025–2026 年結合 DeepSeek 及混元大模型後，騰訊覓影已超越一般電腦視覺，提供全面的多模態生成式 AI 醫療能力。","lvl":0,"num":false}]},"97":{"n":97,"en":"Smart Government – By 2035, 80% of China's Governance Powered by Geospatial Intelligence","zh":"智慧政府——2035 年中國 80% 的管治由地理空間智能支援","p":[{"en":"By 2025, more than 50% of government decision-making, production coordination, and general planning can be conducted through 3D digital geospatial systems.","zh":"到 2025 年，超過 50% 的政府決策、生產協調及總體規劃可透過三維數碼地理空間系統進行。","lvl":0,"num":false},{"en":"By 2035, this % is expected to exceed 80%.","zh":"到 2035 年，這個比例預計超過 80%。","lvl":0,"num":false},{"en":"In February 2022, the Ministry of Natural Resources issued a notice on the development of 3D Real Scene in China (《关于全面推进实景三维中国建设的通知》).","zh":"2022 年 2 月，自然資源部發出《關於全面推進實景三維中國建設的通知》。","lvl":0,"num":false},{"en":"3D Real Scene: from abstract to real; from 2D to 3D; from static to real-time dynamic – the foundation of Digital China","zh":"實景三維：由抽象到真實；由二維到三維；由靜態到實時動態——數字中國的基礎","lvl":0,"num":false}]},"98":{"n":98,"en":"Smart People – China Advances AI Curriculum to Cover Full Basic Education","zh":"智慧市民——中國推進人工智能課程覆蓋整個基礎教育","p":[{"en":"Guidelines: 《中小学人工智能通识教育指南（2025年版）》 and 《中小学生成式人工智能使用指南（2025年版）》","zh":"指引：《中小學人工智能通識教育指南（2025 年版）》及《中小學生成式人工智能使用指南（2025 年版）》","lvl":0,"num":false},{"en":"AI curriculum step by step: primary school – cultivate interest & build basic awareness; junior secondary – deepen AI logic & critical thinking; senior secondary – develop systems thinking & innovative practice","zh":"AI 課程循序漸進：小學——培養興趣及基本認識；初中——深化 AI 邏輯及批判思考；高中——發展系統思維及創新實踐","lvl":0,"num":false},{"en":"Guidelines for Generative AI set five principles: student-centered learning, {equity|公平} and inclusion, value guidance, demand-driven use, and safety control.","zh":"生成式 AI 指引訂立五大原則：以學生為本、公平共融、價值引領、按需使用、安全可控。","lvl":0,"num":false},{"en":"AI should support learning and teaching, but should not replace teachers' core educational role.","zh":"AI 應支援學與教，但不應取代教師的核心教育角色。","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Smart people might include robotics.","zh":"智慧市民可能包括機械人學。","kind":"note"}]}},"secs":{"A1":{"en":"A1. About the Course","zh":"課程簡介","p":[{"h":1,"en":"Teachers","zh":"講師"},{"en":"**Prof. Winnie Tang** (Dr. Winnie Tang, MH, JP) – {Adjunct|兼任} Professor at HKU (School of Computing and Data Science; Department of Geography). Founder of the Smart City {Consortium|聯盟} (SCC), the Greater Bay Area Low-Altitude Economy {Alliance|聯盟}, GIS Academy, and Esri China (Hong Kong) Ltd. Email: wsmtang@hku.hk","zh":"鄧淑明教授（太平紳士，榮譽勳章）——香港大學兼任教授（計算與數據科學學院、地理系）。她創辦了智慧城市聯盟、大灣區低空經濟聯盟、GIS Academy 及 Esri 中國（香港）。電郵：wsmtang@hku.hk","lvl":0,"num":false},{"en":"**Mr. Kelvin Shum** – Adjunct Assistant Professor, Department of Geography. Email: kwlshum@hku.hk","zh":"Kelvin Shum 先生——地理系兼任助理教授。電郵：kwlshum@hku.hk","lvl":0,"num":false},{"h":1,"en":"Course objectives","zh":"課程目標"},{"en":"Make you aware of why GIS is important for building smart cities, and how GIS can be {integrated|整合} with other ICT to support urban development.","zh":"讓你認識 GIS 對建設智慧城市的重要性，以及 GIS 如何與其他資訊及通訊科技結合，支援城市發展。","lvl":0,"num":true},{"en":"Present smart city concepts and applications, and teach the operation skills to use GIS software and {geospatial|地理空間的} cloud technology to build web-based GIS applications.","zh":"介紹智慧城市的概念和應用，並教授使用 GIS 軟件及地理空間雲端技術來建立網上 GIS 應用程式的操作技巧。","lvl":0,"num":true},{"h":1,"en":"Assessment","zh":"評核方法"},{"en":"GIS Lab · GIS 實驗課 · 30% · Hands-on GIS exercises · 實際操作 GIS 練習","zh":"","row":1},{"en":"In-class Quiz · 20% · Lecture 7 (20/10/2026)","zh":"課堂測驗 · 第七課（2026年10月20日）","row":1},{"en":"Individual Report · 20% · Fewer than 1,500 words","zh":"個人報告 · 少於 1,500 字","row":1},{"en":"Group Project & Presentation · 30% · \u003c 5,000 words: 10% peer evaluation + 10% report + 10% presentation","zh":"小組專題及匯報 · 少於 5,000 字：10% 組員互評 + 10% 報告 + 10% 匯報","row":1},{"h":2,"kind":"tip","en":"Plan ahead","zh":""},{"en":"The quiz is in Lecture 7 (20 Oct 2026). Lectures 1–6 are the most likely quiz content, so these notes are useful revision.","zh":"測驗在第七課（2026年10月20日）。第一至六課最有可能成為測驗內容，所以這份筆記是很好的溫習材料。","kind":"tip"}],"terms":[["GIS (Geographic Information System)","地理資訊系統","用電腦把各種數據連繫到「位置」，再以地圖方式儲存、分析和顯示的系統。本課程的核心工具。"],["ICT (Information and Communications Technology)","資訊及通訊科技","所有處理和傳送資訊的科技，例如電腦、互聯網、流動網絡、感應器。"],["Geospatial cloud technology","地理空間雲端技術","把 GIS 軟件和地圖數據放在雲端伺服器上，經網頁瀏覽器使用，毋須自己安裝伺服器（例如 ArcGIS Online）。"],["Web-based GIS application","網上 GIS 應用程式","在網頁上運行、讓用戶查看和查詢地圖的應用程式，例如政府的疫情地圖。"],["Smart City Consortium (SCC)","智慧城市聯盟","由業界專業人士組成的非牟利組織，向香港政府提出智慧城市政策和標準的建議。"],["Peer evaluation","組員互評","小組專題中由組員互相評分，佔本科 10%。"]]},"A2":{"en":"A2. Why Do Cities Need to Become \"Smart\"?","zh":"為甚麼城市需要變得「智慧」？","p":[{"en":"The lecture starts with **problems**. A smart city is a response to these problems. Remember this logic: problems → need to be smarter → use technology and data → better life.","zh":"本課以「問題」開始。智慧城市就是對這些問題的回應。記住這個邏輯：問題 → 需要更聰明 → 運用科技和數據 → 更好的生活。"},{"h":1,"en":"1. Global challenges","zh":"一、全球性挑戰"},{"en":"{Urbanization|城市化}, {ageing population|人口老化}, social conflict, {inequality|不平等}, pollution, loss of nature, energy crisis, climate change, natural disasters and resource {depletion|耗盡}.","zh":"城市化、人口老化、社會衝突、不平等、污染、大自然流失、能源危機、氣候變化、天災及資源耗盡。","lvl":0,"num":false},{"en":"Over 8 million people died from air-pollution-related diseases in 2021 (UNICEF, 2024).","zh":"2021 年有超過 800 萬人死於與空氣污染有關的疾病（聯合國兒童基金會，2024）。","lvl":0,"num":false},{"en":"By 2050, two-thirds of the world's population (6.4 billion) will live in cities → {strain|壓力} on energy, housing, transport, jobs and public services. Citizens also demand more {transparency|透明度} from government.","zh":"到 2050 年，全球三分之二人口（64 億）會住在城市 → 能源、房屋、交通、就業及公共服務都受壓。市民亦要求政府更透明。","lvl":0,"num":false},{"h":1,"en":"2. Climate change is widespread, rapid and {intensifying|加劇}"
