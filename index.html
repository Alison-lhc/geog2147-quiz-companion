rocessing) → model training → generate results of recent natural landslides from AI detection → post-classification processing, converting 2D to 3D","zh":"步驟：匯出深度學習訓練數據（地理處理）→ 模型訓練 → 生成 AI 偵測的近期山泥傾瀉結果 → 分類後處理，二維轉三維","lvl":0,"num":false}]},"24":{"n":24,"en":"GeoAI-infused App for Tree Identification & Inventorying in Georgia","zh":"融合 GeoAI 的樹木識別及清點應用程式（美國喬治亞州）","p":[{"en":"Deep learning; citizen engagement; collect both tree locations and species; build a comprehensive tree {inventory|清單}","zh":"深度學習；市民參與；收集樹木位置及品種；建立全面的樹木清單","lvl":0,"num":false},{"en":"City of John's Creek, Georgia, USA","zh":"美國喬治亞州約翰斯克里克市","lvl":0,"num":false}]},"25":{"n":25,"en":"GeoAI Mosquito Risk Mapping for HK's Public Health Protection","zh":"GeoAI 蚊患風險地圖保障香港公共衞生","p":[{"en":"Identifies locations with the highest mosquito {abundance|數量多} based on the Mosquito Risk Index (MRI)","zh":"根據蚊患風險指數找出蚊子最多的地點","lvl":0,"num":false},{"en":"GIS and AI technologies are used to compile and analyse all the IoT-collected data","zh":"以 GIS 和 AI 技術整理及分析所有物聯網收集的數據","lvl":0,"num":false},{"en":"Presents GeoAI model results on a map so stakeholders and the public can easily locate high-risk areas","zh":"在地圖上展示 GeoAI 模型結果，讓持份者和公眾容易找到高風險地區","lvl":0,"num":false},{"en":"Supports decision-making and targeted mosquito control measures to prevent disease spread (e.g., Chikungunya fever 基孔肯雅熱); by GeoAI Solution & Lingnan University","zh":"支援決策及針對性滅蚊措施，防止疾病傳播（例如基孔肯雅熱）；由 GeoAI Solution 及嶺南大學製作","lvl":0,"num":false}]},"27":{"n":27,"en":"8 Ways AI will Transform our Cities Smarter by 2030","zh":"到 2030 年 AI 令城市更智慧的八種方式","p":[{"en":"Transportation; education; healthcare; public safety; home & service robots; employment & workplace; entertainment; low-resource communities","zh":"交通；教育；醫療；公共安全；家居及服務機械人；就業及工作場所；娛樂；資源匱乏社區","lvl":0,"num":false},{"en":"Source: SingularityHub (2017)","zh":"資料來源：SingularityHub（2017）","lvl":0,"num":false}]},"28":{"n":28,"en":"Impact of AI on Jobs","zh":"AI 對就業的影響","p":[{"en":"By 2030, 170 million jobs will be created globally while 92 million will be lost (**net gain of 78 million jobs, or 7% more employment**)","zh":"到 2030 年，全球將創造 1.7 億個職位，同時失去 9,200 萬個（淨增 7,800 萬個職位，即就業增加 7%）","lvl":0,"num":false},{"en":"The fastest-growing jobs are roles such as big data specialists, FinTech engineers, AI and machine learning specialists, and software and applications developers","zh":"增長最快的職位包括大數據專家、金融科技工程師、AI 及機器學習專家，以及軟件及應用程式開發人員","lvl":0,"num":false},{"en":"Source: World Economic Forum, Future of Jobs Report 2025 (Fastest-growing jobs 2025–2030)","zh":"資料來源：世界經濟論壇《2025 年未來就業報告》（2025–2030 年增長最快職位）","lvl":0,"num":false}]},"29":{"n":29,"en":"Ethics of Artificial Intelligence","zh":"人工智能倫理","p":[{"en":"AI ethics is critical because AI increasingly shapes decisions about people's lives, rights, and opportunities. Without clear ethical rules, AI can {amplify|放大} existing harms instead of delivering benefits.","zh":"AI 倫理至關重要，因為 AI 越來越影響人們生活、權利和機會的決定。沒有清晰的道德規則，AI 可能放大現有的傷害，而不是帶來好處。","lvl":0,"num":false},{"en":"2021 UNESCO: Recommendation on the Ethics of AI","zh":"2021 年聯合國教科文組織：《人工智能倫理建議書》","lvl":0,"num":false},{"en":"2021 (Aug) PCPD: Guidance on the Ethical Development and Use of AI","zh":"2021 年（8 月）私隱專員公署：《開發及使用人工智能道德標準指引》","lvl":0,"num":false},{"en":"2024 (Jul) DPO: Ethical Artificial Intelligence Framework","zh":"2024 年（7 月）數字政策辦公室：《人工智能道德框架》","lvl":0,"num":false},{"en":"Key ideas: transparency, fairness, privacy, safety, accountability, justice, governance, legality","zh":"重要概念：透明、公平、私隱、安全、問責、公正、管治、合法","lvl":0,"num":false}]},"33":{"n":33,"en":"IoT is the \"Senses\", Big Data is the \"Fuel\", AI is the \"Brain\"","zh":"物聯網是「感官」，大數據是「燃料」，AI 是「大腦」","p":[{"en":"**IoT:** connect devices and collect data","zh":"物聯網：連接裝置並收集數據","lvl":0,"num":false},{"en":"**Big Data:** capture, storage, analysis of data","zh":"大數據：擷取、儲存及分析數據","lvl":0,"num":false},{"en":"**AI:** data-based learning, analytics, automation","zh":"AI：以數據為本的學習、分析及自動化","lvl":0,"num":false}]},"36":{"n":36,"en":"What is Cloud Computing? (Definitions)","zh":"甚麼是雲端運算？（定義）","p":[{"en":"**Microsoft:** cloud computing is the delivery of computing services – including servers, storage, databases, networking, software, analytics, and intelligence – over the Internet (\"the cloud\") to offer faster innovation, flexible resources, and {economies of scale|規模經濟}. You typically pay only for cloud services you use, helping you lower your operating costs, run your infrastructure more efficiently, and scale as your business needs change.","zh":"微軟：雲端運算是透過互聯網（「雲端」）提供運算服務——包括伺服器、儲存、數據庫、網絡、軟件、分析及智能——以帶來更快的創新、靈活的資源和規模經濟。你通常只需為使用的雲端服務付費，有助降低營運成本、更有效運行基建，並按業務需要擴展。","lvl":0,"num":false},{"en":"**Amazon Web Services (AWS):** cloud computing is the on-demand delivery of IT resources over the Internet with pay-as-you-go pricing. Instead of buying, owning, and maintaining physical data centres and servers, you can access technology services, such as computing power, storage, and databases, on an as-needed basis from a cloud provider.","zh":"亞馬遜網絡服務：雲端運算是透過互聯網按需提供資訊科技資源，並按用量收費。你毋須購買、擁有及維護實體數據中心和伺服器，而是按需要從雲端供應商取得運算能力、儲存及數據庫等科技服務。","lvl":0,"num":false}]},"37":{"n":37,"en":"What is Cloud Computing? (Simple Definition)","zh":"甚麼是雲端運算？（簡單定義）","p":[{"en":"Cloud computing is a general term for anything that involves delivering hosted services over the Internet","zh":"雲端運算是透過互聯網提供託管服務的統稱","lvl":0,"num":false}]},"38":{"n":38,"en":"Cloud Services Model","zh":"雲端服務模式","p":[{"en":"**IaaS: Infrastructure as a Service** (\"Host\") – consumer can {provision|配置} computing resources within the provider's infrastructure upon which they can deploy and run arbitrary software, including OS and applications","zh":"基礎設施即服務（「託管」）——用戶可在供應商的基建中配置運算資源，並在上面部署及運行任何軟件，包括作業系統和應用程式","lvl":0,"num":false},{"en":"**PaaS: Platform as a Service** (\"Build\") – consumer can create custom applications using programming tools supported by the provider and deploy them onto the provider's cloud infrastructure","zh":"平台即服務（「建立」）——用戶可使用供應商支援的編程工具開發自訂應用程式，並部署到供應商的雲端基建","lvl":0,"num":false},{"en":"**SaaS: Software as a Service** (\"Consume\") – consumer uses the provider's applications running on the provider's cloud infrastructure","zh":"軟件即服務（「使用」）——用戶使用在供應商雲端基建上運行的供應商應用程式","lvl":0,"num":false}]},"39":{"n":39,"en":"Cloud Services Model Comparison","zh":"雲端服務模式比較","p":[{"en":"Applications 應用程式 · You 你 · You 你 · You 你 · Provider 供應商","zh":"","row":1},{"en":"Data 數據 · You · You · You · Provider","zh":"","row":1},{"en":"Runtime 運行環境 · You · You · Provider · Provider","zh":"","row":1},{"en":"Middleware 中介軟件 · You · You · Provider · Provider","zh":"","row":1},{"en":"O/S 作業系統 · You · You · Provider · Provider","zh":"","row":1},{"en":"Virtualization 虛擬化 · You · Provider · Provider · Provider","zh":"","row":1},{"en":"Servers 伺服器 · You · Provider · Provider · Provider","zh":"","row":1},{"en":"Storage 儲存 · You · Provider · Provider · Provider","zh":"","row":1},{"en":"Networking 網絡 · You · Provider · Provider · Provider","zh":"","row":1},{"en":"\"You manage\" vs \"Managed by hosting provider\": the more \"as a service\", the less you manage.","zh":"「你管理」與「由託管供應商管理」：越是「即服務」，你要管理的越少。","lvl":0,"num":false}]},"40":{"n":40,"en":"Cloud Deployment Model","zh":"雲端部署模式","p":[{"en":"**Private cloud:** provisioned for exclusive use by a single organization comprising multiple consumers (e.g., business units)","zh":"私有雲：供單一機構（包括多個用戶，例如業務部門）專用","lvl":0,"num":false},{"en":"**Community cloud:** provisioned for exclusive use by a specific community of consumers from organizations that have shared concerns","zh":"社群雲：供來自有共同關注的機構的特定用戶社群專用","lvl":0,"num":false},{"en":"**Public cloud:** provisioned for open use by the general public","zh":"公共雲：供公眾開放使用","lvl":0,"num":false},{"en":"**Hybrid cloud:** a composition of two or more distinct cloud infrastructures (private, community, or public)","zh":"混合雲：由兩個或以上不同的雲端基建（私有、社群或公共）組成","lvl":0,"num":false}]},"41":{"n":41,"en":"5 Essential Characteristics of Cloud Computing","zh":"雲端運算的五大基本特點","p":[{"en":"**On-demand self-service** – a consumer can {unilaterally|單方面地} provision computing capabilities (server time, storage) automatically without human interaction with the provider","zh":"按需自助服務——用戶可自行自動配置運算能力（伺服器時間、儲存），毋須與供應商人員互動","lvl":0,"num":true},{"en":"**Broad network access** – capabilities are available over the network and accessed through standard mechanisms by phones, tablets, laptops and workstations","zh":"廣泛網絡存取——可透過網絡以標準方式，用手機、平板、手提電腦及工作站存取","lvl":0,"num":true},{"en":"**Resource pooling** – the provider's resources are pooled to serve multiple consumers (multi-tenant model), dynamically assigned according to demand; the customer has no control over the exact location of resources","zh":"資源匯集——供應商的資源匯集起來服務多個用戶（多租戶模式），按需求動態分配；用戶無法控制資源的確切位置","lvl":0,"num":true},{"en":"**Rapid {elasticity|彈性}** – capabilities can be elastically provisioned and released to scale rapidly outward and inward with demand; they appear unlimited to the consumer","zh":"快速彈性——可按需求彈性地增加或減少資源；對用戶而言資源彷彿無限","lvl":0,"num":true},{"en":"**Measured service** – cloud systems automatically control and optimize resource use by metering; usage can be monitored, controlled and reported, providing transparency for both provider and consumer","zh":"可計量服務——雲端系統以計量方式自動控制及優化資源使用；用量可被監察、控制及報告，令供應商和用戶都清楚透明","lvl":0,"num":true}]},"42":{"n":42,"en":"Pros and Cons of Using Cloud Computing","zh":"使用雲端運算的優缺點","p":[{"en":"**Pros:** low cost; simplification; centralization; {virtualization|虛擬化}; self-service; pay-as-you-go; automation; green IT","zh":"優點：成本低；簡化；集中化；虛擬化；自助服務；按用量付費；自動化；綠色資訊科技","lvl":0,"num":false},{"en":"**Cons:** security; limitation in applications; maintenance control; migrations; losing your data privacy; hidden cost","zh":"缺點：保安；應用受限；維護控制權；遷移問題；失去數據私隱；隱藏成本","lvl":0,"num":false}]},"43":{"n":43,"en":"Benefits of Cloud Computing for Smart City","zh":"雲端運算對智慧城市的好處","p":[{"en":"Faster time to market","zh":"更快推出市場","lvl":0,"num":true},{"en":"Faster access to new technology / resources","zh":"更快取得新技術／資源","lvl":0,"num":true},{"en":"Better {scalability|可擴展性}","zh":"更佳的可擴展性","lvl":0,"num":true},{"en":"High-performance infrastructure","zh":"高效能基建","lvl":0,"num":true},{"en":"Cost saving","zh":"節省成本","lvl":0,"num":true}]},"44":{"n":44,"en":"Market Players","zh":"市場參與者","p":[{"en":"Microsoft Azure; AWS (Amazon Web Services); Alibaba Cloud; Huawei Cloud","zh":"微軟 Azure；亞馬遜網絡服務；阿里雲；華為雲","lvl":0,"num":false}]},"45":{"n":45,"en":"Considerations on Choosing Cloud Services","zh":"選擇雲端服務的考慮因素","p":[{"en":"Reputation","zh":"聲譽","lvl":0,"num":false},{"en":"Service Level Agreement (SLA)","zh":"服務水平協議","lvl":0,"num":false},{"en":"Learn their technologies & infrastructure","zh":"了解其技術及基建","lvl":0,"num":false},{"en":"Perform a risk assessment and assess the {compliance|合規性}","zh":"進行風險評估並評估合規性","lvl":0,"num":false},{"en":"Local regulation","zh":"本地法規","lvl":0,"num":false}]},"48":{"n":48,"en":"5 Key Factors for the Success of the Low-Altitude Economy Industry","zh":"低空經濟產業成功的五大關鍵因素","p":[{"en":"Technological support","zh":"技術支援","lvl":0,"num":true},{"en":"Regulatory and policy support, as well as market acceptance","zh":"監管及政策支援，以及市場接受程度","lvl":0,"num":true},{"en":"Financial support","zh":"財政支援","lvl":0,"num":true},{"en":"Sustainability and improving urban traffic efficiency","zh":"可持續性及提升城市交通效率","lvl":0,"num":true},{"en":"National security","zh":"國家安全","lvl":0,"num":true}]},"52":{"n":52,"en":"China's 3 Drone Giants","zh":"中國三大無人機巨頭","p":[{"en":"**DJI 大疆創新:** global leader in civilian drones holding 70–80% market share; agriculture and heavy industrial fleets with over 700,000 active drones globally","zh":"大疆創新：民用無人機全球領導者，佔 70–80% 市場份額；農業及重工業機隊全球超過 70 萬架活躍無人機","lvl":0,"num":false},{"en":"**EHang 億航:** EH216-S became the world's 1st certified eVTOL to launch commercial ticketed flights; active urban public routes in Guangzhou & Hefei","zh":"億航：EH216-S 成為全球首款獲認證並推出商業售票飛行的 eVTOL；在廣州及合肥營運城市公共航線","lvl":0,"num":false},{"en":"**Phoenix Wings 豐翼科技** (subsidiary of SF Express): leader in cargo and medical BVLOS drone delivery","zh":"豐翼科技（順豐子公司）：貨運及醫療超視距無人機配送的領導者","lvl":0,"num":false}]},"54":{"n":54,"en":"First Batch of 38 Low-Altitude Economy (LAE) Regulatory Sandbox Pilot Projects","zh":"首批 38 個低空經濟監管沙盒試點項目","p":[{"en":"34 have commenced – with over 20 already regularised & scaled – while the remaining 4 are being advanced through alternative regulatory mechanisms","zh":"34 個已展開——其中超過 20 個已常規化及擴大規模——其餘 4 個經其他監管機制推進","lvl":0,"num":false},{"en":"Examples: training camp patrol (Civil Aid Service); illegal fishing patrol (AFCD); equipment delivery (EPD); medical delivery (Tseung Kwan O Hospital); on-campus flight route research (universities); bicycle path patrol (police); cable and transmission tower inspection (CLP)","zh":"例子：訓練營巡查（民眾安全服務隊）；非法捕魚巡邏（漁護署）；設備運送（環保署）；醫療物資運送（將軍澳醫院）；校園航線研究（大學）；單車徑巡邏（警方）；電纜及輸電塔檢查（中電）","lvl":0,"num":false}]},"55":{"n":55,"en":"Low-altitude Economy Regulatory Sandbox X (24 Nov 2025)","zh":"低空經濟「監管沙盒 X」（2025 年 11 月 24 日）","p":[{"en":"Objective: to test 5 technologically complex application scenarios. \"X\" represents \"extended\" and \"extra\".","zh":"目標：測試 5 個技術複雜的應用場景。「X」代表「延伸」及「額外」。","lvl":0,"num":false},{"en":"Unmanned aircraft system traffic management (UTM) demonstrations","zh":"無人機系統交通管理示範","lvl":0,"num":true},{"en":"Unconventional aircraft application (UCA) operations","zh":"非常規飛行器應用操作","lvl":0,"num":true},{"en":"Cross-boundary flights","zh":"跨境飛行","lvl":0,"num":true},{"en":"Shared platforms: multi-application and multi-user","zh":"共享平台：多應用、多用戶","lvl":0,"num":true},{"en":"Other advanced technical use cases","zh":"其他進階技術用途","lvl":0,"num":true}]},"57":{"n":57,"en":"4 Roles of Geospatial Intelligence – 1. Data Collection and Processing","zh":"地理空間智能的四個角色——1. 數據收集及處理","p":[{"en":"Integrate data from any source. Collect, manage, and integrate data from a variety of sources and formats, including imagery, sensors, open source, and other location data (IoT).","zh":"整合任何來源的數據。收集、管理及整合不同來源和格式的數據，包括影像、感應器、開源及其他位置數據（物聯網）。","lvl":0,"num":false},{"en":"Images: \"GIS integrating every type & format of data\"; \"Digital twins are abstracting and modelling everything\" – buildings (BIM), networks (NIM), landscapes (LIM), cities (CIM)","zh":"圖片：「GIS 整合各類型及格式的數據」；「數碼孿生抽象及模擬一切」——建築（BIM）、網絡（NIM）、地景（LIM）、城市（CIM）","lvl":0,"num":false}]},"58":{"n":58,"en":"4 Roles of Geospatial Intelligence – 2. Multidimensional Visualization","zh":"地理空間智能的四個角色——2. 多維視覺化","p":[{"en":"Bring data to life. Visualize data with a variety of advanced tools to represent spatial, temporal, and relational data in {compelling|引人入勝的} ways that tell a narrative and are easy to understand.","zh":"令數據變得生動。以多種先進工具視覺化數據，用引人入勝、能說故事又容易理解的方式呈現空間、時間及關係數據。","lvl":0,"num":false}]},"59":{"n":59,"en":"4 Roles of Geospatial Intelligence – 3. Advanced Analytics","zh":"地理空間智能的四個角色——3. 進階分析","p":[{"en":"Transform data into intelligence. Unlock your data with the world's most powerful spatial analytics capabilities (GeoAI, Big Data Analytics) to gain novel insights and actionable intelligence (e.g., link analysis).","zh":"把數據轉化為情報。以世界上最強大的空間分析能力（GeoAI、大數據分析）發掘數據，取得新穎洞見及可付諸行動的情報（例如關聯分析）。","lvl":0,"num":false}]},"60":{"n":60,"en":"4 Roles of Geospatial Intelligence – 4. Dissemination","zh":"地理空間智能的四個角色——4. 發布","p":[{"en":"Communicate findings effectively. Create and share intelligence products with report templates and industry-standard {symbology|符號系統} to create dynamic information products. Distribute to decision-makers and other stakeholders via interactive dashboards delivered securely (e.g., demo crime dashboard).","zh":"有效傳達結果。以報告範本及行業標準符號製作及分享情報產品，建立動態資訊產品。透過安全的互動儀表板發送給決策者及其他持份者（例如罪案儀表板示範）。","lvl":0,"num":false}]},"61":{"n":61,"en":"UAV GIS Mapping and Data Extraction","zh":"無人機 GIS 測繪及數據提取","p":[{"en":"Get data and insights in one step – saving time and effort","zh":"一步取得數據和洞見——節省時間和精力","lvl":0,"num":false},{"en":"Image capture; flight planning; fleet management; large-area mapping with rapid processing; 2D & 3D mapping; advanced analytics (pre-trained GeoAI models)","zh":"影像擷取；飛行規劃；機隊管理；大範圍快速測繪；二維及三維測繪；進階分析（預先訓練的 GeoAI 模型）","lvl":0,"num":false}]},"62":{"n":62,"en":"GIS-Powered LAE Traffic Management Platform (UTM) – Overview","zh":"以 GIS 驅動的低空交通管理平台——概覽","p":[{"en":"With GIS at the core, integrated with flight data, airspace intelligence, monitoring systems, and real-time communication technologies, this UTM platform creates a system with: situational awareness; mission scheduling; risk warning; flight monitoring","zh":"以 GIS 為核心，整合飛行數據、空域情報、監察系統及實時通訊技術，這個無人機交通管理平台具備：態勢感知；任務排程；風險預警；飛行監察","lvl":0,"num":false}]},"63":{"n":63,"en":"UTM – Flight Route Design and Simulation Analysis","zh":"無人機交通管理——航線設計及模擬分析","p":[{"en":"Plan UAV missions, including routes, altitudes, timing, and dynamic {constraints|限制}, while using simulation to predict mission execution and potential risks.","zh":"規劃無人機任務，包括航線、高度、時間及動態限制，並以模擬預測任務執行情況及潛在風險。","lvl":0,"num":false}]},"64":{"n":64,"en":"UTM – Flight Suitability Analysis / Risk Index Analysis","zh":"無人機交通管理——飛行適合度分析／風險指數分析","p":[{"en":"By overlaying open spatial data such as terrain, weather, no-fly zones, etc., and conducting suitability analysis, we can generate a flight risk index, assisting in mission planning and optimizing routes.","zh":"疊加地形、天氣、禁飛區等開放空間數據並進行適合度分析，可生成飛行風險指數，協助任務規劃及優化航線。","lvl":0,"num":false},{"en":"Core capabilities (data layers): land use; slope; real-time weather; building height; no-flying zone","zh":"核心能力（數據圖層）：土地用途；斜度；實時天氣；建築物高度；禁飛區","lvl":0,"num":false},{"en":"Integrating CSDI data to establish a Single Source of Truth (SSOT)","zh":"整合空間數據共享平台數據，建立單一真實來源","lvl":0,"num":false}]},"65":{"n":65,"en":"UTM – Real-time Tracking and Monitoring (Digital Twin)","zh":"無人機交通管理——實時追蹤及監察（數碼孿生）","p":[{"en":"\"Digital Twin\" synchronizes real-world data into the management platform to achieve collaborative management and risk early warning (real-world operation ↔ digital twin).","zh":"「數碼孿生」把現實世界數據同步到管理平台，實現協同管理及風險預警（現實操作 ↔ 數碼孿生）。","lvl":0,"num":false}]},"66":{"n":66,"en":"UTM – Multi-Flight Tracking","zh":"無人機交通管理——多航班追蹤","p":[{"en":"Real-time tracking of multiple drone routes for safe and coordinated airspace operations","zh":"實時追蹤多架無人機航線，確保空域運作安全協調","lvl":0,"num":false},{"en":"Interactive 2D & 3D maps for enhanced spatial awareness and efficient monitoring","zh":"互動二維及三維地圖，加強空間感知及有效監察","lvl":0,"num":false},{"en":"Location reporting: continuous drone position updates for sustained situational awareness","zh":"位置報告：持續更新無人機位置，保持態勢感知","lvl":0,"num":false},{"en":"Conflict detection and resolution: automated detection and resolution of potential airspace conflicts","zh":"衝突偵測及解決：自動偵測並解決潛在空域衝突","lvl":0,"num":false}]},"67":{"n":67,"en":"UTM – Multi-Drone Oversight","zh":"無人機交通管理——多無人機監督","p":[{"en":"Live monitoring of mission status and locations across multiple UAVs","zh":"實時監察多架無人機的任務狀態及位置","lvl":0,"num":false},{"en":"Integrated data dashboard: key flight information such as {attitude|飛行姿態}, speed, altitude, battery level, and mission status displayed in real time","zh":"整合數據儀表板：實時顯示飛行姿態、速度、高度、電量及任務狀態等重要飛行資訊","lvl":0,"num":false}]},"68":{"n":68,"en":"UTM – Geo-fencing","zh":"無人機交通管理——地理圍欄","p":[{"en":"Supports both static and dynamic geofence management by defining virtual boundaries around designated airspaces. By integrating software and hardware, it restricts UAV access to sensitive zones, thereby {safeguarding|保障} flight operations.","zh":"支援靜態及動態地理圍欄管理，在指定空域周圍設定虛擬邊界。透過整合軟件及硬件，限制無人機進入敏感區域，從而保障飛行安全。","lvl":0,"num":false},{"en":"**Static geofences** are applied to predefined sensitive areas such as airports and government facilities, maintaining consistent restrictions.","zh":"靜態地理圍欄應用於預先設定的敏感區域，例如機場及政府設施，維持一貫限制。","lvl":0,"num":false},{"en":"**Dynamic geofences** are activated in response to real-time circumstances, such as temporary no-fly zones or emergency operations.","zh":"動態地理圍欄按實時情況啟動，例如臨時禁飛區或緊急行動。","lvl":0,"num":false}]},"69":{"n":69,"en":"LAE Regulatory Sandbox Pilot Projects – UAV Patrol: Illegal Fishing in Kat O","zh":"低空經濟監管沙盒試點——無人機巡邏：吉澳非法捕魚","p":[{"en":"Kat O is a remote coastal region rich in marine resources and ecological diversity (AFCD)","zh":"吉澳是偏遠海岸地區，海洋資源及生態多樣性豐富（漁護署）","lvl":0,"num":false},{"en":"The area has faced ongoing challenges from illegal fishing activities","zh":"該區持續受非法捕魚問題困擾","lvl":0,"num":false},{"en":"Deploying UAVs for patrols is an effective method to prevent and {deter|阻嚇} illegal fishing","zh":"以無人機巡邏是預防及阻嚇非法捕魚的有效方法","lvl":0,"num":false},{"en":"A pre-trained AI model will automatically identify and flag illegal fishing activities (試飛 – 吉澳非法捕魚監測)","zh":"預先訓練的 AI 模型會自動識別並標示非法捕魚活動（試飛——吉澳非法捕魚監測）","lvl":0,"num":false}]},"70":{"n":70,"en":"LAE Regulatory Sandbox Pilot Projects – UAV Inspection at Tai Tan and Yuen Tun Training Camps","zh":"低空經濟監管沙盒試點——無人機巡查大灘及元墩訓練營","p":[{"en":"Yuen Tun and Tai Tan, as core training facilities for CAS (Civil Aid Service), cover hilly areas of 190,000 m² and 12,000 m² respectively. UAVs can effectively reduce the operational burden of manual inspection and facility maintenance.","zh":"元墩及大灘是民眾安全服務隊的核心訓練設施，分別覆蓋 19 萬平方米及 1.2 萬平方米的山地。無人機可有效減輕人手巡查及設施維修的工作負擔。","lvl":0,"num":false},{"en":"Captured imagery and video data can be used for AI-powered intelligent detection and integrated with GIS, contributing to an efficient Asset Management System.","zh":"拍攝的影像及影片數據可用於 AI 智能偵測並與 GIS 整合，建立高效的資產管理系統。","lvl":0,"num":false}]},"71":{"n":71,"en":"LAE Regulatory Sandbox Pilot Projects – Weather Monitoring and Air Sampling (UAV Transportation)","zh":"低空經濟監管沙盒試點——天氣監測及空氣採樣（無人機運輸）","p":[{"en":"Deployment of air quality sensor calibration devices via UAV to remote monitoring stations for co-location calibration (EPD)","zh":"以無人機把空氣質素感應器校準裝置運送到偏遠監測站作同址校準（環保署）","lvl":0,"num":false},{"en":"Using GIS for precise flight route planning to avoid densely populated areas and obstacles","zh":"以 GIS 精確規劃航線，避開人口稠密地區及障礙物","lvl":0,"num":false},{"en":"Flight distance: about 560 metres, taking less than 3 minutes","zh":"飛行距離：約 560 米，少於 3 分鐘","lvl":0,"num":false}]}},"secs":{"A1":{"en":"A1. Artificial Intelligence – the Basics","zh":"人工智能——基礎","p":[{"en":"\"AI – we can't survive without data.\" AI is like a set of circles, one inside another:","zh":"「AI——沒有數據就無法生存。」AI 就像一組一個套一個的圓圈："},{"en":"Artificial Intelligence · The theory and methods to build machines that think and act like humans","zh":"人工智能 · 建造像人一樣思考和行動的機器的理論和方法","row":1},{"en":"Machine Learning · Computers learn from experience or data without human programming","zh":"機器學習 · 電腦從經驗或數據中學習，毋須人類編寫程式","row":1},{"en":"Deep Learning · Mimics the human brain using artificial {neural networks|神經網絡} (e.g., transformers) for complex tasks · 以人工神經網絡（例如 transformer）模仿人腦，執行複雜任務","zh":"深度學習","row":1},{"en":"Generative AI · Generates new text, audio, images, video or code based on content it has been **pre-trained** on (ChatGPT, Midjourney, Bard)","zh":"生成式 AI · 根據預先訓練的內容生成新的文字、聲音、圖片、影片或程式碼","row":1},{"h":1,"en":"Evolution of AI (timeline)","zh":"AI 的演變（時間線）"},{"en":"**1950–1970** – AI as a concept, no real application: 1950 paper about machine's human ability (Turing); 1956 term \"AI\" coined at Dartmouth by John McCarthy.","zh":"1950–1970——AI 只是概念，沒有實際應用：1950 年有關機器具人類能力的論文（圖靈）；1956 年 John McCarthy 在達特茅斯提出「人工智能」一詞。","lvl":0,"num":false},{"en":"**1980–2000** – military & academia show interest: 1995 Predator UAV used by US DoD in war; 1997 IBM Deep Blue defeats Garry Kasparov at chess.","zh":"1980–2000——軍方及學術界開始關注：1995 年美國國防部在戰爭中使用「掠奪者」無人機；1997 年 IBM 深藍擊敗國際象棋冠軍卡斯帕羅夫。","lvl":0,"num":false},{"en":"**2005 onwards** – big tech companies invest in commercial AI & ML: 2011 IBM Watson wins Jeopardy, Apple Siri; 2012 Google self-driving cars; 2014 Facebook DeepFace, Amazon Alexa, Microsoft Cortana; 2015 Google self-driving cars pass 1 million miles; 2016 AlphaGo defeats Lee Sedol, Uber self-driving pilot; **2022 ChatGPT** (Generative AI) public; **2024 Agentic AI**.","zh":"2005 年後——大型科技公司投資商業 AI 及機器學習：2011 年 IBM Watson 在 Jeopardy 勝出、蘋果 Siri；2012 年 Google 自動駕駛汽車；2014 年 Facebook DeepFace、亞馬遜 Alexa、微軟 Cortana；2015 年 Google 自動駕駛突破 100 萬英里；2016 年 AlphaGo 擊敗李世石、Uber 自動駕駛試驗；2022 年 ChatGPT（生成式 AI）公開；2024 年代理式 AI。","lvl":0,"num":false}],"terms":[["Artificial Intelligence","人工智能","建造像人一樣思考和行動的機器的理論和方法。"],["Machine Learning","機器學習","電腦從經驗或數據中自己學習規律，毋須人類逐步編程。"],["Deep Learning","深度學習","以多層人工神經網絡模仿人腦，處理影像、語言等複雜任務。"],["Neural network / Transformer","神經網絡／Transformer","模仿腦神經元連接的運算模型；Transformer 是現今大型語言模型使用的架構。"],["Pre-trained","預先訓練","模型在使用前已用大量數據訓練好。"]]},"A2":{"en":"A2. Generative AI","zh":"生成式 AI","p":[{"h":2,"kind":"key","en":"Definition","zh":""},{"en":"**Generative AI** is a type of AI that uses machine learning {algorithms|演算法} to **create new content** like images, videos, text and audio. Steps: (1) form a database (neural network trained on data); (2) user inputs a **prompt**; (3) AI generates content similar to what it was trained on.","zh":"生成式 AI 是一種使用機器學習演算法「創造新內容」（例如圖片、影片、文字和聲音）的 AI。步驟：(1) 建立數據庫（以數據訓練神經網絡）；(2) 用戶輸入「提示」；(3) AI 生成與訓練內容相似的新內容。","kind":"key"},{"en":"Examples: text (ChatGPT), image (Midjourney), coding (Codex).","zh":"例子：文字（ChatGPT）、圖片（Midjourney）、編程（Codex）。","lvl":0,"num":false},{"en":"Major players – Western: OpenAI (ChatGPT, GPT-4), Google (Gemini, Bard), Microsoft (Azure AI, Copilot). Eastern: DeepSeek, Baidu (ERNIE Bot 文心一言), Alibaba (Qwen 通義千問), ByteDance (Doubao 豆包).","zh":"主要參與者——西方：OpenAI（ChatGPT、GPT-4）、Google（Gemini、Bard）、微軟（Azure AI、Copilot）。東方：DeepSeek、百度（文心一言）、阿里巴巴（通義千問）、字節跳動（豆包）。","lvl":0,"num":false},{"en":"Use cases: healthcare, finance & trading, content creation, natural language processing (NLP).","zh":"應用：醫療、金融及交易、內容創作、自然語言處理。","lvl":0,"num":false},{"en":"**8 challenges:** misinformation; {hallucinations|幻覺（AI 編造內容）}; profanity changes; biased outputs; intellectual property {infringement|侵權}; privacy concerns; manipulation and {impersonation|冒充}; unintended consequences. (News: Samsung banned ChatGPT after a data leak; a lawyer used ChatGPT and cited fake cases; artists sued Midjourney over copyright.)","zh":"八大挑戰：錯誤資訊；幻覺；粗言穢語變化；偏頗輸出；侵犯知識產權；私隱問題；操控及冒充；意外後果。（新聞：三星因數據外洩禁用 ChatGPT；律師用 ChatGPT 引用虛構案例；藝術家就版權起訴 Midjourney。）","lvl":0,"num":false},{"en":"**HKGAI** (Hong Kong Generative AI R&D Center, under InnoHK): HKPilot 港文通, HKChat 港話通, LexiHK 港法通, HKEcoLink 港環通, HKMeeting 港會通 – local AI for HK's public service, legal and multilingual needs.","zh":"香港生成式人工智能研發中心（InnoHK 轄下）：港文通、港話通、港法通、港環通、港會通——為香港公共服務、法律及多語需要而設的本地 AI。","lvl":0,"num":false}],"terms":[["Generative AI","生成式人工智能","使用機器學習演算法，按用戶提示創造新的文字、圖片、影片、聲音或程式碼的 AI。"],["Prompt","提示","用戶輸入給 AI 的指示、描述或樣本。"],["Hallucination","幻覺","AI 自信地給出錯誤或虛構的答案，例如律師引用 ChatGPT 編造的案例。"],["Intellectual property (IP) infringement","侵犯知識產權","AI 生成內容可能抄襲受版權保護的作品，例如藝術家起訴 Midjourney。"],["NLP (Natural Language Processing)","自然語言處理","讓電腦理解和生成人類語言的技術，例如翻譯、情感分析。"],["HKGAI","香港生成式人工智能研發中心","InnoHK 轄下中心，開發港文通、港話通、港法通等本地 AI。"]]},"A3":{"en":"A3. Agentic AI vs Generative AI","zh":"代理式 AI 與生成式 AI","p":[{"h":2,"kind":"key","en":"Agentic AI","zh":""},{"en":"Agentic AI **does not need human input all the time**; it makes decisions and **carries out tasks on its own**, learning from data and improving over time. Steps: natural language input → interpretation & reasoning → workflow generation → workflow execution → output (with learning & correction, e.g., reinforcement learning).","zh":"代理式 AI 毋須人類時刻輸入；它會自己作決定並執行任務，從數據中學習並不斷改進。步驟：自然語言輸入 → 理解及推理 → 生成工作流程 → 執行工作流程 → 輸出（並透過強化學習等方式學習及修正）。","kind":"key"},{"en":"Autonomous 自主 · Creative 創意","zh":"","row":1},{"en":"Goal-oriented 以目標為導向 · Output-oriented 以輸出為導向","zh":"","row":1},{"en":"Real-time environment 實時環境 · Content-based 以內容為本","zh":"","row":1},{"en":"Utilizes tools & APIs 使用工具及 API · No external tools 不用外部工具","zh":"","row":1},{"en":"Continuous adaptation 持續適應 · No adaptation from real-time 不會實時適應","zh":"","row":1},{"en":"Autonomous systems 自主系統 · Content creation 內容創作","zh":"","row":1},{"en":"Independent decision making 獨立決策 · Makes decisions based on input patterns 根據輸入模式作決定","zh":"","row":1}],"terms":[["Agentic AI","代理式人工智能","毋須人類時刻輸入，會自己定下工作流程、使用工具並執行任務，從結果中學習改進的 AI。"],["Reinforcement learning","強化學習","透過嘗試和獎懲回饋不斷改進行為的學習方式。"],["Workflow","工作流程","完成一項任務的一連串步驟。"]]},"A4":{"en":"A4. GeoAI – AI + GIS","zh":"GeoAI ——人工智能＋GIS","p":[{"en":"**GeoAI (Geospatial Artificial Intelligence)** is the next-generation location intelligence tool. It can **See** (object detection, tracking, land cover & point cloud classification), **Read** (entity extraction, text classification), **Analyze** (prediction, clustering, classification, forecasting, regression), **Learn** (AutoML, AI-assisted labelling) and **Create** (super-resolution, 3D reconstruction, cloud removal, translation).","zh":"GeoAI（地理空間人工智能）是新一代位置智能工具。它能「看」（物件偵測、追蹤、土地覆蓋及點雲分類）、「讀」（實體提取、文字分類）、「分析」（預測、聚類、分類、預報、迴歸）、「學習」（自動機器學習、AI 輔助標註）及「創造」（超解像、三維重建、去雲、翻譯）。"},{"en":"Swimming pools 泳池偵測 · Detects pools from aerial photos – for property tax, maintenance companies, mosquito control; finds neglected pools","zh":"從航空照片偵測泳池——用於物業稅、維修公司、滅蚊；找出被棄置的泳池","row":1},{"en":"Parking lot 停車場 · Detects vehicles and shows results on an Operations Dashboard","zh":"偵測車輛並在運作儀表板顯示結果","row":1},{"en":"Sunken ships (NY, Storm Sandy) 沉船 · Mask-RCNN model found 100+ sunken boats; updated NOAA charts · Mask-RCNN 模型找出 100 多艘沉船；更新 NOAA 航海圖","zh":"","row":1},{"en":"Ship counting (Sai Kung) 船隻點算 · Counted all ships in a satellite image in ~10 minutes; mentioned in CE's 2025 Policy Address","zh":"約 10 分鐘點算衞星圖像中所有船隻；行政長官 2025 年施政報告提及","row":1},{"en":"CCTV traffic 閉路電視交通 · YOLO model detects vehicles, pedestrians, accidents (Transport Dept feed, updates every 0.1 min) · YOLO 模型偵測車輛、行人、意外（運輸署畫面，每 0.1 分鐘更新）","zh":"","row":1},{"en":"Road cracks & signs 路面裂縫及路牌 · Automatic crack detection; road sign defects (Grounding DINO + vision-language classification)","zh":"自動偵測裂縫；路牌缺陷","row":1},{"en":"GeoAI + LLM chatbot 聊天機械人 · Search by keyword/district, heatmaps, charts","zh":"按關鍵字／地區搜尋、熱圖、圖表","row":1},{"en":"Landslides 山泥傾瀉 · Landsat 8 bands 3, 4, 5 → deep learning → 2D to 3D results · Landsat 8 第 3、4、5 波段 → 深度學習 → 二維轉三維","zh":"","row":1},{"en":"Trees (Georgia, USA) 樹木 · Citizens collect tree locations & species → tree inventory","zh":"市民收集樹木位置及品種 → 樹木清單","row":1},{"en":"Mosquito Risk Map (HK) 蚊患風險地圖 · Mosquito Risk Index from IoT data + GIS + AI; helps fight Chikungunya fever · 以物聯網數據＋GIS＋AI 計算蚊患風險指數；協助對抗基孔肯雅熱","zh":"","row":1}],"terms":[["GeoAI","地理空間人工智能","AI 結合 GIS，能「看、讀、分析、學習、創造」地理數據的新一代位置智能工具。"],["Object detection","物件偵測","在影像中自動找出並框出物件，例如船隻、車輛、泳池。"],["Mask-RCNN / YOLO","Mask-RCNN／YOLO 模型","兩種深度學習物件偵測模型；YOLO 速度快，適合實時閉路電視分析。"],["Point cloud classification","點雲分類","把激光雷達點雲中的每一點分類為建築、樹木、地面等。"],["Spectral band","光譜波段","衞星感應器記錄的不同波長光線，例如 Landsat 8 第 3、4、5 波段（綠、紅、近紅外線）。"],["Mosquito Risk Index (MRI)","蚊患風險指數","以物聯網捕蚊器數據、GIS 和 AI 計算的指標，找出蚊子最多的地點。"]]},"A5":{"en":"A5. AI and Society","zh":"AI 與社會","p":[{"en":"**8 ways AI will transform cities by 2030:** transportation, education, healthcare, public safety, home & service robots, employment & workplace, entertainment, low-resource communities.","zh":"到 2030 年 AI 改變城市的八種方式：交通、教育、醫療、公共安全、家居及服務機械人、就業及工作場所、娛樂、資源匱乏社區。","lvl":0,"num":false},{"en":"**Jobs (WEF Future of Jobs 2025):** by 2030, 170 million jobs created and 92 million lost → **net gain of 78 million (7%)**. Fastest-growing: big data specialists, FinTech engineers, AI & machine learning specialists, software developers.","zh":"就業（世界經濟論壇《2025 未來就業報告》）：到 2030 年將創造 1.7 億個職位、失去 9,200 萬個 → 淨增 7,800 萬個（7%）。增長最快：大數據專家、金融科技工程師、AI 及機器學習專家、軟件開發人員。","lvl":0,"num":false},{"en":"**AI ethics** matters because AI shapes decisions about people's lives, rights and opportunities. Frameworks: 2021 UNESCO Recommendation on the Ethics of AI; 2021 (Aug) PCPD Guidance; 2024 (Jul) DPO Ethical AI Framework.","zh":"AI 倫理很重要，因為 AI 影響人們生活、權利和機會的決定。框架：2021 年聯合國教科文組織《人工智能倫理建議書》；2021 年（8 月）私隱專員公署指引；2024 年（7 月）數字政策辦公室《人工智能道德框架》。","lvl":0,"num":false},{"h":2,"kind":"key","en":"IoT = \"Senses\", Big Data = \"Fuel\", AI = \"Brain\"","zh":""},{"en":"**IoT** connects devices and collects data → **Big Data** captures, stores and analyses the data → **AI** does data-based learning, analytics and automation. (This answers the discussion question!)","zh":"物聯網連接裝置並收集數據 → 大數據擷取、儲存及分析數據 → AI 進行以數據為本的學習、分析及自動化。（這就是討論題的答案！）","kind":"key"}],"terms":[["AI ethics","人工智能倫理","確保 AI 公平、透明、保障私隱和可問責的原則；例如教科文組織 2021 年建議書、數字政策辦公室 2024 年框架。"],["PCPD","個人資料私隱專員公署","香港負責監察個人資料私隱的機構，2021 年發出 AI 道德指引。"],["IoT = senses, Big Data = fuel, AI = brain","感官、燃料、大腦","物聯網收集數據、大數據儲存及分析數據、AI 從數據學習並自動化——三者的關係。"]]},"A6":{"en":"A6. Cloud Computing","zh":"雲端運算","p":[{"h":2,"kind":"key","en":"Definition","zh":""},{"en":"Cloud computing is a general term for anything that involves **delivering hosted services over the Internet** – servers, storage, databases, networking, software, analytics, intelligence – with **pay-as-you-go** pricing instead of owning data centres (Microsoft; AWS).","zh":"雲端運算是透過互聯網提供託管服務的統稱——伺服器、儲存、數據庫、網絡、軟件、分析、智能——以「按用量付費」方式，而不用自設數據中心（微軟；亞馬遜網絡服務）。","kind":"key"},{"en":"IaaS – Infrastructure as a Service · \"Host\" – computing resources to run any software incl. OS · Applications, data, runtime, middleware, O/S","zh":"基礎設施即服務 · 「託管」——運行任何軟件（包括作業系統）的運算資源","row":1},{"en":"PaaS – Platform as a Service · \"Build\" – tools to create custom apps on provider's cloud · Applications, data","zh":"平台即服務 · 「建立」——在供應商雲端開發自訂應用程式的工具","row":1},{"en":"SaaS – Software as a Service · \"Consume\" – use provider's apps · Nothing (provider manages all)","zh":"軟件即服務 · 「使用」——使用供應商的應用程式","row":1},{"en":"**4 deployment models:** private cloud (one organisation); community cloud (a community with shared concerns); public cloud (general public); hybrid cloud (two or more combined).","zh":"四種部署模式：私有雲（單一機構）；社群雲（有共同關注的社群）；公共雲（公眾）；混合雲（兩種或以上結合）。","lvl":0,"num":false},{"en":"**5 essential characteristics:** on-demand self-service; broad network access; resource pooling; rapid {elasticity|彈性}; measured service.","zh":"五大基本特點：按需自助服務；廣泛網絡存取；資源匯集；快速彈性；可計量服務。","lvl":0,"num":false},{"en":"**Pros:** low cost, simplification, centralization, {virtualization|虛擬化}, self-service, pay-as-you-go, automation, green IT. **Cons:** security, limitation in applications, maintenance control, migrations, losing data privacy, hidden cost.","zh":"優點：成本低、簡化、集中化、虛擬化、自助、按用量付費、自動化、綠色資訊科技。缺點：保安、應用受限、維護控制、遷移、失去數據私隱、隱藏成本。","lvl":0,"num":false},{"en":"**Benefits for smart city:** faster time to market; faster access to new technology; better {scalability|可擴展性}; high-performance infrastructure; cost saving. Market players: Microsoft Azure, AWS, Alibaba Cloud, Huawei Cloud.","zh":"對智慧城市的好處：更快推出市場；更快取得新技術；更佳可擴展性；高效能基建；節省成本。市場參與者：微軟 Azure、亞馬遜 AWS、阿里雲、華為雲。","lvl":0,"num":false},{"en":"**Choosing a cloud service:** reputation; SLA; learn their technologies & infrastructure; risk assessment & compliance; local regulation.","zh":"選擇雲端服務的考慮：聲譽；服務水平協議；了解其技術及基建；風險評估及合規；本地法規。","lvl":0,"num":false}],"terms":[["Cloud computing","雲端運算","透過互聯網提供伺服器、儲存、數據庫、軟件等運算服務，按用量付費，毋須自設數據中心。"],["IaaS","基礎設施即服務","供應商提供伺服器、儲存和網絡（「託管」）；用戶自己管理作業系統和應用程式。"],["PaaS","平台即服務","供應商再提供作業系統和開發工具（「建立」）；用戶只管理應用程式和數據。"],["SaaS","軟件即服務","供應商管理一切，用戶直接使用軟件（「使用」），例如 ArcGIS Online。"],["Private / Community / Public / Hybrid cloud","私有雲／社群雲／公共雲／混合雲","四種部署模式：單一機構專用／共同關注的社群專用／公眾使用／兩種或以上結合。"],["Rapid elasticity","快速彈性","資源可以按需求迅速增加或減少，對用戶而言彷彿無限。"],["Resource pooling","資源匯集","供應商把資源集中起來同時服務多個用戶（多租戶），按需求動態分配。"],["Virtualization","虛擬化","以軟件模擬硬件，令一部實體伺服器可運行多部虛擬電腦。"],["Scalability","可擴展性","系統隨需求增長而擴大的能力。"]]},"A7":{"en":"A7. Low-Altitude Economy (LAE) and GIS","zh":"低空經濟與 GIS","p":[{"en":"LAE = manned/unmanned activities below 1,000 m (up to 3,000 m); key sectors: drones (UAVs) and eVTOL. (Same as Lecture 1.)","zh":"低空經濟＝1,000 米（最高 3,000 米）以下的載人／無人駕駛活動；主要行業：無人機及 eVTOL。（與第一課相同。）","lvl":0,"num":false},{"en":"**5 key success factors:** (1) technological support; (2) regulatory & policy support and market acceptance; (3) financial support; (4) sustainability and improving urban traffic efficiency; (5) national security.","zh":"五大成功因素：(1) 技術支援；(2) 監管及政策支援和市場接受；(3) 財政支援；(4) 可持續性及提升城市交通效率；(5) 國家安全。","lvl":0,"num":false},{"en":"**China's 3 drone giants:** DJI 大疆 (70–80% of civilian drone market; 700,000+ active drones); EHang 億航 (EH216-S, world's first certified eVTOL with commercial ticketed flights, Guangzhou & Hefei); Phoenix Wings 豐翼 (SF Express, cargo & medical BVLOS delivery).","zh":"中國三大無人機巨頭：大疆（民用無人機市場佔 70–80%；超過 70 萬架活躍無人機）；億航（EH216-S，全球首款獲認證並提供商業載客飛行的 eVTOL，廣州及合肥）；豐翼科技（順豐，貨運及醫療超視距配送）。","lvl":0,"num":false},{"en":"**HK sandbox:** first batch of 38 pilot projects – 34 started, 20+ regularised & scaled, 4 via other mechanisms. **Sandbox X** (24 Nov 2025): 5 complex scenarios – UTM demos, unconventional aircraft, cross-boundary flights, shared platforms, other advanced cases (\"X\" = extended & extra).","zh":"香港沙盒：首批 38 個試點項目——34 個已展開、20 多個已常規化及擴大、4 個經其他機制推進。「監管沙盒 X」（2025 年 11 月 24 日）：5 個複雜場景——無人機交通管理示範、非常規飛行器、跨境飛行、共享平台、其他進階用途（「X」＝延伸及額外）。","lvl":0,"num":false},{"h":1,"en":"4 roles of geospatial intelligence in LAE","zh":"地理空間智能在低空經濟中的四個角色"},{"en":"**Data collection & processing** – integrate data from any source (imagery, sensors, IoT, open data).","zh":"數據收集及處理——整合任何來源的數據（影像、感應器、物聯網、開放數據）。","lvl":0,"num":true},{"en":"**Multidimensional visualization** – bring data to life (spatial, temporal, relational).","zh":"多維視覺化——令數據變得生動（空間、時間、關係）。","lvl":0,"num":true},{"en":"**Advanced analytics** – transform data into intelligence (GeoAI, big data analytics).","zh":"進階分析——把數據轉化為情報（GeoAI、大數據分析）。","lvl":0,"num":true},{"en":"**Dissemination** – share findings via dashboards and reports with decision-makers.","zh":"發布——透過儀表板及報告與決策者分享結果。","lvl":0,"num":true},{"en":"**GIS-powered UTM platform** (UAV traffic management): situational awareness, mission scheduling, risk warning, flight monitoring; flight route design & simulation; flight suitability / risk index (land use, slope, weather, building height, no-fly zones – CSDI as Single Source of Truth); digital twin tracking; multi-flight tracking with conflict detection; multi-drone dashboard; **geo-fencing** (static: airports, government facilities; dynamic: temporary no-fly zones, emergencies).","zh":"以 GIS 驅動的無人機交通管理平台：態勢感知、任務排程、風險預警、飛行監察；航線設計及模擬；飛行適合度／風險指數（土地用途、斜度、天氣、建築物高度、禁飛區——以空間數據共享平台作單一真實來源）；數碼孿生追蹤；多機追蹤及衝突偵測；多機儀表板；地理圍欄（靜態：機場、政府設施；動態：臨時禁飛區、緊急行動）。","lvl":0,"num":false},{"en":"**HK pilot examples:** illegal fishing patrol in Kat O (AFCD + AI); training camp inspection (Civil Aid Service, Yuen Tun 190,000 m² & Tai Tan 12,000 m²); air-quality sensor delivery (EPD, ~560 m in \u003c 3 min).","zh":"香港試點例子：吉澳非法捕魚巡邏（漁護署＋AI）；訓練營巡查（民眾安全服務隊，元墩 19 萬平方米及大灘 1.2 萬平方米）；運送空氣質素感應器（環保署，約 560 米，少於 3 分鐘）。","lvl":0,"num":false},{"en":"Northern Metropolis (~1/3 of HK land; 3,000 ha) = HK's second economic engine; LAE talent: HKU MSc in Low-altitude Technology, PolyU MSc in Low-altitude Economy, LAE in the Gaokao.","zh":"北部都會區（約佔香港土地 1/3；3,000 公頃）＝香港第二經濟引擎；低空經濟人才：港大低空技術工程碩士、理大低空經濟碩士、低空經濟納入高考。","lvl":0,"num":false}],"terms":[["UTM (UAV Traffic Management)","無人機交通管理","以 GIS 為核心、管理多架無人機航線、排程、風險預警和監察的平台。"],["Geo-fencing","地理圍欄","在地圖上設定虛擬邊界，限制無人機進入；靜態圍欄用於機場等固定區域，動態圍欄用於臨時禁飛區。"],["Digital twin","數碼孿生","把現實世界實時同步到電腦中的數碼複製品，用來監察和預警。"],["Flight risk index","飛行風險指數","疊加地形、斜度、建築高度、天氣、禁飛區等圖層計算出的風險分數。"],["Single Source of Truth (SSOT)","單一真實來源","所有人都使用同一套權威數據（例如 CSDI），避免數據不一致。"],["Regulatory Sandbox X","監管沙盒 X","2025 年 11 月推出，測試 5 個技術複雜的低空場景；「X」代表延伸和額外。"],["Geospatial intelligence (4 roles)","地理空間智能四個角色","數據收集及處理、多維視覺化、進階分析、發布。"]]}}},"L6":{"slides":{"4":{"n":4,"en":"What is GIS?","zh":"甚麼是 GIS？","p":[{"en":"GIS = Geographic Information System","zh":"GIS ＝地理資訊系統","lvl":0,"num":false},{"en":"Five components: Hardware; Software; Data; People; Workflows","zh":"五個組成部分：硬件；軟件；數據；人；工作流程","lvl":0,"num":false}]},"5":{"n":5,"en":"GIS Provides a Process and Framework…","zh":"GIS 提供流程和框架⋯⋯","p":[{"en":"…for creating and applying geographic knowledge widely","zh":"⋯⋯用於廣泛建立和應用地理知識","lvl":0,"num":false},{"en":"Measurement → Visualization & Mapping → Analysis & Modeling → Planning & Design → Decision Making → Action","zh":"量度 → 視覺化及製圖 → 分析及建模 → 規劃及設計 → 決策 → 行動","lvl":0,"num":false},{"en":"\"…Understanding precedes action\"","zh":"「⋯⋯先理解，後行動」","lvl":0,"num":false}]},"6":{"n":6,"en":"Representing Spatial Data","zh":"表示空間數據","p":[{"en":"Two formats: **Vector format** (smooth outline shape) and **Raster format** (a grid of square cells)","zh":"兩種格式：矢量格式（平滑輪廓形狀）及柵格格式（方格網）","lvl":0,"num":false}]},"7":{"n":7,"en":"Vector Data: A Shape-based View","zh":"矢量數據：以形狀為本的角度","p":[{"en":"Geography is represented with shapes – points, lines, polygons","zh":"地理以形狀表示——點、線、多邊形","lvl":0,"num":false},{"en":"Good for **{discrete|離散的}** objects:","zh":"適合「離散」的物件：","lvl":0,"num":false},{"en":"Man-made features (political boundaries, roads, buildings)","zh":"人造地物（政治邊界、道路、建築物）","lvl":1,"num":false},{"en":"Natural features (rivers, lakes, forests)","zh":"天然地物（河流、湖泊、森林）","lvl":1,"num":false},{"en":"Examples: electric poles and lines in a land parcel; volcanoes and rivers in Iceland","zh":"例子：地段內的電線桿及電線；冰島的火山及河流","lvl":0,"num":false}]},"8":{"n":8,"en":"Connecting Vector Shapes to Real Places","zh":"把矢量形狀連繫到真實地點","p":[{"en":"**Point:** a pair of x,y coordinates, e.g., {62053, 22848}","zh":"點：一對 x、y 坐標，例如 {62053, 22848}","lvl":0,"num":false},{"en":"**Line:** a series of x,y coordinate pairs, e.g., {62053,22845; 62056,22844; 62061,22846}","zh":"線：一連串 x、y 坐標，例如 {62053,22845; 62056,22844; 62061,22846}","lvl":0,"num":false},{"en":"**Polygon:** a line that ends at its beginning, e.g., {62054,22841; 62059,22842; 62060,22839; 62055,22839; 62054,22841}","zh":"多邊形：終點回到起點的線，例如 {62054,22841; 62059,22842; 62060,22839; 62055,22839; 62054,22841}","lvl":0,"num":false}]},"9":{"n":9,"en":"Representing Features in Vector Data","zh":"以矢量數據表示地物","p":[{"en":"Real-world entities are {abstracted|抽象化} into three basic shapes","zh":"現實事物被抽象化為三種基本形狀","lvl":0,"num":false},{"en":"Example (South America): Points = cities; Lines = rivers; Polygons = countries","zh":"例子（南美洲）：點＝城市；線＝河流；多邊形＝國家","lvl":0,"num":false}]},"10":{"n":10,"en":"Raster Data Structure","zh":"柵格數據結構","p":[{"en":"Matrix of square cells represents a patch of ground – each cell is a unit of area within the patch","zh":"方格矩陣代表一片土地——每格是該範圍內的一個面積單位","lvl":0,"num":false},{"en":"Each cell stores a number","zh":"每格儲存一個數值","lvl":0,"num":false},{"en":"Numbers may be measurements, counts, or codes","zh":"數值可以是量度值、計數或代碼","lvl":0,"num":false},{"en":"Example: elevation values (28, 17, 15…) shown with elevation symbology (0–10, 11–20, 21–30, 31–40, 41–50)","zh":"例子：高度數值（28、17、15⋯⋯）以高度符號顯示（0–10、11–20、21–30、31–40、41–50）","lvl":0,"num":false}]},"11":{"n":11,"en":"Raster Data: A Cell-based View","zh":"柵格數據：以格子為本的角度","p":[{"en":"Geography is represented with cells","zh":"地理以格子表示","lvl":0,"num":false},{"en":"Good for **continuous** phenomena: elevation, rainfall, temperature; air photos; vegetation, soil type","zh":"適合「連續」現象：高度、雨量、氣溫；航空照片；植被、土壤類型","lvl":0,"num":false},{"en":"An air photo \"zoomed in very close\" shows the individual cells (pixels)","zh":"把航空照片「放到很大」就會看到一個個格子（像素）","lvl":0,"num":false}]},"12":{"n":12,"en":"Two Representations of Elevation","zh":"兩種表示高度的方式","p":[{"en":"Vector: elevation represented as lines – each line stores a single elevation value (contours)","zh":"矢量：以線表示高度——每條線儲存一個高度值（等高線）","lvl":0,"num":false},{"en":"Raster: elevation values represented as cells – each cell stores a single elevation value","zh":"柵格：以格子表示高度——每格儲存一個高度值","lvl":0,"num":false}]},"13":{"n":13,"en":"What is a Geodatabase?","zh":"甚麼是地理數據庫？","p":[{"en":"A particular collection of geographic data on disk","zh":"儲存在磁碟上的特定地理數據集合","lvl":0,"num":false},{"en":"Stored in geodatabase format – one of many geographic data formats","zh":"以地理數據庫格式儲存——眾多地理數據格式之一","lvl":0,"num":false},{"en":"Organized by geographic area, theme, or project","zh":"按地區、主題或項目整理","lvl":0,"num":false},{"en":"May include vector data, raster data, tables, special data types","zh":"可包括矢量數據、柵格數據、表格、特殊數據類型","lvl":0,"num":false},{"en":"Advanced capabilities for modeling feature and attribute relationships","zh":"具備模擬地物與屬性關係的進階功能","lvl":0,"num":false},{"en":"Example: \"Yellowstone\" geodatabase – boundary, campgrounds, lakes, peaks, rivers, roads, trails, wildlife sightings…","zh":"例子：「黃石公園」地理數據庫——邊界、營地、湖泊、山峰、河流、道路、山徑、野生動物紀錄⋯⋯","lvl":0,"num":false}]},"14":{"n":14,"en":"Feature Classes and Layers","zh":"要素類別與圖層","p":[{"en":"**Feature class:** stored on disk; physical data (e.g., SouthAmerica file geodatabase feature class, 279.11 KB, polygon)","zh":"要素類別：儲存在磁碟；實體數據（例如南美洲檔案地理數據庫要素類別，279.11 KB，多邊形）","lvl":0,"num":false},{"en":"**Layer:** stored in map; visual representation; many layers can reference a single feature class","zh":"圖層：儲存在地圖中；視覺呈現；多個圖層可引用同一個要素類別","lvl":0,"num":false}]},"15":{"n":15,"en":"Organizing Spatial Data","zh":"整理空間數據","p":[{"en":"A GIS works with **thematic layers** of spatial data","zh":"GIS 以空間數據的「主題圖層」運作","lvl":0,"num":false},{"en":"Answer questions by comparing different layers of data","zh":"透過比較不同數據圖層來回答問題","lvl":0,"num":false},{"en":"Example layers: street data, buildings data, vegetation data → integrated data; land use, streets, districts, parcels, rivers, aquifers…","zh":"圖層例子：街道、建築、植被數據 → 整合數據；土地用途、街道、地區、地段、河流、含水層⋯⋯","lvl":0,"num":false}]},"16":{"n":16,"en":"Layer Attribute Table","zh":"圖層屬性表","p":[{"en":"Database or file containing information about geographic features","zh":"包含地理地物資料的數據庫或檔案","lvl":0,"num":false},{"en":"Attribute table structure: each **row** represents a feature; each **column** represents a feature attribute","zh":"屬性表結構：每一「行」代表一個地物；每一「列」代表一個地物屬性","lvl":0,"num":false},{"en":"1-to-1 relationship between a feature on the map and a row (e.g., Yellowstone National Park campgrounds: Pebble Creek, Canyon, Bridge Bay…)","zh":"地圖上的地物與表中的行是一對一關係（例如黃石國家公園營地）","lvl":0,"num":false}]},"17":{"n":17,"en":"Feature Attribute Relationship","zh":"地物與屬性的關係","p":[{"en":"Features linked to rows by **Object ID** field","zh":"地物以 Object ID 欄位與行連結","lvl":0,"num":false},{"en":"Create new feature → new row is added to the attribute table","zh":"建立新地物 → 屬性表加入新的一行","lvl":0,"num":false},{"en":"Add a new field to the table → field is added for all features","zh":"在表中加入新欄位 → 所有地物都會增加這個欄位","lvl":0,"num":false}]},"19":{"n":19,"en":"Categorical Symbolization","zh":"分類符號化","p":[{"en":"Symbolization based on **type or kind** (e.g., showers yes/no; building type – barn, boathouse, cabin, outhouse, shed, stable)","zh":"按「類型或種類」符號化（例如有／沒有淋浴設施；建築類型——穀倉、船屋、小屋、戶外廁所、棚、馬廄）","lvl":0,"num":false}]},"20":{"n":20,"en":"Quantitative Symbolization","zh":"數量符號化","p":[{"en":"Symbolization based on **amount or rank** (e.g., peak height ranges 7539–8214, 8215–9606, 9607–10087, 10088–10553, 10554–11041 ft – larger symbols for higher peaks)","zh":"按「數量或等級」符號化（例如山峰高度範圍 7539–8214、8215–9606、9607–10087、10088–10553、10554–11041 呎——越高符號越大）","lvl":0,"num":false}]},"21":{"n":21,"en":"Labels","zh":"標註","p":[{"en":"Purpose: provide textual information on a map","zh":"目的：在地圖上提供文字資訊","lvl":0,"num":false},{"en":"Can be rendered many different ways – e.g., brown italics (name field); black with halo (name field); black with halo (elevation field)","zh":"可用多種方式呈現——例如棕色斜體（名稱欄）；黑色加光暈（名稱欄）；黑色加光暈（高度欄）","lvl":0,"num":false}]},"22":{"n":22,"en":"Metadata","zh":"元數據","p":[{"en":"An owner's manual for your geographic data – descriptive, spatial, attribute, and processing history information","zh":"地理數據的用戶手冊——描述、空間、屬性及處理歷史資料","lvl":0,"num":false},{"en":"Good data has good metadata","zh":"好的數據有好的元數據","lvl":0,"num":false},{"en":"How much metadata? Templates define complete and minimum standards; some is maintained automatically; do your best with the rest","zh":"需要多少元數據？範本定義完整及最低標準；部分會自動維護；其餘盡力而為","lvl":0,"num":false},{"en":"Questions metadata answers: What is it? Who made it? How was it made? What's this? (e.g., what does the value −9999 mean?)","zh":"元數據回答的問題：它是甚麼？誰製作的？如何製作？這是甚麼？（例如數值 −9999 代表甚麼？）","lvl":0,"num":false}]},"23":{"n":23,"en":"Spatial Reference Lines on the Earth","zh":"地球上的空間參考線","p":[{"en":"**Equator** – natural east-west line around the middle of the earth","zh":"赤道——環繞地球中部的天然東西線","lvl":0,"num":false},{"en":"**Prime meridian** – {arbitrary|任意的} north-south line through Greenwich","zh":"本初子午線——經過格林威治、人為設定的南北線","lvl":0,"num":false},{"en":"**Parallels** – east-west lines parallel to the equator","zh":"緯線——與赤道平行的東西線","lvl":0,"num":false},{"en":"**Meridians** – north-south lines meeting at the poles","zh":"經線——在兩極相交的南北線","lvl":0,"num":false}]},"24":{"n":24,"en":"Measuring Latitude and Longitude","zh":"量度緯度和經度","p":[{"en":"**Latitude:** angle north or south of the equator (90°N – 0° – 90°S)","zh":"緯度：赤道以北或以南的角度（北緯 90° – 0° – 南緯 90°）","lvl":0,"num":false},{"en":"**Longitude:** angle east or west of the prime meridian (180°W – 0° – 180°E)","zh":"經度：本初子午線以東或以西的角度（西經 180° – 0° – 東經 180°）","lvl":0,"num":false},{"en":"Example: 40 degrees north, 50 degrees east","zh":"例子：北緯 40 度，東經 50 度","lvl":0,"num":false}]},"25":{"n":25,"en":"Flattening the Earth with Map Projections","zh":"以地圖投影把地球攤平","p":[{"en":"Map projections \"transplant\" locations from the earth to a flat surface (\"Where do I go on a flat map?\" – \"Over here, Stockholm.\")","zh":"地圖投影把地球上的位置「移植」到平面上（「我在平面地圖上應去哪裡？」——「在這裡，斯德哥爾摩。」）","lvl":0,"num":false},{"en":"A map projection is a set of rules for where to transplant locations","zh":"地圖投影是決定位置移植到哪裡的一套規則","lvl":0,"num":false},{"en":"There are many different map projections","zh":"地圖投影有很多種","lvl":0,"num":false}]},"26":{"n":26,"en":"Georeferencing","zh":"地理配準","p":[{"en":"Data is referenced to a location on the earth's surface using geographic coordinate systems or projected coordinate systems","zh":"數據以地理坐標系統或投影坐標系統，對應到地球表面的位置","lvl":0,"num":false}]},"27":{"n":27,"en":"Coordinate Systems","zh":"坐標系統","p":[{"en":"**Geographic coordinate system:** latitude and longitude are **not uniform** across the earth's surface (e.g., distance of 60° longitude at 60° latitude ≠ at the equator)","zh":"地理坐標系統：經緯度在地球表面「不均勻」（例如在北緯 60° 的 60 個經度距離，與在赤道的不同）","lvl":0,"num":false},{"en":"**Projected coordinate system:** Cartesian coordinate system (X+/X−, Y+/Y−; data usually in the X+,Y+ quadrant); measures of length and angle are **uniform**","zh":"投影坐標系統：直角坐標系統（X+／X−、Y+／Y−；數據通常在 X+、Y+ 象限）；長度和角度的量度「均勻」","lvl":0,"num":false}]},"28":{"n":28,"en":"Projection File in GIS","zh":"GIS 中的投影檔案","p":[{"en":"PROJCS[\"Hong_Kong_1980_Grid\", GEOGCS[\"GCS_Hong_Kong_1980\", DATUM[\"D_Hong_Kong_1980\", SPHEROID[\"International_1924\", 6378388.0, 297.0]], PRIMEM[\"Greenwich\", 0.0], UNIT[\"Degree\", 0.0174532925199433]], PROJECTION[\"Transverse_Mercator\"], PARAMETER[\"False_Easting\", 836694.05], PARAMETER[\"False_Northing\", 819069.8], PARAMETER[\"Central_Meridian\", 114.1785555555556], PARAMETER[\"Scale_Factor\", 1.0], PARAMETER[\"Latitude_Of_Origin\", 22.31213333333334], UNIT[\"Meter\", 1.0]]","zh":"這是香港 1980 方格網的投影檔案（.prj）內容：地理坐標系統為 GCS_Hong_Kong_1980；基準面 D_Hong_Kong_1980；橢球體 International 1924；本初子午線 Greenwich；投影為橫軸墨卡托；假東距 836694.05；假北距 819069.8；中央經線 114.1786°；比例因子 1.0；原點緯度 22.3121°；單位為米。","lvl":0,"num":false}]},"29":{"n":29,"en":"Coordinate Systems in Hong Kong","zh":"香港的坐標系統","p":[{"en":"**Geographic coordinate system – WGS84:** measured from GPS; in the form of latitudes & longitudes; e.g., 113°25'35\", 22°27'38\"","zh":"地理坐標系統——WGS84：以 GPS 量度；以經緯度表示；例如 113°25'35\"、22°27'38\"","lvl":0,"num":false},{"en":"**Projected coordinate system – HK1980 Grid:** by ground measurements carried out by surveyors; in the form of Northing & Easting; e.g., 834695.786mN, 876231.564mE","zh":"投影坐標系統——香港 1980 方格網：由測量師實地量度；以北距及東距表示；例如 834695.786mN、876231.564mE","lvl":0,"num":false},{"en":"Example spreadsheet with both WGS84 (longitude/latitude) and HK1980 Grid (easting/northing) columns, plotted on a map of HK","zh":"例子：試算表同時有 WGS84（經度／緯度）及香港 1980 方格網（東距／北距）欄位，並在香港地圖上標示","lvl":0,"num":false}]},"31":{"n":31,"en":"Getting Information about Features","zh":"取得地物資訊","p":[{"en":"Go to the map → click a feature → get information","zh":"到地圖 → 點擊地物 → 取得資訊","lvl":0,"num":false},{"en":"Tools: **Identify** (shows all attributes of a clicked feature); **MapTips** (pop-up text when hovering, e.g., \"Panama City Beach\"); **Selection** (highlights features and their rows, e.g., hospitals)","zh":"工具：識別（顯示被點擊地物的所有屬性）；地圖提示（滑鼠停留時彈出文字，例如「Panama City Beach」）；選取（突顯地物及其資料行，例如醫院）","lvl":0,"num":false}]},"32":{"n":32,"en":"Anatomy of an Attribute Query","zh":"屬性查詢的結構","p":[{"en":"The request: Which parks have tennis courts?","zh":"要求：哪些公園有網球場？","lvl":0,"num":false},{"en":"The expression: \"REC_USE\" = 'TENNIS COURT' → name of attribute field + relationship between field and value (**operator**) + name of value","zh":"表達式：\"REC_USE\" = 'TENNIS COURT' → 屬性欄位名稱＋欄位與數值的關係（運算符）＋數值名稱","lvl":0,"num":false},{"en":"The language: **SQL (Structured Query Language)** – standard computer language for querying a database","zh":"語言：SQL（結構化查詢語言）——查詢數據庫的標準電腦語言","lvl":0,"num":false}]},"33":{"n":33,"en":"Analyzing Feature Relationships","zh":"分析地物關係","p":[{"en":"Which parcels are inside the {floodplain|氾濫平原}?","zh":"哪些地段位於氾濫平原內？","lvl":0,"num":false},{"en":"**Select By Location:** finds parcels partially inside the floodplain; creates a new selection","zh":"按位置選取：找出部分位於氾濫平原內的地段；建立新的選取","lvl":0,"num":false},{"en":"**Overlay:** finds portions of parcels inside the floodplain; creates a new feature class","zh":"疊加：找出地段位於氾濫平原內的部分；建立新的要素類別","lvl":0,"num":false}]},"34":{"n":34,"en":"What is Overlay?","zh":"甚麼是疊加？","p":[{"en":"Combines features and attributes in one layer with features and attributes in another layer","zh":"把一個圖層的地物及屬性與另一圖層的地物及屬性結合","lvl":0,"num":false},{"en":"Creates new features in a new feature class","zh":"在新的要素類別中建立新地物","lvl":0,"num":false},{"en":"Example: Ecoregion + County = Ecoregion + County (combined)","zh":"例子：生態區＋縣＝生態區與縣的結合","lvl":0,"num":false}]},"35":{"n":35,"en":"Overlay with Union","zh":"以「聯合」疊加","p":[{"en":"Which area is cool and dry? Temperature (warm/cool) + Moisture (wet/dry) = Warm-Wet, Warm-Dry, Cool-Wet, Cool-Dry (plus Warm-only and Cool-only areas)","zh":"哪個地區清涼乾燥？溫度（溫暖／清涼）＋濕度（潮濕／乾燥）＝溫暖潮濕、溫暖乾燥、清涼潮濕、清涼乾燥（另有只屬溫暖或清涼的地區）","lvl":0,"num":false},{"en":"Creates a new feature class; includes **all** input features in the output","zh":"建立新的要素類別；輸出包括「所有」輸入地物","lvl":0,"num":false}]},"36":{"n":36,"en":"Overlay with Intersect","zh":"以「相交」疊加","p":[{"en":"Which area is cool and dry? (same inputs)","zh":"哪個地區清涼乾燥？（相同輸入）","lvl":0,"num":false},{"en":"Creates a new feature class; includes **only areas of overlap** in the output","zh":"建立新的要素類別；輸出「只包括重疊部分」","lvl":0,"num":false}]},"37":{"n":37,"en":"What is Buffer?","zh":"甚麼是緩衝區？","p":[{"en":"Creates zones around features using a set distance","zh":"以設定距離在地物周圍建立區域","lvl":0,"num":false},{"en":"Creates new features in a new feature class","zh":"在新的要素類別中建立新地物","lvl":0,"num":false},{"en":"Example: schools before buffer → 500-foot buffers around schools where billboards are {prohibited|禁止}","zh":"例子：學校（未建緩衝區）→ 學校周圍 500 呎緩衝區，區內禁止設置廣告牌","lvl":0,"num":false}]},"38":{"n":38,"en":"Spatial Data Formats","zh":"空間數據格式","p":[{"en":"Work with spatial data in multiple formats: shapefile, geodatabase, CAD, raster, map service, tables","zh":"以多種格式處理空間數據：shapefile、地理數據庫、CAD、柵格、地圖服務、表格","lvl":0,"num":false}]},"39":{"n":39,"en":"GeoCloud Data","zh":"雲端地理數據","p":[{"en":"Map or feature services","zh":"地圖或要素服務","lvl":0,"num":false},{"en":"**Feature service** – shares features (the actual data can be queried/edited)","zh":"要素服務——共享地物（可查詢／編輯實際數據）","lvl":0,"num":false},{"en":"**Map service** – shares images (a picture of the map)","zh":"地圖服務——共享影像（地圖圖片）","lvl":0,"num":false}]},"42":{"n":42,"en":"GIS Technology – Desktop GIS","zh":"GIS 技術——桌面 GIS","p":[{"en":"Mapping software that is installed onto and runs on a personal computer and allows users to display, query, update, and analyze data about geographic locations and the information linked to those locations","zh":"安裝並在個人電腦上運行的製圖軟件，讓用戶顯示、查詢、更新及分析地理位置數據及相關資訊","lvl":0,"num":false},{"en":"Examples: ArcMap and ArcGIS Pro screenshots (HK district map)","zh":"例子：ArcMap 及 ArcGIS Pro 畫面（香港分區地圖）","lvl":0,"num":false}]},"43":{"n":43,"en":"GIS Technology – Web GIS","zh":"GIS 技術——網上 GIS","p":[{"en":"A technology used to display and analyze spatial data on the Internet. It combines the advantages of both the Internet and GIS, and offers the public a new means to access spatial information via web browsers.","zh":"在互聯網上顯示及分析空間數據的技術。它結合互聯網和 GIS 的優點，為公眾提供透過瀏覽器取得空間資訊的新途徑。","lvl":0,"num":false},{"en":"Architecture: client → firewall → (1) web server → (2) GIS server (e.g., ArcGIS Server, open-source map server) → (3) database server (e.g., Oracle DB, MS SQL 2008); request and response flow back and forth","zh":"架構：用戶端 → 防火牆 → (1) 網頁伺服器 → (2) GIS 伺服器（例如 ArcGIS Server、開源地圖伺服器）→ (3) 數據庫伺服器（例如 Oracle、MS SQL 2008）；請求與回應來回傳送","lvl":0,"num":false}]},"44":{"n":44,"en":"GIS Technology – Mobile GIS","zh":"GIS 技術——流動 GIS","p":[{"en":"An evolution of conventional GIS to being available on wireless mobile devices such as smartphones (and tablets)","zh":"傳統 GIS 演變為可在智能手機（及平板電腦）等無線流動裝置上使用","lvl":0,"num":false}]},"45":{"n":45,"en":"GIS Technology – Cloud GIS / GeoCloud","zh":"GIS 技術——雲端 GIS","p":[{"en":"The combination of running GIS software and services on cloud infrastructure and accessing GIS capabilities using the web","zh":"在雲端基建上運行 GIS 軟件及服務，並透過網絡使用 GIS 功能","lvl":0,"num":false},{"en":"Example: ArcGIS map viewer and gallery (featured maps from the Living Atlas, e.g., AQHI, weather, traffic speed, EV charging stations, population distribution)","zh":"例子：ArcGIS 地圖檢視器及圖庫（Living Atlas 精選地圖，例如空氣質素健康指數、天氣、車速、電動車充電站、人口分佈）","lvl":0,"num":false}]},"46":{"n":46,"en":"GeoCloud – ArcGIS Online (SaaS)","zh":"雲端地理——ArcGIS Online（軟件即服務）","p":[{"en":"A web-based collaborative platform hosted by Esri that allows users to create, manage, store and share maps, apps and data","zh":"由 Esri 託管的網上協作平台，讓用戶建立、管理、儲存及分享地圖、應用程式和數據","lvl":0,"num":false},{"en":"https://www.arcgis.com/index.html (you will use this in Lecture 7 and the labs)","zh":"https://www.arcgis.com/index.html（第七課及實驗課會用到）","lvl":0,"num":false}]},"49":{"n":49,"en":"In Government, Location is Never an Afterthought","zh":"在政府中，位置從來不是事後才想到的","p":[{"en":"GIS is recognized as a **foundational system**; GIS supports all aspects of government","zh":"GIS 被視為「基礎系統」；GIS 支援政府各方面工作","lvl":0,"num":false},{"en":"**Citizen:** health, connected, homelessness, equity, livability, opioid crisis, housing, mobility, public safety, aging population, economic opportunity","zh":"市民：健康、互聯、露宿者、公平、宜居、鴉片類藥物危機、房屋、出行、公共安全、人口老化、經濟機會","lvl":0,"num":false},{"en":"**Infrastructure:** broadband, aging structures, telecommunications, airports, highways and roads, buildings, water, bridges, land use, sewer","zh":"基建：寬頻、老化結構、電訊、機場、公路及道路、建築、水務、橋樑、土地用途、污水","lvl":0,"num":false},{"en":"**Environment:** green infrastructure, open space, climate, sea-level rise, air quality, inclement weather, renewable energy, pollution, habitat preservation","zh":"環境：綠色基建、休憩空間、氣候、海平面上升、空氣質素、惡劣天氣、可再生能源、污染、生境保育","lvl":0,"num":false},{"en":"**Technology advancements:** sensors, AI, autonomous vehicles, machine learning, intelligent things, cloud, AR/VR, drones, Internet of Things","zh":"科技進步：感應器、人工智能、自動駕駛汽車、機器學習、智能物件、雲端、擴增／虛擬實境、無人機、物聯網","lvl":0,"num":false}]},"50":{"n":50,"en":"It Starts with Identifying Priorities…","zh":"由確定優先事項開始⋯⋯","p":[{"en":"Livable; sustainable; resilient; well-run; healthy; safe; prosperous","zh":"宜居；可持續；具抗逆力；管理完善；健康；安全；繁榮","lvl":0,"num":false}]},"51":{"n":51,"en":"Aspirations Get Translated into Actionable, Real-world Initiatives","zh":"願景轉化為可行的現實措施","p":[{"en":"**Aspirations:** safe, well-run, livable, healthy, prosperous, sustainable","zh":"願景：安全、管理完善、宜居、健康、繁榮、可持續","lvl":0,"num":false},{"en":"**Initiatives:** implement performance management; reduce traffic congestion; create more affordable housing; reduce homelessness; increase recreation opportunities; improve water conservation; make parking easier; create job availability; improve emergency response times; use less energy; encourage startups; improve earthquake preparedness","zh":"措施：推行績效管理；減少交通擠塞；增建可負擔房屋；減少露宿者；增加康樂機會；加強節約用水；令泊車更方便；增加就業機會；縮短緊急應變時間；減少用電；鼓勵初創；加強地震準備","lvl":0,"num":false}]},"53":{"n":53,"en":"Coordinated Construction","zh":"協調施工","p":[{"en":"To enhance livability by easing traffic, the city pooled its open data via GeoHub to create **Street Wize**, an interactive web-based application that maps street construction and permit activities.","zh":"為紓緩交通、提升宜居度，市政府透過 GeoHub 匯集開放數據，建立 Street Wize——一個顯示道路工程及許可證活動的互動網上應用程式。","lvl":0,"num":false}]},"54":{"n":54,"en":"Clean Streets","zh":"清潔街道","p":[{"en":"22,000 miles of public streets and alleys assigned a cleanliness score. Residents can explore the cleanliness of streets near them while city staff use this data to prioritize clean-up efforts, prevent illegal dumping, and deploy 5,000 trash bins in the right locations.","zh":"22,000 英里的公共街道及小巷獲評清潔分數。居民可查看附近街道的清潔度，市政府職員則利用這些數據排列清潔優先次序、防止非法棄置，並在合適地點放置 5,000 個垃圾桶。","lvl":0,"num":false}]},"55":{"n":55,"en":"Livable Streets","zh":"宜居街道","p":[{"en":"The city's annual campaign to repave 2,400 miles of roads delivers more reliable and safer transportation options for all citizens. The app (\"Road to 2400\") helps citizens keep tabs on the city's progress and shows how staff are meeting their goal – ahead of schedule and under budget.","zh":"市政府每年重鋪 2,400 英里道路，為所有市民提供更可靠、更安全的交通選擇。應用程式（「邁向 2400」）讓市民追蹤進度，並顯示職員如何提前並以低於預算完成目標。","lvl":0,"num":false}]},"56":{"n":56,"en":"Los Angeles Vision Zero","zh":"洛杉磯零死亡願景","p":[{"en":"Vision Zero is a global initiative whose goal is to reduce severe injuries and deaths in roadway {collisions|碰撞}. Through the LA GeoHub you can explore, visualize and download Vision Zero's location-based open data, and use and develop web and mobile apps that support this initiative.","zh":"零死亡願景是一項全球倡議，目標是減少道路碰撞造成的重傷和死亡。透過洛杉磯 GeoHub，你可探索、視覺化及下載零死亡願景的位置開放數據，並使用及開發支援這項倡議的網上及手機應用程式。","lvl":0,"num":false}]},"57":{"n":57,"en":"Four Technology Foundations (Smart Community Information System)","zh":"四大科技基礎（智慧社區資訊系統）","p":[{"en":"**Planning and Engineering** – urban and community design","zh":"規劃及工程——城市及社區設計","lvl":0,"num":true},{"en":"**Operational Efficiency** – good government services","zh":"營運效率——良好的政府服務","lvl":0,"num":true},{"en":"**Data-Driven Performance** – through data and analytics","zh":"數據驅動績效——透過數據及分析","lvl":0,"num":true},{"en":"**Civic Inclusion** – connecting with the community","zh":"公民共融——與社區連繫","lvl":0,"num":true}]},"58":{"n":58,"en":"Planning and Engineering","zh":"規劃及工程","p":[{"en":"\"Smart communities happen when location helps great things get built\"","zh":"「當位置協助建設美好事物時，智慧社區便出現」","lvl":0,"num":false},{"en":"Examples: Sacramento Area Council of Governments, CA – identify key locations to install bike parking; impact of proposed development; City of Peachtree Corners, GA – autonomous vehicle test track; Manatee County, FL – sea-level rise analysis; Cobb County, GA – prioritization of street repaving; Incheon, South Korea – urban redevelopment","zh":"例子：加州薩克拉門托地區政府委員會——找出安裝單車泊位的重要地點；擬議發展的影響；喬治亞州桃樹角市——自動駕駛測試跑道；佛州馬納提縣——海平面上升分析；喬治亞州科布縣——道路重鋪優先次序；南韓仁川——市區重建","lvl":0,"num":false}]},"59":{"n":59,"en":"Operational Efficiency","zh":"營運效率","p":[{"en":"\"Smart communities happen when location is used to improve efficiency\"","zh":"「當位置用於提升效率時，智慧社區便出現」","lvl":0,"num":false},{"en":"Examples: Palm Beach County, FL – mosquito inspection; Iowa DOT – bridge conditions; Johns Creek, GA – Alexa skill connects the city's open data; facilities management; St. Johns County, FL – asset maintenance; Seminole Tribe of Florida – inspections with drone imagery","zh":"例子：佛州棕櫚灘縣——蚊患檢查；愛荷華州交通部——橋樑狀況；喬治亞州約翰斯克里克——以 Alexa 技能連接城市開放數據；設施管理；佛州聖約翰斯縣——資產維修；佛州塞米諾爾部落——以無人機影像巡查","lvl":0,"num":false}]},"60":{"n":60,"en":"Data-Driven Performance","zh":"數據驅動績效","p":[{"en":"\"Smart communities happen when governments achieve data-driven performance\"","zh":"「當政府達到數據驅動的績效時，智慧社區便出現」","lvl":0,"num":false},{"en":"Examples: Cobb County, GA – traffic management using AI; Tempe, AZ – opioid abuse monitoring; Baton Rouge, LA – crime analysis; Coral Gables, FL – Community Intelligence Center; Iowa DOT – real-time monitoring of snow operations","zh":"例子：喬治亞州科布縣——以 AI 管理交通；亞利桑那州坦佩——監察鴉片類藥物濫用；路易斯安那州巴吞魯日——罪案分析；佛州科勒爾蓋布爾斯——社區情報中心；愛荷華州交通部——實時監察除雪工作","lvl":0,"num":false}]},"61":{"n":61,"en":"Civic Inclusion","zh":"公民共融","p":[{"en":"\"Smart communities happen when governments focus on civic inclusion\"","zh":"「當政府重視公民共融時，智慧社區便出現」","lvl":0,"num":false},{"en":"Examples: Sonoma County, CA – fire debris clean-up status; Hillsborough County, FL – capital improvement projects & expenditures; Philadelphia, PA – stress index; Santa Clara Valley Transportation Authority, CA – hub; Grand Rapids, MI – housing choices for all; San Bernardino County, CA – addressing homelessness; Cobb County, GA – enhancing the lives of senior citizens","zh":"例子：加州索諾瑪縣——山火殘骸清理進度；佛州希爾斯伯勒縣——基本工程項目及開支；賓州費城——壓力指數；加州聖塔克拉拉谷交通局——資訊平台；密歇根州大急流城——人人有房屋選擇；加州聖貝納迪諾縣——處理露宿者問題；喬治亞州科布縣——改善長者生活","lvl":0,"num":false}]},"64":{"n":64,"en":"Develop a Geospatial Strategy to Achieve Maximum Impact","zh":"制定地理空間策略以發揮最大影響","p":[{"en":"**Foundation** – embracing GIS as a platform","zh":"基礎——以 GIS 作為平台","lvl":0,"num":true},{"en":"**Approach** – defining priorities and needs","zh":"方針——確定優先事項及需要","lvl":0,"num":true},{"en":"**System** – adopting technology and assessing your resources","zh":"系統——採用技術並評估資源","lvl":0,"num":true},{"en":"**Implement** – deploying solutions and workflows","zh":"實施——部署方案及工作流程","lvl":0,"num":true}]},"65":{"n":65,"en":"Developing & Executing a Geospatial Strategy","zh":"制定及執行地理空間策略","p":[{"en":"Understand → Plan → Act: (1) Prepare → (2) Implement → (3) Operate → (4) Review → Revisit … maximize impact","zh":"理解 → 規劃 → 行動：(1) 準備 → (2) 實施 → (3) 營運 → (4) 檢討 → 重新審視⋯⋯發揮最大影響","lvl":0,"num":false}]},"68":{"n":68,"en":"Mapping the Outbreak of SARS","zh":"繪製沙士爆發地圖","p":[{"en":"SARS web maps: cases distribution, affected buildings in HK, affected areas worldwide (image from IRINFO.org; newspaper article \"Charting an epidemic\")","zh":"沙士網上地圖：個案分佈、香港受影響大廈、全球受影響地區（圖片來自 IRINFO.org；報章文章「繪製疫情圖」）","lvl":0,"num":false},{"en":"To keep HK residents up to date on SARS spread","zh":"讓香港市民掌握沙士傳播的最新情況","lvl":0,"num":false},{"en":"To help health officials and {epidemiologists|流行病學家} to track & study the disease","zh":"協助衞生官員及流行病學家追蹤及研究這種疾病","lvl":0,"num":false}]},"70":{"n":70,"en":"Coronavirus COVID-19 Global Cases (Johns Hopkins University CSSE Dashboard)","zh":"新冠病毒全球個案（約翰霍普金斯大學系統科學與工程中心儀表板）","p":[{"en":"Snapshot (4/3/2020, 10:42:30 PM): total confirmed 1,041,126; total deaths 55,132; total recovered 221,262; 181 countries/regions","zh":"截圖（2020 年 4 月 3 日晚上 10:42:30）：累計確診 1,041,126；死亡 55,132；康復 221,262；181 個國家／地區","lvl":0,"num":false},{"en":"Top confirmed: US 245,658; Spain 117,710; Italy 115,242; Germany 87,244; China 82,509; France 59,929; Iran 53,183; UK 38,681 …","zh":"確診最多：美國 245,658；西班牙 117,710；意大利 115,242；德國 87,244；中國 82,509；法國 59,929；伊朗 53,183；英國 38,681⋯⋯","lvl":0,"num":false},{"en":"Includes a world map with proportional red circles and a chart of cumulative cases rising sharply","zh":"包括以比例紅圈顯示的世界地圖，以及累計個案急升的圖表","lvl":0,"num":false}]},"71":{"n":71,"en":"Latest Situation of Coronavirus Disease (COVID-19) in Hong Kong","zh":"香港 2019 冠狀病毒病最新情況","p":[{"en":"Snapshot: confirmed/probable 915 (▲24); hospitalised 668 (▲15); critical 12; discharged 216 (▲10); death 4 (▲0)","zh":"截圖：確診／疑似 915（▲24）；住院 668（▲15）；危殆 12；出院 216（▲10）；死亡 4（▲0）","lvl":0,"num":false},{"en":"Map: buildings with cases in the past 14 days (red) and beyond 14 days (green); case list with age, sex, status (hospitalised, imported, close contact)","zh":"地圖：過去 14 天有個案的大廈（紅色）及超過 14 天的（綠色）；個案列表包括年齡、性別、狀況（住院、輸入、密切接觸者）","lvl":0,"num":false}]},"74":{"n":74,"en":"Understanding & Responding to COVID-19: Five Steps (Overview)","zh":"理解及應對新冠病毒：五個步驟（概覽）","p":[{"en":"Map the cases","zh":"繪製個案地圖","lvl":0,"num":true},{"en":"Map the spread","zh":"繪製傳播情況","lvl":0,"num":true},{"en":"Map vulnerable populations","zh":"繪製易受影響人口","lvl":0,"num":true},{"en":"Map your capacity","zh":"繪製你的應對能力","lvl":0,"num":true},{"en":"Communicate with maps","zh":"以地圖溝通","lvl":0,"num":true}]},"75":{"n":75,"en":"Step 1 – Map the Cases","zh":"第一步——繪製個案地圖","p":[{"en":"Examples: global case map (dark), HK building map (red/green dots), China province choropleth map","zh":"例子：全球個案地圖（深色）、香港大廈地圖（紅／綠點）、中國省份分級統計圖","lvl":0,"num":false}]},"76":{"n":76,"en":"Step 2 – Map the Spread","zh":"第二步——繪製傳播情況","p":[{"en":"Examples: HK map with a time slider showing how cases appear day by day (e.g., 20/01/2020); world map with a time slider (Jan–Apr 2020) for active, confirmed, deaths and recovered cases","zh":"例子：附時間滑桿的香港地圖，顯示每日個案出現情況（例如 2020 年 1 月 20 日）；附時間滑桿的世界地圖（2020 年 1–4 月），顯示現存、確診、死亡及康復個案","lvl":0,"num":false}]},"77":{"n":77,"en":"Step 3 – Map Vulnerable Populations","zh":"第三步——繪製易受影響人口","p":[{"en":"Examples: US map \"Where are the uninsured?\" (population without health insurance); Hong Kong mid-year population density map (persons per km², e.g., > 39,977 to \u003c 1,203)","zh":"例子：美國地圖「沒有保險的人在哪裡？」（沒有醫療保險的人口）；香港年中人口密度地圖（每平方公里人數，例如多於 39,977 至少於 1,203）","lvl":0,"num":false}]},"78":{"n":78,"en":"Step 4 – Map Your Capacity","zh":"第四步——繪製你的應對能力","p":[{"en":"Examples: HK map of collection points for specimen submission (e.g., Cheung Sha Wan Dermatological Clinic); US maps of hospital beds and ICU capacity by county/state; analysis charts","zh":"例子：香港樣本收集點地圖（例如長沙灣皮膚科診所）；美國按縣／州劃分的病床及深切治療部容量地圖；分析圖表","lvl":0,"num":false}]},"79":{"n":79,"en":"Step 5 – Communicate with Maps","zh":"第五步——以地圖溝通","p":[{"en":"Examples: Esri COVID-19 GIS Hub; HK dashboard; charts and infographics; story maps (e.g., temple notice)","zh":"例子：Esri 新冠病毒 GIS 平台；香港儀表板；圖表及資訊圖；故事地圖（例如廟宇通告）","lvl":0,"num":false}]},"81":{"n":81,"en":"Creating a Dashboard (5 Steps)","zh":"建立儀表板（五個步驟）","p":[{"en":"Data preprocessing","zh":"數據預處理","lvl":0,"num":true},{"en":"Data publishing","zh":"發布數據","lvl":0,"num":true},{"en":"Create web map services","zh":"建立網上地圖服務","lvl":0,"num":true},{"en":"Build dashboard","zh":"建立儀表板","lvl":0,"num":true},{"en":"Real-time update","zh":"實時更新","lvl":0,"num":true}]},"82":{"n":82,"en":"Creating a Dashboard – 1. Data Preprocessing","zh":"建立儀表板——1. 數據預處理","p":[{"en":"Clean and organise the case data in a spreadsheet (case no., date, age, sex, building address…) and geocode it into points on a map of HK","zh":"在試算表中清理及整理個案數據（個案編號、日期、年齡、性別、大廈地址⋯⋯），並把它地理編碼為香港地圖上的點","lvl":0,"num":false}]},"83":{"n":83,"en":"Creating a Dashboard – 2. Data Publishing","zh":"建立儀表板——2. 發布數據","p":[{"en":"Publish the data to ArcGIS Online as hosted feature layers (e.g., COVID_19_HistoricCasesByCountry, COVID_19_CasesByAdmin1, COVID_19_CasesByCountry)","zh":"把數據發布到 ArcGIS Online 成為託管要素圖層（例如 COVID_19_HistoricCasesByCountry、COVID_19_CasesByAdmin1、COVID_19_CasesByCountry）","lvl":0,"num":false}]},"84":{"n":84,"en":"Creating a Dashboard – 3. Create Web Map Services (Some Considerations)","zh":"建立儀表板——3. 建立網上地圖服務（一些考慮）","p":[{"en":"Language: Chinese & English","zh":"語言：中文及英文","lvl":0,"num":true},{"en":"Colour of basemap: colour style or grey style?","zh":"底圖顏色：彩色風格還是灰色風格？","lvl":0,"num":true},{"en":"Colour of cases: red? green? blue?","zh":"個案顏色：紅？綠？藍？","lvl":0,"num":true},{"en":"{Choropleth|分級統計圖} or proportional symbols","zh":"分級統計圖還是比例符號","lvl":0,"num":true},{"en":"Using clustering symbols","zh":"使用聚類符號","lvl":0,"num":true},{"en":"Case details: pop-up box?","zh":"個案詳情：彈出視窗？","lvl":0,"num":true},{"en":"…","zh":"⋯⋯","lvl":0,"num":true}]},"85":{"n":85,"en":"Creating a Dashboard – 4. Build Dashboard","zh":"建立儀表板——4. 建立儀表板","p":[{"en":"Mobile version and desktop version","zh":"流動版及桌面版","lvl":0,"num":false},{"en":"Dashboard elements: left panel, map, map legend, serial chart, pie chart, indicator, gauge, list, details, rich text","zh":"儀表板元素：左側面板、地圖、圖例、序列圖、圓形圖、指標、量表、列表、詳情、豐富文字","lvl":0,"num":false}]},"86":{"n":86,"en":"Creating a Dashboard – 5. Real Time Update","zh":"建立儀表板——5. 實時更新","p":[{"en":"Download the latest official data (DATA.GOV.HK \"Data in Coronavirus Disease (COVID-19)\" CSV files) and run a scheduled script (Python) to update the feature layer automatically","zh":"下載最新官方數據（資料一線通「2019 冠狀病毒病數據」CSV 檔），並以排程腳本（Python）自動更新要素圖層","lvl":0,"num":false}]},"87":{"n":87,"en":"Creating a Dashboard (Recap)","zh":"建立儀表板（重溫）","p":[{"en":"1. Data preprocessing → 2. Data publishing → 3. Create web map services → 4. Build dashboard → 5. Real-time update","zh":"1. 數據預處理 → 2. 發布數據 → 3. 建立網上地圖服務 → 4. 建立儀表板 → 5. 實時更新","lvl":0,"num":false}]},"95":{"n":95,"en":"In Summary","zh":"總結","p":[{"en":"Public-Private-People Partnership","zh":"公私民合作","lvl":0,"num":true},{"en":"Make use of Open Data","zh":"善用開放數據","lvl":0,"num":true},{"en":"Make use of GIS","zh":"善用 GIS","lvl":0,"num":true},{"en":"Make use of Cloud GIS Platform","zh":"善用雲端 GIS 平台","lvl":0,"num":true},{"en":"Make use of Dashboard Technology","zh":"善用儀表板技術","lvl":0,"num":true}]}},"secs":{"A1":{"en":"A1. What Is GIS?","zh":"甚麼是 GIS？","p":[{"h":2,"kind":"key","en":"Definition","zh":""},{"en":"**GIS = Geographic Information System.** It has 5 components: **Hardware, Software, Data, People, Workflows.**","zh":"GIS ＝地理資訊系統，由五部分組成：硬件、軟件、數據、人、工作流程。","kind":"key"},{"en":"GIS provides a **process and framework for creating and applying geographic knowledge widely**: Measurement → Visualization & Mapping → Analysis & Modeling → Planning & Design → Decision Making → Action. \"Understanding precedes action.\"","zh":"GIS 提供一個廣泛建立和應用地理知識的流程和框架：量度 → 視覺化及製圖 → 分析及建模 → 規劃及設計 → 決策 → 行動。「先理解，後行動。」"}],"terms":[["GIS components","GIS 五個組成部分","硬件、軟件、數據、人和工作流程。"],["GIS process","GIS 流程","量度 → 視覺化及製圖 → 分析及建模 → 規劃及設計 → 決策 → 行動；「先理解，後行動」。"]]},"A2":{"en":"A2. Vector vs Raster Data","zh":"矢量數據與柵格數據","p":[{"en":"View 角度 · Shape-based: points, lines, polygons · Cell-based: a matrix of square cells; each cell stores one number","zh":"以形狀為本：點、線、多邊形 · 以格子為本：方格矩陣；每格儲存一個數值","row":1},{"en":"Good for 適合 · **Discrete** objects – roads, buildings, boundaries, rivers, lakes · **Continuous** phenomena – elevation, rainfall, temperature, air photos, vegetation, soil","zh":"離散的物件——道路、建築、邊界、河流、湖泊 · 連續的現象——高度、雨量、氣溫、航空照片、植被、土壤","row":1},{"en":"Elevation 高度 · Contour lines (each line = one value) · Cells (each cell = one value)","zh":"等高線（每條線一個數值） · 格子（每格一個數值）","row":1},{"en":"**Point** = a pair of x,y coordinates; **Line** = a series of x,y pairs; **Polygon** = a line that ends at its beginning. Real-world entities are abstracted into these 3 shapes (e.g., cities = points, rivers = lines, countries = polygons).","zh":"點＝一對 x、y 坐標；線＝一連串 x、y 坐標；多邊形＝起點與終點相同的線。現實事物被抽象為這三種形狀（例如城市＝點、河流＝線、國家＝多邊形）。","lvl":0,"num":false}],"terms":[["Vector data","矢量數據","以點、線、多邊形表示地理；適合有清晰邊界的離散物件，例如道路、建築。"],["Raster data","柵格數據","以方格（像素）矩陣表示地理，每格儲存一個數值；適合連續現象，例如高度、氣溫。"],["Point / Line / Polygon","點／線／多邊形","點＝一對 x、y 坐標；線＝一連串坐標；多邊形＝終點回到起點的線。"],["Discrete vs continuous","離散與連續","離散＝有明確邊界的獨立物件；連續＝到處都有數值並逐漸變化的現象。"],["Contour line","等高線","連接相同高度點的線，是以矢量表示高度的方法。"]]},"A3":{"en":"A3. Organising GIS Data","zh":"整理 GIS 數據","p":[{"en":"**Geodatabase:** a collection of geographic data on disk, organised by area, theme or project; can hold vector, raster, tables; models feature & attribute relationships.","zh":"地理數據庫：儲存在磁碟上的地理數據集合，按地區、主題或項目整理；可包含矢量、柵格、表格；可模擬地物與屬性的關係。","lvl":0,"num":false},{"en":"**Feature class vs layer:** feature class = stored on disk, physical data; layer = stored in a map, visual representation. Many layers can reference one feature class.","zh":"要素類別與圖層：要素類別＝儲存在磁碟、實體數據；圖層＝儲存在地圖中、視覺呈現。多個圖層可引用同一要素類別。","lvl":0,"num":false},{"en":"GIS works with **thematic layers**; we answer questions by comparing layers (streets, buildings, vegetation…).","zh":"GIS 以主題圖層運作；我們透過比較不同圖層（街道、建築、植被⋯⋯）來回答問題。","lvl":0,"num":false},{"en":"**Attribute table:** each **row = a feature**, each **column = an attribute**; features link to rows by the **Object ID** (1-to-1). Minimal fields = ID and shape. Attributes are used for **symbology** and **labeling**.","zh":"屬性表：每一行＝一個地物，每一列＝一個屬性；地物以 Object ID 與行連結（一對一）。最少的欄位＝ID 及形狀。屬性用於符號化及標註。","lvl":0,"num":false},{"en":"**Categorical symbolization** = by type/kind (e.g., cabin, barn); **quantitative symbolization** = by amount/rank (e.g., peak height ranges).","zh":"分類符號化＝按類型（例如小屋、穀倉）；數量符號化＝按數量／等級（例如山峰高度範圍）。","lvl":0,"num":false},{"en":"**Metadata** = \"an owner's manual for your geographic data\" – what is it, who made it, how was it made. Good data has good metadata.","zh":"元數據＝「地理數據的用戶手冊」——它是甚麼、誰製作、如何製作。好的數據有好的元數據。","lvl":0,"num":false}],"terms":[["Geodatabase","地理數據庫","儲存在磁碟、按地區、主題或項目整理的地理數據集合，可包含矢量、柵格和表格。"],["Feature class","要素類別","儲存在磁碟上的實體數據（例如所有營地點）。"],["Layer","圖層","要素類別在地圖上的視覺呈現；多個圖層可引用同一要素類別。"],["Attribute table","屬性表","每一行＝一個地物，每一列＝一個屬性；地物以 Object ID 與行一對一連結。"],["Object ID","物件編號","屬性表中每個地物獨一無二的編號，用來連結地圖上的地物和表中的行。"],["Categorical / Quantitative symbolization","分類／數量符號化","分類＝按類型（例如小屋、穀倉）；數量＝按數量或等級（例如山峰高度範圍）。"],["Metadata","元數據","「關於數據的數據」：說明數據是甚麼、誰製作、如何製作，是地理數據的用戶手冊。"]]},"A4":{"en":"A4. Coordinate Systems and Projections","zh":"坐標系統與投影","p":[{"en":"Reference lines: **equator** (natural E–W line), **prime meridian** (arbitrary N–S line through Greenwich), **parallels** (E–W lines), **meridians** (N–S lines meeting at the poles).","zh":"參考線：赤道（天然的東西線）、本初子午線（經格林威治、人為設定的南北線）、緯線（東西線）、經線（在兩極相交的南北線）。","lvl":0,"num":false},{"en":"**Latitude** = angle north/south of the equator (0°–90°N/S); **longitude** = angle east/west of the prime meridian (0°–180°E/W).","zh":"緯度＝赤道以北／南的角度（0°–90°）；經度＝本初子午線以東／西的角度（0°–180°）。","lvl":0,"num":false},{"en":"**Map projection** = a set of rules to \"transplant\" locations from the round earth to a flat map; there are many projections.","zh":"地圖投影＝把圓形地球上的位置「移植」到平面地圖的一套規則；投影有很多種。","lvl":0,"num":false},{"en":"Units 單位 · Latitude & longitude (degrees) · Cartesian x,y (metres)","zh":"經緯度（度） · 直角坐標 x、y（米）","row":1},{"en":"Uniform? 是否均勻 · No – not uniform across the earth · Yes – length and angle are uniform","zh":"否——在地球表面不均勻 · 是——長度和角度均勻","row":1},{"en":"HK example 香港例子 · **WGS84** – measured by GPS, e.g., 113°25'35\", 22°27'38\" · WGS84——以 GPS 量度 · **HK1980 Grid** – by surveyors' ground measurements, Northing & Easting, e.g., 834695.786mN, 876231.564mE","zh":"香港 1980 方格網——由測量師實地量度，北距及東距","row":1},{"en":"The HK1980 Grid projection file uses Transverse Mercator, International 1924 spheroid, false easting 836694.05, false northing 819069.8, unit = metre.","zh":"香港 1980 方格網的投影檔案使用橫軸墨卡托投影、1924 國際橢球體、假東距 836694.05、假北距 819069.8，單位＝米。","lvl":0,"num":false}],"terms":[["Equator / Prime meridian","赤道／本初子午線","赤道是天然的東西線；本初子午線是人為設定、經過格林威治的南北線。"],["Latitude / Longitude","緯度／經度","緯度＝赤道以北或以南的角度（0–90°）；經度＝本初子午線以東或以西的角度（0–180°）。"],["Map projection","地圖投影","把圓形地球上的位置「移植」到平面地圖的一套規則。"],["Georeferencing","地理配準","把數據對應到地球表面真實位置的過程。"],["Geographic coordinate system","地理坐標系統","以經緯度（度）表示位置；在地球表面不均勻。香港例子：WGS84（GPS 使用）。"],["Projected coordinate system","投影坐標系統","以直角坐標 x、y（米）表示位置；長度和角度均勻。香港例子：香港 1980 方格網（北距／東距）。"],["Northing / Easting","北距／東距","投影坐標系統中向北和向東的距離（米）。"]]},"A5":{"en":"A5. Querying and Analysing GIS Data","zh":"查詢及分析 GIS 數據","p":[{"en":"**Get information:** Identify, MapTips, Selection (\"go to the map → click a feature → get information\").","zh":"取得資訊：識別、地圖提示、選取（「到地圖 → 點擊地物 → 取得資訊」）。","lvl":0,"num":false},{"en":"**Attribute query** uses **SQL**: e.g., \"REC_USE\" = 'TENNIS COURT' (field name + operator + value).","zh":"屬性查詢使用 SQL：例如 \"REC_USE\" = 'TENNIS COURT'（欄位名稱＋運算符＋數值）。","lvl":0,"num":false},{"en":"Select By Location · Finds whole features partly inside another (e.g., parcels touching floodplain) · New selection","zh":"按位置選取 · 找出部分位於另一範圍內的完整地物 · 新選取","row":1},{"en":"Overlay – Union · Combines layers; keeps **all** input features · New feature class","zh":"疊加——聯合 · 合併圖層；保留**所有**輸入地物 · 新要素類別","row":1},{"en":"Overlay – Intersect · Keeps **only areas of overlap** · New feature class","zh":"疊加——相交 · 只保留**重疊部分** · 新要素類別","row":1},{"en":"Buffer · Creates zones at a set distance around features (e.g., 500-ft around schools, no billboards) · New feature class","zh":"緩衝區 · 在地物周圍按設定距離建立區域 · 新要素類別","r
