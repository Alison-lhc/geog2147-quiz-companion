ow":1},{"en":"**Data formats:** shapefile, geodatabase, CAD, raster, tables, map services. GeoCloud data: **feature service** (shares features) and **map service** (shares images).","zh":"數據格式：shapefile、地理數據庫、CAD、柵格、表格、地圖服務。雲端地理數據：要素服務（共享地物）及地圖服務（共享影像）。","lvl":0,"num":false},{"h":1,"en":"4 GIS technologies","zh":"四種 GIS 技術"},{"en":"Desktop GIS 桌面 GIS · Installed on a PC; display, query, update, analyse data","zh":"安裝在個人電腦；顯示、查詢、更新、分析數據","row":1},{"en":"Web GIS 網上 GIS · Display and analyse spatial data on the Internet via browsers (client → firewall → web server → GIS server → database server)","zh":"透過瀏覽器在互聯網顯示及分析空間數據","row":1},{"en":"Mobile GIS 流動 GIS · GIS on wireless mobile devices like smartphones · 在智能手機等無線流動裝置上使用 GIS","zh":"","row":1},{"en":"Cloud GIS / GeoCloud 雲端 GIS · GIS software & services on cloud infrastructure, accessed via the web. e.g., **ArcGIS Online (SaaS)** · 在雲端基建上運行 GIS，透過網絡存取，例如 ArcGIS Online（軟件即服務）","zh":"","row":1}],"terms":[["Identify / MapTips / Selection","識別／地圖提示／選取","在地圖上點擊或停留在地物上取得其資訊的三種方法。"],["Attribute query (SQL)","屬性查詢（SQL）","以結構化查詢語言按屬性篩選地物，例如 \"REC_USE\" = 'TENNIS COURT'。"],["Select By Location","按位置選取","找出與另一圖層有空間關係的完整地物（例如部分位於氾濫平原的地段），結果是新的選取。"],["Overlay – Union","疊加——聯合","結合兩個圖層，輸出保留所有輸入地物，建立新要素類別。"],["Overlay – Intersect","疊加——相交","結合兩個圖層，輸出只保留重疊部分，建立新要素類別。"],["Buffer","緩衝區","在地物周圍按設定距離建立區域，例如學校周圍 500 呎禁止廣告牌。"],["Feature service / Map service","要素服務／地圖服務","雲端數據的兩種分享方式：要素服務分享可查詢的地物；地圖服務只分享地圖圖片。"],["Desktop / Web / Mobile / Cloud GIS","桌面／網上／流動／雲端 GIS","四種 GIS 技術：安裝在電腦／經瀏覽器／在手機／在雲端基建上運行。"]]},"A6":{"en":"A6. Delivering Smart Cities through a Geospatial Strategy","zh":"以地理空間策略實現智慧城市","p":[{"en":"\"In government, location is never an afterthought.\" GIS is a **foundational system** supporting all aspects of government – citizens, infrastructure, environment, technology.","zh":"「在政府中，位置從來不是事後才想到的。」GIS 是支援政府各方面工作的基礎系統——市民、基建、環境、科技。","lvl":0,"num":false},{"en":"It starts by **identifying priorities** (aspirations): safe, well-run, livable, healthy, prosperous, sustainable, resilient → translated into **actionable initiatives** (reduce traffic congestion, affordable housing, reduce homelessness, emergency response, encourage startups…).","zh":"先「確定優先事項」（願景）：安全、管理完善、宜居、健康、繁榮、可持續、具抗逆力 → 轉化為「可行的措施」（減少交通擠塞、可負擔房屋、減少露宿者、緊急應變、鼓勵初創⋯⋯）。","lvl":0,"num":false},{"en":"**LA examples:** Coordinated Construction (Street Wize); Clean Streets (22,000 miles scored; 5,000 trash bins); Livable Streets (repave 2,400 miles); Vision Zero (reduce road deaths).","zh":"洛杉磯例子：協調施工（Street Wize）；清潔街道（評分 22,000 英里；5,000 個垃圾桶）；宜居街道（重鋪 2,400 英里）；零死亡願景（減少交通死亡）。","lvl":0,"num":false},{"h":2,"kind":"key","en":"Four technology foundations of a Smart Community Information System","zh":""},{"en":"**1. Planning & Engineering** (urban & community design) · **2. Operational Efficiency** (good government services) · **3. Data-Driven Performance** (through data & analytics) · **4. Civic Inclusion** (connecting with the community). All \"start with location\".","zh":"1. 規劃及工程（城市及社區設計）· 2. 營運效率（良好的政府服務）· 3. 數據驅動績效（透過數據及分析）· 4. 公民共融（與社區連繫）。全部「由位置開始」。","kind":"key"},{"en":"**Geospatial strategy:** Foundation (embrace GIS as a platform) → Approach (define priorities & needs) → System (adopt technology, assess resources) → Implement (deploy solutions & workflows).","zh":"地理空間策略：基礎（以 GIS 為平台）→ 方針（確定優先事項及需要）→ 系統（採用技術、評估資源）→ 實施（部署方案及工作流程）。","lvl":0,"num":false},{"en":"**Executing the strategy:** Understand → Plan → Act (1 Prepare, 2 Implement, 3 Operate, 4 Review) → Revisit … maximize impact.","zh":"執行策略：理解 → 規劃 → 行動（1 準備、2 實施、3 營運、4 檢討）→ 重新審視⋯⋯發揮最大影響。","lvl":0,"num":false}],"terms":[["Foundational system","基礎系統","GIS 支援政府各方面工作，是其他系統的基礎；「在政府中，位置從來不是事後才想到的」。"],["Aspirations → Initiatives","願景 → 措施","先定下城市的願景（安全、宜居等），再轉化為具體可行的措施（減少擠塞等）。"],["Four technology foundations","四大科技基礎","規劃及工程、營運效率、數據驅動績效、公民共融——全部由位置開始。"],["Civic inclusion","公民共融","讓所有市民（包括長者、露宿者等）都能參與和受惠。"],["Geospatial strategy","地理空間策略","基礎 → 方針 → 系統 → 實施；執行時理解 → 規劃 → 行動（準備、實施、營運、檢討）→ 重新審視。"]]},"A7":{"en":"A7. Case Study: Mapping and Tracking COVID-19","zh":"案例：繪製及追蹤新冠病毒","p":[{"en":"**20+ years ago – SARS (2003):** Esri's website mapped SARS to keep HK residents up to date and help health officials and {epidemiologists|流行病學家} track the disease.","zh":"20 多年前——沙士（2003）：Esri 網站繪製沙士地圖，讓香港市民掌握最新情況，並協助衞生官員及流行病學家追蹤疾病。","lvl":0,"num":false},{"en":"**2019/2020 – COVID-19:** JHU global dashboard (e.g., 1,041,126 confirmed on 4/3/2020) and the HK dashboard (e.g., 915 confirmed, 668 hospitalised, 12 critical, 216 discharged, 4 deaths).","zh":"2019/2020——新冠病毒：約翰霍普金斯大學全球儀表板（例如 2020 年 4 月 3 日確診 1,041,126 宗）及香港儀表板（例如確診 915、住院 668、危殆 12、出院 216、死亡 4）。","lvl":0,"num":false},{"h":1,"en":"5 steps to understand & respond to COVID-19","zh":"理解及應對新冠病毒的五個步驟"},{"en":"Map the cases","zh":"繪製個案地圖","lvl":0,"num":true},{"en":"Map the spread","zh":"繪製傳播情況","lvl":0,"num":true},{"en":"Map vulnerable populations","zh":"繪製易受影響人口","lvl":0,"num":true},{"en":"Map your capacity","zh":"繪製你的應對能力（如醫療資源）","lvl":0,"num":true},{"en":"Communicate with maps","zh":"以地圖溝通","lvl":0,"num":true},{"h":1,"en":"5 steps to create a dashboard","zh":"建立儀表板的五個步驟"},{"en":"Data preprocessing","zh":"數據預處理","lvl":0,"num":true},{"en":"Data publishing","zh":"發布數據","lvl":0,"num":true},{"en":"Create web map services","zh":"建立網上地圖服務","lvl":0,"num":true},{"en":"Build dashboard (mobile & desktop versions)","zh":"建立儀表板（流動版及桌面版）","lvl":0,"num":true},{"en":"Real-time update","zh":"實時更新","lvl":0,"num":true},{"en":"Design considerations: language (Chinese & English); basemap colour (colour or grey); case colour (red/green/blue?); choropleth or proportional symbols; clustering symbols; case details pop-up …","zh":"設計考慮：語言（中英文）；底圖顏色（彩色或灰色）；個案顏色（紅／綠／藍？）；分級統計圖或比例符號；聚類符號；個案詳情彈出視窗⋯⋯","lvl":0,"num":false},{"h":2,"kind":"key","en":"Summary – keys to success","zh":""},{"en":"**Public-Private-People Partnership** · make use of **Open Data** · make use of **GIS** · make use of **Cloud GIS platform** · make use of **Dashboard technology**.","zh":"公私民合作 · 善用開放數據 · 善用 GIS · 善用雲端 GIS 平台 · 善用儀表板技術。","kind":"key"}],"terms":[["Epidemiologist","流行病學家","研究疾病如何傳播和控制的科學家。"],["Vulnerable population","易受影響人口","較容易受疾病影響的人群，例如長者、沒有醫療保險的人、人口密集地區的居民。"],["Choropleth map","分級統計圖","按每個地區的數值把地區填上不同深淺顏色的地圖。"],["Proportional symbols","比例符號","符號大小按數值比例變化，例如確診越多圓圈越大。"],["Clustering symbols","聚類符號","把鄰近的點合併成一個標有數目的符號，避免地圖太擠。"],["Data preprocessing","數據預處理","在使用前清理、整理和地理編碼數據。"],["Public-Private-People Partnership","公私民合作","政府、私營機構和市民（例如智慧城市聯盟義工）一起合作，是疫情儀表板成功的關鍵。"]]}}}},"ex":[{"x":0,"n":"HKeToll (Free-Flow Tolling)","en":"All government toll tunnels use RFID toll tags, so drivers do not stop, queue or change lanes. ICT directly saves travel time.","zh":"所有政府收費隧道使用 RFID 繳費貼，司機毋須停車、排隊或切線，ICT 直接節省交通時間。","src":"L1 slide 50","q":0,"pl":[["Hong Kong","香港"]],"refs":[["L1",50]],"d":[["Who and when: the Transport Department rolled out HKeToll to all government toll tunnels and roads from 2023.","誰及何時：運輸署由 2023 年起在所有政府收費隧道及道路推行易通行。"],["How it works: an {RFID|無線射頻識別} tag on the windscreen is read by gantries overhead, and the toll is charged to the driver's account later, so toll booths are no longer needed.","運作：擋風玻璃上的 RFID 繳費貼由上方的龍門架讀取，隧道費之後從司機帳戶扣除，因此不再需要收費亭。"],["Use in answer: it shows goal 1 (quality of life – less waiting time) and goal 2 (sustainability – less idling, so less fuel and fewer emissions).","答題用法：它展示目標一（生活質素——減少等候時間）及目標二（可持續性——減少停車怠速，從而減少耗油及排放）。"]]},{"x":1,"n":"Copenhagen","en":"Cut emissions by 80% since 2005 and aims to be climate positive by 2035, which shows smart cities pursuing sustainable growth.","zh":"自 2005 年起減排 80%，目標 2035 年實現氣候正效益，展示智慧城市追求可持續增長。","src":"L1 slide 32","q":0,"pl":[["Copenhagen","哥本哈根"],["Denmark","丹麥"]],"refs":[["L1",32]],"d":[["Background: Denmark's capital is often ranked as a leading smart and green city, with long-term climate plans.","背景：丹麥首都經常被評為領先的智慧及綠色城市，並訂有長遠氣候計劃。"],["How: it combines cycling infrastructure, district heating, wind power and data from sensors to cut emissions while the city keeps growing.","做法：結合單車基建、區域供暖、風力發電及感應器數據，在城市持續發展的同時減少排放。"],["Use in answer: the best example for goal 2, \"foster {sustainable|可持續的} growth\" – growth and lower emissions at the same time.","答題用法：最適合說明目標二「促進可持續增長」——同時做到增長與減排。"]]},{"x":2,"n":"HK Smart City Blueprint 2.0","en":"6 areas and 130+ initiatives (Dec 2020) to make Hong Kong more livable.","zh":"6 個範疇、130 多項措施（2020 年 12 月），令香港更宜居。","src":"L1 slide 39","q":0,"pl":[["Hong Kong","香港"]],"refs":[["L1",39]],"d":[["Background: published by the HK Government in December 2020, following Blueprint 1.0 (2017).","背景：香港政府於 2020 年 12 月發表，承接 2017 年的藍圖 1.0。"],["Content: 6 smart areas – Smart Mobility, Smart Living, Smart Environment, Smart People, Smart Government and Smart Economy – with 130+ initiatives such as iAM Smart and HKeToll.","內容：6 個智慧範疇——智慧出行、智慧生活、智慧環境、智慧市民、智慧政府及智慧經濟——共 130 多項措施，例如「智方便」及易通行。"],["Use in answer: shows a whole city using ICT to make life better, i.e., goal 1 \"enhance quality of life\".","答題用法：展示整個城市運用 ICT 改善生活，即目標一「提升生活質素」。"]]},{"x":3,"n":"Singapore \"Smart Nation\"","en":"Singapore calls itself a smart nation (launched 2014). It uses national open data (Data.gov.sg) and a national map system (OneMap) to improve public services.","zh":"新加坡稱自己為「智慧國家」（2014 年推出），以國家開放數據（Data.gov.sg）及地圖系統（OneMap）改善公共服務。","src":"L2 slide 17; also outside the slides","q":0,"pl":[["Singapore","新加坡"]],"refs":[["L2",17]],"d":[["Background: Singapore launched the Smart Nation initiative in 2014 for the whole country, not only one city district.","背景：新加坡於 2014 年推出「智慧國家」計劃，覆蓋全國，而非單一城區。"],["How: open data on Data.gov.sg, the OneMap national map, digital ID and sensors support services in transport, health and housing.","做法：Data.gov.sg 開放數據、OneMap 國家地圖、數碼身份及感應器支援交通、醫療及房屋服務。"],["Use in answer: a well-known international comparison with Hong Kong – ICT used to improve city services (definition of a smart city).","答題用法：與香港比較的著名國際例子——運用 ICT 改善城市服務（智慧城市的定義）。"]]},{"x":4,"n":"Songdo, South Korea (1.0)","en":"A new city built from scratch with large technology companies installing sensors and networks. Technology providers led the design.","zh":"由大型科技公司安裝感應器和網絡、從零建造的新城市，由科技供應商主導設計。","src":"outside the slides","q":1,"pl":[["Songdo","松島"],["South Korea","南韓"]],"refs":[],"d":[["Background: a new city built on reclaimed land near Incheon from the 2000s, planned with large technology companies such as Cisco.","背景：自 2000 年代起在仁川附近填海興建的新城市，與 Cisco 等大型科技公司一同規劃。"],["Problem: sensors and networks were installed everywhere, but people were slow to move in, so it was criticised as technology without people.","問題：到處安裝感應器和網絡，但居民遷入緩慢，因此被批評為「有科技、無市民」。"],["Use in answer: Smart City 1.0 – technology-driven, led by technology providers, not by citizens' needs.","答題用法：智慧城市 1.0——科技主導，由科技供應商帶動，而非以市民需要為本。"]]},{"x":5,"n":"Mainland China / HK Blueprint (2.0)","en":"China's state-led, top-down smart city policies since 2012 (900+ smart cities) and HK's government Blueprints are government-driven.","zh":"中國自 2012 年起由國家主導的智慧城市政策（900 多個）及香港政府的藍圖都屬政府主導。","src":"L1 slides 39, 89","q":1,"pl":[["Mainland China","中國內地"],["Hong Kong","香港"]],"refs":[["L1",39],["L1",89]],"d":[["Background: China started national smart city pilots in 2012, and more than 900 cities have joined; Hong Kong has its government Blueprints (2017, 2020).","背景：中國自 2012 年展開國家智慧城市試點，超過 900 個城市參與；香港則有政府藍圖（2017、2020）。"],["How: the government plans, funds and chooses the technology – a {top-down|由上而下} approach.","做法：由政府規劃、出資及選擇科技——由上而下的方式。"],["Use in answer: Smart City 2.0 – technology-enabled and government-led; better than 1.0 but citizens are still mainly users.","答題用法：智慧城市 2.0——科技賦能、政府主導；比 1.0 進步，但市民仍主要是使用者。"]]},{"x":6,"n":"HK COVID-19 dashboard (3.0 in action)","en":"Developed together by DEVB, LandsD and Smart City Consortium volunteers, launched 3 Feb 2020 with 81.84 million visits. Citizens co-created it with the government.","zh":"由發展局、地政總署及智慧城市聯盟義工共同開發，2020 年 2 月 3 日推出，瀏覽 8,184 萬次，市民與政府共同創造。","src":"L1 slide 59","q":1,"pl":[["Hong Kong","香港"]],"refs":[["L1",59]],"d":[["Background: launched on 3 February 2020, early in the pandemic, and visited 81.84 million times.","背景：於 2020 年 2 月 3 日疫情初期推出，瀏覽量達 8,184 萬次。"],["How: DEVB and LandsD worked with Smart City Consortium volunteers to map buildings with cases on a GIS dashboard that the public could check every day.","做法：發展局及地政總署與智慧城市聯盟義工合作，把有個案的大廈繪在 GIS 儀表板上，市民每天可查看。"],["Use in answer: Smart City 3.0 – citizen {co-creation|共同創造}; government and citizens built it together, which is why 3.0 is the ultimate goal.","答題用法：智慧城市 3.0——市民共同創造；政府與市民一起建立，這正是 3.0 為終極目標的原因。"]]},{"x":7,"n":"Vienna citizen solar plants (3.0)","en":"Citizens co-invested in city solar power plants, a well-known example Boyd Cohen gives of citizen co-creation.","zh":"市民共同投資城市太陽能發電廠，是 Boyd Cohen 常舉的市民共創例子。","src":"outside the slides","q":1,"pl":[["Vienna","維也納"],["Austria","奧地利"]],"refs":[],"d":[["Background: from 2012 the city energy company Wien Energie let citizens buy shares of new solar power plants.","背景：由 2012 年起，維也納市營能源公司 Wien Energie 讓市民購買新太陽能發電廠的份額。"],["How: citizens provide money and receive a small return, so they own part of the city's green energy.","做法：市民出資並獲得小額回報，因此擁有城市綠色能源的一部分。"],["Use in answer: Boyd Cohen's own 3.0 example – citizens are co-creators and investors, not only users.","答題用法：Boyd Cohen 本人引用的 3.0 例子——市民是共同創造者及投資者，而非只是使用者。"]]},{"x":8,"n":"GeoLab (HK)","en":"Run by TWGHs for DEVB to help the public build apps with CSDI data, which supports a bottom-up approach.","zh":"東華三院為發展局營運，協助公眾以 CSDI 數據開發應用程式，支持由下而上的方式。","src":"L1 slide 78","q":1,"pl":[["Hong Kong","香港"]],"refs":[["L1",78]],"d":[["Background: run by TWGHs for DEVB as a community space for learning and using CSDI data.","背景：由東華三院為發展局營運，是學習及使用 CSDI 數據的社區空間。"],["How: it offers training, workshops and app competitions so the public and start-ups can build their own map apps.","做法：提供培訓、工作坊及應用程式比賽，讓市民及初創企業建立自己的地圖應用。"],["Use in answer: supports a {bottom-up|由下而上} approach, moving Hong Kong from 2.0 towards 3.0.","答題用法：支持由下而上的方式，推動香港由 2.0 邁向 3.0。"]]},{"x":9,"n":"URA URIS & Sham Shui Po district planning","en":"URA's GIS-based Urban Renewal Information System supports planning for old districts (SAG Award 2021). It is a direct GIS answer to ageing buildings.","zh":"市建局以 GIS 為本的市區更新資訊系統支援舊區規劃（2021 年 GIS 特別成就獎），是用 GIS 處理樓宇老化的直接例子。","src":"L1 slide 61","q":2,"pl":[["Hong Kong","香港"],["Sham Shui Po","深水埗"]],"refs":[["L1",61]],"d":[["Background: the Urban Renewal Authority built the Urban Renewal Information System (URIS) on GIS; it won a SAG Award in 2021.","背景：市區重建局以 GIS 建立「市區更新資訊系統」（URIS），於 2021 年獲得 SAG 獎。"],["How: it brings building age, condition, land use and population data together on one map to plan renewal of old districts such as Sham Shui Po.","做法：把樓齡、樓宇狀況、土地用途及人口數據整合在同一地圖上，規劃深水埗等舊區的更新。"],["Use in answer: the strongest slide-based answer for \"ageing buildings\" – GIS helps decide where to redevelop first.","答題用法：回答「樓宇老化」最有力的投影片例子——GIS 幫助決定優先重建的地點。"]]},{"x":10,"n":"Mandatory Building Inspection Scheme","en":"The Buildings Department requires owners of private buildings aged 30+ to inspect and repair them. GIS can map which buildings are due.","zh":"屋宇署要求 30 年或以上樓齡的私人樓宇業主進行檢驗和維修，GIS 可標示哪些樓宇需要檢驗。","src":"outside the slides","q":2,"pl":[["Hong Kong","香港"]],"refs":[],"d":[["Background: run by the Buildings Department since 2012; owners of private buildings aged 30 years or more must inspect and repair them.","背景：屋宇署自 2012 年推行；樓齡 30 年或以上的私人樓宇業主須驗樓及維修。"],["GIS idea: map every building by age and inspection status, so officers can see clusters of overdue buildings.","GIS 構想：按樓齡及驗樓狀況把所有樓宇繪成地圖，讓職員看到逾期樓宇集中的地方。"],["Use in answer: an extra (outside-slide) example after URIS, showing how GIS supports a real policy on ageing buildings.","答題用法：在 URIS 之後的補充例子（講課以外），說明 GIS 如何支援處理樓宇老化的實際政策。"]]},{"x":11,"n":"Lift Modernisation Subsidy Scheme","en":"A government subsidy scheme (from 2019) for upgrading old lifts. Mapping lift ages helps target subsidies.","zh":"政府資助更新舊升降機的計劃（2019 年起），繪製升降機樓齡地圖有助精準分配資助。","src":"outside the slides","q":2,"pl":[["Hong Kong","香港"]],"refs":[],"d":[["Background: a government subsidy scheme from 2019 to help owners upgrade old lifts with modern safety devices.","背景：政府由 2019 年起推出的資助計劃，協助業主為舊升降機加裝現代安全裝置。"],["GIS idea: overlay lift age with the number of elderly residents to give subsidies first where risk is highest.","GIS 構想：把升降機機齡與長者住戶數目疊加，優先資助風險最高的地方。"],["Use in answer: links \"ageing lifts\" with \"ageing population\" – a good way to show joined-up thinking.","答題用法：把「升降機老化」與「人口老化」連結起來——能展示全面思考。"]]},{"x":12,"n":"Census elderly map (application idea)","en":"Overlay C&SD census data on 65+ residents with elderly centres and clinics on CSDI to find areas lacking services.","zh":"把政府統計處 65 歲以上人口普查數據與 CSDI 上的長者中心及診所疊加，找出服務不足的地區。","src":"L3 slide 80 (CSDI data)","q":2,"pl":[["Hong Kong","香港"]],"refs":[["L3",80]],"d":[["Data: C&SD census data give the number of residents aged 65+ in each small area; CSDI has locations of elderly centres and clinics.","數據：統計處人口普查提供各小區 65 歲以上居民人數；CSDI 有長者中心及診所的位置。"],["How: buffer each service (e.g., 500 m walking distance) and overlay it on the elderly population map to find gaps.","做法：為每項服務建立緩衝區（例如步行 500 米範圍），再疊加長者人口地圖，找出服務不足之處。"],["Use in answer: a simple GIS method for \"ageing population\" that you can describe step by step.","答題用法：針對「人口老化」的簡單 GIS 方法，可逐步描述。"]]},{"x":13,"n":"Kat O illegal fishing patrol","en":"AFCD drones with a pre-trained AI model flag illegal fishing in a remote marine area.","zh":"漁護署以無人機配合預先訓練的 AI 模型，在偏遠海域標示非法捕魚。","src":"L5 slide 69","q":3,"pl":[["Hong Kong","香港"],["Kat O","吉澳"]],"refs":[["L5",69]],"d":[["Who: AFCD (Agriculture, Fisheries and Conservation Department) in the remote Kat O marine area.","誰：漁農自然護理署，在偏遠的吉澳海域。"],["How: drones fly regular patrols; a pre-trained AI model checks the video and flags suspected illegal fishing boats for officers.","做法：無人機定期巡邏；預先訓練的 AI 模型分析影片，標示懷疑非法捕魚的船隻給職員跟進。"],["Use in answer: application scenario \"government inspection / law enforcement\" in the low-altitude economy.","答題用法：低空經濟中的「政府巡查／執法」應用場景。"]]},{"x":14,"n":"EPD air-sensor delivery","en":"A drone carries calibration devices about 560 m in under 3 minutes. GIS plans the route to avoid crowded areas.","zh":"無人機運送校準裝置約 560 米、少於 3 分鐘，以 GIS 規劃航線避開人多地方。","src":"L5 slide 71","q":3,"pl":[["Hong Kong","香港"]],"refs":[["L5",71]],"d":[["Who: the Environmental Protection Department, in a drone trial.","誰：環境保護署的無人機試驗。"],["How: a drone carried calibration devices about 560 m in under 3 minutes; GIS planned the flight route to avoid crowded areas.","做法：無人機在 3 分鐘內把校準儀器運送約 560 米；GIS 規劃航線以避開人多的地方。"],["Use in answer: scenario \"logistics / delivery\" and shows why GIS is needed for safe flight paths.","答題用法：「物流／運送」場景，並說明安全航線為何需要 GIS。"]]},{"x":15,"n":"EHang EH216-S","en":"The world's first certified eVTOL with commercial ticketed flights, on routes in Guangzhou and Hefei.","zh":"全球首款獲認證並提供商業售票飛行的 eVTOL，在廣州及合肥營運。","src":"L5 slide 52","q":3,"pl":[["Mainland China","中國內地"],["Guangzhou","廣州"],["Hefei","合肥"]],"refs":[["L5",52]],"d":[["What: a pilotless passenger {eVTOL|電動垂直升降飛行器} made by EHang in Guangzhou; it received full certification in China.","是甚麼：億航在廣州製造的無人駕駛載人電動垂直升降飛行器，已在中國取得完整認證。"],["Use: commercial ticketed sightseeing flights on routes in Guangzhou and Hefei.","用途：在廣州及合肥的航線上提供商業售票觀光飛行。"],["Use in answer: shows the \"manned (passenger) aviation\" sector and the scenario \"urban air mobility / tourism\".","答題用法：展示「載人航空」範疇，以及「城市空中交通／旅遊」場景。"]]},{"x":16,"n":"Meituan drone food delivery (Shenzhen)","en":"Drones deliver food orders to pick-up points in Shenzhen, a daily-life use of the LAE.","zh":"無人機把外賣送到深圳的取餐點，是低空經濟的日常應用。","src":"outside the slides","q":3,"pl":[["Shenzhen","深圳"],["Mainland China","中國內地"]],"refs":[],"d":[["Who: Meituan, a large food-delivery company in Mainland China.","誰：美團，中國內地大型外賣平台。"],["How: drones fly food orders from restaurants to pick-up points or cabinets near offices and parks in Shenzhen.","做法：無人機把外賣從餐廳送到深圳辦公室及公園附近的取餐點或取餐櫃。"],["Use in answer: shows the \"unmanned (drone)\" sector in daily life – an outside-slide extra example.","答題用法：展示日常生活中的「無人駕駛（無人機）」範疇——講課以外的補充例子。"]]},{"x":17,"n":"GeoAI finds a missing hiker","en":"Drone images plus AI helped spot a missing hiker in HK (FSD), an emergency rescue scenario.","zh":"無人機影像加 AI 協助在香港尋找失蹤行山人士（消防處），屬緊急救援場景。","src":"L1 slide 65","q":3,"pl":[["Hong Kong","香港"]],"refs":[["L1",65]],"d":[["Who: the Fire Services Department (FSD) in a mountain search in Hong Kong.","誰：消防處在香港山野進行搜索。"],["How: drones take many images of the hillside; AI (GeoAI) scans them quickly to find a person, faster than people checking every image.","做法：無人機拍攝大量山坡影像；AI（GeoAI）快速掃描找出人影，比人手逐張檢查更快。"],["Use in answer: scenario \"emergency rescue\" – drones + AI + location save lives.","答題用法：「緊急救援」場景——無人機 + AI + 位置可拯救生命。"]]},{"x":18,"n":"DATA.GOV.HK","en":"5,700+ datasets, 2,500+ with API, 85B+ downloads in 2025. The APIs make the data machine processable.","zh":"5,700 多個數據集、2,500 多個提供 API、2025 年下載 850 億次以上；API 令數據可由機器處理。","src":"L1 slide 72","q":4,"pl":[["Hong Kong","香港"]],"refs":[["L1",72]],"d":[["What: Hong Kong's public sector information portal, run by the Digital Policy Office.","是甚麼：香港公共資料入口網站，由數字政策辦公室營運。"],["Numbers: 5,700+ datasets, 2,500+ with an API, and 85B+ downloads in 2025.","數字：5,700 多個數據集，2,500 多個提供 API，2025 年下載量超過 850 億次。"],["Use in answer: principles \"machine processable\" (APIs, CSV, JSON) and \"accessible\" (free online for anyone).","答題用法：原則「可機器處理」（API、CSV、JSON）及「可存取」（任何人可免費在網上取得）。"]]},{"x":19,"n":"3D Digital Map (CSDI)","en":"Covers the whole territory since 27 Mar 2025 and is free, which shows the \"complete\" and \"licence-free\" principles.","zh":"2025 年 3 月 27 日起覆蓋全港並免費提供，體現「完整」及「免授權」原則。","src":"L3 slide 83","q":4,"pl":[["Hong Kong","香港"]],"refs":[["L3",83]],"d":[["What: LandsD's 3D map of buildings, terrain and infrastructure, covering the whole territory since 27 March 2025.","是甚麼：地政總署的三維地圖，涵蓋建築物、地形及基建，自 2025 年 3 月 27 日起覆蓋全港。"],["How: free to download and use on the CSDI Portal.","做法：可在 CSDI 地理空間數據共享平台免費下載及使用。"],["Use in answer: principles \"complete\" (whole territory) and \"licence-free\" (no fee, open use).","答題用法：原則「完整」（覆蓋全港）及「無需許可」（免費、開放使用）。"]]},{"x":20,"n":"US Data.gov","en":"190,000+ datasets with free public access, which shows the \"accessible\" principle.","zh":"190,000 多個數據集免費公開，體現「可存取」原則。","src":"L2 slide 18","q":4,"pl":[["United States (USA)","美國"]],"refs":[["L2",18]],"d":[["What: the United States government's open data portal, launched in 2009.","是甚麼：美國政府的開放數據入口網站，於 2009 年推出。"],["Numbers: 190,000+ datasets from federal agencies, free for anyone.","數字：來自聯邦機構的 19 萬多個數據集，任何人可免費使用。"],["Use in answer: principle \"accessible\" – available to the widest range of users for the widest range of purposes.","答題用法：原則「可存取」——讓最多的使用者作最廣泛的用途。"]]},{"x":21,"n":"Sweden real-time transport data","en":"Free, but users must subscribe or register, so it does not fully meet \"non-discriminatory\" (your notes: this principle is not compulsory).","zh":"免費但須訂閱登記，未完全符合「無歧視」原則（筆記：此原則並非強制）。","src":"L2 slide 20","q":4,"pl":[["Sweden","瑞典"]],"refs":[["L2",20]],"d":[["What: Swedish public transport real-time data, given free.","是甚麼：瑞典公共交通實時數據，免費提供。"],["Catch: users must subscribe or register to get an API key.","限制：使用者須訂閱或登記才能取得 API 金鑰。"],["Use in answer: a counter-example – it is not fully \"non-discriminatory\", but your notes say this principle is not compulsory.","答題用法：反例——它並非完全「無歧視」，但你的筆記指出此原則並非必須。"]]},{"x":22,"n":"CityMapper / HKeMobility (individuals)","en":"Real-time transport apps built on operators' open data help people choose the fastest route.","zh":"以交通營辦商開放數據建立的實時交通應用程式，幫助市民選最快路線。","src":"L2 slide 24; HKeMobility outside the slides","q":5,"pl":[["London","倫敦"],["United Kingdom (UK)","英國"],["Hong Kong","香港"]],"refs":[["L2",24]],"d":[["What: CityMapper (a London-born journey app) and HKeMobility (Transport Department app) use transport operators' open data.","是甚麼：Citymapper（源自倫敦的出行程式）及「香港出行易」（運輸署程式）使用交通營運商的開放數據。"],["How: they combine bus, MTR and traffic data to plan the fastest route and show real-time arrivals.","做法：結合巴士、港鐵及交通數據，規劃最快路線並顯示實時到站時間。"],["Use in answer: advantage for individuals – better daily decisions and saved time.","答題用法：對個人的好處——作出更好的日常決定並節省時間。"]]},{"x":23,"n":"Florida restaurant inspection app (business)","en":"Developers turned government inspection results into an app that earns money from advertising.","zh":"開發者把政府巡查結果製成應用程式，並以廣告賺錢。","src":"L2 slide 25","q":5,"pl":[["Florida","佛羅里達州"],["United States (USA)","美國"]],"refs":[["L2",25]],"d":[["What: in Florida, USA, government restaurant inspection results were released as open data.","是甚麼：美國佛羅里達州政府把餐廳衞生巡查結果以開放數據發布。"],["How: developers built an app showing the results; the app earns money from advertising.","做法：開發者製作程式顯示結果，並透過廣告賺錢。"],["Use in answer: advantage for businesses – new products and income from free data.","答題用法：對企業的好處——利用免費數據開發新產品及收入。"]]},{"x":24,"n":"Ireland GeoHive (government)","en":"Open data saves the public sector about $92m a year and frees time worth about $316m.","zh":"開放數據每年為公營部門節省約 9,200 萬美元，騰出的時間價值約 3.16 億美元。","src":"L3 slide 53","q":5,"pl":[["Ireland","愛爾蘭"]],"refs":[["L3",53]],"d":[["What: Ireland's national geospatial data hub, run by Tailte Éireann (formerly Ordnance Survey Ireland).","是甚麼：愛爾蘭國家地理空間數據中心，由 Tailte Éireann（前愛爾蘭地形測量局）營運。"],["Value: open data saves the public sector about $92m a year and frees staff time worth about $316m.","價值：開放數據每年為公營部門節省約 9,200 萬美元，並騰出價值約 3.16 億美元的人手時間。"],["Use in answer: advantage for government – lower cost and more efficient work.","答題用法：對政府的好處——降低成本、提升效率。"]]},{"x":25,"n":"EU value (economy)","en":"Open data market €184.45bn (2019), 1.09 million jobs, and 54–202 thousand lives saved through faster emergency response.","zh":"開放數據市場 1,844.5 億歐元（2019）、109 萬職位，更快的緊急應變可拯救 5.4–20.2 萬條生命。","src":"L2 slide 14","q":5,"pl":[["European Union (Europe)","歐盟（歐洲）"]],"refs":[["L2",14]],"d":[["Source: European Data Portal study of open data value in the EU.","來源：歐洲數據入口網站對歐盟開放數據價值的研究。"],["Numbers: market size €184.45bn (2019), 1.09 million jobs, and 54–202 thousand lives saved through faster emergency response.","數字：市場規模 1,844.5 億歐元（2019），109 萬個職位，並因緊急應變更快而拯救 5.4 萬至 20.2 萬條生命。"],["Use in answer: shows the big-picture economic and social value – good as a closing point.","答題用法：展示宏觀的經濟及社會價值——適合作為總結。"]]},{"x":26,"n":"HK COVID-19 dashboard","en":"Showed buildings with cases, not patients' names. Grouping the data at building level protected privacy while still informing the public.","zh":"只顯示有個案的大廈而非病人姓名，以大廈層面匯總，既保障私隱又能通知公眾。","src":"L6 slide 71","q":6,"pl":[["Hong Kong","香港"]],"refs":[["L6",71]],"d":[["What: the GIS dashboard showing buildings with confirmed cases (2020–2022).","是甚麼：顯示有確診個案大廈的 GIS 儀表板（2020–2022）。"],["How it protected privacy: it showed the building, not the patient's name, age or flat number – data {aggregated|匯總} at building level.","如何保障私隱：只顯示大廈，不顯示病人姓名、年齡或單位——數據以大廈為單位匯總。"],["Use in answer: solution to privacy – aggregate or {anonymise|匿名化} data before opening it.","答題用法：私隱問題的解決方法——開放前先匯總或匿名化數據。"]]},{"x":27,"n":"Personal Data (Privacy) Ordinance, Cap. 486","en":"Hong Kong's privacy law. Any open data with personal information must follow it (\"according to laws!!!\" in your notes).","zh":"香港的私隱法例；含個人資料的開放數據必須遵守（筆記：「必須依法！」）。","src":"outside the slides","q":6,"pl":[["Hong Kong","香港"]],"refs":[],"d":[["What: Hong Kong's main privacy law (1995), enforced by the Privacy Commissioner for Personal Data (PCPD).","是甚麼：香港主要私隱法例（1995 年），由個人資料私隱專員公署執行。"],["Key idea: six Data Protection Principles, e.g., collect only what is needed and use data only for its stated purpose.","重點：六項保障資料原則，例如只收集所需資料，並只作原定用途。"],["Use in answer: solution to privacy – follow the law (\"according to laws!!!\" in your notes).","答題用法：私隱問題的解決方法——依法處理（筆記中的 \"according to laws!!!\"）。"]]},{"x":28,"n":"Singapore telco data","en":"Singtel, StarHub and M1 aggregate data to predict commuting patterns without naming individuals.","zh":"新加坡電信、星和、M1 匯總數據預測通勤模式，不會識別個人。","src":"L2 slide 29","q":6,"pl":[["Singapore","新加坡"]],"refs":[["L2",29]],"d":[["Who: Singtel, StarHub and M1, Singapore's mobile operators.","誰：新加坡流動網絡營辦商 Singtel、StarHub 及 M1。"],["How: phone location data are combined into totals for areas and times, then used to predict commuting patterns.","做法：把手機位置數據合併成不同地區及時段的總數，用來預測通勤模式。"],["Use in answer: aggregation solves privacy – no single person can be identified.","答題用法：匯總數據可解決私隱問題——無法識別任何個人。"]]},{"x":29,"n":"Google Maps traffic","en":"Congestion is calculated from many phones in one place. Location data is used in aggregate.","zh":"從同一地點的大量手機計算塞車情況，位置數據以匯總方式使用。","src":"L2 slide 26 (your notes)","q":6,"pl":[["Global","全球"]],"refs":[["L2",26]],"d":[["What: the red/orange/green traffic layer in Google Maps.","是甚麼：Google 地圖中紅／橙／綠色的交通圖層。"],["How: it calculates speed from many phones on the same road at the same time.","做法：根據同一時間同一條路上大量手機計算車速。"],["Use in answer: everyday example of aggregate location data that informs the public without exposing individuals.","答題用法：日常例子——匯總位置數據既能告知公眾，又不暴露個人資料。"]]},{"x":30,"n":"KMB / Citybus real-time arrival data","en":"Private bus companies release estimated arrival times through DATA.GOV.HK, which shows private firms can open data and gain happier passengers.","zh":"私營巴士公司透過資料一線通發放到站時間，顯示私營機構開放數據可提升乘客滿意度。","src":"outside the slides","q":7,"pl":[["Hong Kong","香港"]],"refs":[],"d":[["What: private bus companies KMB and Citybus release estimated arrival times (ETA) through DATA.GOV.HK.","是甚麼：私營巴士公司九巴及城巴透過 DATA.GOV.HK 發布預計到站時間。"],["Result: many apps use the data, passengers wait less and are happier with the service.","結果：很多程式使用這些數據，乘客等候時間減少，對服務更滿意。"],["Use in answer: method \"show the benefits\" – opening data can improve a company's image and service.","答題用法：方法「展示好處」——開放數據可改善公司形象及服務。"]]},{"x":31,"n":"Singapore telcos","en":"Shared only aggregated phone data, which removed privacy worries for the companies.","zh":"只分享匯總手機數據，消除公司的私隱顧慮。","src":"L2 slide 29","q":7,"pl":[["Singapore","新加坡"]],"refs":[["L2",29]],"d":[["Who: Singtel, StarHub and M1.","誰：Singtel、StarHub 及 M1。"],["How: they shared only aggregated data, never individual records.","做法：只分享匯總數據，從不分享個人紀錄。"],["Use in answer: method \"reduce the risk\" – aggregation removes privacy and legal worries for companies.","答題用法：方法「降低風險」——匯總數據消除公司對私隱及法律的顧慮。"]]},{"x":32,"n":"New York Open Data Law (2012) / Australia CDR (2018)","en":"Laws and rights that require or encourage data sharing.","zh":"要求或鼓勵數據共享的法例和權利。","src":"L2 slides 32–33","q":7,"pl":[["New York","紐約"],["United States (USA)","美國"],["Australia","澳洲"]],"refs":[["L2",32],["L2",33]],"d":[["What: New York City's Open Data Law (2012) requires agencies to publish data; Australia's Consumer Data Right (2018) lets consumers ask firms to share their data.","是甚麼：紐約市《開放數據法》（2012）要求部門公開數據；澳洲「消費者數據權」（2018）讓消費者要求企業分享其數據。"],["How: law and rights create a clear duty or incentive to share.","做法：法律及權利訂立清晰的分享責任或誘因。"],["Use in answer: method \"legislation / policy\" to require or encourage data sharing.","答題用法：方法「立法／政策」要求或鼓勵分享數據。"]]},{"x":33,"n":"Esri Startup Program / GeoLab","en":"Free tools, training and platforms lower the cost for companies to use and share data.","zh":"免費工具、培訓及平台降低企業使用和分享數據的成本。","src":"L1 slides 65, 78","q":7,"pl":[["Hong Kong","香港"]],"refs":[["L1",65],["L1",78]],"d":[["What: Esri's Startup Program gives young companies free GIS software and training; GeoLab gives free CSDI training in HK.","是甚麼：Esri 初創計劃為初創企業提供免費 GIS 軟件及培訓；GeoLab 在香港提供免費 CSDI 培訓。"],["How: lower cost and skills barriers so companies can use and share data.","做法：降低成本及技術門檻，讓企業能使用及分享數據。"],["Use in answer: method \"support / incentives\" – free tools and platforms.","答題用法：方法「支援／誘因」——免費工具及平台。"]]},{"x":34,"n":"HK CSDI – four pillars","en":"Policy: DEVB leads under the Smart City Blueprint. Standards: agreed data standards. Technology: CSDI Portal (1,200+ datasets). People & sharing: 71+ departments and GeoLab.","zh":"政策：發展局在智慧城市藍圖下主導；標準：協定數據標準；技術：CSDI 平台（1,200 多個數據集）；人及共享：71 個以上部門及地理空間實驗室。","src":"L3 slides 43, 80–81","q":8,"pl":[["Hong Kong","香港"]],"refs":[["L3",43],["L3",80],["L3",81]],"d":[["Policy & institution: DEVB leads CSDI under the Smart City Blueprint.","政策及機構：發展局按智慧城市藍圖牽頭推動 CSDI。"],["Standards & technology: agreed data standards; the CSDI Portal shares 1,200+ datasets.","標準及技術：統一數據標準；CSDI 平台分享 1,200 多個數據集。"],["People & sharing: 71+ departments share data, and GeoLab trains users – a complete example of all four pillars.","人員及分享：71 個以上部門分享數據，GeoLab 培訓使用者——完整展示四大支柱。"]]},{"x":35,"n":"EU INSPIRE Directive (2007)","en":"A law that makes EU member states share spatial data to common standards – the policy pillar.","zh":"要求歐盟成員國以共同標準分享空間數據的法規——政策支柱。","src":"L3 slide 50","q":8,"pl":[["European Union (Europe)","歐盟（歐洲）"]],"refs":[["L3",50]],"d":[["What: an EU law (2007) that makes member states share spatial data on 34 themes.","是甚麼：歐盟法例（2007），要求成員國分享 34 個主題的空間數據。"],["How: data must follow common standards and be published through national portals.","做法：數據須遵從統一標準，並透過各國平台發布。"],["Use in answer: the \"policy / legal framework\" pillar.","答題用法：「政策／法律框架」支柱。"]]},{"x":36,"n":"UK Geospatial Commission (2017)","en":"An institution set up to manage geospatial data; adopted the UN IGIF in its 2020–2025 strategy.","zh":"負責管理地理空間數據的機構，在 2020–2025 策略中採用聯合國 IGIF。","src":"L3 slides 42, 47","q":8,"pl":[["United Kingdom (UK)","英國"]],"refs":[["L3",42],["L3",47]],"d":[["What: a UK government body set up in 2017 to coordinate geospatial data.","是甚麼：英國政府於 2017 年成立的機構，統籌地理空間數據。"],["How: its 2020–2025 strategy follows the UN {IGIF|綜合地理空間資訊框架}.","做法：其 2020–2025 年策略依循聯合國綜合地理空間資訊框架。"],["Use in answer: the \"institution / governance\" pillar.","答題用法：「機構／管治」支柱。"]]},{"x":37,"n":"US FGDC (1990)","en":"Set data formats so everyone can share and use data – the standards pillar.","zh":"制定數據格式，讓所有人都能分享和使用數據——標準支柱。","src":"L3 slides 39, 47","q":8,"pl":[["United States (USA)","美國"]],"refs":[["L3",39],["L3",47]],"d":[["What: the Federal Geographic Data Committee, set up in 1990 in the USA.","是甚麼：美國聯邦地理數據委員會，於 1990 年成立。"],["How: it sets metadata and data format standards so agencies can share data.","做法：制定元數據及數據格式標準，讓各部門可分享數據。"],["Use in answer: the \"standards\" pillar.","答題用法：「標準」支柱。"]]},{"x":38,"n":"3D Pedestrian Network","en":"Built from CSDI data. It gives shortest, rain-covered and wheelchair-friendly routes, a service for citizens.","zh":"以 CSDI 數據建立，提供最短、有上蓋及輪椅友善路線，服務市民。","src":"L3 slide 82","q":9,"pl":[["Hong Kong","香港"]],"refs":[["L3",82]],"d":[["What: a 3D walking network of footbridges, subways, lifts and covered walkways in HK, built from CSDI data.","是甚麼：以 CSDI 數據建立的香港三維行人網絡，包括天橋、隧道、升降機及有蓋行人路。"],["How: apps can give the shortest, rain-covered or wheelchair-friendly route.","做法：程式可提供最短、有蓋或適合輪椅的路線。"],["Use in answer: reason \"better services for citizens\" (inclusive city).","答題用法：理由「為市民提供更好服務」（共融城市）。"]]},{"x":39,"n":"UK OS MasterMap release","en":"Free data through an API, estimated to add at least £130m a year to the economy.","zh":"透過 API 免費公開數據，估計每年為經濟帶來至少 1.3 億英鎊。","src":"L3 slide 48","q":9,"pl":[["United Kingdom (UK)","英國"]],"refs":[["L3",48]],"d":[["What: Ordnance Survey made parts of its detailed MasterMap data free through an API.","是甚麼：英國地形測量局透過 API 免費開放部分 MasterMap 詳細數據。"],["Value: estimated to add at least £130m a year to the UK economy.","價值：估計每年為英國經濟帶來至少 1.3 億英鎊。"],["Use in answer: reason \"economic value / innovation\".","答題用法：理由「經濟價值／創新」。"]]},{"x":40,"n":"HK COP for emergencies","en":"20 departments (HyD, DSD, FSD, HKO…) share incidents on one web map for faster decisions.","zh":"20 個部門在同一網上地圖共享事故，加快決策。","src":"L3 slide 90","q":9,"pl":[["Hong Kong","香港"]],"refs":[["L3",90]],"d":[["What: a Common Operational Picture shared by 20 departments such as HyD, DSD, FSD and HKO.","是甚麼：由路政署、渠務署、消防處、天文台等 20 個部門共用的共同運作圖像。"],["How: all incidents appear on one web map, so departments see the same picture at the same time.","做法：所有事故顯示在同一網上地圖，各部門同時看到相同情況。"],["Use in answer: reason \"better decisions and coordination\".","答題用法：理由「更好的決策及協調」。"]]},{"x":41,"n":"Singapore OneMap","en":"One government map system that private companies also use to build services, which avoids duplication.","zh":"單一政府地圖系統，私營機構亦用來開發服務，避免重複。","src":"L3 slide 51","q":9,"pl":[["Singapore","新加坡"]],"refs":[["L3",51]],"d":[["What: Singapore's authoritative national map, run by the Singapore Land Authority.","是甚麼：新加坡權威國家地圖，由新加坡土地管理局營運。"],["How: agencies and private companies use the same base map and APIs instead of each making their own.","做法：政府部門及私營公司使用同一底圖及 API，而非各自製作。"],["Use in answer: reason \"avoid duplication and save cost\".","答題用法：理由「避免重複、節省成本」。"]]},{"x":42,"n":"Boston Marathon","en":"An online operations dashboard (COP) for public safety and security during a large event.","zh":"大型活動期間用於公共安全及保安的網上運作儀表板（COP）。","src":"L3 slide 67","q":10,"pl":[["Boston","波士頓"],["United States (USA)","美國"]],"refs":[["L3",67]],"d":[["What: a COP operations dashboard for the Boston Marathon, a huge race with crowds along the route.","是甚麼：波士頓馬拉松的 COP 運作儀表板，賽道沿途人潮眾多。"],["How: police, medical and event teams watched runners, crowds, incidents and resources on one live map.","做法：警方、醫療及活動團隊在同一實時地圖上監察跑手、人群、事故及資源。"],["Use in answer: COP for \"public safety at a large event\".","答題用法：COP 用於「大型活動的公眾安全」。"]]},{"x":43,"n":"Kumamoto Earthquake 2016","en":"A COP and dashboards tracked damage estimation, rescue management and recovery progress.","zh":"以 COP 和儀表板追蹤損毀估算、救援管理及復原進度。","src":"L3 slide 71","q":10,"pl":[["Kumamoto","熊本"],["Japan","日本"]],"refs":[["L3",71]],"d":[["What: a strong earthquake in Kumamoto, Japan, in April 2016.","是甚麼：2016 年 4 月日本熊本發生的強烈地震。"],["How: COP dashboards tracked damage estimates, rescue teams, shelters and recovery progress.","做法：COP 儀表板追蹤損毀估算、救援隊、避難所及復原進度。"],["Use in answer: COP for \"disaster response and recovery\".","答題用法：COP 用於「災害應變及復原」。"]]},{"x":44,"n":"HK COP (20 departments)","en":"All reported incidents shown in a single web map to improve emergency planning and resource allocation.","zh":"所有事故在單一網上地圖顯示，改善應急規劃和資源調配。","src":"L3 slide 90","q":10,"pl":[["Hong Kong","香港"]],"refs":[["L3",90]],"d":[["What: Hong Kong's cross-department COP web map.","是甚麼：香港跨部門 COP 網上地圖。"],["How: reported incidents (flooding, fallen trees, landslides) are shown in one place for planning and resource allocation.","做法：把報告的事故（水浸、塌樹、山泥傾瀉）集中顯示，以便規劃及調配資源。"],["Use in answer: the local example – one map, many departments, faster decisions.","答題用法：本地例子——一張地圖、多個部門、更快決策。"]]},{"x":45,"n":"CEDD COP","en":"Improves emergency readiness – useful in events like the 2023 \"once-in-500-years\" rainstorm or Super Typhoon Mangkhut (2018).","zh":"提升應急準備——適用於 2023 年「五百年一遇」暴雨或 2018 年超強颱風山竹等事件。","src":"L1 slides 14, 24","q":10,"pl":[["Hong Kong","香港"]],"refs":[["L1",14],["L1",24]],"d":[["What: the Civil Engineering and Development Department's COP for slopes and emergencies.","是甚麼：土木工程拓展署用於斜坡及緊急情況的 COP。"],["When useful: events like the September 2023 \"once-in-500-years\" rainstorm or Super Typhoon Mangkhut (2018).","適用情況：例如 2023 年 9 月「五百年一遇」暴雨或 2018 年超強颱風山竹。"],["Use in answer: COP improves emergency readiness – shows landslide reports and rainfall together.","答題用法：COP 提升緊急應變能力——同時顯示山泥傾瀉報告及雨量。"]]},{"x":46,"n":"Clean Streets Index","en":"22,000 miles scored 1–3 every quarter; used to prioritise cleaning, stop illegal dumping and place 5,000 bins.","zh":"每季為 22,000 英里街道評 1–3 分，用來排列清潔次序、防止非法棄置及放置 5,000 個垃圾桶。","src":"L3 slide 60; L6 slide 54","q":11,"pl":[["Los Angeles","洛杉磯"],["United States (USA)","美國"]],"refs":[["L3",60],["L6",54]],"d":[["What: Los Angeles scores every street segment (about 22,000 miles) from 1 to 3 every quarter.","是甚麼：洛杉磯每季為所有街段（約 22,000 英里）由 1 至 3 評分。"],["How: the scores are mapped on GeoHub to decide where to clean first, stop illegal dumping and place 5,000 new bins.","做法：評分在 GeoHub 上繪成地圖，以決定優先清潔地點、打擊非法棄置及擺放 5,000 個新垃圾桶。"],["Use in answer: GeoHub application for \"city cleanliness\" – data-driven decisions.","答題用法：GeoHub 應用於「城市清潔」——以數據作決策。"]]},{"x":47,"n":"Road to 2400","en":"Tracks repaving of 2,400 lane miles; the goal was reached ahead of schedule and under budget.","zh":"追蹤 2,400 車道英里的重鋪工程，提前並以低於預算完成。","src":"L3 slide 61; L6 slide 55","q":11,"pl":[["Los Angeles","洛杉磯"],["United States (USA)","美國"]],"refs":[["L3",61],["L6",55]],"d":[["What: a programme to repave 2,400 lane miles of roads in Los Angeles.","是甚麼：洛杉磯重鋪 2,400 條行車線英里道路的計劃。"],["How: GeoHub maps and dashboards tracked progress; the goal was met ahead of schedule and under budget.","做法：GeoHub 地圖及儀表板追蹤進度；目標提前及低於預算完成。"],["Use in answer: GeoHub application for \"infrastructure maintenance\" and public transparency.","答題用法：GeoHub 應用於「基建維修」及向公眾展示透明度。"]]},{"x":48,"n":"Street Wize","en":"Maps street works and permits (e.g., 65 projects within 0.5 mile) to reduce traffic disruption.","zh":"顯示道路工程和許可證（例如 0.5 英里內 65 個項目），減少交通影響。","src":"L3 slide 62; L6 slide 53","q":11,"pl":[["Los Angeles","洛杉磯"],["United States (USA)","美國"]],"refs":[["L3",62],["L6",53]],"d":[["What: a Los Angeles map of street works and permits.","是甚麼：洛杉磯道路工程及許可證地圖。"],["How: planners can see, for example, 65 projects within 0.5 mile and coordinate them so roads are not dug up again and again.","做法：規劃人員可看到例如 0.5 英里內有 65 個工程，並協調安排，避免道路被重複挖掘。"],["Use in answer: GeoHub application for \"reducing traffic disruption\".","答題用法：GeoHub 應用於「減少交通阻塞」。"]]},{"x":49,"n":"Vision Zero","en":"Open location data on road collisions to reduce severe injuries and deaths.","zh":"開放道路碰撞位置數據，減少重傷和死亡。","src":"L6 slide 56","q":11,"pl":[["Los Angeles","洛杉磯"],["United States (USA)","美國"]],"refs":[["L6",56]],"d":[["What: a road-safety goal of zero traffic deaths; Los Angeles publishes collision locations as open data.","是甚麼：以零交通死亡為目標的道路安全計劃；洛杉磯把交通意外地點以開放數據公開。"],["How: hot-spot maps show the most dangerous streets, so the city can redesign them first.","做法：熱點地圖顯示最危險的街道，讓市政府優先重新設計。"],["Use in answer: GeoHub application for \"road safety\".","答題用法：GeoHub 應用於「道路安全」。"]]},{"x":50,"n":"HKeToll (all 4 layers)","en":"RFID tag (layer 1) → reader network (2) → toll calculation and accounts (3) → HKeToll app and website (4).","zh":"RFID 繳費貼（第 1 層）→ 讀取網絡（2）→ 收費計算及帳戶（3）→ 易通行應用程式及網站（4）。","src":"L4 slide 14","q":12,"pl":[["Hong Kong","香港"]],"refs":[["L4",14]],"d":[["Layer 1 (perception/sensing): the RFID toll tag on the car.","第一層（感知層）：車上的 RFID 繳費貼。"],["Layer 2 (network) and layer 3 (processing): readers on gantries send data through the network; the system calculates tolls and updates accounts.","第二層（網絡層）及第三層（處理層）：龍門架上的讀取器經網絡傳送數據；系統計算收費並更新帳戶。"],["Layer 4 (application): drivers check and pay in the HKeToll app or website – one example covering all four layers.","第四層（應用層）：司機在易通行程式或網站查看及繳費——一個例子涵蓋全部四層。"]]},{"x":51,"n":"Smart recycling fleet routing","en":"Fill-level sensors in cages → cloud analytics → alerts and smart routes for trucks.","zh":"回收籠容量感應器 → 雲端分析 → 提示及智能收集路線。","src":"L4 slide 30","q":12,"pl":[["Hong Kong","香港"]],"refs":[["L4",30]],"d":[["Layer 1: fill-level sensors inside recycling cages.","第一層：回收籠內的滿溢感應器。"],["Layer 2–3: data go to the cloud, where analytics decide which cages are nearly full.","第二至三層：數據傳到雲端，由分析決定哪些回收籠快滿。"],["Layer 4: alerts and smart routes for collection trucks – fewer wasted trips.","第四層：向收集車發出提示及智能路線——減少無謂行程。"]]},{"x":52,"n":"Smart Barrier on slopes","en":"Depth gauges, impact switches and cameras → base station → web platform and app alerts to the authority.","zh":"深度計、撞擊開關及攝影機 → 基站 → 網上平台及手機應用程式向當局發出警報。","src":"L4 slide 32","q":12,"pl":[["Hong Kong","香港"]],"refs":[["L4",32]],"d":[["Layer 1: depth gauges, impact switches and cameras on debris barriers.","第一層：防石屏障上的深度計、撞擊開關及攝影機。"],["Layer 2–3: data go through a base station to a web platform for processing.","第二至三層：數據經基站傳到網上平台處理。"],["Layer 4: app alerts to the authority when a landslide hits the barrier.","第四層：山泥衝擊屏障時以程式向當局發出警報。"]]},{"x":53,"n":"Multi-functional Smart Lampposts (HK)","en":"Lampposts with sensors (air quality, traffic), Wi-Fi and 5G – an IoT network in the street.","zh":"裝有感應器（空氣質素、交通）、Wi-Fi 及 5G 的燈柱——街道上的物聯網。","src":"outside the slides","q":12,"pl":[["Hong Kong","香港"]],"refs":[],"d":[["What: a government pilot (from 2019, e.g., Kwun Tong and Kai Tak) adding devices to street lampposts.","是甚麼：政府試驗計劃（2019 年起，例如觀塘及啟德）在街燈柱加裝裝置。"],["Devices: sensors for air quality, weather and traffic, plus Wi-Fi and 5G base stations.","裝置：空氣質素、天氣及交通感應器，以及 Wi-Fi 和 5G 基站。"],["Use in answer: a street-level IoT network (layers 1–2) feeding city applications; also raised public privacy concerns.","答題用法：街道層面的物聯網網絡（第一至二層）為城市應用提供數據；亦曾引起公眾私隱關注。"]]},{"x":54,"n":"Dense urban parking sensors → NB-IoT","en":"Mong Kok car parks need low latency and good urban coverage, and NB-IoT needs no gateway. Slide 19 lists smart parking and streetlights.","zh":"旺角停車場需要低延遲及良好市區覆蓋，NB-IoT 毋須閘道器；第 19 張列出智能泊車及路燈。","src":"L4 slides 19, 21 (applied)","q":13,"pl":[["Hong Kong","香港"],["Mong Kok","旺角"]],"refs":[["L4",19],["L4",21]],"d":[["Situation: car parks in busy districts like Mong Kok, with many sensors close together.","情況：旺角等繁忙地區的停車場，大量感應器集中一起。"],["Why NB-IoT: uses the mobile network (licensed spectrum), lower latency, good indoor coverage and no own gateway needed.","為何選 NB-IoT：使用流動網絡（持牌頻譜）、延遲較低、室內覆蓋好，毋須自設閘道。"],["Use in answer: aspect \"coverage / latency / infrastructure\".","答題用法：比較方面「覆蓋／延遲／基礎設施」。"]]},{"x":55,"n":"Smart water and gas meters → NB-IoT","en":"Many meters in buildings, with heavily shadowed environments covered.","zh":"大廈內大量水錶煤氣錶，訊號受阻環境亦能覆蓋。","src":"L4 slide 19","q":13,"pl":[["Hong Kong","香港"]],"refs":[["L4",19]],"d":[["Situation: thousands of meters inside buildings and basements.","情況：大廈內及地庫的數以千計水錶和煤氣錶。"],["Why NB-IoT: deep indoor penetration covers heavily shadowed places; the telecom operator manages the network.","為何選 NB-IoT：深入室內，能覆蓋訊號遮擋嚴重的地方；由電訊商管理網絡。"],["Use in answer: aspect \"coverage\" – NB-IoT is better indoors in cities.","答題用法：比較方面「覆蓋」——NB-IoT 在城市室內較佳。"]]},{"x":56,"n":"Remote slope or country park sensors → LoRa","en":"Rural areas, long battery life (up to 20 years), unlicensed spectrum, and one gateway covers many sensors.","zh":"郊區、電池壽命長（最長 20 年）、免牌照頻譜，一個閘道器覆蓋大量感應器。","src":"L4 slides 20–21 (applied)","q":13,"pl":[["Hong Kong","香港"]],"refs":[["L4",20],["L4",21]],"d":[["Situation: slopes and country parks far from buildings and power.","情況：遠離建築物及電源的斜坡和郊野公園。"],["Why LoRa: long range, very long battery life (up to about 20 years), free unlicensed spectrum, one gateway covers many sensors.","為何選 LoRa：距離長、電池壽命極長（最多約 20 年）、使用免費非持牌頻譜，一個閘道可覆蓋大量感應器。"],["Use in answer: aspects \"range / battery / cost / spectrum\".","答題用法：比較方面「距離／電池／成本／頻譜」。"]]},{"x":57,"n":"Farm sensors → LoRa","en":"Long range (up to 30 miles rural) and low cost, but less frequent data.","zh":"遠距離（郊區可達 30 英里）、低成本，但數據較少。","src":"L4 slide 20","q":13,"pl":[["Global","全球"]],"refs":[["L4",20]],"d":[["Situation: soil and weather sensors spread across large rural farms.","情況：分布於大片鄉郊農地的泥土及天氣感應器。"],["Why LoRa: range up to about 30 miles in rural areas and low cost; data only need to be sent a few times a day.","為何選 LoRa：鄉郊範圍可達約 30 英里，成本低；數據每天只需傳送數次。"],["Use in answer: aspect \"data rate / frequency\" – LoRa sends small, infrequent data.","答題用法：比較方面「數據率／頻率」——LoRa 傳送少量、不頻密的數據。"]]},{"x":58,"n":"Internet minute 2025 (Volume, Velocity)","en":"5.56B internet users; Siri answers 1M+ questions and YouTube has 3.47M views every minute.","zh":"全球 55.6 億上網人口；每分鐘 Siri 回答逾 100 萬條問題、YouTube 有 347 萬次觀看。","src":"L4 slide 38","q":14,"pl":[["Global","全球"]],"refs":[["L4",38]],"d":[["Numbers: 5.56 billion internet users; every minute Siri answers 1M+ questions and YouTube gets 3.47M views.","數字：55.6 億互聯網用戶；每分鐘 Siri 回答 100 萬多條問題，YouTube 有 347 萬次觀看。"],["Meaning: huge amounts of data (Volume) created very fast (Velocity).","意思：產生大量數據（數量）且速度極快（速度）。"],["Use in answer: one example for two Vs – Volume and Velocity.","答題用法：一個例子說明兩個 V——數量及速度。"]]},{"x":59,"n":"Transport Department CCTV (Variety)","en":"Video data updated every 0.1 minute, mixed with sensor and text data.","zh":"每 0.1 分鐘更新的影片數據，與感應器及文字數據混合。","src":"L5 slide 19","q":14,"pl":[["Hong Kong","香港"]],"refs":[["L5",19]],"d":[["What: traffic CCTV images from the Transport Department, updated about every 0.1 minute.","是甚麼：運輸署交通閉路電視影像，約每 0.1 分鐘更新。"],["Meaning: video is unstructured data, used together with sensor numbers and text reports.","意思：影片屬非結構化數據，與感應器數字及文字報告一起使用。"],["Use in answer: Variety – many data types and formats.","答題用法：多樣性——多種數據類型及格式。"]]},{"x":60,"n":"Crowdsourced data (Veracity)","en":"Navigation apps depend on the number of subscribers and are not comprehensive, so trustworthiness must be checked.","zh":"導航應用程式依賴用戶數目、數據不全面，須檢查可信度。","src":"L2 slide 28","q":14,"pl":[["Global","全球"]],"refs":[["L2",28]],"d":[["What: navigation apps that rely on users' phones to report traffic.","是甚麼：依賴用戶手機報告交通狀況的導航程式。"],["Problem: results depend on how many subscribers are on a road, so data may be incomplete or biased.","問題：結果取決於該路段有多少用戶，因此數據可能不完整或有偏差。"],["Use in answer: Veracity – we must check how trustworthy the data are.","答題用法：真實性——必須檢查數據的可信程度。"]]},{"x":61,"n":"Ebola map 1976–2014 (location)","en":"Mapping outbreaks shows spatial relationships – where disease occurs.","zh":"繪製疫情地圖顯示空間關係——疾病在哪裡出現。","src":"L4 slide 48","q":14,"pl":[["West Africa","西非"]],"refs":[["L4",48]],"d":[["What: a map of Ebola outbreaks in Africa from 1976 to 2014.","是甚麼：1976 至 2014 年非洲伊波拉疫情爆發地圖。"],["How: plotting cases by location shows clusters and spread patterns that a table cannot show.","做法：按位置標示個案，可顯示表格看不到的聚集及擴散模式。"],["Use in answer: how location (GIS) adds Value to big data – it reveals spatial relationships.","答題用法：位置（GIS）如何為大數據增值——揭示空間關係。"]]},{"x":62,"n":"Mosquito Risk Map (HK)","en":"IoT mosquito traps → big data → GIS + AI calculates the Mosquito Risk Index → public map (fights Chikungunya fever).","zh":"物聯網捕蚊器 → 大數據 → GIS 加 AI 計算蚊患風險指數 → 公開地圖（對抗基孔肯雅熱）。","src":"L5 slide 25","q":15,"pl":[["Hong Kong","香港"]],"refs":[["L5",25]],"d":[["IoT: smart mosquito traps across Hong Kong count mosquitoes automatically.","物聯網：全港的智能捕蚊器自動計算蚊子數量。"],["Big data + AI: the counts are combined with GIS data and AI to calculate a Mosquito Risk Index.","大數據 + AI：把數字與 GIS 數據結合，以 AI 計算蚊患風險指數。"],["Result: a public map helps prevent Chikungunya fever – a full IoT → Big Data → AI chain.","結果：公眾地圖幫助預防基孔肯雅熱——完整的物聯網 → 大數據 → AI 鏈條。"]]},{"x":63,"n":"Sewage surveillance for COVID-19","en":"Sampling at sewage points → daily test data → GIS dashboard for real-time analysis (IWA Gold Award 2024).","zh":"污水採樣點 → 每日檢測數據 → GIS 儀表板實時分析（2024 年國際水協會金獎）。","src":"L1 slide 60","q":15,"pl":[["Hong Kong","香港"]],"refs":[["L1",60]],"d":[["IoT/sampling: sewage samples are collected at many points in the drainage network.","物聯網／採樣：在排污網絡多個地點收集污水樣本。"],["Big data: daily test results build up a large dataset over time and space.","大數據：每日化驗結果累積成跨時間和空間的大型數據集。"],["AI/GIS: a GIS dashboard analyses results in real time to find hidden cases; it won an IWA Gold Award in 2024.","AI／GIS：GIS 儀表板實時分析結果以找出隱形個案；於 2024 年獲 IWA 金獎。"]]},{"x":64,"n":"CCTV traffic AI","en":"Cameras (IoT) → video big data → YOLO AI detects vehicles, pedestrians and accidents.","zh":"攝影機（物聯網）→ 影片大數據 → YOLO AI 偵測車輛、行人及意外。","src":"L5 slide 19","q":15,"pl":[["Hong Kong","香港"]],"refs":[["L5",19]],"d":[["IoT: traffic cameras on roads.","物聯網：道路上的交通攝影機。"],["Big data: continuous video creates a huge stream of images.","大數據：持續的影片產生大量影像流。"],["AI: a YOLO model detects vehicles, pedestrians and accidents automatically – IoT collects, big data stores, AI understands.","AI：YOLO 模型自動偵測車輛、行人及意外——物聯網收集、大數據儲存、AI 理解。"]]},{"x":65,"n":"ChatGPT, Midjourney, HKGAI (generative)","en":"Create text and images from prompts; HKGAI builds local tools such as HKChat and LexiHK.","zh":"按提示創造文字和圖片；香港生成式 AI 研發中心開發港話通、港法通等本地工具。","src":"L5 slides 6, 11","q":16,"pl":[["United States (USA)","美國"],["Hong Kong","香港"]],"refs":[["L5",6],["L5",11]],"d":[["What: ChatGPT writes text, Midjourney makes images; HKGAI (Hong Kong Generative AI R&D Centre) builds local tools such as HKChat and LexiHK.","是甚麼：ChatGPT 生成文字，Midjourney 生成圖像；香港生成式人工智能研發中心開發本地工具，例如 HKChat 及 LexiHK。"],["How: they respond to a prompt and create new content, but wait for the user's next instruction.","做法：根據提示生成新內容，但要等待用戶下一個指示。"],["Use in answer: Generative AI = creates content when asked (reactive).","答題用法：生成式 AI = 被要求時生成內容（被動回應）。"]]},{"x":66,"n":"Lawyer cited fake cases (hallucination)","en":"A lawyer used ChatGPT in court and cited cases that did not exist.","zh":"律師在法庭使用 ChatGPT，引用不存在的案例。","src":"L5 slide 10","q":16,"pl":[["New York","紐約"],["United States (USA)","美國"]],"refs":[["L5",10]],"d":[["What: in 2023 a New York lawyer used ChatGPT to prepare a court document (Mata v. Avianca).","是甚麼：2023 年一名紐約律師使用 ChatGPT 準備法庭文件（Mata v. Avianca 案）。"],["Problem: ChatGPT invented cases that did not exist; the court fined the lawyers.","問題：ChatGPT 虛構了不存在的案例；法庭向律師罰款。"],["Use in answer: challenge \"{hallucination|幻覺} / accuracy\" – always check AI output.","答題用法：挑戰「幻覺／準確性」——必須核實 AI 的輸出。"]]},{"x":67,"n":"Samsung data leak (privacy)","en":"Staff put company information into ChatGPT, so Samsung banned it.","zh":"員工把公司資料輸入 ChatGPT，三星因此禁用。","src":"L5 slide 10","q":16,"pl":[["South Korea","南韓"]],"refs":[["L5",10]],"d":[["What: in 2023 Samsung staff pasted company source code and meeting notes into ChatGPT.","是甚麼：2023 年三星員工把公司原始碼及會議紀錄貼上 ChatGPT。"],["Result: Samsung restricted staff use of generative AI tools.","結果：三星限制員工使用生成式 AI 工具。"],["Use in answer: challenge \"privacy / data security\".","答題用法：挑戰「私隱／數據安全」。"]]},{"x":68,"n":"Self-driving cars (autonomous, goal-oriented)","en":"Google and Uber self-driving cars sense the road and decide actions on their own toward a goal – similar to agentic behaviour.","zh":"Google 和 Uber 的自動駕駛汽車自行感知路況並為目標作決定——類似代理式 AI 的行為。","src":"L5 slide 4 (applied)","q":16,"pl":[["United States (USA)","美國"]],"refs":[["L5",4]],"d":[["What: self-driving cars developed by Google (Waymo) and Uber.","是甚麼：Google（Waymo）及 Uber 開發的自動駕駛汽車。"],["How: they sense the road, plan and act on their own to reach a destination without step-by-step human commands.","做法：自行感知路面、規劃並行動以到達目的地，毋須人類逐步指示。"],["Use in answer: Agentic AI = autonomous and goal-oriented (proactive), compared with Generative AI.","答題用法：代理式 AI = 自主及以目標為本（主動），與生成式 AI 作比較。"]]},{"x":69,"n":"ArcGIS Online (SaaS)","en":"Esri hosts everything; users just create maps, apps and dashboards in a browser.","zh":"Esri 託管一切，用戶只需在瀏覽器建立地圖、應用及儀表板。","src":"L6 slide 46","q":17,"pl":[["Global","全球"]],"refs":[["L6",46]],"d":[["What: Esri's cloud GIS used in this course.","是甚麼：本課程使用的 Esri 雲端 GIS。"],["How: Esri runs the servers, software and updates; users only log in with a browser to make maps and dashboards.","做法：Esri 負責伺服器、軟件及更新；使用者只需用瀏覽器登入製作地圖及儀表板。"],["Use in answer: SaaS – the provider manages everything; you just use the software.","答題用法：軟件即服務——供應商管理一切，你只需使用軟件。"]]},{"x":70,"n":"COVID-19 dashboard speed","en":"Built on a cloud GIS platform in about 2 days, compared with about a month for SARS in 2003 – faster time to market.","zh":"以雲端 GIS 平台約兩天建成，2003 年沙士則約一個月——更快推出市場。","src":"L3 slide 74 (your notes)","q":17,"pl":[["Hong Kong","香港"]],"refs":[["L3",74]],"d":[["What: Hong Kong's COVID-19 dashboard (2020) compared with the SARS response in 2003.","是甚麼：香港 COVID-19 儀表板（2020）與 2003 年沙士應對的比較。"],["How: on a cloud GIS platform it was built in about 2 days, compared with about a month in 2003.","做法：在雲端 GIS 平台上約 2 天建成，2003 年則約需一個月。"],["Use in answer: benefit \"faster time to market / speed\" of cloud computing.","答題用法：雲端運算的好處「更快推出／速度」。"]]},{"x":71,"n":"Virtual servers, e.g., AWS EC2 / Azure VMs (IaaS)","en":"Rent servers and storage; you install and manage your own software.","zh":"租用伺服器和儲存，自行安裝及管理軟件。","src":"outside the slides","q":17,"pl":[["Global","全球"]],"refs":[],"d":[["What: Amazon Web Services EC2 and Microsoft Azure Virtual Machines.","是甚麼：亞馬遜 AWS EC2 及微軟 Azure 虛擬機。"],["How: you rent computing power and storage; you install and manage the operating system and software yourself.","做法：租用運算能力及儲存空間；自行安裝及管理作業系統和軟件。"],["Use in answer: IaaS – most control, most work for the user.","答題用法：基礎設施即服務——控制最多，使用者工作亦最多。"]]},{"x":72,"n":"App platforms, e.g., Azure App Service / Google App Engine (PaaS)","en":"Upload your own app code; the provider runs the OS and servers.","zh":"上載自己的程式碼，供應商負責作業系統和伺服器。","src":"outside the slides","q":17,"pl":[["Global","全球"]],"refs":[],"d":[["What: Microsoft Azure App Service and Google App Engine.","是甚麼：微軟 Azure App Service 及 Google App Engine。"],["How: you upload only your app code; the provider runs the operating system, servers and scaling.","做法：只需上載應用程式碼；供應商負責作業系統、伺服器及擴展。"],["Use in answer: PaaS – in the middle between IaaS and SaaS.","答題用法：平台即服務——介乎 IaaS 與 SaaS 之間。"]]},{"x":73,"n":"HK district boundaries, roads, bus stops (vector)","en":"Discrete features with clear edges, e.g., LandsD topographic map layers on CSDI.","zh":"有清晰邊界的離散地物，例如 CSDI 上地政總署的地形圖層。","src":"L6 slides 7, 42","q":18,"pl":[["Hong Kong","香港"]],"refs":[["L6",7],["L6",42]],"d":[["What: LandsD topographic layers on CSDI.","是甚麼：CSDI 上的地政總署地形圖層。"],["How: boundaries = polygons, roads = lines, bus stops = points, each with an attribute table.","做法：界線 = 多邊形，道路 = 線，巴士站 = 點，各自附有屬性表。"],["Use in answer: vector suits discrete features with clear edges; files are small and precise.","答題用法：向量適合邊界清晰的離散要素；檔案細小且精確。"]]},{"x":74,"n":"Landsat 8 satellite images (raster)","en":"Cells (pixels) in bands 3, 4, 5 used to detect landslides.","zh":"第 3、4、5 波段的格子（像素），用來偵測山泥傾瀉。","src":"L5 slide 23","q":18,"pl":[["United States (USA)","美國"],["Global","全球"]],"refs":[["L5",23]],"d":[["What: images from the NASA/USGS Landsat 8 satellite.","是甚麼：美國太空總署／地質調查局 Landsat 8 衞星影像。"],["How: each cell (pixel) stores a value in each band; bands 3, 4 and 5 help detect landslides by showing bare soil vs vegetation.","做法：每個網格（像素）在每個波段儲存數值；波段 3、4、5 可顯示裸土與植被的分別，有助偵測山泥傾瀉。"],["Use in answer: raster suits continuous data like imagery; resolution depends on cell size.","答題用法：柵格適合影像等連續數據；解像度取決於網格大小。"]]},{"x":75,"n":"Orthorectified aerial photo (raster)","en":"An air photo corrected to map accuracy in the LandsD Map API.","zh":"地政總署地圖 API 中經校正至地圖精度的航空照片。","src":"L3 slide 88","q":18,"pl":[["Hong Kong","香港"]],"refs":[["L3",88]],"d":[["What: an air photo in the LandsD Map API.","是甚麼：地政總署地圖 API 中的航空照片。"],["How: \"{orthorectified|正射校正}\" means it is corrected for tilt and terrain so it matches map positions.","做法：「正射校正」即修正傾斜及地形影響，使其與地圖位置吻合。"],["Use in answer: another raster example – a photo made of pixels, used as a base map.","答題用法：另一柵格例子——由像素組成的照片，可用作底圖。"]]},{"x":76,"n":"Population density (both)","en":"Can be district polygons (vector choropleth) or a grid of cells (raster).","zh":"可以是地區多邊形（矢量分級統計圖）或格網（柵格）。","src":"L6 slide 77 (applied)","q":18,"pl":[["Hong Kong","香港"]],"refs":[["L6",77]],"d":[["Vector version: each district polygon is coloured by its density (a {choropleth|分層設色} map).","向量版本：每個分區多邊形按密度著色（分層設色地圖）。"],["Raster version: a grid of cells, each cell storing people per km².","柵格版本：網格中每格儲存每平方公里人口。"],["Use in answer: shows the same data can be either – good for a comparison answer.","答題用法：說明同一數據可用兩種模型表示——適合比較題。"]]},{"x":77,"n":"500-ft buffer around schools","en":"Billboards are prohibited within the buffer zone.","zh":"學校周圍 500 呎緩衝區內禁止廣告牌。","src":"L6 slide 37","q":19,"pl":[["United States (USA)","美國"]],"refs":[["L6",37]],"d":[["What: a lecture example where billboards are not allowed within 500 feet of a school.","是甚麼：講課例子——學校 500 呎範圍內不准設置廣告牌。"],["How: the Buffer tool draws a zone of fixed distance around each school.","做法：緩衝區工具在每間學校周圍畫出固定距離的範圍。"],["Use in answer: step 1 – Buffer schools by 500 m to get the \"near school\" zone.","答題用法：第一步——以 500 米為學校建立緩衝區，得到「學校附近」範圍。"]]},{"x":78,"n":"Parcels in the floodplain","en":"Select By Location gives whole parcels; Overlay (Intersect) gives only the parts inside.","zh":"按位置選取得到整個地段；疊加（相交）只得到位於範圍內的部分。","src":"L6 slides 33, 36","q":19,"pl":[["Global","全球"]],"refs":[["L6",33],["L6",36]],"d":[["What: a lecture example of finding land parcels in a floodplain.","是甚麼：講課例子——找出位於氾濫平原內的地段。"],["Difference: Select By Location returns whole parcels that touch the floodplain; Overlay (Intersect) cuts and keeps only the parts inside.","分別：按位置選取會傳回與氾濫平原接觸的整個地段；疊加（相交）則切割並只保留範圍內的部分。"],["Use in answer: step 2 – Intersect parcels, floodplain and school buffer, because the question asks for \"the parts\".","答題用法：第二步——把地段、氾濫平原及學校緩衝區相交，因為題目要求「部分」。"]]},{"x":79,"n":"Drone no-fly zones (geo-fencing)","en":"Static geofences around airports and government facilities work like buffers that limit UAVs.","zh":"機場及政府設施周圍的靜態地理圍欄，就像限制無人機的緩衝區。","src":"L5 slide 68","q":19,"pl":[["Hong Kong","香港"]],"refs":[["L5",68]],"d":[["What: static geofences around airports and government facilities in Hong Kong's drone rules.","是甚麼：香港無人機規例中，機場及政府設施周圍的靜態地理圍欄。"],["How: a fixed zone is drawn around each site, just like a buffer, and drones cannot fly inside.","做法：在每個地點周圍畫出固定範圍，就像緩衝區，無人機不可飛入。"],["Use in answer: a real-life example showing why Buffer is useful.","答題用法：真實例子，說明緩衝區工具的用處。"]]},{"x":80,"n":"WGS84 vs HK1980 Grid","en":"A phone GPS gives WGS84 (113°25'35\", 22°27'38\"); LandsD maps and CSDI data often use the HK1980 Grid (834695.786mN, 876231.564mE).","zh":"手機 GPS 給出 WGS84 坐標；地政總署地圖及 CSDI 數據常用香港 1980 方格網。","src":"L6 slide 29","q":19,"pl":[["Hong Kong","香港"],["Global","全球"]],"refs":[["L6",29]],"d":[["WGS84: a geographic coordinate system in latitude/longitude (degrees), used by GPS worldwide.","WGS84：以經緯度（度）表示的地理坐標系統，全球 GPS 使用。"],["HK1980 Grid: a projected coordinate system in metres (Northing, Easting), used by LandsD maps and CSDI.","香港 1980 方格網：以米（北距、東距）表示的投影坐標系統，地政總署地圖及 CSDI 使用。"],["Use in answer: data must be in the same system before Buffer/Intersect, so convert WGS84 GPS data to HK1980 Grid.","答題用法：進行緩衝及相交前，數據必須在同一坐標系統，因此要把 WGS84 GPS 數據轉換成香港 1980 方格網。"]]}],"sq":[{"L":"L1","q":"Define a smart city and state its two ultimate goals.","qz":"定義智慧城市，並說明其兩個終極目標。","m":4,"pts":[["A smart city uses ICT (information and communications technology) to improve the quality of life and city services, making the city more livable.","智慧城市運用資訊及通訊科技改善生活質素和城市服務，令城市更宜居。"],["Goal 1: enhance quality of life.","目標一：提升生活質素。"],["Goal 2: foster sustainable growth – the key word is sustainability.","目標二：促進可持續增長——關鍵詞是可持續性。"]],"s":["For example, HKeToll uses RFID tags so drivers pass toll tunnels without stopping, which saves time and improves quality of life.","例如易通行利用 RFID 繳費貼，讓司機不停車通過隧道，節省時間、提升生活質素。"],"sl":{"L1":[27,31,32,33]},"lab":"SQ1"},{"L":"L1","q":"Explain Boyd Cohen's three phases of smart city development. Which phase is the ultimate goal, and why?","qz":"解釋 Boyd Cohen 的智慧城市三個發展階段。哪一個是終極目標？為甚麼？","m":6,"pts":[["1.0 – technology-driven: tech companies push products to cities.","1.0——科技主導：科技公司向城市推銷產品。"],["2.0 – government-driven: government decides how technology is used.","2.0——政府主導：政府決定如何運用科技。"],["3.0 – citizen-driven: citizens co-create solutions (bottom-up).","3.0——市民主導：市民共同創造方案（由下而上）。"],["3.0 is the ultimate goal because solutions meet citizens' real needs; it needs open data so citizens can build maps and apps.","3.0 是終極目標，因為方案切合市民真正需要；它需要開放數據讓市民製作地圖和應用程式。"]],"s":["Hong Kong's COVID-19 dashboard, built by government and Smart City Consortium volunteers together, shows the citizen co-creation of Smart City 3.0.","香港新冠疫情地圖由政府與智慧城市聯盟義工共同建立，展示智慧城市 3.0 的市民共創。"],"sl":{"L1":[11,13,17,30,89]},"lab":"SQ2"},{"L":"L1","q":"Describe Hong Kong's \"3 ageing\" challenges with data, and suggest how GIS can help with one of them.","qz":"以數據描述香港的「三老」挑戰，並建議 GIS 如何協助處理其中之一。","m":6,"pts":[["Ageing population: 1 in 10 aged 65+ (2015) → 1 in 4 (2025) → 1 in 2.8 (36%) by 2046.","人口老化：65 歲以上由 2015 年每 10 人有 1 人增至 2046 年 36%。"],["Ageing buildings: 326K private units aged 70+ by 2046.","樓宇老化：2046 年有 32.6 萬個私人單位樓齡 70 年以上。"],["Ageing lifts: about 73K lifts, 67% aged 21+.","升降機老化：約 7.3 萬部升降機，67% 使用 21 年或以上。"],["GIS example: map elderly population with clinics and lifts to plan services, or use URA's URIS to plan urban renewal of old buildings.","GIS 例子：把長者人口與診所、升降機位置一起繪圖以規劃服務，或用市建局 URIS 規劃舊樓重建。"]],"s":["GIS can overlay census data on residents aged 65+ with clinic locations from CSDI, so the government can see which districts need more elderly services.","GIS 可把 65 歲以上人口數據與 CSDI 診所位置疊加，讓政府看到哪些地區需要更多長者服務。"],"sl":{"L1":[26,61]},"lab":"SQ3"},{"L":"L1","q":"What is the low-altitude economy? Give its definition, two key sectors and three application scenarios.","qz":"甚麼是低空經濟？寫出定義、兩個主要行業及三個應用場景。","m":6,"pts":[["Manned and unmanned activities in airspace below 1,000 m (extendable to 3,000 m).","在 1,000 米（可延伸至 3,000 米）以下空域的載人及無人駕駛活動。"],["Key sectors: drones (UAVs) and eVTOL.","主要行業：無人機及電動垂直起降飛行器。"],["Applications (any three): real-time data collection, emergency rescue, building inspection, waste monitoring, tree conservation, coastal conservation, slope management, tourism.","應用（任選三項）：實時數據收集、緊急救援、樓宇檢查、廢物監察、樹木保育、海岸保育、斜坡管理、旅遊。"]],"s":["For example, AFCD uses drones with AI to patrol illegal fishing in Kat O, which shows LAE in maritime conservation.","例如漁護署以無人機配合 AI 在吉澳巡查非法捕魚，展示低空經濟在海事保育的應用。"],"sl":{"L1":[80,81],"L5":[69,70,71]},"lab":"SQ4"},{"L":"L2","q":"Define open data and list any four of its eight principles.","qz":"定義開放數據，並列出八大原則中任何四個。","m":6,"pts":[["Open data can be freely used, modified and shared by anyone for any purpose, under an open licence, in a machine-readable form.","開放數據可被任何人為任何目的自由使用、修改及分享，以開放授權及機器可讀形式提供。"],["Principles: complete, primary, timely, accessible, machine processable, non-discriminatory, non-proprietary, licence-free (any four, with a short meaning).","原則：完整、原始、及時、可存取、機器可處理、無歧視、非專有、免授權（任選四個並簡單解釋）。"]],"s":["DATA.GOV.HK offers over 2,500 datasets through APIs, so computers can read them directly – the principle of being machine processable.","資料一線通有超過 2,500 個數據集提供 API，電腦可直接讀取，符合「機器可處理」原則。"],"sl":{"L2":[9,10],"L1":[72]},"lab":"SQ5"},{"L":"L2","q":"Explain the advantages of open data for individuals, businesses and government.","qz":"解釋開放數據對個人、企業及政府的好處。","m":6,"pts":[["Individuals: make more informed decisions and use new services (e.g., CityMapper).","個人：作出更明智的決定，使用新服務（例如 CityMapper）。"],["Businesses: a cost-effective resource to combine with their own proprietary databases; new apps and profit.","企業：具成本效益的資源，可與自家數據庫結合；開發新應用並賺錢。"],["Government: more transparency and collaboration between departments, better city planning, job creation and a stronger economy (EU market €184 bn, 1.09 m jobs).","政府：提高透明度及部門合作、改善城市規劃、創造職位和推動經濟（歐盟市場 1,844 億歐元、109 萬職位）。"]],"s":["For government, open data saves money: Ireland's GeoHive saves the public sector about $92 million a year.","對政府而言，開放數據可以省錢：愛爾蘭 GeoHive 每年為公營部門節省約 9,200 萬美元。"],"sl":{"L2":[11,13,14,23,24,25],"L3":[53]},"lab":"SQ6"},{"L":"L2","q":"Identify four challenges of open data and suggest one way to solve the privacy challenge.","qz":"指出開放數據的四個挑戰，並建議一個解決私隱問題的方法。","m":6,"pts":[["Challenges (any four): privacy concerns; losing control of confidential information; cost of creating and curating a portal; data must be machine-readable; constant updating and promotion; effort to engage the community.","挑戰（任選四項）：私隱；失去機密資料控制；建立及管理平台的成本；數據須機器可讀；不斷更新及推廣；投入資源讓社區參與。"],["Solution: use aggregate information – remove individual identities and characteristics before sharing (e.g., Singapore telco data, Japan's renewed privacy law); follow the law.","方法：使用匯總資訊——分享前移除個人身份及特徵（例如新加坡電訊數據、日本修訂私隱法）；依法處理。"]],"s":["Privacy can be protected by aggregation: Hong Kong's COVID-19 dashboard showed affected buildings, not patients' identities.","匯總可以保障私隱：香港新冠疫情地圖只顯示受影響大廈，而非病人身份。"],"sl":{"L2":[26,27,28,29,30,31]},"lab":"SQ7"},{"L":"L2","q":"Private organisations often choose not to open their data. Suggest three methods to persuade them.","qz":"私營機構常不開放數據。提出三個說服他們的方法。","m":6,"pts":[["Protect privacy and business secrets by sharing only aggregated or anonymised data.","只分享匯總或匿名數據，保障私隱和商業秘密。"],["Show the business value and give incentives – new customers, reputation, tax relief, funding, or allow charging for some data.","展示商業價值並提供誘因——新客戶、聲譽、稅務寬免、資助，或容許部分數據收費。"],["Lower the cost with free platforms and standards (CSDI, GeoLab, APIs), and set clear rules or laws (e.g., New York Open Data Law, Australia's CDR).","以免費平台和標準降低成本（CSDI、地理空間實驗室、API），並訂立清晰規則或法例（例如紐約《開放數據法》、澳洲消費者數據權）。"]],"s":["The government can show the benefits: KMB and Citybus share real-time arrival data on DATA.GOV.HK, which improves their service image.","政府可展示好處：九巴和城巴在資料一線通分享實時到站數據，提升服務形象。"],"sl":{"L2":[29,32,33]},"lab":"SQ8"},{"L":"L3","q":"What is a Spatial Data Infrastructure (SDI)? Describe the four things needed to build one.","qz":"甚麼是空間數據基礎設施？描述建立 SDI 所需的四項元素。","m":6,"pts":[["SDI (term coined 1993 by the U.S. National Research Council) is a framework of technologies, policies and institutional arrangements that helps create, exchange and use geospatial data.","SDI（1993 年由美國國家研究委員會提出）是由技術、政策和機構安排組成、協助建立、交換和使用地理空間數據的框架。"],["1. Policy & institutional framework (budget, resources); 2. Data & technical standards; 3. Technologies & applications (GIS, server GIS); 4. People & sharing.","1. 政策及機構框架（預算、資源）；2. 數據及技術標準；3. 技術及應用（GIS、伺服器 GIS）；4. 人及共享。"]],"s":["Hong Kong's CSDI shows all four pillars: DEVB provides the policy, the portal provides the technology, and 71 departments share over 1,200 datasets.","香港 CSDI 體現四大支柱：發展局提供政策，平台提供技術，71 個部門分享逾 1,200 個數據集。"],"sl":{"L3":[37,39,42,43,47,50],"L1":[77,78]},"lab":"SQ9"},{"L":"L3","q":"Why is SDI (CSDI) important to the development of a smart city? Give four reasons with examples.","qz":"為甚麼 SDI（CSDI）對發展智慧城市很重要？以例子提出四個理由。","m":8,"pts":[["80% of data is spatial, so SDI is the backbone that links all data by location.","80% 數據是空間數據，SDI 是以位置連結所有數據的骨幹。"],["Avoids duplication and saves money – one authoritative dataset (Ireland GeoHive saves about $92m a year).","避免重複、節省金錢——一套權威數據（愛爾蘭 GeoHive 每年節省約 9,200 萬美元）。"],["Better and faster decisions – supports COP and dashboards (HK COP with 20 departments).","更好更快的決策——支援共用運作圖和儀表板（香港 20 個部門的共用運作圖）。"],["Drives innovation and the economy – startups and public build apps (3D Pedestrian Network, GeoLab; UK MasterMap ≥ £130m a year); and improves public engagement and transparency (SPP3).","推動創新和經濟——初創和公眾開發應用（三維行人網絡、地理空間實驗室；英國 MasterMap 每年至少 1.3 億英鎊）；並加強公眾參與及透明度（SPP3）。"]],"s":["SDI saves duplication and creates value: the UK's free OS MasterMap data is expected to add at least £130 million a year to its economy.","SDI 避免重複並創造價值：英國免費公開 MasterMap 數據，預計每年為經濟帶來至少 1.3 億英鎊。"],"sl":{"L3":[44,45,48,49,51,52,79,82,90]},"lab":"SQ10"},{"L":"L3","q":"What is a Common Operational Picture (COP)? Describe one example of its use.","qz":"甚麼是共用運作圖？描述一個應用例子。","m":4,"pts":[["A COP gives all groups in an Emergency Operations Center one central place to access maps and apps and add to one common dataset.","共用運作圖讓緊急應變中心內所有小組在一個中央平台存取地圖和應用，並更新同一套數據。"],["Example (any one): Boston Marathon security dashboard; Kumamoto Earthquake 2016 (damage, rescue, recovery); HK COP showing incidents from 20 departments (HyD, DSD, FSD, HKO…) in one web map.","例子（任選一個）：波士頓馬拉松保安儀表板；2016 年熊本地震（損毀、救援、復原）；香港共用運作圖在一張網上地圖顯示 20 個部門的事故。"]],"s":["During a rainstorm like the one in September 2023, a COP lets HyD, DSD and FSD see the same flooding reports on one map and send teams quickly.","在 2023 年 9 月那樣的暴雨中，COP 讓路政署、渠務署和消防處在同一地圖看到水浸報告並迅速派員。"],"sl":{"L3":[66,67,69,70,71,90],"L1":[14]},"lab":"SQ11"},{"L":"L3","q":"Describe Los Angeles GeoHub and explain two of its applications.","qz":"描述洛杉磯 GeoHub，並解釋其中兩個應用。","m":6,"pts":[["GeoHub is LA's city-level open data hub: maps, data, apps, open data portal and open APIs for developers.","GeoHub 是洛杉磯的城市級開放數據平台：地圖、數據、應用程式、開放數據入口及開放 API。"],["Clean Streets Index: every block scored 1–3 (clean / somewhat clean / not clean) by litter, weeds, bulky items and illegal dumping; used to prioritise cleaning.","街道清潔指數：每段街道按垃圾、雜草、大型廢物和非法棄置評 1–3 分；用來排列清潔次序。"],["Others: Road to 2400 (repaving 2,400 lane miles), Street Wize (maps street works), Vision Zero (reduce road deaths), Mayor's Dashboard.","其他：邁向 2400（重鋪 2,400 車道英里）、Street Wize（道路工程地圖）、零死亡願景（減少交通死亡）、市長儀表板。"]],"s":["LA GeoHub's Clean Streets Index scores every block from 1 to 3, so the city can send cleaners to the dirtiest streets first.","洛杉磯 GeoHub 的街道清潔指數為每段街道評 1–3 分，讓市政府優先清潔最髒的街道。"],"sl":{"L3":[55,56,58,60,61,62,63,64],"L6":[53,54,55,56]},"lab":"SQ12"},{"L":"L4","q":"Describe the four layers of the IoT architecture, with one example for each.","qz":"描述物聯網架構的四層，並各舉一例。","m":8,"pts":[["1. Sensor & Identification Layer – generates information; e.g., RFID tag (HKeToll), QR code, smartphone GPS.","1. 感應及識別層——產生資訊；例如 RFID（易通行）、二維碼、手機 GPS。"],["2. Network Construction Layer – transmits information; e.g., 5G, Wi-Fi, NB-IoT, LoRa.","2. 網絡建構層——傳送資訊；例如 5G、Wi-Fi、NB-IoT、LoRa。"],["3. Management Layer – processes information: data and streaming analytics, security & privacy.","3. 管理層——處理資訊：數據及串流分析、保安及私隱。"],["4. Integrated Application Layer – user interface and sector apps; e.g., smart home, smart recycling routing, Smart Barrier.","4. 整合應用層——用戶介面及行業應用；例如智能家居、智能回收路線、智能屏障。"]],"s":["In HKeToll, the RFID tag is the sensor layer, the roadside readers form the network layer, the toll system is the management layer, and the HKeToll app is the application layer.","在易通行中，RFID 繳費貼是感應層，路旁讀取器是網絡層，收費系統是管理層，易通行應用程式是應用層。"],"sl":{"L4":[9,10,12,13,16,24,25,29,30,32]},"lab":"SQ13"},{"L":"L4","q":"Compare LoRa and NB-IoT in four aspects.","qz":"從四方面比較 LoRa 和 NB-IoT。","m":4,"pts":[["Spectrum: LoRa unlicensed; NB-IoT licensed.","頻譜：LoRa 免牌照；NB-IoT 持牌。"],["Cost: LoRa cheaper devices but needs a gateway; NB-IoT costs more per device, no gateway.","成本：LoRa 裝置較平但需閘道器；NB-IoT 每部較貴但毋須閘道器。"],["Battery/latency: LoRa longer battery, higher latency; NB-IoT shorter battery, lower latency.","電池／延遲：LoRa 電池較耐、延遲較高；NB-IoT 電池較短、延遲較低。"],["Range & area: LoRa 7–10 miles, better rural; NB-IoT 11–13 miles, better urban, 10× data rate.","範圍：LoRa 7–10 英里、郊區較好；NB-IoT 11–13 英里、市區較好、速度快 10 倍。"]],"s":["For parking sensors in Mong Kok I would choose NB-IoT because it has lower latency and better urban coverage; for sensors on a remote slope in Sai Kung I would choose LoRa because of its longer battery life and rural range.","旺角的泊車感應器我會選 NB-IoT，因為延遲較低、市區覆蓋較好；西貢偏遠斜坡的感應器我會選 LoRa，因為電池較耐、郊區範圍較遠。"],"sl":{"L4":[19,20,21]},"lab":"SQ14"},{"L":"L4","q":"Explain the 5 Vs of big data and how location (GIS) adds value to big data.","qz":"解釋大數據的 5V，以及位置（GIS）如何為大數據增值。","m":7,"pts":[["Volume – huge amounts every second; Velocity – speed of generation and movement; Veracity – trustworthiness; Variety – different types; Value – must turn data into value.","數量——每秒大量數據；速度——產生和流動的速度；真實性——可信度；多樣性——不同類型；價值——要把數據轉化為價值。"],["All IoT sensors have locations (e.g., phone GPS, geotagged posts), so GIS can find spatial relationships (where are disease outbreaks?) and do predictive modelling (disaster plans, disease spread).","所有物聯網感應器都有位置（例如手機 GPS、帶位置的帖子），所以 GIS 可找出空間關係（疾病在哪裡爆發？）並進行預測模型（災害計劃、疾病傳播）。"]],"s":["Big data has huge volume and velocity – every minute Siri answers over one million questions – and because phones carry GPS, GIS can map these data to find patterns such as disease hotspots.","大數據數量龐大、速度極快——每分鐘 Siri 回答逾 100 萬條問題——由於手機有 GPS，GIS 可把數據繪成地圖找出疾病熱點等規律。"],"sl":{"L4":[38,44,47,48]},"lab":"SQ15"},{"L":"L5","q":"Explain the relationship between IoT, Big Data and AI.","qz":"解釋物聯網、大數據和 AI 之間的關係。","m":4,"pts":[["IoT is the \"senses\": connects devices and collects data.","物聯網是「感官」：連接裝置並收集數據。"],["Big Data is the \"fuel\": captures, stores and analyses the data.","大數據是「燃料」：擷取、儲存及分析數據。"],["AI is the \"brain\": data-based learning, analytics and automation. Example: Mosquito Risk Map – IoT traps → big data → GeoAI → map.","AI 是「大腦」：以數據學習、分析及自動化。例子：蚊患風險地圖——物聯網捕蚊器 → 大數據 → GeoAI → 地圖。"]],"s":["Hong Kong's Mosquito Risk Map shows the chain: IoT traps collect data (senses), the data are stored and analysed (fuel), and GeoAI predicts high-risk areas (brain).","香港蚊患風險地圖展示整條鏈：物聯網捕蚊器收集數據（感官），數據被儲存分析（燃料），GeoAI 預測高風險地區（大腦）。"],"sl":{"L5":[19,25,33],"L1":[60]},"lab":"SQ16"},{"L":"L5","q":"Compare Agentic AI and Generative AI, and give two challenges of Generative AI.","qz":"比較代理式 AI 和生成式 AI，並寫出生成式 AI 的兩個挑戰。","m":6,"pts":[["Generative AI: creative, output-oriented, content-based, no external tools, creates text/images/code from prompts (ChatGPT, Midjourney).","生成式 AI：創意、以輸出為導向、以內容為本、不用外部工具，按提示創造文字／圖片／程式碼。"],["Agentic AI: autonomous, goal-oriented, works in real-time environments, uses tools & APIs, adapts continuously and makes independent decisions.","代理式 AI：自主、以目標為導向、在實時環境運作、使用工具及 API、持續適應並獨立決策。"],["Challenges (any two): misinformation, hallucinations, bias, IP infringement (artists v Midjourney), privacy leaks (Samsung), impersonation, unintended consequences.","挑戰（任選兩項）：錯誤資訊、幻覺、偏頗、侵犯知識產權、私隱外洩、冒充、意外後果。"]],"s":["One challenge of generative AI is hallucination: a lawyer cited fake court cases produced by ChatGPT.","生成式 AI 的挑戰之一是幻覺：一名律師引用了 ChatGPT 編造的法庭案例。"],"sl":{"L5":[5,6,9,10,12,13]},"lab":"SQ17"},{"L":"L5","q":"Explain the three cloud service models and state two benefits of cloud computing for a smart city.","qz":"解釋三種雲端服務模式，並寫出雲端運算對智慧城市的兩個好處。","m":6,"pts":[["IaaS (\"host\"): provider gives servers, storage, networking; you manage OS, runtime, data and apps.","IaaS（託管）：供應商提供伺服器、儲存、網絡；你管理作業系統、運行環境、數據及應用。"],["PaaS (\"build\"): provider also manages OS and runtime; you build and manage apps and data.","PaaS（建立）：供應商再管理作業系統及運行環境；你開發及管理應用和數據。"],["SaaS (\"consume\"): provider manages everything; you just use the software (e.g., ArcGIS Online).","SaaS（使用）：供應商管理一切；你只使用軟件（例如 ArcGIS Online）。"],["Benefits (any two): faster time to market, faster access to new technology, better scalability, high-performance infrastructure, cost saving.","好處（任選兩項）：更快推出市場、更快取得新技術、更佳可擴展性、高效能基建、節省成本。"]],"s":["A smart city benefits from faster time to market: Hong Kong's COVID-19 dashboard was built on cloud GIS in about two days, while the SARS map took about a month.","智慧城市受惠於更快推出市場：香港新冠疫情地圖以雲端 GIS 約兩天建成，沙士地圖則約需一個月。"],"sl":{"L5":[36,37,38,39,41,42,43],"L6":[46]},"lab":"SQ18"},{"L":"L6","q":"Compare vector and raster data, giving one suitable example of each.","qz":"比較矢量和柵格數據，並各舉一個合適例子。","m":6,"pts":[["Vector: shape-based (points, lines, polygons with x,y coordinates); good for discrete objects; e.g., roads, buildings, district boundaries.","矢量：以形狀為本（點、線、多邊形，用 x、y 坐標）；適合離散物件；例如道路、建築、地區界線。"],["Raster: cell-based matrix, each cell stores one value; good for continuous phenomena; e.g., elevation, rainfall, temperature, air photos.","柵格：方格矩陣，每格儲存一個數值；適合連續現象；例如高度、雨量、氣溫、航空照片。"],["Elevation can be both: contour lines (vector) or cells (raster).","高度兩者皆可：等高線（矢量）或格子（柵格）。"]],"s":["Roads and district boundaries suit vector data because they are discrete, while Landsat satellite images used for landslide detection are raster data made of cells.","道路和地區界線屬離散地物，適合矢量數據；用來偵測山泥傾瀉的 Landsat 衞星影像則是由格子組成的柵格數據。"],"sl":{"L6":[6,7,8,9,10,11,12]},"lab":"SQ19"},{"L":"L6","q":"A city wants to find the parts of land parcels that are inside a floodplain and within 500 m of a school. Which GIS tools would you use and why? Also explain the two coordinate systems used in Hong Kong.","qz":"一個城市想找出位於氾濫平原內、並在學校 500 米範圍內的地段部分。你會用哪些 GIS 工具？為甚麼？並解釋香港使用的兩種坐標系統。","m":8,"pts":[["Buffer the schools by 500 m to create zones.","以學校為中心建立 500 米緩衝區。"],["Overlay with Intersect (parcels ∩ floodplain ∩ buffer) – it keeps only the areas of overlap and creates a new feature class; Select By Location would only select whole parcels.","以「相交」疊加（地段 ∩ 氾濫平原 ∩ 緩衝區）——只保留重疊部分並建立新要素類別；按位置選取只會選出完整地段。"],["WGS84: geographic coordinate system, latitude/longitude in degrees, measured by GPS.","WGS84：地理坐標系統，以經緯度（度）表示，由 GPS 量度。"],["HK1980 Grid: projected coordinate system, northing/easting in metres, from surveyors' ground measurements; length and angle are uniform.","香港 1980 方格網：投影坐標系統，以北距／東距（米）表示，由測量師實地量度；長度和角度均勻。"]],"s":["I would buffer each school by 500 m and then intersect the buffer with the floodplain and parcel layers, so only the overlapping parts of parcels remain.","我會為每間學校建立 500 米緩衝區，再與氾濫平原及地段圖層相交，只保留地段重疊的部分。"],"sl":{"L6":[23,24,25,26,27,28,29,33,34,35,36,37],"L5":[68]},"lab":"SQ20"},{"L":"L1","q":"Describe three challenges that citi
