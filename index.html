：視覺化實時及動態城市數據","p":[{"en":"\"Visualise Open Data in City Dashboard\": traffic & transport; public facilities & services; environment & weather; sightseeing spots & events; city at a glance","zh":"「在城市儀表板視覺化開放數據」：交通及運輸；公共設施及服務；環境及天氣；景點及活動；城市概覽","lvl":0,"num":false}]},"79":{"n":79,"en":"Need for Common Spatial Data Infrastructure","zh":"空間數據共享平台的需要","p":[{"en":"One-stop shop map-based information infrastructure {leveraging|善用} Geographic Information System technology","zh":"善用地理資訊系統技術的一站式地圖資訊基建","lvl":0,"num":false},{"en":"Spatial data based on agreed standards can be stored, searched, shared, explored, {assimilated|吸收整合} and analysed","zh":"按協定標準建立的空間數據可被儲存、搜尋、共享、探索、整合及分析","lvl":0,"num":false},{"en":"Users: public sector, private sector, contractors, academia/research, general public → develop map-based applications using GIS technology","zh":"使用者：公營機構、私營機構、承建商、學術／研究界、公眾 → 以 GIS 技術開發地圖應用程式","lvl":0,"num":false}]},"82":{"n":82,"en":"CSDI – Promote Use of Spatial Data in Developing Useful Applications","zh":"空間數據共享平台——推動以空間數據開發實用應用程式","p":[{"en":"3D Pedestrian Network (3DPN): normal walking (shortest path); weatherproof (rain-cover path); mobility-aided (wheelchair-friendly path)","zh":"三維行人網絡：一般步行（最短路線）；防風雨（有上蓋路線）；行動輔助（輪椅友善路線）","lvl":0,"num":false},{"en":"3D map using CSDI data","zh":"使用空間數據共享平台數據的三維地圖","lvl":0,"num":false}]},"83":{"n":83,"en":"3D Digital Map of Hong Kong","zh":"香港三維數碼地圖","p":[{"en":"Available on CSDI Portal for free","zh":"可在空間數據共享平台免費取得","lvl":0,"num":false},{"en":"First launched in 2022 covering Kowloon East area","zh":"2022 年首次推出，覆蓋九龍東","lvl":0,"num":false},{"en":"27 Mar 2025: 3D Digital Maps achieve territory-wide coverage","zh":"2025 年 3 月 27 日：三維數碼地圖覆蓋全港","lvl":0,"num":false},{"en":"Offering API for streaming data of 3D maps, allowing the I&T sector and academia to use the dataset in developing web services or apps","zh":"提供 API 串流三維地圖數據，讓創科界和學術界利用數據集開發網絡服務或應用程式","lvl":0,"num":false},{"en":"Supports: urban planning; land management; project development; environmental studies; traffic studies; landscape design; other technical assessments","zh":"支援：城市規劃；土地管理；項目發展；環境研究；交通研究；園境設計；其他技術評估","lvl":0,"num":false},{"en":"Websites: portal.csdi.gov.hk; 3d.map.gov.hk","zh":"網址：portal.csdi.gov.hk；3d.map.gov.hk","lvl":0,"num":false}]},"87":{"n":87,"en":"Map API Portal","zh":"地圖 API 平台","p":[{"en":"Welcome to LandsD developer portal: JavaScript samples, API reference, API documentation and API console","zh":"地政總署開發者平台：JavaScript 範例、API 參考、API 文件及 API 控制台","lvl":0,"num":false}]},"88":{"n":88,"en":"Map API Portal – Products","zh":"地圖 API 平台——產品","p":[{"en":"Topographic Map","zh":"地形圖","lvl":0,"num":false},{"en":"{Orthorectified|正射校正的} Map (aerial photo corrected to map accuracy)","zh":"正射影像圖（經校正至地圖精度的航空照片）","lvl":0,"num":false},{"en":"Geocoding Locator (convert an address into a map location)","zh":"地理編碼定位器（把地址轉換為地圖位置）","lvl":0,"num":false}]},"89":{"n":89,"en":"Planning Department – HK Statutory Planning Portal 3 (SPP3)","zh":"規劃署——法定規劃綜合網站 3","p":[{"en":"A Web GIS application that provides the latest statutory plans and planning information, including applications for planning permission, representations/objections to statutory plans, and rezoning/amendment of plans","zh":"一個網上 GIS 應用程式，提供最新法定圖則及規劃資訊，包括規劃許可申請、對法定圖則的申述／反對，以及改劃／修訂圖則","lvl":0,"num":false},{"en":"A portal for public engagement","zh":"一個公眾參與平台","lvl":0,"num":false}]},"90":{"n":90,"en":"Common Operational Picture (COP) for Emergency Planning & Resources Allocation","zh":"用於應急規劃及資源調配的共用運作圖","p":[{"en":"Improve emergency planning & resources allocation","zh":"改善應急規劃及資源調配","lvl":0,"num":false},{"en":"All reported incidents & data from 20 departments, including HyD, DSD, LandsD, CEDD, WSD, HKPF, FSD, HA, EPD, TD, HKO, BD, ArchSD etc. are shown and shared in a single web map (source: RTHK)","zh":"來自 20 個部門（包括路政署、渠務署、地政總署、土拓署、水務署、警務處、消防處、醫管局、環保署、運輸署、天文台、屋宇署、建築署等）的所有事故報告及數據，都在單一網上地圖顯示和共享（資料來源：香港電台）","lvl":0,"num":false}]},"92":{"n":92,"en":"Begin with Smart Response","zh":"由智慧回應開始","p":[{"en":"A smart future begins with a smart response to changes and challenges","zh":"智慧未來始於對變化和挑戰的智慧回應","lvl":0,"num":false},{"en":"A smart response begins with the adoption of essential technologies which generate large volume of real-time spatial data in open format","zh":"智慧回應始於採用能以開放格式產生大量實時空間數據的關鍵技術","lvl":0,"num":false}]},"93":{"n":93,"en":"To Enable Public Engagement","zh":"促進公眾參與","p":[{"en":"**For citizens:** to voluntarily collect information about surroundings and share with the community","zh":"市民：自願收集周圍環境的資訊並與社區分享","lvl":0,"num":false},{"en":"**For government:** use SDI to {aggregate|匯總} the data to identify hot spots of services; to inform citizens and seek their approval when drafting development plans for the future","zh":"政府：以 SDI 匯總數據找出服務熱點；在草擬未來發展計劃時通知市民並徵求他們同意","lvl":0,"num":false}]},"94":{"n":94,"en":"To Build a Hub of Innovation","zh":"建立創新樞紐","p":[{"en":"SDI and open data strategy creates the infrastructure for information sharing, solution creation, and innovation","zh":"SDI 及開放數據策略為資訊共享、方案創建和創新建立基建","lvl":0,"num":false},{"en":"Data and initiatives in SDI can be actionable and reusable by different communities in the city","zh":"SDI 中的數據和措施可被城市中不同社群使用及重用","lvl":0,"num":false},{"en":"A hub of innovation can be built together by government departments, NGOs, startups, academia, businesses, and citizens","zh":"政府部門、非政府組織、初創、學術界、企業和市民可一起建立創新樞紐","lvl":0,"num":false}]},"95":{"n":95,"en":"An Open and Smarter Future","zh":"開放而更智慧的未來","p":[{"en":"Open Data and SDI bring more collaboration and transparency by enabling citizens, businesses, NGOs, academia and government departments working together","zh":"開放數據和 SDI 讓市民、企業、非政府組織、學術界和政府部門一起工作，帶來更多協作和透明度","lvl":0,"num":false},{"en":"A Smart City enabled by open data and SDI is a place where people feel safe, healthy, happy and motivated to improve","zh":"由開放數據和 SDI 推動的智慧城市，是一個讓人感到安全、健康、快樂並有動力進步的地方","lvl":0,"num":false}]},"96":{"n":96,"en":"SDI is an Enabling Technology","zh":"SDI 是一種賦能技術","p":[{"en":"Today's governments & communities need collaboration","zh":"今天的政府和社群需要協作","lvl":0,"num":false},{"en":"Four elements: People; Process; Data; Technology","zh":"四大元素：人；流程；數據；技術","lvl":0,"num":false}]}},"secs":{"A6":{"en":"A6. Data Is Infrastructure → Spatial Data Infrastructure (SDI)","zh":"數據就是基建 → 空間數據基礎設施（SDI）","p":[{"en":"\"Data is the new oil.\" Data is a **resource**, and like roads or water pipes it should be treated as **infrastructure** – \"to protect & to serve\". Data are a valuable government asset; we must invest in it, protect it, and treat it as a platform for discovery, economic growth and innovation (Sinai, 2014). How do we deploy it? → **SDI**.","zh":"「數據是新石油。」數據是一種資源，應像道路或水管一樣被視為基建——「保護及服務」。數據是政府的寶貴資產；我們必須投資、保護它，並把它視為科學發現、經濟增長和創新的平台（Sinai，2014）。如何部署？→ 空間數據基礎設施（SDI）。"},{"h":2,"kind":"key","en":"What is SDI? (4 points)","zh":""},{"en":"1. Term coined in **1993** by the U.S. National Research Council: a framework of **technologies, policies and institutional arrangements** that facilitate the creation, exchange and use of geospatial data across an information-sharing community.","zh":"1. 由美國國家研究委員會於 1993 年提出：由技術、政策和機構安排組成的框架，促進地理空間數據在資訊共享社群中的建立、交換和使用。","kind":"key"},{"en":"2. Can be narrow (within one organisation) or broad (national, regional, global).","zh":"2. 可以是狹義的（機構內）或廣義的（國家、區域、全球）。","kind":"key"},{"en":"3. Provides an {institutionally sanctioned|經機構認可的}, automated way of posting, discovering, evaluating and exchanging geospatial information.","zh":"3. 提供經機構認可、自動化的方式，發布、搜尋、評估及交換地理空間資訊。","kind":"key"},{"en":"4. SDI **extends GIS** by ensuring geospatial data and standards are used to create {authoritative|權威的} datasets and policies.","zh":"4. SDI 擴展了 GIS，確保以地理空間數據和標準建立權威數據集及政策。","kind":"key"},{"h":1,"en":"The history: Digital Earth → UN-GGIM / IGIF","zh":"發展歷史：數碼地球 → 聯合國全球地理空間資訊管理／IGIF"},{"en":"**Al Gore (1998):** \"We need a Digital Earth\" – a multi-resolution, 3D representation of the planet with vast geo-referenced data. (Your note: the US stored lots of data but it was unused and not public.)","zh":"戈爾（1998）：「我們需要一個數碼地球」——一個多解像度、三維的地球模型，內含大量地理參照數據。（你的筆記：美國儲存了大量數據，但沒有使用亦未公開。）","lvl":0,"num":false},{"en":"Key developments: FGDC promoted SDI; USGS supplied timely, relevant information; geobrowsers (NASA World Wind, Google Earth, Bing Maps 3D, ArcGIS Earth).","zh":"主要發展：聯邦地理數據委員會推動 SDI；美國地質調查局提供及時相關資訊；地理瀏覽器興起（NASA World Wind、Google Earth、Bing Maps 3D、ArcGIS Earth）。","lvl":0,"num":false},{"en":"**IGIF** (UN Integrated Geospatial Information Framework): \"Geospatial information is a nation's **digital currency** for evidence-based decision-making.\" 9 pathways under Governance, Technology and People.","zh":"IGIF（聯合國綜合地理空間資訊框架）：「地理空間資訊是國家用於循證決策的『數碼貨幣』。」在管治、技術和人三方面共有九條路徑。","lvl":0,"num":false},{"h":1,"en":"What is behind building an SDI? (4 pillars)","zh":"建立 SDI 需要甚麼？（四大支柱）"},{"en":"Policy & institutional framework (budget, resources)","zh":"政策及機構框架（預算、資源）","lvl":0,"num":true},{"en":"Data & technical standards","zh":"數據及技術標準","lvl":0,"num":true},{"en":"Technologies & applications (GIS, especially server-side GIS)","zh":"技術及應用（GIS，特別是伺服器端 GIS）","lvl":0,"num":true},{"en":"People & sharing","zh":"人及共享","lvl":0,"num":true}],"terms":[["Data infrastructure","數據基建","把數據視為像道路、水管一樣的基礎設施，需要投資和保護；目的是「保護及服務」。"],["SDI (Spatial Data Infrastructure)","空間數據基礎設施","1993 年由美國國家研究委員會提出：由技術、政策和機構安排組成的框架，促進地理空間數據的建立、交換和使用。"],["Institutional arrangements","機構安排","由哪個部門負責、如何協調和分工的組織制度。"],["Authoritative dataset","權威數據集","由官方負責、可信和公認的數據集；SDI 確保以標準建立這類數據。"],["Digital Earth","數碼地球","戈爾在 1998 年提出：一個多解像度的三維地球模型，可嵌入大量地理參照數據。"],["FGDC","聯邦地理數據委員會","美國負責推動 SDI 和制定地理數據格式標準的機構（1990 年成立）。"],["Geobrowser","地理瀏覽器","可瀏覽三維地球和地圖的軟件，例如 Google Earth、ArcGIS Earth。"],["UN-GGIM / IGIF","聯合國全球地理空間資訊管理／綜合地理空間資訊框架","聯合國推動各國建立地理空間資訊的框架，有管治、技術、人三方面共九條路徑。"],["Evidence-based decision-making","循證決策","根據數據和證據而不是直覺作決定；IGIF 稱地理空間資訊是國家的「數碼貨幣」。"]]},"A7":{"en":"A7. CSDI – Hong Kong's Common Spatial Data Infrastructure","zh":"CSDI ——香港的空間數據共享平台","p":[{"en":"CSDI is the **critical component** of HK's digital framework for smart city (Smart City Blueprint study, 2017). Its Data Layer has three parts: **Big Data, Open Data, Common Spatial Data**.","zh":"空間數據共享平台是香港智慧城市數碼框架的關鍵組成部分（智慧城市藍圖顧問研究，2017）。其數據層有三部分：大數據、開放數據、共用空間數據。","lvl":0,"num":false},{"en":"Why important: 80% of data is spatial → better planning & management; unlock knowledge & boost economy; right and agile decisions. Applications: COP, risk assessment, hotspot analysis, route planning, spatial market research.","zh":"重要性：80% 數據是空間數據 → 改善規劃及管理；釋放知識、推動經濟；作出正確靈活的決定。應用：共用運作圖、風險評估、熱點分析、路線規劃、空間市場研究。","lvl":0,"num":false},{"en":"GIS provides the location platform: System of Record, System of Insight, System of Engagement – \"using the power of **where** to integrate everything\".","zh":"GIS 提供位置平台：紀錄系統、洞察系統、參與系統——「以『位置』的力量整合一切」。","lvl":0,"num":false},{"en":"HK tools: CSDI Portal (1,200+ datasets, 71+ departments), GeoLab, 3D Pedestrian Network, 3D Digital Map (territory-wide since 27 Mar 2025), Map API Portal, SPP3, COP for emergencies (20 departments).","zh":"香港工具：空間數據共享平台（1,200 多個數據集、71 個以上部門）、地理空間實驗室、三維行人網絡、三維數碼地圖（2025 年 3 月 27 日起覆蓋全港）、地圖 API 平台、法定規劃綜合網站 3、應急共用運作圖（20 個部門）。","lvl":0,"num":false}],"terms":[["CSDI","空間數據共享平台","香港的 SDI：一站式地圖資訊基建，讓政府、私營機構、學界和公眾按共同標準共享空間數據。"],["Data layer (Big / Open / Common Spatial Data)","數據層","香港智慧城市數碼框架中的數據部分，包括大數據、開放數據和共用空間數據。"],["System of Record / Insight / Engagement","紀錄／洞察／參與系統","GIS 作為位置平台的三個角色：儲存數據、分析數據、與公眾互動。"],["GeoLab","地理空間實驗室","發展局成立、東華三院營運，鼓勵公眾利用空間數據開發應用程式。"],["3D Pedestrian Network (3DPN)","三維行人網絡","利用 CSDI 數據建立的行人路線，可選最短、有上蓋或輪椅友善路線。"],["3D Digital Map","三維數碼地圖","地政總署的全港三維地圖，2025 年 3 月 27 日覆蓋全港，可經 API 免費使用。"]]},"A8":{"en":"A8. SDI Examples Around the World","zh":"世界各地的 SDI 例子","p":[{"en":"GeoPlatform · USA 美國 · Shared, trusted geospatial data, services and apps for public & agencies","zh":"為公眾及機構提供共享、可信的地理空間數據、服務和應用","row":1},{"en":"INSPIRE Geoportal · EU 歐盟 · Search & view spatial data from EU member states (INSPIRE Directive)","zh":"搜尋及檢視歐盟成員國的空間數據","row":1},{"en":"OneMap · Singapore 新加坡 · Integrated map system for government; used by private sector & community","zh":"政府綜合地圖系統，私營機構及社區亦使用","row":1},{"en":"Dubai Pulse · Dubai 杜拜 · \"The oil of the future\": data views on housing, utilities, transport/land","zh":"「未來的石油」：房屋、公用事業、交通／土地數據","row":1},{"en":"GeoHive · Ireland 愛爾蘭 · Saves public sector ~$92m/yr; frees time worth ~$316m; competition benefits ~$118m","zh":"每年為公營部門節省約 9,200 萬美元；騰出時間價值約 3.16 億；競爭效益約 1.18 億","row":1},{"en":"Abu Dhabi SDI · Abu Dhabi 阿布扎比 · Spatial data infrastructure programme","zh":"空間數據基礎設施計劃","row":1},{"en":"Living Atlas / GeoHub · Los Angeles 洛杉磯 · City-level hub: open data portal + open APIs + apps (Clean Streets Index, Road to 2400, Street Wize) · 城市級平台：開放數據＋開放 API＋應用","zh":"","row":1},{"en":"OS MasterMap · UK 英國 · First Geospatial Commission project; free datasets via API; ≥ £130m/yr to UK economy · 地理空間委員會首個項目；以 API 免費提供；每年為英國經濟帶來至少 1.3 億英鎊","zh":"","row":1},{"en":"**Chief Data Officer (CDO):** senior executive responsible for data governance policies and using big data strategically; ensures easy access to trusted data. Gartner: 50% of companies in regulated industries will have a CDO.","zh":"首席數據總監：負責數據管治政策及策略性運用大數據的高級行政人員；確保人們能方便取得可信數據。Gartner：受規管行業中 50% 公司會設立首席數據總監。","lvl":0,"num":false}],"terms":[["GeoPlatform (USA)","美國 GeoPlatform","美國的國家 SDI，提供共享和可信的地理空間數據、服務和應用。"],["INSPIRE Directive (EU)","歐盟 INSPIRE 指令","要求歐盟成員國以共同標準分享空間數據的法規，並設地理門戶網站。"],["OneMap (Singapore)","新加坡 OneMap","新加坡政府的綜合地圖系統，私營機構和社區亦可用來開發增值服務。"],["GeoHub (Los Angeles)","洛杉磯 GeoHub","城市層面的開放數據平台，提供數據、開放 API 和應用程式（例如街道清潔指數）。"],["API (Application Programming Interface)","應用程式介面","讓程式直接向伺服器索取數據的通道；比下載檔案更方便，毋須定期重新下載。"],["SLA (Service Level Agreement)","服務水平協議","服務供應商承諾的服務可用率，例如 99.9%，但永遠不會是 100%。"],["Chief Data Officer (CDO)","首席數據總監","負責制定數據管治政策、策略性運用大數據的高級行政人員。"],["Clean Streets Index","街道清潔指數","洛杉磯為每段街道評 1–3 分（清潔／頗清潔／不清潔），依據垃圾、雜草、大型廢物和非法棄置四個因素。"]]},"A9":{"en":"A9. COP and Map-Centric Dashboards","zh":"共用運作圖與以地圖為中心的儀表板","p":[{"en":"**COP (Common Operational Picture):** a central place to access maps and apps for all groups in an Emergency Operations Center (EOC); each group adds to one common dataset. Example: Boston Marathon security.","zh":"共用運作圖：緊急應變中心內所有小組存取地圖和應用程式的中央平台；各小組共同更新同一數據集。例子：波士頓馬拉松保安。","lvl":0,"num":false},{"en":"**Map-centric dashboard:** at-a-glance KPIs; interactive; real-time feeds; includes a map/spatial context; shareable. Usage: monitor operations/assets (IoT, COP), event management, executive summaries.","zh":"以地圖為中心的儀表板：一目了然的 KPI；互動；實時數據；包含地圖／空間背景；可分享。用途：監察運作／資產（物聯網、共用運作圖）、事件管理、行政摘要。","lvl":0,"num":false},{"en":"Examples: Kumamoto Earthquake 2016, LA Mayor's Dashboard, US wildfire dashboard, COVID-19 dashboards (HK, China CDC, JHU), HK City Dashboard.","zh":"例子：2016 年熊本地震、洛杉磯市長儀表板、美國山火儀表板、新冠疫情儀表板（香港、中國疾控中心、約翰霍普金斯大學）、香港城市儀表板。","lvl":0,"num":false}],"terms":[["COP (Common Operational Picture)","共用運作圖","緊急應變中心內各小組共用的中央地圖平台，每組都可更新同一套數據。"],["EOC (Emergency Operations Center)","緊急應變中心","災害或大型活動期間統籌各部門應變的指揮中心。"],["Map-centric dashboard","以地圖為中心的儀表板","以地圖為主、配合圖表和數字的網頁，一目了然顯示 KPI，支援實時數據和互動。"],["Situational awareness","態勢感知","清楚掌握現在發生甚麼事、在哪裡發生。"]]},"A10":{"en":"A10. Open Data in Hong Kong","zh":"香港的開放數據","p":[{"en":"3 ways of dissemination: **viewing only; downloadable; consumable by APIs**.","zh":"三種發放方式：只供瀏覽；可下載；可透過 API 使用。","lvl":0,"num":false},{"en":"DATA.GOV.HK: 5,700+ datasets, 2,500+ with API, 120+ providers, 85B+ downloads (2025); Annual Open Data Plans since 2019.","zh":"資料一線通：5,700 多個數據集、2,500 多個提供 API、120 多個提供者、2025 年下載 850 億次以上；自 2019 年起每年公布開放數據計劃。","lvl":0,"num":false},{"en":"COVID-19 interactive map dashboard (3 Feb 2020) – first in Asia, same day as WHO; 81.84 m visits by 4 Jul 2022.","zh":"新冠疫情互動地圖（2020 年 2 月 3 日）——亞洲首個、與世衞同日推出；截至 2022 年 7 月 4 日瀏覽 8,184 萬次。","lvl":0,"num":false},{"h":2,"kind":"key","en":"Lecture conclusion","zh":""},{"en":"A smart future begins with a **smart response** → adopt technologies that create real-time spatial data in **open format** → enable **public engagement** → build a **hub of innovation** → an **open and smarter future**. SDI is an enabling technology that joins **People, Process, Data and Technology**.","zh":"智慧未來始於「智慧回應」→ 採用能產生開放格式實時空間數據的技術 → 促進公眾參與 → 建立創新樞紐 → 開放而更智慧的未來。SDI 是一種賦能技術，連結人、流程、數據和技術。","kind":"key"}],"terms":[["3 ways of dissemination","三種發放方式","香港開放數據的發放方式：只供瀏覽、可下載、可經 API 使用。"],["Map API Portal","地圖 API 平台","地政總署讓開發者在應用程式中使用地形圖、正射影像圖和地理編碼的平台。"],["Geocoding","地理編碼","把地址轉換為地圖上的坐標位置。"],["Orthorectified map","正射影像圖","經校正、與地圖精度一致的航空照片。"],["SPP3 (Statutory Planning Portal 3)","法定規劃綜合網站 3","規劃署的網上 GIS，顯示法定圖則、規劃申請和改劃資料，亦是公眾參與平台。"],["Enabling technology","賦能技術","本身不是最終產品，但令其他應用成為可能的技術；SDI 連結人、流程、數據和技術。"]]}}},"L4":{"slides":{"4":{"n":4,"en":"What is Internet of Things (IoT)?","zh":"甚麼是物聯網？","p":[{"en":"IoT, Internet of Things","zh":"IoT，物聯網","lvl":0,"num":false},{"en":"Everything is connected","zh":"萬物互聯","lvl":0,"num":false},{"en":"Tying together the **physical, digital** and **analytic** worlds","zh":"連結實體、數碼及分析世界","lvl":0,"num":false},{"en":"Image: phone, smartwatch, CCTV camera, TV, drone, car, fridge, robot, laptop – all connected","zh":"圖片：手機、智能手錶、閉路電視、電視、無人機、汽車、雪櫃、機械人、手提電腦——全部互相連接","lvl":0,"num":false}]},"5":{"n":5,"en":"Connectivity and the \"Any\" Dimension","zh":"連接性與「任何」維度","p":[{"en":"IoT allows people & things to be connected **Anytime** at **Anyplace** with **Anything** and **Anyone** using **Any Network** and **Any Service**","zh":"物聯網讓人和物件在任何時間、任何地點，與任何物件和任何人，透過任何網絡和任何服務連接","lvl":0,"num":false},{"en":"Diagram: Anytime (any context), Anyone (anybody), Any service (any business), Any path (any network), Any place (anywhere), Anything (any device)","zh":"圖示：任何時間（任何情境）、任何人、任何服務（任何業務）、任何路徑（任何網絡）、任何地點、任何物件（任何裝置）","lvl":0,"num":false},{"en":"Figure 1 – A new dimension (ITU): Any TIME connection (on the move, outdoors/indoors, night, daytime); Any PLACE connection (on the move, outdoors, indoors away from the PC, at the PC); Any THING connection (between PCs, human to human (H2H) not using a PC, human to thing (H2T) using generic equipment, thing to thing (T2T))","zh":"圖 1——一個新維度（國際電信聯盟）：任何時間連接（移動中、戶外／室內、晚上、日間）；任何地點連接（移動中、戶外、離開電腦的室內、在電腦前）；任何物件連接（電腦之間、不用電腦的人對人、以一般設備的人對物、物對物）","lvl":0,"num":false}]},"6":{"n":6,"en":"A Comprehensive Definition from IERC (European Research Cluster on the Internet of Things)","zh":"歐洲物聯網研究集群（IERC）的全面定義","p":[{"en":"The IERC is actively involved in ITU-T Study Group 13, which leads the work of the International Telecommunications Union (ITU) on standards for next generation networks (NGN) and future networks, and helped formulate the following definition:","zh":"IERC 積極參與 ITU-T 第 13 研究組，該組領導國際電信聯盟制定下一代網絡及未來網絡的標準，並協助制定以下定義：","lvl":0,"num":false},{"en":"\"Internet of things (IoT): A global infrastructure for the information society, enabling advanced services by {interconnecting|互相連接} (physical & virtual) things based on existing & evolving {interoperable|可互通的} information & communication technologies.","zh":"「物聯網：資訊社會的全球基建，以現有及不斷發展、可互通的資訊及通訊科技，把（實體及虛擬）物件互相連接，從而提供先進服務。","lvl":0,"num":false},{"en":"NOTE 1 – Through the {exploitation|充分利用} of identification, data capture, processing & communication capabilities, the IoT makes full use of things to offer services to all kinds of applications, whilst ensuring that security and privacy requirements are fulfilled.","zh":"註 1——透過充分利用識別、數據擷取、處理及通訊能力，物聯網善用物件為各類應用提供服務，同時確保符合保安及私隱要求。","lvl":1,"num":false},{"en":"NOTE 2 – From a broader perspective, the IoT can be perceived as a vision with technological and societal {implications|影響}.\"","zh":"註 2——從更廣角度看，物聯網可被視為一個對科技和社會都有影響的願景。」","lvl":1,"num":false},{"en":"The IERC definition: IoT is \"A dynamic global network infrastructure with self-configuring capabilities based on standard & interoperable communication {protocols|協定} where physical & virtual 'things' have identities, physical attributes, & virtual personalities & use intelligent interfaces, & are {seamlessly|無縫地} integrated into the information network\".","zh":"IERC 定義：物聯網是「一個動態的全球網絡基建，具自我配置能力，以標準及可互通的通訊協定為基礎；實體及虛擬『物件』擁有身份、實體屬性及虛擬個性，使用智能介面，並無縫地整合到資訊網絡中」。","lvl":0,"num":false},{"en":"Source: http://www.internet-of-things-research.eu/about_iot.htm","zh":"資料來源：http://www.internet-of-things-research.eu/about_iot.htm","lvl":0,"num":false}]},"7":{"n":7,"en":"IoT Evolution","zh":"物聯網的演變","p":[{"en":"Pre-Internet 互聯網前 · Human to human 人對人 · Fixed & mobile telephony, SMS 固網及流動電話、短訊 · Smart networks","zh":"","row":1},{"en":"Internet of content 內容互聯網 · WWW 萬維網 · E-mail, information, entertainment 電郵、資訊、娛樂 · IT platforms & services","zh":"","row":1},{"en":"Internet of services 服務互聯網 · Web 2.0 · E-productivity, e-commerce 電子生產力、電子商貿 · Phones & applications","zh":"","row":1},{"en":"Internet of people 人的互聯網 · Social media 社交媒體 · Skype, Facebook, YouTube · Devices, objects, data","zh":"","row":1},{"en":"Internet of things 物聯網 · Machine to machine 機器對機器 · Identification, tracking, monitoring, metering, automation, actuation, payment 識別、追蹤、監察、計量、自動化、驅動、支付 · Data & ambient context","zh":"","row":1},{"en":"Starts with only network & evolves into everything that can be connected with a network","zh":"由只有網絡開始，演變成所有可連接網絡的事物","lvl":0,"num":false}]},"8":{"n":8,"en":"Characteristics of IoT","zh":"物聯網的特點","p":[{"en":"Dynamic changes","zh":"動態變化","lvl":0,"num":false},{"en":"{Heterogeneity|異質性}","zh":"異質性（不同種類的裝置和網絡）","lvl":0,"num":false},{"en":"Things-related services","zh":"與物件相關的服務","lvl":0,"num":false},{"en":"Inter-connectivity","zh":"互聯性","lvl":0,"num":false},{"en":"Enormous scale","zh":"規模龐大","lvl":0,"num":false}]},"9":{"n":9,"en":"Architecture of IoT","zh":"物聯網的架構","p":[{"en":"Sensor and Identification Layer – information generation","zh":"感應及識別層——資訊產生","lvl":0,"num":true},{"en":"Network Construction Layer – information transmission","zh":"網絡建構層——資訊傳送","lvl":0,"num":true},{"en":"Management Layer – information processing","zh":"管理層——資訊處理","lvl":0,"num":true},{"en":"Integrated Application Layer – information application","zh":"整合應用層——資訊應用","lvl":0,"num":true}]},"10":{"n":10,"en":"Sensor & Identification Layer (Layer 1)","zh":"感應及識別層（第一層）","p":[{"en":"Lowest {abstraction|抽象} layer","zh":"最低的抽象層","lvl":0,"num":false},{"en":"With sensors we are creating a digital nervous system","zh":"透過感應器，我們正在建立數碼神經系統","lvl":0,"num":false},{"en":"Incorporated to measure physical quantities","zh":"用來量度物理量","lvl":0,"num":false},{"en":"Interconnects the physical and digital world","zh":"連接實體和數碼世界","lvl":0,"num":false},{"en":"Collects and processes the real-time information","zh":"收集及處理實時資訊","lvl":0,"num":false},{"en":"Diagram – Sensor network: LAN (Wi-Fi, Ethernet), PAN (UWB, ZigBee, Bluetooth, 6LowPAN, wired). Sensors/actuators: solid state, infra-red, photo-ionization, gyroscope, electro-chemical, electro-mech, catalytic, accelerometer, GPS, photo-electric. Tags: RFID, barcode (1D, 2D)","zh":"圖示——感應器網絡：區域網絡（Wi-Fi、以太網）、個人網絡（超寬頻、ZigBee、藍牙、6LowPAN、有線）。感應器／執行器：固態、紅外線、光電離、陀螺儀、電化學、機電、催化、加速度計、GPS、光電。標籤：RFID、條碼（一維、二維）","lvl":0,"num":false}]},"11":{"n":11,"en":"Barcode & QR Code","zh":"條碼及二維碼","p":[{"en":"Low cost","zh":"成本低","lvl":0,"num":false},{"en":"No technological difficulties","zh":"沒有技術困難","lvl":0,"num":false},{"en":"Several devices can read a barcode","zh":"多種裝置都可讀取條碼","lvl":0,"num":false},{"en":"Starting point for more complex systems","zh":"更複雜系統的起點","lvl":0,"num":false}]},"12":{"n":12,"en":"RFID","zh":"無線射頻識別（RFID）","p":[{"en":"The reduction in terms of size, weight, energy consumption, & cost of the radio takes us to a new era.","zh":"無線電在體積、重量、耗電及成本上的減少，帶我們進入新紀元。","lvl":0,"num":false},{"en":"This allows us to integrate radios in almost all objects and thus to add the word \"anything\" to the above vision, which leads to the IoT concept","zh":"這讓我們可以把無線電裝進幾乎所有物件，為上述願景加入「任何物件」，從而產生物聯網的概念","lvl":1,"num":false},{"en":"Composed of one or more readers and tags","zh":"由一個或多個讀取器及標籤組成","lvl":0,"num":false},{"en":"RFID tag is a small microchip attached to an {antenna|天線}","zh":"RFID 標籤是連接天線的小型微晶片","lvl":0,"num":false},{"en":"It can be seen as one of the main, smallest components of IoT that collects data","zh":"可視為物聯網中收集數據的主要及最小組件之一","lvl":0,"num":false},{"en":"Widely used in transport and {logistics|物流}","zh":"廣泛用於交通及物流","lvl":0,"num":false},{"en":"Easy to deploy: RFID tags and RFID readers","zh":"容易部署：RFID 標籤及讀取器","lvl":0,"num":false},{"en":"The communication range and the frequency depend on the type of technology","zh":"通訊範圍及頻率取決於技術種類","lvl":0,"num":false}]},"13":{"n":13,"en":"RFID Applications","zh":"RFID 的應用","p":[{"en":"Library management (book drop, self check-in/out, anti-theft detection, shelf management)","zh":"圖書館管理（還書箱、自助借還、防盜偵測、書架管理）","lvl":0,"num":false},{"en":"Luggage tracking; sports tracking (e.g., marathon runners); asset tracking; IVU (in-vehicle unit, e.g., RFID toll tag); {inventory|存貨} management","zh":"行李追蹤；運動追蹤（例如馬拉松跑手）；資產追蹤；車內裝置（例如 RFID 繳費貼）；存貨管理","lvl":0,"num":false}]},"15":{"n":15,"en":"Smartphone Sensor","zh":"智能手機感應器","p":[{"en":"In the near future almost everybody will probably have a smartphone","zh":"在不久將來，幾乎每個人都可能擁有智能手機","lvl":0,"num":false},{"en":"A smartphone isn't just a mobile phone that has access to the Internet","zh":"智能手機不只是可上網的手機","lvl":0,"num":false},{"en":"The smartphone can have a lot of different types of sensors – 14 sensors: accelerometer, gyroscope, magnetometer, barometer, proximity, light sensor, touch screen, GPS, Wi-Fi, Bluetooth, GSM/CDMA cell, NFC (near field), camera (front), camera (back)","zh":"智能手機可以有很多不同類型的感應器——14 個：加速度計、陀螺儀、磁力計、氣壓計、近距感應器、光感應器、觸控屏、GPS、Wi-Fi、藍牙、GSM/CDMA 流動網絡、近場通訊、前鏡頭、後鏡頭","lvl":0,"num":false}]},"16":{"n":16,"en":"Network Construction Layer (Layer 2)","zh":"網絡建構層（第二層）","p":[{"en":"{Robust|穩健的} and high-performance network infrastructure","zh":"穩健及高效能的網絡基建","lvl":0,"num":false},{"en":"Supports the communication requirements for latency, {bandwidth|頻寬} or security","zh":"支援延遲、頻寬或保安方面的通訊要求","lvl":0,"num":false},{"en":"Allows multiple organizations to share and use the same network independently","zh":"讓多個機構獨立地共享及使用同一網絡","lvl":0,"num":false},{"en":"Diagram – Gateway network: WAN (GSM/UMTS, LTE, LTE-A), LAN (Wi-Fi, Ethernet). Gateway: micro-controller, radio comms module, signal processor & modulator, embedded OS, SIM module, encryption","zh":"圖示——閘道網絡：廣域網絡（GSM/UMTS、LTE、LTE-A）、區域網絡（Wi-Fi、以太網）。閘道器：微控制器、無線通訊模組、訊號處理及調變器、嵌入式作業系統、SIM 模組、加密","lvl":0,"num":false}]},"17":{"n":17,"en":"Wireless Network (1)","zh":"無線網絡（一）","p":[{"h":1,"en":"Telecommunication systems","zh":"電訊系統"},{"en":"Initial/primary service: mobile voice telephony","zh":"最初／主要服務：流動語音電話","lvl":0,"num":false},{"en":"Large coverage per access point (100s of metres – 10s of kilometres)","zh":"每個接入點覆蓋範圍大（數百米至數十公里）","lvl":0,"num":false},{"en":"Low/moderate data rate (10s of kbit/s – 10s of Mbit/s)","zh":"數據速率低至中等（每秒數十千位元至數十兆位元）","lvl":0,"num":false},{"en":"Examples: GSM, UMTS, LTE","zh":"例子：GSM、UMTS、LTE","lvl":0,"num":false},{"h":1,"en":"WLAN","zh":"無線區域網絡"},{"en":"Initial service: wireless Ethernet extension","zh":"最初服務：無線以太網延伸","lvl":0,"num":false},{"en":"Moderate coverage per access point (10s – 100s metres)","zh":"每個接入點覆蓋中等（數十至數百米）","lvl":0,"num":false},{"en":"Moderate/high data rate (Mbit/s – 100s)","zh":"數據速率中至高（每秒數兆至數百兆位元）","lvl":0,"num":false},{"en":"Very common; widely used both indoors and outdoors; general purpose; low cost; highly interoperable","zh":"非常普遍；室內外廣泛使用；通用；成本低；高度可互通","lvl":0,"num":false},{"en":"Maybe not a good solution in some special conditions","zh":"在某些特殊情況下可能不是好方案","lvl":0,"num":false},{"en":"Examples: IEEE 802.11 (a–n)","zh":"例子：IEEE 802.11（a–n）","lvl":0,"num":false}]},"18":{"n":18,"en":"Wireless Network (2) – Short Range","zh":"無線網絡（二）——短距離","p":[{"en":"Direct connection between devices – sensor networks","zh":"裝置之間直接連接——感應器網絡","lvl":0,"num":false},{"en":"Typical low power usage; low cost; very long battery life; easy to deploy","zh":"通常耗電低；成本低；電池壽命很長；容易部署","lvl":0,"num":false},{"en":"Large number of nodes (up to 64,770)","zh":"節點數目多（最多 64,770 個）","lvl":0,"num":false},{"en":"Can be used globally; secure","zh":"可全球使用；安全","lvl":0,"num":false},{"en":"Ideal for WPAN and mesh networks; supports multiple network {topologies|拓撲結構}","zh":"適合無線個人網絡及網狀網絡；支援多種網絡拓撲","lvl":0,"num":false},{"en":"Examples: Bluetooth, Zigbee, Z-wave (house products), NB-IoT","zh":"例子：藍牙、Zigbee、Z-wave（家居產品）、NB-IoT","lvl":0,"num":false}]},"19":{"n":19,"en":"NB-IoT","zh":"窄頻物聯網（NB-IoT）","p":[{"en":"NB-IoT = Narrowband Internet of Things","zh":"NB-IoT ＝窄頻物聯網","lvl":0,"num":false},{"en":"A new global standard based on public and spectrum-licensed mobile operator networks","zh":"以公共及持頻譜牌照的流動營辦商網絡為基礎的新全球標準","lvl":0,"num":false},{"en":"A wide-area wireless technology which enables {ubiquitous|無處不在的} connections","zh":"一種廣域無線技術，實現無處不在的連接","lvl":0,"num":false},{"en":"Anything can be connected to the network from anywhere, regardless of distance","zh":"任何物件都可以從任何地方連接網絡，不論距離","lvl":0,"num":false},{"en":"Part of the global 3GPP Release 13 standard published in June 2016, optimized for Low Power Wide Area (LPWA) applications","zh":"屬 2016 年 6 月發布的全球 3GPP 第 13 版標準，為低功耗廣域應用而優化","lvl":0,"num":false},{"en":"Advantages: low power (battery life up to 10 years); low cost (affordable for mass-scale deployment); enhanced coverage (covers heavily shadowed environments); massive deployment (billions of connections)","zh":"優點：低功耗（電池壽命長達 10 年）；低成本（可負擔大規模部署）；覆蓋更廣（覆蓋訊號嚴重受阻的環境）；大規模部署（數十億個連接）","lvl":0,"num":false},{"en":"Uses: smart cities (streetlights, parking), smart metering (water, gas), smart building (alarm, access control, HVAC), environment (pollution monitoring), intelligent manufacturing (industrial control, supply chain), consumer (wearables, tracking, white goods)","zh":"用途：智慧城市（路燈、泊車）、智能計量（水、煤氣）、智能大廈（警報、門禁、冷暖通風）、環境（污染監測）、智能製造（工業控制、供應鏈）、消費者（可穿戴裝置、追蹤、家電）","lvl":0,"num":false},{"en":"Source: ASTRI","zh":"資料來源：香港應用科技研究院","lvl":0,"num":false}]},"20":{"n":20,"en":"LoRa","zh":"遠距離無線電（LoRa）","p":[{"en":"LoRa = Long Range Radio","zh":"LoRa ＝遠距離無線電","lvl":0,"num":false},{"en":"Long range, low power consumption connection; secure data transmission","zh":"遠距離、低耗電連接；安全的數據傳送","lvl":0,"num":false},{"en":"The physical layer or wireless {modulation|調變} scheme used to create long-distance communication links","zh":"用來建立長距離通訊連結的物理層或無線調變方式","lvl":0,"num":false},{"en":"LoRaWAN: a protocol specification built on top of LoRa technology, developed by the LoRa Alliance","zh":"LoRaWAN：建基於 LoRa 技術的協定規格，由 LoRa 聯盟制定","lvl":0,"num":false},{"en":"Uses unlicensed radio spectrum in the Industrial, Scientific and Medical (ISM) bands to enable low-power, wide-area communication between remote sensors and gateways","zh":"使用工業、科學及醫療頻段的免牌照無線電頻譜，讓遙距感應器與閘道器之間進行低功耗、廣域通訊","lvl":0,"num":false},{"en":"Key features: geolocation; low cost; standardized; low power (battery up to 20 years); long range (up to 30 miles in rural areas); secure (AES128 encryption); high capacity","zh":"主要特點：地理定位；低成本；標準化；低功耗（電池長達 20 年）；遠距離（郊區可達 30 英里）；安全（AES128 加密）；高容量","lvl":0,"num":false}]},"21":{"n":21,"en":"LoRa vs NB-IoT","zh":"LoRa 與 NB-IoT 比較","p":[{"en":"Older (2015) · Newer (2017)","zh":"","row":1},{"en":"Unlicensed spectrum 免牌照頻譜 · Licensed frequency bands 持牌頻段","zh":"","row":1},{"en":"Lower cost per device (but gateway needed) · Higher cost per device (but no gateway needed)","zh":"","row":1},{"en":"Longer battery life · Shorter battery life","zh":"","row":1},{"en":"High latency / less frequent data transfer · Low latency / more frequent data transfer","zh":"","row":1},{"en":"7 to 10 mile range · 11 to 13 mile range","zh":"","row":1},{"en":"Better rural/remote performance · Better urban/dense performance","zh":"","row":1},{"en":"Lower data rates · Higher data rates (10× LoRa's rates)","zh":"","row":1},{"en":"Translation of key rows: LoRa = older, unlicensed, cheaper devices, longer battery, better in rural areas; NB-IoT = newer, licensed, lower latency, longer range, better in cities, faster.","zh":"主要內容翻譯：LoRa ＝較舊、免牌照、裝置較便宜、電池較耐用、郊區較好；NB-IoT ＝較新、持牌、延遲較低、範圍較遠、市區較好、速度較快。","lvl":0,"num":false}]},"23":{"n":23,"en":"5G – More Data from Billions of Devices","zh":"5G——來自數十億裝置的更多數據","p":[{"en":"The fifth generation of cellular networking","zh":"第五代流動網絡","lvl":0,"num":false},{"en":"Early products available as soon as 2018","zh":"早期產品最早在 2018 年推出","lvl":0,"num":false},{"en":"Dramatically increases: speed of data transfer; response time; capacity for billions of devices to be connected","zh":"大幅提升：數據傳送速度；反應時間；連接數十億裝置的容量","lvl":0,"num":false},{"en":"Generations: 1G (1981, 2 Kbps, analog voice) → 2G (1992, 64 Kbps, digital, GSM/CDMA) → 3G (2001, 2 Mbps / 384 Kbps, mobile broadband) → 4G (2010, 100 Mbps, LTE) → 5G (2020, 10 Gbps, \"tactile internet\")","zh":"各代網絡：1G（1981，2 Kbps，模擬語音）→ 2G（1992，64 Kbps，數碼）→ 3G（2001，2 Mbps／384 Kbps，流動寬頻）→ 4G（2010，100 Mbps，LTE）→ 5G（2020，10 Gbps，「觸覺互聯網」）","lvl":0,"num":false},{"en":"5G applications: smart mobility, smart parking, eHealth, traffic priority, smart grids, domotics (home automation), car-to-car communication, connected house, security & surveillance, water quality, utility management, smart wearables","zh":"5G 應用：智慧出行、智能泊車、電子健康、交通優先、智能電網、家居自動化、車對車通訊、聯網家居、保安及監控、水質、公用事業管理、智能可穿戴裝置","lvl":0,"num":false}]},"24":{"n":24,"en":"Management Layer (Layer 3)","zh":"管理層（第三層）","p":[{"en":"Capturing of periodic sensory data","zh":"擷取定期的感應數據","lvl":0,"num":false},{"en":"Data analytics (extracts relevant information from massive amounts of raw data)","zh":"數據分析（從大量原始數據中提取相關資訊）","lvl":0,"num":false},{"en":"Streaming analytics (process real-time data)","zh":"串流分析（處理實時數據）","lvl":0,"num":false},{"en":"Ensures security and privacy of data","zh":"確保數據保安及私隱","lvl":0,"num":false},{"en":"Diagram: OSS (device modelling, device config & management, performance management, security management); BSS (billing, reporting); IoT/M2M application services – analytics platform (statistical analytics, data mining, in-motion analytics, text mining, in-memory analytics, predictive analytics); Data (governance, anonymity, repository, quality management); Security (access controls, encryption, identity access management); BRM (business rules); BPM (business process management)","zh":"圖示：營運支援系統（裝置建模、配置及管理、效能管理、保安管理）；業務支援系統（計費、報告）；物聯網／機器對機器應用服務——分析平台（統計分析、數據挖掘、動態分析、文字挖掘、記憶體內分析、預測分析）；數據（管治、匿名、儲存庫、質素管理）；保安（存取控制、加密、身份存取管理）；業務規則管理；業務流程管理","lvl":0,"num":false}]},"25":{"n":25,"en":"Integrated Application Layer (Layer 4)","zh":"整合應用層（第四層）","p":[{"en":"Provides a user interface for using IoT","zh":"提供使用物聯網的用戶介面","lvl":0,"num":false},{"en":"Different applications for various sectors like transportation, healthcare, agriculture, supply chains, government, retail, etc.","zh":"為不同行業提供不同應用，例如交通、醫療、農業、供應鏈、政府、零售等","lvl":0,"num":false},{"en":"Sector applications: environmental, energy, transportation, healthcare, retail… Horizontal applications: fleet management, asset management, supply chain, people tracking, surveillance…","zh":"行業應用：環境、能源、交通、醫療、零售⋯⋯橫向應用：車隊管理、資產管理、供應鏈、人員追蹤、監控⋯⋯","lvl":0,"num":false}]},"26":{"n":26,"en":"Smart Home Scenario","zh":"智能家居場景","p":[{"en":"Remote control of smart household {appliances|家用電器}","zh":"遙控智能家用電器","lvl":0,"num":false},{"en":"Remote monitoring of smart house","zh":"遙距監察智能家居","lvl":0,"num":false},{"en":"Devices: touch screens, air-conditioning, smoke & fire sensors, PIR (motion) sensor, electric curtain switch, temperature controller, wireless & magnetic sensors, spherical camera, infrared generator, emergency button, smart remote control","zh":"裝置：觸控屏、冷氣、煙霧及火警感應器、人體紅外線感應器、電動窗簾開關、溫度控制器、無線及磁力感應器、球形攝影機、紅外線發射器、緊急按鈕、智能遙控","lvl":0,"num":false}]},"27":{"n":27,"en":"Transportation Scenario","zh":"交通場景","p":[{"en":"Vehicle can interact with its surroundings","zh":"車輛可與周圍環境互動","lvl":0,"num":false},{"en":"Provide valuable feedback on local roads, weather and traffic conditions to the driver","zh":"向司機提供有關當地道路、天氣及交通狀況的寶貴資訊","lvl":0,"num":false},{"en":"Condition & event detection sensors can maintain driver & passenger comfort and safety","zh":"狀況及事件偵測感應器可保持司機和乘客的舒適及安全","lvl":0,"num":false},{"en":"Sensors for {fatigue|疲勞} and mood monitoring, driver behaviour and facial indicators can ensure safe driving","zh":"監察疲勞及情緒、司機行為及面部指標的感應器，可確保安全駕駛","lvl":0,"num":false}]},"28":{"n":28,"en":"Healthcare Scenario – Wearables","zh":"醫療場景——可穿戴裝置","p":[{"en":"Can IoT help us to know more about ourselves?","zh":"物聯網能幫助我們更了解自己嗎？","lvl":0,"num":false},{"en":"Where you're going? Who you've interacted with? How long you've spoken to friends? The {affinity|親密度} of connections? How long it takes to get to work? The tone of your messages? The amount you text, tweet or update? How much exercise you're getting? How much you get distracted?","zh":"你去哪裡？你和誰互動過？你和朋友談了多久？關係有多親密？上班要多久？你訊息的語氣？你發短訊、推文或更新的數量？你做了多少運動？你有多容易分心？","lvl":0,"num":false},{"en":"Example: heart rate 78 bpm, resting heart rate (RHR) 61","zh":"例子：心率每分鐘 78 下，靜止心率 61","lvl":0,"num":false}]},"29":{"n":29,"en":"Smart Waste Management Scenario","zh":"智能廢物管理場景","p":[{"en":"Garbage cans with low-cost passive sensors / active sensors → garbage trucks (as data collectors) → cloud platform that supports sensing as a service → city council, recycling plant, manufacturing plant, health & safety authorities","zh":"裝有低成本被動感應器／主動感應器的垃圾桶 → 垃圾車（作為數據收集者）→ 支援「感應即服務」的雲端平台 → 市議會、回收廠、製造廠、健康及安全當局","lvl":0,"num":false},{"en":"Infrastructure with access to energy sources and long-range data communication","zh":"可取得能源及長距離數據通訊的基建","lvl":0,"num":false},{"en":"Source: University of Manitoba (cs.umanitoba.ca)","zh":"資料來源：曼尼托巴大學","lvl":0,"num":false}]},"30":{"n":30,"en":"Smart Recycling Fleet Routing and Weighting System","zh":"智能回收車隊路線及稱重系統","p":[{"en":"Fill-level sensor provides real-time filling level & location of the bins/cages","zh":"容量感應器提供回收桶／籠的實時容量及位置","lvl":0,"num":false},{"en":"Generate timely alerts for recyclables collection","zh":"及時發出收集回收物的提示","lvl":0,"num":false},{"en":"Real-time cloud-based analytics platform for smart routing","zh":"以雲端實時分析平台規劃智能路線","lvl":0,"num":false},{"en":"IoT embedded cages; interactive map indicates the position of trucks","zh":"內置物聯網的回收籠；互動地圖顯示回收車位置","lvl":0,"num":false}]},"31":{"n":31,"en":"IoT for a Shopping Mall in Central to Collect Spatiotemporal Data","zh":"中環商場以物聯網收集時空數據","p":[{"en":"Using IoT sensors to collect {spatiotemporal|時空的} data of indoor air quality and people flow over time","zh":"使用物聯網感應器收集室內空氣質素及人流隨時間變化的時空數據","lvl":0,"num":false},{"en":"A time series of map visualization has been produced for studying","zh":"製作了時間序列地圖視覺化以作研究","lvl":0,"num":false},{"en":"Property management can address the needs of areas of interest – such as improving the air {ventilation|通風} or diverting the people flow","zh":"物業管理可針對重點區域的需要——例如改善通風或分流人群","lvl":0,"num":false},{"en":"Retail stores can target potential customers with information on people flow, gender and age during a specific time inside the shopping centre","zh":"零售店可利用特定時間商場內的人流、性別及年齡資料，鎖定潛在顧客","lvl":0,"num":false},{"en":"Where and when people like to {congregate|聚集}, and the duration","zh":"人們喜歡在何時何地聚集，以及停留多久","lvl":0,"num":false}]},"32":{"n":32,"en":"Smart Barrier System – GIS and IoT Integration","zh":"智能屏障系統——GIS 與物聯網整合","p":[{"en":"Smart Barrier allows real-time monitoring of falling {debris|碎石} and build-up","zh":"智能屏障可實時監察落石及堆積","lvl":0,"num":false},{"en":"It uses a web platform and mobile app to issue alerts to the authority","zh":"透過網上平台及手機應用程式向當局發出警報","lvl":0,"num":false},{"en":"IoT sensors include two depth gauge sensors, three impact switches, and two cameras (plus base station, digital camera, wireless impact switch)","zh":"物聯網感應器包括兩個深度計、三個撞擊開關及兩部攝影機（另有基站、數碼相機、無線撞擊開關）","lvl":0,"num":false}]},"33":{"n":33,"en":"IoT Applications & Compound Applications","zh":"物聯網應用及複合應用","p":[{"en":"Home (consumer): light bulbs, security, pet feeding, irrigation controller, smoke alarm, refrigerator, infotainment, washer/dryer, stove, energy monitoring","zh":"家居（消費者）：燈泡、保安、餵飼寵物、灌溉控制器、煙霧警報、雪櫃、資訊娛樂、洗衣機／乾衣機、爐具、能源監察","lvl":0,"num":false},{"en":"Transport (mobility): traffic routing, telematics, package monitoring, smart parking, insurance adjustments, supply chain, shipping, public transport, airlines, trains","zh":"交通（出行）：交通路線、車載資訊、包裹監察、智能泊車、保險調整、供應鏈、航運、公共交通、航空、鐵路","lvl":0,"num":false},{"en":"Health (body): patient care, elderly monitoring, remote diagnostics, equipment monitoring, hospital hygiene, bio wearables, food sensors","zh":"健康（身體）：病人護理、長者監察、遙距診斷、設備監察、醫院衞生、生物可穿戴裝置、食物感應器","lvl":0,"num":false},{"en":"Buildings (infrastructure): HVAC, security, lighting, electrical, transit, emergency alerts, structural integrity, occupancy, energy credits","zh":"建築（基建）：冷暖通風、保安、照明、電力、運輸、緊急警報、結構完整性、使用率、能源積分","lvl":0,"num":false},{"en":"Cities (industry): electrical distribution, maintenance, surveillance, signage, utilities/smart grid, emergency services, waste management","zh":"城市（工業）：電力分配、維修、監控、標誌、公用事業／智能電網、緊急服務、廢物管理","lvl":0,"num":false},{"en":"\"Things get interesting when these connected devices and services start creating **compound applications** within their own verticals and across industries\"","zh":"「當這些連接的裝置和服務開始在其本身行業內及跨行業創造『複合應用』時，事情就變得有趣」","lvl":0,"num":false}]},"34":{"n":34,"en":"IoT Challenges","zh":"物聯網的挑戰","p":[{"en":"Lack of standardization","zh":"缺乏標準化","lvl":0,"num":true},{"en":"Addressing issues","zh":"定址問題（每部裝置都需要網絡地址）","lvl":0,"num":true},{"en":"New network traffic patterns to handle","zh":"需要處理新的網絡流量模式","lvl":0,"num":true},{"en":"Device-level energy issues","zh":"裝置層面的能源問題","lvl":0,"num":true},{"en":"Security concerns","zh":"保安問題","lvl":0,"num":true},{"en":"Privacy issues","zh":"私隱問題","lvl":0,"num":true}]},"35":{"n":35,"en":"Home CCTV Camera Users Urged to Step Up Security (Consumer Council, 15 March 2017)","zh":"家居閉路電視用戶須加強保安（消費者委員會，2017 年 3 月 15 日）","p":[{"en":"The Consumer Council urged people who use surveillance cameras at home to step up security to avoid being hacked or having their privacy breached.","zh":"消委會呼籲在家中使用監控攝影機的人士加強保安，以免被入侵或私隱外洩。","lvl":0,"num":false},{"en":"The watchdog tested 40 models, most of which provide reliable IP addresses for direct connections.","zh":"消委會測試了 40 款型號，大部分提供可靠的 IP 地址作直接連接。","lvl":0,"num":false},{"en":"Consumers should note that cameras which use cloud accounts or peer-to-peer connections can be open to risks.","zh":"消費者應注意，使用雲端帳戶或點對點連接的攝影機可能有風險。","lvl":0,"num":false},{"en":"\"If the servers are situated in countries and regions where privacy protection is inadequate, users also may have higher risk of having their names and passwords stored in the servers stolen.\"","zh":"「如伺服器位於私隱保障不足的國家或地區，用戶儲存在伺服器的名稱及密碼被盜的風險亦可能較高。」","lvl":0,"num":false},{"en":"Consumers should change the default passwords regularly, and only use personal devices to access the cameras.","zh":"消費者應定期更改預設密碼，並只用個人裝置連接攝影機。","lvl":0,"num":false}]},"37":{"n":37,"en":"What is Big Data?","zh":"甚麼是大數據？","p":[{"en":"There is no single definition; from Wikipedia:","zh":"沒有單一定義；參考維基百科：","lvl":0,"num":false},{"en":"Big data is a term for data sets that are so {voluminous|大量的} and complex that traditional data processing application software is {inadequate|不足夠的} to deal with them. Challenges include capture, storage, analysis, data curation, search, sharing, transfer, visualization, querying, updating and information privacy.","zh":"大數據指數量龐大且複雜，以致傳統數據處理軟件不足以處理的數據集。挑戰包括擷取、儲存、分析、數據整理、搜尋、共享、傳送、視覺化、查詢、更新及資訊私隱。","lvl":1,"num":false},{"en":"The term tends to refer to the use of **predictive analytics, user behaviour analytics**, or certain other **advanced data analytics** methods that extract value from data, and seldom to a particular size of data set.","zh":"這個詞通常指使用預測分析、用戶行為分析或其他從數據提取價值的進階數據分析方法，而很少指特定的數據集大小。","lvl":1,"num":false},{"en":"Analysis of data sets can find new {correlations|相關性} to \"spot business trends, prevent diseases, combat crime and so on\".","zh":"分析數據集可找出新的相關性，以「發現商業趨勢、預防疾病、打擊罪案等」。","lvl":1,"num":false}]},"38":{"n":38,"en":"Data Never Sleeps! What Happens in an Internet Minute? (2025)","zh":"數據從不休息！互聯網一分鐘內發生甚麼？（2025）","p":[{"en":"World's internet population has reached a record high of 5.56B people (68% of global population)","zh":"全球上網人口創新高，達 55.6 億人（全球人口 68%）","lvl":0,"num":false},{"en":"**AI everywhere:** AI becomes a daily assistant for millions; Google searches dropped by 6%, from 6.3M to 5.9M per minute; Siri answers over 1 million questions every minute; Google's Gemini attracts 8,574 visitors per minute","zh":"AI 無處不在：AI 成為數以百萬人的日常助手；Google 搜尋下跌 6%，由每分鐘 630 萬次減至 590 萬次；Siri 每分鐘回答超過 100 萬條問題；Google Gemini 每分鐘吸引 8,574 名訪客","lvl":0,"num":false},{"en":"**Security in focus** – with more data comes more risk: 4,080 records compromised in data {breaches|外洩事故} every minute; emphasizes the need for enhanced cybersecurity and governance","zh":"保安成焦點——數據越多風險越大：每分鐘有 4,080 項紀錄在數據外洩事故中被盜；顯示需要加強網絡安全及管治","lvl":0,"num":false},{"en":"Other per-minute figures: TikTok 16,000 video uploads; Netflix 362,962 hours streamed; 18.8M text messages; YouTube 3,472,222 video views; 251.1M emails; 1.04M Slack messages; Zoom 288 people download; Amazon (Cyber Week) shoppers spend $443.6K; Snapchat 3.3M snaps; Microsoft Teams 229M meeting minutes","zh":"其他每分鐘數字：TikTok 上載 16,000 段影片；Netflix 串流 362,962 小時；1,880 萬條短訊；YouTube 3,472,222 次觀看；2.511 億封電郵；104 萬條 Slack 訊息；Zoom 288 人下載；網購周顧客消費 44.36 萬美元；Snapchat 330 萬個快照；Microsoft Teams 2.29 億會議分鐘","lvl":0,"num":false}]},"40":{"n":40,"en":"What's Driving the Growth of Data?","zh":"甚麼推動數據增長？","p":[{"en":"Volume & type of data: 10× data growth by 2016; 90% unstructured","zh":"數據量及類型：到 2016 年數據增長 10 倍；90% 屬非結構化","lvl":0,"num":false},{"en":"Lower cost of compute & storage: average server cost ▼40% (2002–2012); storage cost per GB ▼90% (2002–2012)","zh":"運算及儲存成本下降：平均伺服器成本下降 40%（2002–2012）；每 GB 儲存成本下降 90%（2002–2012）","lvl":0,"num":false},{"en":"New investments in tools & services: $3B (2010) → $7B (2012) → $17B (2017)","zh":"對工具及服務的新投資：30 億美元（2010）→ 70 億（2012）→ 170 億（2017）","lvl":0,"num":false}]},"41":{"n":41,"en":"Sources of Big Data","zh":"大數據的來源","p":[{"en":"Users; applications; systems; sensors","zh":"用戶；應用程式；系統；感應器","lvl":0,"num":false},{"en":"Mobile devices; microphones; readers/scanners; science facilities; programs/software; social media; cameras","zh":"流動裝置；咪高峰；讀取器／掃描器；科學設施；程式／軟件；社交媒體；攝影機","lvl":0,"num":false}]},"42":{"n":42,"en":"Types of Big Data","zh":"大數據的類型","p":[{"en":"Activity data; conversation data; photo & video image data; sensor data from IoT devices; real-time data; spatial data; spatiotemporal data","zh":"活動數據；對話數據；相片及影片影像數據；物聯網裝置的感應數據；實時數據；空間數據；時空數據","lvl":0,"num":false}]},"43":{"n":43,"en":"Structure of Big Data","zh":"大數據的結構","p":[{"en":"Unstructured · No {inherent|固有的} structure; stored as different types of files · Text documents, PDFs, images, videos · 文字文件、PDF、圖片、影片","zh":"非結構化 · 沒有固有結構，以不同類型檔案儲存","row":1},{"en":"Quasi-structured · Textual data with erratic formats that can be formatted with effort and software tools · Clickstream data","zh":"準結構化 · 格式不規則的文字數據，可花工夫用軟件整理 · 點擊流數據","row":1},{"en":"Semi-structured · Textual data files with an apparent pattern, enabling analysis · Spreadsheets, XML files · 試算表、XML 檔案","zh":"半結構化 · 有明顯模式的文字數據檔案，可作分析","row":1},{"en":"Structured · Data having a defined data model, format, structure · Database","zh":"結構化 · 有既定數據模型、格式及結構的數據 · 數據庫","row":1},{"en":"Increasing growth goes from structured (bottom) to unstructured (top) – unstructured data is growing fastest","zh":"增長由結構化（底部）往非結構化（頂部）遞增——非結構化數據增長最快","lvl":0,"num":false}]},"44":{"n":44,"en":"The Characteristics of Big Data – 5 Vs","zh":"大數據的特點——5V","p":[{"en":"**Volume** – the vast amounts of data generated every second (terabytes; records/archives; transactions; tables, files)","zh":"數量——每秒產生的海量數據（太位元組；紀錄／檔案；交易；表格、檔案）","lvl":0,"num":true},{"en":"**Velocity** – the speed at which new data is generated and the speed at which data moves around (batch; real/near-time; processes; streams)","zh":"速度——新數據產生的速度及數據流動的速度（批次；實時／接近實時；流程；串流）","lvl":0,"num":true},{"en":"**Veracity** – the messiness or trustworthiness of the data (trustworthiness; authenticity; origin, reputation; availability; accountability)","zh":"真實性——數據的混亂程度或可信度（可信度；真確性；來源、聲譽；可用性；問責性）","lvl":0,"num":true},{"en":"**Variety** – the different types of data that can now be used (structured; unstructured; multi-factor; {probabilistic|概率的})","zh":"多樣性——現在可使用的不同類型數據（結構化；非結構化；多因素；概率性）","lvl":0,"num":true},{"en":"**Value** – having access to big data is no good unless we can turn it into value (statistical; events; correlations; hypothetical)","zh":"價值——除非能轉化為價值，否則擁有大數據也沒有用（統計；事件；相關性；假設性）","lvl":0,"num":true}]},"45":{"n":45,"en":"How is Big Data Different?","zh":"大數據有何不同？","p":[{"en":"Massive scale 規模極大 · Large scale 規模大","zh":"","row":1},{"en":"Highly distributed 高度分散 · Highly centralized 高度集中","zh":"","row":1},{"en":"Unstructured: emails, audio/video, documents, spreadsheets, log files, sensor data, geo-spatial data, books, journals, blogs, text messages, chat sessions, search data · Structured: files, records, databases","zh":"非結構化：電郵、影音、文件、試算表、日誌、感應數據、地理空間數據、書籍、期刊、網誌、短訊、聊天、搜尋數據 · 結構化：檔案、紀錄、數據庫","row":1},{"en":"Random 隨機 · Sequential 順序","zh":"","row":1},{"en":"– · Indexed 已索引","zh":"","row":1},{"en":"Looking for patterns and relationships 尋找模式及關係 · Processing transactions 處理交易","zh":"","row":1}]},"46":{"n":46,"en":"Traditional Analytics vs Big Data Analytics","zh":"傳統分析與大數據分析比較","p":[{"en":"Focus on 重點 · Descriptive analytics; diagnosis analytics · Predictive analytics; data science","zh":"描述性分析；診斷性分析 · 預測分析；數據科學","row":1},{"en":"Data sets 數據集 · Limited data sets; cleansed data; simple models · Large-scale data sets; more types of data; raw data; complex data models","zh":"有限數據集；已清理數據；簡單模型 · 大型數據集；更多數據類型；原始數據；複雜數據模型","row":1},{"en":"Supports 支援 · {Causation|因果關係}: what happened, and why? · Correlation: new insight; more accurate answers","zh":"因果關係：發生了甚麼？為甚麼？ · 相關性：新洞見；更準確的答案","row":1}]},"47":{"n":47,"en":"Big Data & Location","zh":"大數據與位置","p":[{"en":"All IoT sensors have locations","zh":"所有物聯網感應器都有位置","lvl":0,"num":false},{"en":"The most common IoT sensor in smartphones – GPS receiver","zh":"智能手機最常見的物聯網感應器——GPS 接收器","lvl":0,"num":false},{"en":"All posts, photos and messages are tagged with phone or IP locations in social media","zh":"社交媒體上所有帖子、相片和訊息都帶有手機或 IP 位置標記","lvl":0,"num":false}]},"48":{"n":48,"en":"Find Spatial Relationships","zh":"找出空間關係","p":[{"en":"Seeing spatially enabled big data on a map allows users to answer questions & ask new ones","zh":"在地圖上查看具空間屬性的大數據，讓用戶回答問題並提出新問題","lvl":0,"num":false},{"en":"Where are disease {outbreaks|爆發} occurring?","zh":"疾病在哪裡爆發？","lvl":1,"num":false},{"en":"Where is insurance risk greatest given recently updated population shifts?","zh":"根據最新的人口變動，哪裡的保險風險最高？","lvl":1,"num":false},{"en":"Geographic thinking adds a new dimension to big data problem solving & helps users make sense of big data","zh":"地理思維為大數據解難增添新維度，幫助用戶理解大數據","lvl":0,"num":false},{"en":"Example map: Ebola outbreaks 1976–2014 (mostly in central & west Africa)","zh":"地圖例子：1976–2014 年伊波拉疫情（主要在中非及西非）","lvl":0,"num":false}]},"49":{"n":49,"en":"Perform Predictive Modeling","zh":"進行預測模型分析","p":[{"en":"Predictive modelling using spatially enabled big data helps users develop strategies from if/then scenarios","zh":"利用具空間屬性的大數據進行預測模型分析，幫助用戶從「如果／那麼」情境制定策略","lvl":0,"num":false},{"en":"Governments can use it to design disaster response plans","zh":"政府可用來設計災害應變計劃","lvl":1,"num":false},{"en":"Natural resource managers can analyse recovery of {wetlands|濕地} after a disaster","zh":"天然資源管理人員可分析災後濕地的復原情況","lvl":1,"num":false},{"en":"Health service organizations can identify the spread of disease and ways to {contain|控制} it","zh":"醫療服務機構可找出疾病的傳播方式及控制方法","lvl":1,"num":false}]},"50":{"n":50,"en":"Issues of Big Data","zh":"大數據的問題","p":[{"en":"Data privacy; data security; data storage; data accuracy; data existence","zh":"數據私隱；數據保安；數據儲存；數據準確度；數據存在性（數據是否存在）","lvl":0,"num":false}]}},"secs":{"A1":{"en":"A1. Review: Three HK Open Data Websites (Your Class Notes)","zh":"溫習：香港三個開放數據網站（你的課堂筆記）","p":[{"en":"**DATA.GOV.HK** – can download data and use applications for the city, especially the City Dashboard: (1) traffic & transport; (2) public facilities & services; (3) environment & weather; (4) city at a glance; (5) …","zh":"資料一線通——可下載數據及使用城市應用程式，特別是城市儀表板：(1) 交通及運輸；(2) 公共設施及服務；(3) 環境及天氣；(4) 城市概覽；(5) ⋯⋯","lvl":0,"num":true},{"en":"**CEDD** – open data plan (annually).","zh":"土木工程拓展署——開放數據計劃（每年）。","lvl":0,"num":true},{"en":"**CSDI Portal** – \"Open 3D HK\" for 3D data & models of HK.","zh":"空間數據共享平台——「開放三維香港」提供香港三維數據及模型。","lvl":0,"num":true},{"h":2,"kind":"key","en":"★ Difference: Open 3D HK vs 3D model in Google","zh":""},{"en":"Open 3D HK is **created by the government** and is **updated**; Google's 3D model may be **outdated** (e.g., buildings under construction are not shown correctly).","zh":"開放三維香港由政府製作並會更新；Google 的三維模型可能過時（例如興建中的建築物未能正確顯示）。","kind":"key"}],"terms":[["City Dashboard","城市儀表板","資料一線通的網頁，以地圖和圖表顯示交通、公共設施、環境天氣等實時城市數據。"],["Open 3D HK","開放三維香港","CSDI 上的政府三維數據及模型；比 Google 三維模型更新、更準確。"]]},"A2":{"en":"A2. What Is the Internet of Things (IoT)?","zh":"甚麼是物聯網？","p":[{"en":"IoT means **everything is connected**. It ties together the **physical, digital and analytic** worlds. IoT allows people and things to be connected **Anytime, Anyplace, with Anything and Anyone, using Any Network and Any Service** (the 6 \"Any\"s).","zh":"物聯網的意思是「萬物互聯」，把實體、數碼和分析世界連結起來。物聯網讓人和物件可以在任何時間、任何地點，與任何物件和任何人，透過任何網絡和任何服務連接（六個「任何」）。"},{"h":2,"kind":"key","en":"Formal definition (ITU / IERC)","zh":""},{"en":"IoT = \"A global infrastructure for the information society, enabling advanced services by {interconnecting|互相連接} (physical & virtual) things based on existing & evolving {interoperable|可互通的} information & communication technologies.\"","zh":"物聯網＝「資訊社會的全球基建，以現有及不斷發展、可互通的資訊及通訊科技，把（實體及虛擬）物件互相連接，從而提供先進服務。」","kind":"key"},{"en":"**IoT evolution:** Pre-Internet (human to human: phone, SMS) → Internet of Content (WWW: email, information) → Internet of Services (Web 2.0: e-commerce) → Internet of People (social media: Skype, Facebook, YouTube) → **Internet of Things** (machine to machine: identification, tracking, monitoring, automation).","zh":"物聯網的演變：互聯網前（人對人：電話、短訊）→ 內容互聯網（萬維網：電郵、資訊）→ 服務互聯網（Web 2.0：電子商貿）→ 人的互聯網（社交媒體）→ 物聯網（機器對機器：識別、追蹤、監察、自動化）。","lvl":0,"num":false},{"en":"**5 characteristics:** dynamic changes; {heterogeneity|異質性}; things-related services; inter-connectivity; enormous scale.","zh":"五大特點：動態變化；異質性；與物件相關的服務；互聯性；規模龐大。","lvl":0,"num":false}],"terms":[["Internet of Things (IoT)","物聯網","萬物互聯：把實體物件、數碼世界和分析世界連結起來，讓人和物件在任何時間、地點互相連接。"],["Interoperable","可互通的","不同系統或裝置可以互相溝通和合作。"],["M2M (Machine to Machine)","機器對機器","裝置之間自動交換數據，毋須人類參與；物聯網的核心。"],["Heterogeneity","異質性","物聯網由很多不同種類的裝置和網絡組成。"],["Protocol","通訊協定","裝置之間傳送數據時要遵守的規則。"]]},"A3":{"en":"A3. The 4-Layer Architecture of IoT","zh":"物聯網的四層架構","p":[{"en":"This is the most important framework in the lecture. Learn it from the bottom (layer 1) to the top (layer 4).","zh":"這是本課最重要的框架。由底層（第 1 層）到頂層（第 4 層）學習。"},{"en":"4. Integrated Application Layer · Information application – user interface for IoT · Smart home, transport, healthcare, waste management, retail","zh":"整合應用層 · 資訊應用——物聯網的用戶介面 · 智能家居、交通、醫療、廢物管理、零售","row":1},{"en":"3. Management Layer · Information processing – capture data, data analytics, streaming analytics, security & privacy · Analytics platform, data mining, predictive analytics","zh":"管理層 · 資訊處理——擷取數據、數據分析、串流分析、保安及私隱 · 分析平台、數據挖掘、預測分析","row":1},{"en":"2. Network Construction Layer · Information transmission – robust, high-performance network (latency, bandwidth, security) · GSM, LTE, 5G, Wi-Fi, Bluetooth, Zigbee, NB-IoT, LoRa","zh":"網絡建構層 · 資訊傳送——穩健、高效能網絡（延遲、頻寬、保安） · 各種流動、無線及低功耗網絡","row":1},{"en":"1. Sensor & Identification Layer · Information generation – sensors measure the physical world (\"digital nervous system\") · Barcode, QR code, RFID, smartphone sensors, GPS · 條碼、二維碼、RFID、手機感應器、GPS","zh":"感應及識別層 · 資訊產生——感應器量度實體世界（「數碼神經系統」）","row":1},{"h":2,"kind":"tip","en":"Memory trick","zh":""},{"en":"Bottom to top: **Generate → Transmit → Process → Apply** (\"Sensors, Network, Manage, App\" = \"SNMA\").","zh":"由下至上：產生 → 傳送 → 處理 → 應用（感應、網絡、管理、應用）。","kind":"tip"},{"h":1,"en":"Layer 1 key technologies","zh":"第一層主要技術"},{"en":"**Barcode & QR code:** low cost, no technological difficulties, many devices can read them, a starting point for more complex systems.","zh":"條碼及二維碼：成本低、沒有技術難度、很多裝置都可讀取，是更複雜系統的起點。","lvl":0,"num":false},{"en":"**RFID:** reader + tag (microchip + {antenna|天線}); one of the smallest IoT components that collects data; widely used in transport and logistics (library, luggage, sports, asset tracking, IVU, inventory, **HKeToll**).","zh":"RFID：讀取器＋標籤（微晶片＋天線）；收集數據的最小物聯網組件之一；廣泛用於交通及物流（圖書館、行李、運動、資產追蹤、車內裝置、存貨、易通行）。","lvl":0,"num":false},{"en":"**Smartphone sensors:** 14 sensors – accelerometer, gyroscope, magnetometer, barometer, proximity, light sensor, touch screen, GPS, Wi-Fi, Bluetooth, GSM/CDMA, NFC, front & back cameras.","zh":"手機感應器：14 個——加速度計、陀螺儀、磁力計、氣壓計、近距感應器、光感應器、觸控屏、GPS、Wi-Fi、藍牙、GSM/CDMA、近場通訊、前後鏡頭。","lvl":0,"num":false},{"h":1,"en":"Layer 2 key networks","zh":"第二層主要網絡"},{"en":"Telecom 電訊系統 · 100s m – 10s km · Low/moderate · GSM, UMTS, LTE (4G), 5G","zh":"","row":1},{"en":"WLAN 無線區域網絡 · 10s – 100s m · Moderate/high · Wi-Fi (IEEE 802.11)","zh":"","row":1},{"en":"Short range 短距離 · Very short · Low; very long battery · Bluetooth, Zigbee, Z-wave, NB-IoT","zh":"","row":1},{"en":"LPWA 低功耗廣域 · Very wide (km) · Low · NB-IoT, LoRa","zh":"","row":1},{"en":"Older (2015) · Newer (2017)","zh":"較舊 · 較新","row":1},{"en":"**Unlicensed** spectrum · **Licensed** frequency bands","zh":"免牌照頻譜 · 持牌頻段","row":1},{"en":"Lower cost per device (but gateway needed) · Higher cost per device (no gateway needed)","zh":"每部裝置成本較低（但需要閘道器） · 每部裝置成本較高（毋須閘道器）","row":1},{"en":"Longer battery life · Shorter battery life","zh":"電池壽命較長 · 電池壽命較短","row":1},{"en":"High latency / less frequent data · Low latency / more frequent data","zh":"延遲高／數據傳送較少 · 延遲低／數據傳送較頻密","row":1},{"en":"7–10 mile range; better rural performance · 11–13 mile range; better urban performance","zh":"7–10 英里；郊區表現較好 · 11–13 英里；市區表現較好","row":1},{"en":"Lower data rates · Higher data rates (10× LoRa) · 數據速率較高（LoRa 的 10 倍）","zh":"數據速率較低","row":1},{"en":"**5G:** 5th generation cellular network (from 2018) – dramatically increases speed, response time and capacity for billions of devices. (3G 384 Kbps → 4G 100 Mbps → 5G 10 Gbps.)","zh":"5G：第五代流動網絡（2018 年起）——大幅提升速度、反應時間及連接數十億裝置的容量。（3G 384 Kbps → 4G 100 Mbps → 5G 10 Gbps。）","lvl":0,"num":false}],"terms":[["Sensor & Identification Layer","感應及識別層（第 1 層）","物聯網最底層，用感應器量度實體世界並產生資訊，像「數碼神經系統」。"],["Network Construction Layer","網絡建構層（第 2 層）","負責傳送資訊的網絡，要符合延遲、頻寬和保安的要求。"],["Management Layer","管理層（第 3 層）","擷取、分析和處理數據，並確保保安和私隱。"],["Integrated Application Layer","整合應用層（第 4 層）","最頂層，提供用戶介面和各行業的應用。"],["RFID","無線射頻識別","由讀取器和標籤（微晶片＋天線）組成，以無線電讀取資料；例如易通行。"],["QR code","二維碼","成本低、容易讀取的二維條碼，是更複雜系統的起點。"],["Bandwidth","頻寬","網絡每秒可以傳送的數據量。"],["WLAN (Wi-Fi)","無線區域網絡","覆蓋數十至數百米的無線網絡，成本低、普遍。"],["NB-IoT","窄頻物聯網","使用持牌頻譜的低功耗廣域網絡；延遲低、速度快、適合市區。"],["LoRa / LoRaWAN","遠距離無線電","使用免牌照頻譜的低功耗廣域網絡；成本低、電池耐用、適合郊區，但需要閘道器。"],["LPWA","低功耗廣域","耗電極低、覆蓋範圍很廣的網絡類型，適合大量物聯網感應器。"],["5G","第五代流動網絡","速度可達 10 Gbps，大幅提升速度、反應時間和連接數十億裝置的容量。"],["Streaming analytics","串流分析","在數據不斷流入時即時分析，而不是儲存後才分析。"]]},"A4":{"en":"A4. IoT Applications and Challenges","zh":"物聯網的應用與挑戰","p":[{"en":"Scenarios: smart home (remote control & monitoring); transportation (vehicle talks to surroundings, fatigue sensors); healthcare wearables; smart waste management; smart recycling fleet routing; shopping mall in Central (indoor air quality + people flow); Smart Barrier (falling debris on slopes).","zh":"應用場景：智能家居（遙控及監察）；交通（車輛與周圍溝通、疲勞感應器）；醫療可穿戴裝置；智能廢物管理；智能回收車隊路線；中環商場（室內空氣質素＋人流）；智能屏障（斜坡落石）。","lvl":0,"num":false},{"en":"**Compound applications:** things get interesting when connected devices and services combine within and across industries (home, health, transport, buildings, cities).","zh":"複合應用：當連接的裝置和服務在行業內及跨行業結合時，就會產生更有趣的應用（家居、健康、交通、建築、城市）。","lvl":0,"num":false},{"en":"**6 IoT challenges:** (1) lack of standardization; (2) addressing issues; (3) new network traffic patterns to handle; (4) device-level energy issues; (5) security concerns; (6) privacy issues. Example: Consumer Council (2017) warned home CCTV camera users to step up security.","zh":"物聯網六大挑戰：(1) 缺乏標準；(2) 定址問題；(3) 需處理新的網絡流量模式；(4) 裝置層面的能源問題；(5) 保安問題；(6) 私隱問題。例子：消費者委員會（2017）提醒家居閉路電視用戶加強保安。","lvl":0,"num":false}],"terms":[["Spatiotemporal data","時空數據","同時帶有位置和時間的數據，例如商場人流隨時間的變化。"],["Smart Barrier","智能屏障","在斜坡屏障裝上深度計、撞擊開關和攝影機，實時監察落石並向當局發出警報。"],["Compound application","複合應用","不同行業的連接裝置和服務結合而產生的新應用。"],["Addressing issues","定址問題","數十億裝置每部都需要獨一無二的網絡地址。"]]},"A5":{"en":"A5. Big Data","zh":"大數據","p":[{"en":"Billions of connected IoT devices create vast amounts of data, and data exchange creates even more → we need **data analytics** to find insights and trends. This is Big Data.","zh":"數十億連接的物聯網裝置產生大量數據，裝置之間交換數據又產生更多數據 → 我們需要數據分析去找出洞見和趨勢。這就是大數據。"},{"h":2,"kind":"key","en":"Definition (Wikipedia)","zh":""},{"en":"Big data = data sets so **{voluminous|大量的}** and complex that traditional data-processing software cannot deal with them. It usually refers to **predictive analytics, user behaviour analytics** or other advanced analytics that extract value from data – not a particular size.","zh":"大數據＝數量龐大且複雜，傳統數據處理軟件無法處理的數據集。它通常指從數據中提取價值的預測分析、用戶行為分析或其他進階分析方法——而非特定的數據大小。","kind":"key"},{"h":1,"en":"The 5 Vs of Big Data (very important!)","zh":"大數據的 5V（非常重要！）"},{"en":"Volume 數量 · The vast amounts of data generated every second (terabytes, records, tables, files)","zh":"每秒產生的海量數據","row":1},{"en":"Velocity 速度 · The speed at which new data is generated and moves around (batch, real-time, streams)","zh":"新數據產生及流動的速度","row":1},{"en":"Veracity 真實性 · The messiness or trustworthiness of the data (authenticity, origin, accountability)","zh":"數據的混亂程度或可信度","row":1},{"en":"Variety 多樣性 · The different types of data (structured, unstructured, multi-factor)","zh":"不同類型的數據","row":1},{"en":"Value 價值 · Big data is no good unless we can turn it into value (statistical, correlations)","zh":"除非能轉化為價值，否則大數據沒有用","row":1},{"en":"**Structure** (from most to least growth): unstructured (text, PDFs, images, videos) → quasi-structured (clickstream data) → semi-structured (spreadsheets, XML) → structured (databases).","zh":"結構（增長由多到少）：非結構化（文字、PDF、圖片、影片）→ 準結構化（點擊流數據）→ 半結構化（試算表、XML）→ 結構化（數據庫）。","lvl":0,"num":false},{"en":"**Traditional analytics (BI)** = descriptive/diagnostic, limited clean data, causation (\"what happened and why\"). **Big data analytics** = predictive/data science, large raw data, **correlation** (new insight, more accurate answers).","zh":"傳統分析（商業智能）＝描述／診斷性、有限的已清理數據、因果關係（「發生了甚麼、為何」）。大數據分析＝預測／數據科學、大量原始數據、相關性（新洞見、更準確的答案）。","lvl":0,"num":false},{"h":1,"en":"Big Data + Location = GIS","zh":"大數據＋位置＝GIS"},{"en":"All IoT sensors have locations; the most common sensor in smartphones is the GPS receiver; social media posts are tagged with phone or IP locations.","zh":"所有物聯網感應器都有位置；手機最常見的感應器是 GPS 接收器；社交媒體帖子都帶有手機或 IP 位置。","lvl":0,"num":false},{"en":"With GIS we can **find spatial relationships** (where are disease outbreaks? e.g., Ebola 1976–2014) and **perform predictive modelling** (if/then scenarios for disaster response, wetland recovery, disease spread).","zh":"透過 GIS 可以找出空間關係（疾病在哪裡爆發？例如 1976–2014 年伊波拉）及進行預測模型（以「如果／那麼」情境規劃災害應變、濕地復原、疾病傳播）。","lvl":0,"num":false},{"en":"**Issues of big data:** data privacy, data security, data storage, data accuracy, data existence. → Can **aggregate information** help? (Yes – removing personal identities protects privacy while keeping value.)","zh":"大數據的問題：數據私隱、數據保安、數據儲存、數據準確度、數據存在性。→ 匯總資訊能幫忙嗎？（能——移除個人身份可保障私隱，同時保留數據價值。）","lvl":0,"num":false}],"terms":[["Big data","大數據","數量龐大和複雜、傳統軟件無法處理的數據；重點是用預測分析等方法提取價值，而非特定大小。"],["5 Vs","大數據 5V","Volume 數量、Velocity 速度、Veracity 真實性、Variety 多樣性、Value 價值。"],["Structured / Semi-structured / Quasi-structured / Unstructured","結構化／半結構化／準結構化／非結構化","由有固定格式（數據庫）到完全沒有格式（影片、相片）；非結構化數據增長最快。"],["Predictive analytics","預測分析","利用數據預測未來會發生甚麼，是大數據分析的重點。"],["Correlation vs causation","相關性與因果關係","相關性＝兩件事一起變化；因果關係＝一件事導致另一件事。大數據分析找相關性，傳統分析找因果。"],["Business Intelligence (BI)","商業智能","傳統分析：以有限、已清理的數據描述「發生了甚麼、為何」。"],["Predictive modelling","預測模型","以「如果……那麼……」情境推算結果，例如規劃災害應變。"]]}}},"L5":{"slides":{"3":{"n":3,"en":"Artificial Intelligence (AI) – We Can't Survive Without Data","zh":"人工智能——沒有數據就無法生存","p":[{"en":"**Artificial Intelligence:** the theory and methods to build machines that think and act like humans","zh":"人工智能：建造像人一樣思考和行動的機器的理論和方法","lvl":0,"num":false},{"en":"**Machine Learning:** the ability for computers to learn from experience or data without human programming","zh":"機器學習：電腦毋須人類編程，從經驗或數據中學習的能力","lvl":0,"num":false},{"en":"**Deep Learning:** mimics the human brain using artificial {neural networks|神經網絡} such as **transformers** to allow computers to perform complex tasks","zh":"深度學習：以 transformer 等人工神經網絡模仿人腦，讓電腦執行複雜任務","lvl":0,"num":false},{"en":"**Generative AI:** generates new text, audio, images, video or code based on content it has been **pre-trained** on (ChatGPT, Midjourney, Bard)","zh":"生成式 AI：根據預先訓練的內容生成新的文字、聲音、圖片、影片或程式碼（ChatGPT、Midjourney、Bard）","lvl":0,"num":false},{"en":"Source: aiforeducation.io – Generative AI explainer","zh":"資料來源：aiforeducation.io——生成式 AI 解說","lvl":0,"num":false}]},"4":{"n":4,"en":"Evolution of AI","zh":"AI 的演變","p":[{"en":"1950 · Paper about machine's human ability (Turing) 有關機器具人類能力的論文（圖靈）","zh":"","row":1},{"en":"1956 · Term \"AI\" coined at Dartmouth by John McCarthy 「人工智能」一詞在達特茅斯由 John McCarthy 提出","zh":"","row":1},{"en":"1995 · Predator UAV used by US DoD in war 美國國防部在戰爭中使用「掠奪者」無人機","zh":"","row":1},{"en":"1997 · IBM Deep Blue defeats Garry Kasparov at chess IBM 深藍在國際象棋擊敗卡斯帕羅夫","zh":"","row":1},{"en":"2011 · IBM Watson defeats Ken Jennings on Jeopardy; Apple introduces Siri IBM Watson 在 Jeopardy 擊敗 Ken Jennings；蘋果推出 Siri","zh":"","row":1},{"en":"2012 · Google self-driving cars Google 自動駕駛汽車","zh":"","row":1},{"en":"2014 · Facebook DeepFace (near-human accuracy); Amazon Alexa; Microsoft Cortana Facebook DeepFace（接近人類準確度）；亞馬遜 Alexa；微軟 Cortana","zh":"","row":1},{"en":"2015 · Google self-driving cars cross the 1-million-mile mark autonomously Google 自動駕駛汽車自主行駛突破 100 萬英里","zh":"","row":1},{"en":"2016 · Google DeepMind's AlphaGo defeats Lee Sedol at Go; Uber pilots self-driving car programme in Pittsburgh AlphaGo 在圍棋擊敗李世石；Uber 在匹茲堡試行自動駕駛","zh":"","row":1},{"en":"2022 · Generative AI – ChatGPT available to public testing 生成式 AI——ChatGPT 開放公眾測試","zh":"","row":1},{"en":"2024 · Agentic AI 代理式 AI","zh":"","row":1},{"en":"1950–1970: AI as a concept, no real application. 1980–2000: military & academia begin to show interest in AI. 2005 onwards: large tech companies invest in commercial applications of AI & ML.","zh":"1950–1970：AI 只是概念，沒有實際應用。1980–2000：軍方及學術界開始關注 AI。2005 年後：大型科技公司投資 AI 及機器學習的商業應用。","lvl":0,"num":false}]},"5":{"n":5,"en":"What is Generative AI?","zh":"甚麼是生成式 AI？","p":[{"en":"Generative AI is a type of Artificial Intelligence (AI) that uses machine learning {algorithms|演算法} to create new content like images, videos, text, and audio.","zh":"生成式 AI 是一種使用機器學習演算法創造新內容（例如圖片、影片、文字和聲音）的人工智能。","lvl":0,"num":false},{"en":"**Forming a database:** a neural network consisting of various information or media files like images, text, data, sounds, etc. forms the basis of artificial intelligence","zh":"建立數據庫：由圖片、文字、數據、聲音等各種資訊或媒體檔案組成的神經網絡，構成人工智能的基礎","lvl":0,"num":true},{"en":"**Inputting a prompt:** the user provides the AI with a description or sample of the desired content (prompts can be user-submitted materials, words, numbers or photos)","zh":"輸入提示：用戶向 AI 提供想要內容的描述或樣本（提示可以是用戶提交的材料、文字、數字或相片）","lvl":0,"num":true},{"en":"**Generating content:** the AI uses its neural network to generate new examples that are similar to the ones it has trained from","zh":"生成內容：AI 利用其神經網絡生成與訓練內容相似的新例子","lvl":0,"num":true},{"en":"Source: Visual Capitalist (image created on Midjourney)","zh":"資料來源：Visual Capitalist（圖片由 Midjourney 製作）","lvl":0,"num":false}]},"6":{"n":6,"en":"Generative AI Examples","zh":"生成式 AI 例子","p":[{"en":"**Text generation AI** – ChatGPT: input prompt (e.g., \"write a limerick about data taking over the world\") → output text. Real-life: communications, journalism, publishing, creative writing","zh":"文字生成 AI——ChatGPT：輸入提示（例如「寫一首關於數據統治世界的打油詩」）→ 輸出文字。實際應用：傳訊、新聞、出版、創意寫作","lvl":0,"num":false},{"en":"**Image generation AI** – Midjourney: prompt (e.g., \"a rabbit wearing a sunhat; Santa Claus in a blue outfit; a watercolor of a red bicycle\") → image. Real-life: advertisements, illustrations, corporate visuals","zh":"圖片生成 AI——Midjourney：提示（例如「戴太陽帽的兔子；穿藍衣的聖誕老人；紅色單車水彩畫」）→ 圖片。實際應用：廣告、插圖、企業視覺","lvl":0,"num":false},{"en":"**Coding generation AI** – Codex: prompt (e.g., \"write script to change a website's background colour in Python\") → code. Real-life: web design, software development, coding/scripting","zh":"編程生成 AI——Codex：提示（例如「用 Python 寫程式改變網站背景顏色」）→ 程式碼。實際應用：網頁設計、軟件開發、編程","lvl":0,"num":false}]},"7":{"n":7,"en":"\"Generative AI\" Fever","zh":"「生成式 AI」熱潮","p":[{"en":"The landscape of the generative AI market is diverse, {encompassing|包括} both established tech giants & startups","zh":"生成式 AI 市場多元化，包括老牌科技巨頭和初創企業","lvl":0,"num":false},{"en":"**Western leaders:** OpenAI – ChatGPT, GPT-4; Google – Gemini, Bard; Microsoft – Azure AI, Copilot","zh":"西方領導者：OpenAI——ChatGPT、GPT-4；Google——Gemini、Bard；微軟——Azure AI、Copilot","lvl":0,"num":false},{"en":"**Eastern leaders:** DeepSeek AI – DeepSeek; Baidu – ERNIE Bot 文心一言; Alibaba – Qwen 通義千問; ByteDance – Doubao 豆包","zh":"東方領導者：DeepSeek；百度——文心一言；阿里巴巴——通義千問；字節跳動——豆包","lvl":0,"num":false}]},"8":{"n":8,"en":"Generative AI Use Cases","zh":"生成式 AI 的應用","p":[{"en":"**Healthcare:** medical image synthesis for diagnostics; drug discovery and development; personalized medicine and treatment plans","zh":"醫療：用於診斷的醫學影像合成；藥物研發；個人化醫療及治療方案","lvl":0,"num":false},{"en":"**Finance & trading:** algorithmic trading strategies; predictive market analysis; high-frequency trading algorithms","zh":"金融及交易：演算法交易策略；預測市場分析；高頻交易演算法","lvl":0,"num":false},{"en":"**Content creation:** art and music generation; automated content creation for marketing; virtual assistants and chatbots","zh":"內容創作：藝術及音樂生成；自動化市場推廣內容；虛擬助理及聊天機械人","lvl":0,"num":false},{"en":"**Natural Language Processing (NLP):** text generation for content creation; {sentiment analysis|情感分析}; language translation and sentiment analysis … more","zh":"自然語言處理：生成文字內容；情感分析；語言翻譯及情感分析⋯⋯及更多","lvl":0,"num":false}]},"9":{"n":9,"en":"Challenges of Generative AI (1)","zh":"生成式 AI 的挑戰（一）","p":[{"en":"Misinformation","zh":"錯誤資訊","lvl":0,"num":false},{"en":"{Hallucinations|幻覺（AI 編造內容）}","zh":"幻覺（AI 自信地給出錯誤或虛構的答案）","lvl":0,"num":false},{"en":"{Profanity|粗言穢語} changes","zh":"粗言穢語變化","lvl":0,"num":false},{"en":"Biased outputs","zh":"偏頗的輸出","lvl":0,"num":false},{"en":"Intellectual property {infringement|侵權}","zh":"侵犯知識產權","lvl":0,"num":false},{"en":"Privacy concerns","zh":"私隱問題","lvl":0,"num":false},{"en":"Manipulation and {impersonation|冒充}","zh":"操控及冒充","lvl":0,"num":false},{"en":"Unintended consequences","zh":"意外後果","lvl":0,"num":false}]},"10":{"n":10,"en":"Challenges of Generative AI (2) – In the News","zh":"生成式 AI 的挑戰（二）——新聞例子","p":[{"en":"Bloomberg: Samsung bans staff's AI use after spotting ChatGPT data **leak**","zh":"彭博：三星發現 ChatGPT 數據外洩後禁止員工使用 AI","lvl":0,"num":false},{"en":"Amazon, Apple and 12 other major companies have restricted employees from using ChatGPT; Amazon warns employees not to share confidential information with ChatGPT after seeing answers that closely match existing material from inside the company","zh":"亞馬遜、蘋果等 14 間大公司限制員工使用 ChatGPT；亞馬遜發現 ChatGPT 的答案與公司內部資料極相似後，警告員工不要分享機密資料","lvl":0,"num":false},{"en":"MSSP Alert: ransomware crews develop GenAI tools for **cyberattacks**","zh":"MSSP Alert：勒索軟件集團開發生成式 AI 工具作網絡攻擊","lvl":0,"num":false},{"en":"Forbes: lawyer used ChatGPT in court – and cited **fake** cases; a judge is considering sanctions","zh":"《福布斯》：律師在法庭使用 ChatGPT——引用虛構案例；法官考慮制裁","lvl":0,"num":false},{"en":"Reuters: judge pares down artists' AI **copyright** lawsuit against Midjourney, Stability AI","zh":"路透社：法官縮減藝術家對 Midjourney、Stability AI 的 AI 版權訴訟","lvl":0,"num":false}]},"11":{"n":11,"en":"Hong Kong Generative AI Research and Development Center (HKGAI)","zh":"香港生成式人工智能研發中心","p":[{"en":"Under InnoHK and the Innovation and Technology Commission; collaborates with top universities to jointly promote AI in Hong Kong","zh":"屬 InnoHK 及創新科技署轄下；與頂尖大學合作推動香港 AI 發展","lvl":0,"num":false},{"en":"Products: HKPilot 港文通; HKChat 港話通; LexiHK 港法通; HKEcoLink 港環通; HKMeeting 港會通","zh":"產品：港文通；港話通；港法通；港環通；港會通","lvl":0,"num":false},{"en":"Building local AI capabilities customized for HK's public service, legal, and multilingual needs","zh":"建立為香港公共服務、法律及多語需要而設的本地 AI 能力","lvl":0,"num":false}]},"12":{"n":12,"en":"What is Agentic AI?","zh":"甚麼是代理式 AI？","p":[{"en":"Agentic AI does not need human input all the time but makes decisions and carries out the task on its own, relying on advanced algorithms in learning from data and improvements over time.","zh":"代理式 AI 毋須人類時刻輸入，而是依靠先進演算法從數據中學習並不斷改進，自行作決定並執行任務。","lvl":0,"num":false},{"en":"Process: natural language input → interpretation & reasoning → workflow generation → workflow execution → output/outcome (learning & course correction, e.g., through reinforcement learning)","zh":"流程：自然語言輸入 → 理解及推理 → 生成工作流程 → 執行工作流程 → 輸出／結果（透過強化學習等方式學習及修正方向）","lvl":0,"num":false}]},"13":{"n":13,"en":"Agentic AI vs Generative AI","zh":"代理式 AI 與生成式 AI 比較","p":[{"en":"Autonomous 自主 · Creative 創意","zh":"","row":1},{"en":"Goal-oriented 以目標為導向 · Output-oriented 以輸出為導向","zh":"","row":1},{"en":"Real-time environment 實時環境 · Content-based 以內容為本","zh":"","row":1},{"en":"Utilize tools & APIs 使用工具及 API · No external tools 不使用外部工具","zh":"","row":1},{"en":"Continuous adaptation 持續適應 · No adaptation from real-time 不會因實時情況而調整","zh":"","row":1},{"en":"Autonomous systems 自主系統 · Content creation 內容創作","zh":"","row":1},{"en":"Independent decision making 獨立決策 · Make decision based on input patterns 根據輸入模式作決定","zh":"","row":1}]},"14":{"n":14,"en":"GeoAI – Building Next-Generation Location Intelligence Tool","zh":"GeoAI——建立新一代位置智能工具","p":[{"en":"Geospatial Artificial Intelligence: **See, Read, Analyze, Learn, Create**","zh":"地理空間人工智能：看、讀、分析、學習、創造","lvl":0,"num":false},{"en":"See: object detection, object tracking, point cloud classification, land cover classification","zh":"看：物件偵測、物件追蹤、點雲分類、土地覆蓋分類","lvl":0,"num":false},{"en":"Read: entity extraction, text classification, text to shape","zh":"讀：實體提取、文字分類、文字轉形狀","lvl":0,"num":false},{"en":"Analyze: prediction, clustering, classification, forecasting, regression, model explainability","zh":"分析：預測、聚類、分類、預報、迴歸、模型可解釋性","lvl":0,"num":false},{"en":"Learn: GeoAI Studio, GeoAI Toolbox, arcgis.learn, AutoML & AutoDL, AI-assisted labelling","zh":"學習：GeoAI Studio、GeoAI 工具箱、arcgis.learn、自動機器學習及自動深度學習、AI 輔助標註","lvl":0,"num":false},{"en":"Create: super-resolution, 3D reconstruction, generative modelling, translation, cloud removal","zh":"創造：超解像、三維重建、生成模型、翻譯、去除雲層","lvl":0,"num":false}]},"15":{"n":15,"en":"Swimming Pool Detection using Aerial Photos","zh":"以航空照片偵測泳池","p":[{"en":"Detected pools within residential parcels","zh":"偵測住宅地段內的泳池","lvl":0,"num":false},{"en":"Tools for labelling and exporting training data","zh":"標註及匯出訓練數據的工具","lvl":0,"num":false},{"en":"Purposes: property tax assessment; maintenance companies; mosquito control","zh":"用途：物業稅評估；維修公司；滅蚊","lvl":0,"num":false},{"en":"Automatically find neglected pools (e.g., Redlands)","zh":"自動找出被棄置的泳池（例如雷德蘭茲）","lvl":0,"num":false}]},"16":{"n":16,"en":"Parking Lot Vehicle Detection – Visualize Results on Operations Dashboard","zh":"停車場車輛偵測——在運作儀表板顯示結果","p":[{"en":"Drone/aerial image of a car park: AI detects each vehicle; results (occupancy) shown on an Operations Dashboard","zh":"停車場航拍圖：AI 偵測每輛車；結果（使用率）在運作儀表板顯示","lvl":0,"num":false}]},"17":{"n":17,"en":"GeoAI Deep Learning Model for Sunken Ships Detection in NY after Storm Sandy","zh":"GeoAI 深度學習模型偵測紐約颶風桑迪後的沉船","p":[{"en":"Teach the model what we want to look for – ships in the water, not those sitting on land (Jamaica Bay, New York)","zh":"教模型要找甚麼——水中的船，而不是岸上的船（紐約牙買加灣）","lvl":0,"num":true},{"en":"Detect boats on the water using the Mask-RCNN deep learning model","zh":"使用 Mask-RCNN 深度學習模型偵測水上船隻","lvl":0,"num":true},{"en":"By applying the same deep learning process, it helped identify 100+ sunken boats in the {bathymetric|水深測量的} survey data taken after Storm Sandy","zh":"以相同深度學習流程，從颶風桑迪後的水深測量數據中找出 100 多艘沉船","lvl":0,"num":true},{"en":"Use the result to update the NOAA navigational charts to indicate the sunken ships","zh":"用結果更新美國國家海洋和大氣管理局的航海圖，標示沉船位置","lvl":0,"num":true}]},"18":{"n":18,"en":"GeoAI Ship Detection – Maritime Rescue & Port Management","zh":"GeoAI 船隻偵測——海上救援及港口管理","p":[{"en":"Deep learning: detect objects – ship detection (3 bands, RGB imagery)","zh":"深度學習：偵測物件——船隻偵測（3 波段，RGB 影像）","lvl":0,"num":false},{"en":"Completed within roughly 10 minutes; counting all ships shown in the satellite image (number of vessels in Pak Sha Wan, Sai Kung)","zh":"約 10 分鐘內完成；點算衞星圖像中所有船隻（西貢白沙灣的船隻數目）","lvl":0,"num":false},{"en":"The CE mentioned using AI to count ships as an example of how AI improves efficiency and accuracy in government operations (Chief Executive's 2025 Policy Address)","zh":"行政長官以 AI 點算船隻為例，說明 AI 如何提升政府運作的效率和準確度（行政長官 2025 年施政報告）","lvl":0,"num":false}]},"19":{"n":19,"en":"GeoAI Vehicle Identification from Real-time CCTVs for Traffic Monitoring","zh":"GeoAI 從實時閉路電視識別車輛以監察交通","p":[{"en":"Traffic analysis from CCTVs: detect vehicles by type; detect pedestrians; detect accidents, sudden stops or other {anomalies|異常情況}; understand traffic patterns; deal with incidents quickly","zh":"以閉路電視分析交通：按類型偵測車輛；偵測行人；偵測意外、急停或其他異常情況；了解交通模式；迅速處理事故","lvl":0,"num":false},{"en":"YOLO (You Only Look Once) from the arcgis.learn library","zh":"使用 arcgis.learn 程式庫的 YOLO（You Only Look Once）模型","lvl":0,"num":false},{"en":"Traffic flow detection using Transport Department real-time CCTV feed (updates every 0.1 minutes)","zh":"利用運輸署實時閉路電視畫面偵測交通流量（每 0.1 分鐘更新）","lvl":0,"num":false}]},"20":{"n":20,"en":"GeoAI Road Features Detection – Road Crack Detection Analysis","zh":"GeoAI 道路特徵偵測——路面裂縫偵測分析","p":[{"en":"Detection for real-time traffic monitoring via CCTV feed: detect vehicles by type, pedestrians, accidents, sudden stops or other anomalies","zh":"透過閉路電視畫面實時監察交通：偵測各類車輛、行人、意外、急停或其他異常","lvl":0,"num":false},{"en":"Road crack detection: automate road crack detection for road maintenance and public works; determine type of crack and potentially length and width","zh":"路面裂縫偵測：為道路維修及公共工程自動偵測裂縫；判斷裂縫類型及可能的長度和闊度","lvl":0,"num":false}]},"21":{"n":21,"en":"GeoAI Road Sign Defect Detection","zh":"GeoAI 路牌缺陷偵測","p":[{"en":"Interpretation of road sign status by deep learning model","zh":"以深度學習模型判斷路牌狀況","lvl":0,"num":false},{"en":"Detect objects – Grounding DINO","zh":"偵測物件——Grounding DINO","lvl":0,"num":false},{"en":"Classify objects – vision language context-based classification","zh":"分類物件——以視覺語言情境分類","lvl":0,"num":false},{"en":"Scenario: road sign {occluded|被遮擋的} by object (e.g., trees)","zh":"場景：路牌被物件（例如樹木）遮擋","lvl":0,"num":false}]},"22":{"n":22,"en":"GeoAI + GenAI – Integrating Large Language Models (LLM) to Build Intelligent Chatbots","zh":"GeoAI＋生成式 AI——整合大型語言模型建立智能聊天機械人","p":[{"en":"Functions: search by keywords; search record by district; heatmap analysis; charting (on a map of Hong Kong)","zh":"功能：按關鍵字搜尋；按地區搜尋紀錄；熱圖分析；製作圖表（香港地圖）","lvl":0,"num":false}]},"23":{"n":23,"en":"Landslide Detection with Satellite Imagery by Deep Learning","zh":"以深度學習從衞星影像偵測山泥傾瀉","p":[{"en":"Automatic identification of recent natural terrain landslides from satellite images using deep learning","zh":"利用深度學習從衞星影像自動識別近期天然山坡山泥傾瀉","lvl":0,"num":false},{"en":"Landsat 8: extract spectrum bands 3, 4, 5 (green, red & near infrared) using GIS for model training","zh":"Landsat 8：以 GIS 提取第 3、4、5 波段（綠、紅及近紅外線）作模型訓練","lvl":0,"num":false},{"en":"Steps: export training data for deep learning (geop
