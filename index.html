,"zh":"二、氣候變化廣泛、急速並不斷加劇"},{"en":"UN/IPCC report = \"Code Red for Humanity\": global temperature likely rises ~1.5°C in the next 20 years; {heat waves|熱浪} and {droughts|旱災} become much more frequent.","zh":"聯合國／IPCC 報告形容為「人類的紅色警報」：全球氣溫很可能在未來 20 年上升約 1.5°C，熱浪和旱災會變得頻密得多。","lvl":0,"num":false},{"en":"Examples: Dubai record rain, Australia fires, Texas floods 2025, 14 storms in UK & Ireland; in Hong Kong – Super Typhoon Mangkhut (2018), the \"once-in-500-years\" rainstorm (2023) and the hottest October (2025); 4 typhoons active at the same time in November 2024.","zh":"例子：杜拜破紀錄暴雨、澳洲山火、2025 年德州水災、英國及愛爾蘭 14 個風暴；香港——2018 年超強颱風山竹、2023 年「五百年一遇」暴雨、2025 年最熱十月；2024 年 11 月四個颱風同時出現。","lvl":0,"num":false},{"h":1,"en":"3. Hong Kong's own \"3 ageing\" problems","zh":"三、香港本身的「三老」問題"},{"en":"**Ageing population** – 1 in 10 aged 65+ (2015) → 1 in 4 (2025) → 1 in 2.8 (2046, 36%).","zh":"人口老化——65 歲以上人口由 2015 年每 10 人有 1 人，到 2025 年每 4 人有 1 人，到 2046 年每 2.8 人有 1 人（36%）。","lvl":0,"num":false},{"en":"**Ageing buildings** – 326K private units aged 70+ by 2046 (300 times more than 2015).","zh":"樓宇老化——到 2046 年，樓齡 70 年以上的私人單位達 32.6 萬個（比 2015 年多 300 倍）。","lvl":0,"num":false},{"en":"**Ageing lifts** – about 73K lifts in HK; about 67% (~48K) are 21+ years old.","zh":"升降機老化——全港約 7.3 萬部升降機，約 67%（約 4.8 萬部）已使用 21 年或以上。","lvl":0,"num":false}],"terms":[["Urbanization","城市化","越來越多人由鄉村搬到城市居住的過程；到 2050 年全球約三分之二人口住在城市。"],["Ageing population","人口老化","長者（65 歲或以上）佔人口比例不斷上升，令勞動力減少、醫療需求增加。"],["Resource depletion","資源耗盡","能源、水、土地等資源被過度使用，數量不斷減少。"],["IPCC","政府間氣候變化專門委員會","聯合國的科學組織，定期評估氣候變化的科學證據；其 2021 年報告被稱為「人類的紅色警報」。"],["COP30","第 30 屆聯合國氣候變化大會","2025 年在巴西貝倫舉行的氣候峰會，承諾到 2035 年提供 1.3 萬億美元氣候融資。"],["Nature-based solutions","以自然為本的方案","利用保護或修復森林、紅樹林、濕地等自然生態來應對氣候變化，可減少約 37% 排放。"],["\"3 ageing\" problems of HK","香港的「三老」問題","人口老化、樓宇老化、升降機老化三個香港獨有的挑戰。"]]},"A3":{"en":"A3. What Is a Smart City?","zh":"甚麼是智慧城市？","p":[{"h":2,"kind":"key","en":"Definition (learn by heart)","zh":""},{"en":"A smart city uses **ICT (Information and Communications Technology)** to improve the quality of life and city services, making the city more {livable|宜居}.","zh":"智慧城市是運用資訊及通訊科技（ICT）去改善生活質素和城市服務，令城市更宜居。","kind":"key"},{"en":"**Ultimate goals:** (1) enhance quality of life; (2) {foster|促進} sustainable growth → the key word is **{SUSTAINABILITY|可持續性}**.","zh":"最終目標：(1) 提升生活質素；(2) 促進可持續增長 → 關鍵詞是「可持續性」。","kind":"key"},{"h":1,"en":"Sustainability needs \"one single ecosystem\"","zh":"可持續發展需要「單一生態系統」"},{"en":"We should see the world as **one single {ecosystem|生態系統}** in which social, economic and environmental systems are connected. **Geography** provides the science and the \"language\" to do this, and **GIS** lets us map the world as one system (\"One Map Planning\").","zh":"我們應把世界視為一個「單一生態系統」，社會、經濟和環境系統互相連繫。地理學提供做到這一點的科學和「語言」，而 GIS 讓我們把世界繪成一個整體（「一張地圖規劃」）。"},{"en":"**The Geographic Approach** = a way of thinking and problem solving that {integrates|融合} geographic science and information into how we understand and manage our planet.","zh":"「地理方法」＝一種思考和解決問題的方式，把地理科學和資訊融入我們理解和管理地球的過程中。","lvl":0,"num":false},{"en":"GIS helps by: organizing and integrating all the factors; providing a framework for understanding and applying knowledge; {illuminating|揭示} patterns and discovering relationships.","zh":"GIS 的作用：組織和整合所有因素；提供理解和應用知識的框架；揭示規律及發現關係。","lvl":0,"num":false},{"h":1,"en":"ICT is the backbone","zh":"ICT 是骨幹"},{"en":"\"ICT is the {backbone|骨幹} of any society that wants to achieve 'smart' status.\" The key technologies are **IoT, Big Data, AI**, all brought together on a **GIS** platform.","zh":"「ICT 是任何想達到『智慧』水平的社會的骨幹。」主要技術是物聯網、大數據和人工智能，並全部在 GIS 平台上整合。"},{"en":"IoT (Internet of Things) · Sensors and devices connected to the internet that collect data (e.g., parking sensors).","zh":"物聯網 · 連接互聯網並收集數據的感應器和裝置（例如泊車感應器）。","row":1},{"en":"Big Data · Very large and complex data sets that traditional tools cannot handle easily.","zh":"大數據 · 傳統工具難以處理的龐大而複雜的數據集。","row":1},{"en":"AI (Artificial Intelligence) · Computers that learn from data to predict, recognise and decide.","zh":"人工智能 · 能從數據中學習，用來預測、識別和作決定的電腦。","row":1},{"en":"GIS (Geographic Information System) · The platform that links all data to **location** and shows it on maps.","zh":"地理資訊系統 · 把所有數據連繫到「位置」並在地圖上顯示的平台。","row":1}],"terms":[["Smart city","智慧城市","運用 ICT 改善生活質素和城市服務、令城市更宜居的城市。"],["Sustainability","可持續性","滿足現在需要之餘不損害下一代的發展；是智慧城市的終極目標。"],["One single ecosystem","單一生態系統","把社會、經濟和環境三個系統視為互相連繫的整體，而不是分開處理。"],["The Geographic Approach","地理方法","把地理科學和地理資訊融入理解和管理地球的思考及解難方式；GIS 令它成為可能。"],["One Map Planning","「一張地圖」規劃","把所有因素放在同一張地圖上作規劃，看清它們之間的關係。"],["IoT (Internet of Things)","物聯網","把各種感應器和裝置連上互聯網，自動收集和傳送數據（第四課詳述）。"],["Big Data","大數據","數量龐大、種類繁多、傳統工具難以處理的數據（第四課詳述）。"],["AI (Artificial Intelligence)","人工智能","讓電腦從數據中學習，進行預測、識別和決策的技術（第五課詳述）。"]]},"A4":{"en":"A4. The 6 Components and 3 Phases of a Smart City","zh":"智慧城市的六大範疇與三個階段","p":[{"h":1,"en":"Six components (pillars) – Dr. Boyd Cohen","zh":"六大範疇（支柱）——Boyd Cohen 博士"},{"en":"Smart Economy · Startups, unicorns, Fintech 2025/2030, digital assets, Northern Metropolis","zh":"智慧經濟 · 初創、獨角獸、金融科技 2025/2030、數字資產、北部都會區","row":1},{"en":"Smart Mobility · HKeToll, EV roadmap, Transport Strategy Blueprint, Shenzhen electric buses","zh":"智慧出行 · 易通行、電動車路線圖、運輸策略藍圖、深圳電動巴士","row":1},{"en":"Smart Environment · Carbon neutrality, hydrogen, river & biodiversity maps, BGIS","zh":"智慧環境 · 碳中和、氫能、河流及生物多樣性地圖、生物多樣性地理資訊系統","row":1},{"en":"Smart Living · COVID-19 dashboard, sewage surveillance, URA URIS, Tencent AI healthcare · 新冠疫情地圖、污水監測、市建局 URIS、騰訊 AI 醫療","zh":"智慧生活","row":1},{"en":"Smart People · STEAM education, GIS Academy, universities, startups using GeoAI · STEAM 教育、GIS Academy、大學、使用 GeoAI 的初創","zh":"智慧市民","row":1},{"en":"Smart Government · R-Map, DPO, iAM Smart, open data, CSDI, GeoLab","zh":"智慧政府 · 救援地圖、數字政策辦公室、智方便、開放數據、空間數據共享平台、地理空間實驗室","row":1},{"h":1,"en":"Three phases of smart city (Cohen)","zh":"智慧城市的三個階段（Cohen）"},{"en":"Smart City 1.0 · Technology-driven · Tech companies push their products to cities.","zh":"科技主導 · 科技公司向城市推銷產品。","row":1},{"en":"Smart City 2.0 · Government-driven · Government leads and decides how technology is used.","zh":"政府主導 · 政府主導並決定如何運用科技。","row":1},{"en":"Smart City 3.0 · Citizen-driven · Citizens co-create solutions (bottom-up). This is \"the ultimate goal\".","zh":"市民主導 · 市民共同創造方案（由下而上），是「終極目標」。","row":1},{"h":2,"kind":"note","en":"","zh":""},{"en":"Data-driven city: we hope the government provides more open data so citizens can use it, build maps, link data together and add AI. Use GIS to build up the 6 pillars. Citizens should know about the {bottom-up|由下而上} approach.","zh":"數據驅動城市：希望政府提供更多開放數據，讓市民使用、製作地圖、連結數據並結合 AI。用 GIS 建立六大支柱。市民應認識「由下而上」的方式。","kind":"note"},{"h":1,"en":"Prof. Tang's books: Smart City 3.0 → 4.0 → 5.0","zh":"鄧教授的著作：智慧城市 3.0 → 4.0 → 5.0"},{"en":"**3.0** – Bottom-up, citizen co-creation.","zh":"3.0 —— 由下而上，市民共同創造。","lvl":0,"num":false},{"en":"**4.0** – Post-COVID era: GIS-driven, startups as the core / engine. Startup = growth engine and innovation {catalyst|催化劑}; GIS = platform to use data to visualise the future; Startup + GIS = sustainable growth.","zh":"4.0 —— 後疫情時代：以 GIS 推動、以初創為核心／引擎。初創＝增長引擎和創新催化劑；GIS＝運用數據展望未來的平台；初創 + GIS ＝可持續增長。","lvl":0,"num":false},{"en":"**5.0** – Sustainable development: carbon reduction and {biodiversity|生物多樣性}.","zh":"5.0 —— 可持續發展：減碳和生物多樣性。","lvl":0,"num":false}],"terms":[["6 components (pillars) of a smart city","智慧城市六大範疇","Boyd Cohen 提出：智慧經濟、智慧出行、智慧環境、智慧生活、智慧市民、智慧政府。"],["Smart City 1.0","智慧城市 1.0（科技主導）","由科技公司主導、向城市推銷產品的階段。"],["Smart City 2.0","智慧城市 2.0（政府主導）","由政府主導、決定如何運用科技的階段。"],["Smart City 3.0","智慧城市 3.0（市民主導）","市民共同參與、由下而上創造方案的階段，是「終極目標」。"],["Bottom-up / Top-down approach","由下而上／由上而下","由下而上＝由市民發起；由上而下＝由政府發起（例如中國內地）。"],["Startup","初創企業","新成立、以創新科技快速成長的公司；智慧城市 4.0 視之為增長引擎。"],["Biodiversity","生物多樣性","地球上物種、基因和生態系統的多樣程度；智慧城市 5.0 的重點之一。"]]},"A5":{"en":"A5. How Do We Measure a Smart City?","zh":"如何衡量智慧城市？","p":[{"en":"McKinsey (2018): smart city applications can improve key quality-of-life {indicators|指標} by **10–30%** (e.g., GHG emissions ▼10–15%, water use ▼20–30%, unrecycled waste ▼10–20%, crime ▼30–40%, commute time ▼15–20%).","zh":"麥肯錫（2018）：智慧城市應用可把主要生活質素指標改善 10–30%（例如溫室氣體排放減少 10–15%、用水減少 20–30%、未回收廢物減少 10–20%、罪案減少 30–40%、通勤時間減少 15–20%）。","lvl":0,"num":false},{"en":"Each city sets its **own goals**: Copenhagen – environment; Sweden – mobility (Vision Zero); Dubai – happiness; London – FinTech; Singapore – smart government; China – \"Beautiful China\".","zh":"每個城市訂立自己的目標：哥本哈根——環境；瑞典——出行（零死亡願景）；杜拜——幸福；倫敦——金融科技；新加坡——智慧政府；中國——「美麗中國」。","lvl":0,"num":false},{"en":"**KPIs** to track innovation & technology spending: no. of unicorns, no. of startups, employment figures, R&D expenditure (% of GDP), no. of {patents|專利}, international rankings.","zh":"追蹤創新科技投資的關鍵績效指標：獨角獸數目、初創數目、就業數字、研發開支（佔本地生產總值百分比）、專利數目、國際排名。","lvl":0,"num":false},{"en":"Hong Kong rankings: IMD Smart City Index 2026 = **No. 21**; IMD World Competitiveness 2026 = **No. 2**; GII 2025: Shenzhen–Hong Kong–Guangzhou = **No. 1** science & technology cluster.","zh":"香港排名：IMD 智慧城市指數 2026 排第 21；IMD 世界競爭力 2026 排第 2；全球創新指數 2025：深圳—香港—廣州是全球第 1 科技集群。","lvl":0,"num":false},{"h":2,"kind":"key","en":"HK's suggested positioning","zh":""},{"en":"**Smart People – a Talent and Innotech Hub** (innotech = innovation + technology).","zh":"「智慧市民——人才及創科樞紐」。","kind":"key"}],"terms":[["Quality-of-life indicators","生活質素指標","量度市民生活好壞的數據，例如通勤時間、罪案率、空氣質素；麥肯錫指智慧城市應用可改善 10–30%。"],["KPI (Key Performance Indicator)","關鍵績效指標","用來量度目標是否達成的主要數字，例如初創數目、專利數目、研發開支。"],["Unicorn","獨角獸企業","估值超過 10 億美元的初創企業；香港約有 20 間。"],["R&D expenditure","研發開支","投放在研究及發展的資金，通常以佔本地生產總值（GDP）百分比表示。"],["IMD Smart City Index","IMD 智慧城市指數","瑞士洛桑國際管理發展學院的城市排名；香港 2026 年排第 21。"],["Science & technology cluster","科技集群","研究機構和科技企業集中的地區；深圳—香港—廣州在 2025 年全球創新指數排第 1。"]]},"A6":{"en":"A6. Hong Kong's Smart City Policies (Timeline)","zh":"香港智慧城市政策（時間線）","p":[{"en":"Dec 2017 · HK Smart City Blueprint 1.0 · 6 areas, 70+ initiatives","zh":"香港智慧城市藍圖 1.0 · 6 個範疇，70 多項措施","row":1},{"en":"18 Feb 2019 · Outline Development Plan for the GBA · Plan to build smart city clusters (open data portal, CSDI, COP, etc.)","zh":"粵港澳大灣區發展規劃綱要 · 建設智慧城市群（開放數據平台、空間數據共享平台、共用運作圖等）","row":1},{"en":"Dec 2020 · HK Smart City Blueprint 2.0 · 6 areas, 130+ initiatives","zh":"香港智慧城市藍圖 2.0 · 6 個範疇，130 多項措施","row":1},{"en":"1 Mar 2021 · National 14th Five-Year Plan · HK positioned as \"8 Centres\" (4 traditional + 4 emerging)","zh":"國家十四五規劃 · 香港定位為「八大中心」（4 個傳統 + 4 個新興）","row":1},{"en":"22 Dec 2022 · HK I&T Development Blueprint · 4 development directions, 8 major strategies, for 5–10 years","zh":"香港創新科技發展藍圖 · 4 大發展方向、8 大策略，涵蓋 5–10 年","row":1},{"en":"Mar 2023 · Guangdong–HKSAR Co-operation Agreement on Co-developing a Smart City Cluster · Joint smart city cluster","zh":"粵港共建智慧城市群合作協議 · 共同建設智慧城市群","row":1},{"en":"30 Oct 2023 · Northern Metropolis Action Agenda · 4 major zones","zh":"北部都會區行動綱領 · 四大區域","row":1},{"en":"2026–2030 · HK's First Five-Year Plan · Aligned with National 15th Five-Year Plan; 6 major areas","zh":"香港首個五年規劃 · 與國家十五五規劃銜接；6 大範疇","row":1},{"en":"The Government has invested an unprecedented **HK$210 billion** to promote I&T development.","zh":"政府以前所未有的 2,100 億港元推動創科發展。","lvl":0,"num":false},{"en":"HK must speed up building **CSDI** (Common Spatial Data Infrastructure) and **COP** (Common Operational Picture) to strengthen its position as a leading smart city.","zh":"香港必須加快建設「空間數據共享平台」（CSDI）和「共用運作圖」（COP），以鞏固其領先智慧城市的地位。","lvl":0,"num":false}],"terms":[["Smart City Blueprint 1.0 / 2.0","香港智慧城市藍圖 1.0／2.0","政府在 2017 年及 2020 年公布的智慧城市計劃，分別有 70 多項及 130 多項措施。"],["Greater Bay Area (GBA)","粵港澳大灣區","香港、澳門和廣東九個城市組成的城市群；2019 年發展規劃綱要提出建設智慧城市群。"],["\"8 Centres\"","「八大中心」","國家十四五規劃為香港定下的八個中心定位（4 個傳統、4 個新興，例如國際創新科技中心）。"],["I&T Development Blueprint","香港創新科技發展藍圖","2022 年公布、為未來 5–10 年創科發展定下 4 大方向和 8 大策略的文件。"],["Northern Metropolis","北部都會區","新界北部的大型發展區，分四大區域，將成為香港第二經濟引擎。"],["CSDI (Common Spatial Data Infrastructure)","空間數據共享平台","政府部門共享空間數據的一站式平台（第三課詳述）。"],["COP (Common Operational Picture)","共用運作圖","把各部門的事故和數據放在同一張網上地圖，方便協調應急工作（第三課詳述）。"]]},"A7":{"en":"A7. Spatial Data, Open Data and GIS – the Core of This Course","zh":"空間數據、開放數據與 GIS ——本課程的核心","p":[{"h":2,"kind":"key","en":"Three ideas you must connect","zh":""},{"en":"**80% of data is spatial** (has a location). Spatial data is the **backbone** of a smart city.","zh":"80% 的數據是空間數據（有位置）。空間數據是智慧城市的骨幹。","kind":"key"},{"en":"**GIS** is the backbone **technology** for managing spatial data: Capture, Store, Query, Analyze, Display, Output.","zh":"GIS 是管理空間數據的骨幹技術：擷取、儲存、查詢、分析、顯示、輸出。","kind":"key"},{"en":"**Open data** = data anyone can use for free. Geographic information is the open-data domain with the **highest commercial value**.","zh":"開放數據＝任何人都可以免費使用的數據。地理資訊是商業價值最高的開放數據範疇。","kind":"key"},{"en":"Why spatial data matters: better city planning and management (prevention, monitoring, rescue, recovery); unlock existing knowledge and boost the economy; make right and {agile|靈活敏捷的} decisions.","zh":"空間數據的重要性：改善城市規劃和管理（預防、監察、救援、復原）；釋放現有知識並推動經濟；作出正確而靈活的決定。","lvl":0,"num":false},{"en":"Sources of spatial big data: GPS devices, satellite {remote sensing|遙感}, aerial surveying, radar, {Lidar|激光雷達}, sensor networks, digital cameras, RFID readings.","zh":"空間大數據來源：GPS 裝置、衛星遙感、航空測量、雷達、激光雷達、感應器網絡、數碼相機、RFID 讀數。","lvl":0,"num":false},{"en":"**CSDI Portal** (portal.csdi.gov.hk) works like a one-stop data \"supermarket\": 1,200+ spatial datasets from 71+ government departments (as of 1/2025).","zh":"空間數據共享平台（portal.csdi.gov.hk）像一站式數據「超級市場」：截至 2025 年 1 月，有來自 71 個以上政府部門的 1,200 多個空間數據集。","lvl":0,"num":false},{"en":"**DATA.GOV.HK**: 5,700+ datasets, 2,500+ with API, 120+ data providers, 85B+ downloads in 2025. Annual Open Data Plans since 2019.","zh":"資料一線通：5,700 多個數據集、2,500 多個提供 API、120 多個數據提供者、2025 年下載量超過 850 億次。自 2019 年起每年公布開放數據計劃。","lvl":0,"num":false}],"terms":[["Spatial data","空間數據","帶有位置（坐標）資料的數據；約 80% 的數據都是空間數據。"],["Open data","開放數據","任何人都可以免費使用、修改和分享的數據（第二課詳述）。"],["Remote sensing","遙感","利用衞星或飛機從遠處拍攝和量度地球表面，取得影像和數據。"],["Lidar","激光雷達","以激光脈衝量度距離，製作精確的三維點雲模型。"],["RFID","無線射頻識別","以無線電讀取標籤資料的技術，例如八達通、易通行繳費貼（第四課詳述）。"],["DATA.GOV.HK","資料一線通","香港政府的開放數據平台，有 5,700 多個數據集。"],["GIS functions (Capture, Store, Query, Analyze, Display, Output)","GIS 六大功能","擷取、儲存、查詢、分析、顯示、輸出——數據在 GIS 中處理的流程。"]]},"A8":{"en":"A8. Low-Altitude Economy (LAE) – \"What's Next\"","zh":"低空經濟——「下一步」","p":[{"en":"**Definition:** manned and {unmanned|無人駕駛的} activities in airspace **below 1,000 m** (3,280 ft); can extend to **3,000 m** depending on regional needs. Key sectors: **drones (UAVs)** and **eVTOL** (electric vertical take-off and landing aircraft).","zh":"定義：在 1,000 米（3,280 呎）以下空域進行的載人和無人駕駛活動；視乎地區需要可延伸至 3,000 米。主要行業：無人機及電動垂直起降飛行器（eVTOL）。","lvl":0,"num":false},{"en":"Uses: real-time data collection, emergency rescue, building inspection, waste monitoring, tree conservation, coastal conservation, slope management, tourism.","zh":"用途：實時數據收集、緊急救援、樓宇檢查、廢物監察、樹木保育、海岸保育、斜坡管理、旅遊。","lvl":0,"num":false},{"en":"China: LAE status rose from \"new growth engine\" (2024) → \"emerging industry\" (2025) → \"**emerging pillar industry**\" (2026). Market: RMB 500 bn (2023) → 1.5 tn (2025) → 2 tn (2030) → 3.5 tn (2035). Talent gap of 1 million drone pilots.","zh":"中國：低空經濟的地位由「新增長引擎」（2024）→「新興產業」（2025）→「新興支柱產業」（2026）。市場規模：5,000 億人民幣（2023）→ 1.5 萬億（2025）→ 2 萬億（2030）→ 3.5 萬億（2035）。無人機操作員人才缺口達 100 萬。","lvl":0,"num":false},{"en":"Hong Kong: GBA LAE Alliance, LAE Working Group, 38 regulatory {sandbox|沙盒} pilot projects, Regulatory Sandbox X, legal amendments effective 18 Jul 2025, new MSc programmes at universities.","zh":"香港：大灣區低空經濟聯盟、低空經濟工作小組、38 個監管沙盒試點項目、「監管沙盒 X」、2025 年 7 月 18 日生效的法例修訂，以及大學新開設的碩士課程。","lvl":0,"num":false}],"terms":[["Low-Altitude Economy (LAE)","低空經濟","在 1,000 米（最高 3,000 米）以下空域進行的載人及無人駕駛航空活動所帶動的經濟。"],["UAV (Unmanned Aerial Vehicle)","無人機","沒有機師在機上、由遙控或程式控制飛行的飛行器。"],["eVTOL","電動垂直起降飛行器","以電力推動、可像直升機一樣垂直起飛和降落的飛行器，被視為未來「空中的士」。"],["Regulatory sandbox","監管沙盒","在受控範圍內暫時放寬規則，讓新科技先試行的安排；香港有 38 個低空經濟試點項目。"],["BVLOS (Beyond Visual Line of Sight)","超視距飛行","無人機飛出操作員肉眼可見範圍；香港正研究放寬相關限制。"],["Emerging pillar industry","新興支柱產業","2026 年中國政府工作報告對低空經濟的最新定位，地位比「新增長引擎」更高。"]]},"A9":{"en":"A9. Smart City Development in Mainland China","zh":"中國內地的智慧城市發展","p":[{"en":"**Top-down** (state-led) approach since 2012; 900+ smart city pilots; high urbanization; tech giants (Alibaba, Tencent, Baidu, Huawei) are key.","zh":"自 2012 年起採用「由上而下」（國家主導）的方式；超過 900 個智慧城市試點；城市化程度高；科技巨頭（阿里巴巴、騰訊、百度、華為）擔當重要角色。","lvl":0,"num":false},{"en":"Compare: China = top-down (government-led, like Smart City 2.0); Smart City 3.0 = bottom-up (citizen-led).","zh":"比較：中國＝由上而下（政府主導，類似智慧城市 2.0）；智慧城市 3.0 ＝由下而上（市民主導）。","lvl":0,"num":false},{"en":"Examples: 21st-Century Digital Silk Road (Belt & Road), Hetao Shenzhen–HK Sci-Tech Zone, Shenzhen fully electric bus fleet (2017), Tencent MIAIS medical AI, 3D Real Scene China (80% of governance by geospatial intelligence by 2035), AI curriculum in schools.","zh":"例子：二十一世紀數字絲綢之路（一帶一路）、河套深港科技創新合作區、深圳全電動巴士車隊（2017）、騰訊覓影醫療 AI、實景三維中國（2035 年 80% 管治由地理空間智能支援）、中小學人工智能課程。","lvl":0,"num":false}],"terms":[["State-led (top-down) initiatives","國家主導（由上而下）措施","由中央政府制定政策推動智慧城市；中國自 2012 年起推行，有 900 多個試點城市。"],["Digital Silk Road","數字絲綢之路","「一帶一路」倡議中推動大數據、雲計算、智慧城市互聯的部分。"],["Hetao Sci-Tech Zone","河套深港科技創新合作區","橫跨深圳和香港的科技合作區，「一河兩岸、一區兩園」。"],["3D Real Scene China","實景三維中國","自然資源部推動的全國三維數碼地理空間建設；目標 2035 年 80% 管治由地理空間智能支援。"],["Large Language Model (LLM)","大型語言模型","以海量文字訓練、能理解和生成語言的 AI 模型，例如騰訊混元、DeepSeek。"]]}}},"L2":{"slides":{"1":{"n":1,"en":"Lecture 2 & 3 – GeoSpatial Open Data and Common Spatial Data Infrastructure","zh":"第二及第三課——地理空間開放數據及空間數據共享平台","p":[{"en":"GEOG2147 Building Smart Cities with GIS – Prof. Winnie Tang (Adjunct Professor), Mr. Kelvin Shum (Adjunct Assistant Professor), Department of Geography","zh":"GEOG2147 運用 GIS 建設智慧城市——鄧淑明教授（兼任教授）、Kelvin Shum 先生（兼任助理教授），地理系","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"**Source data:** data or information we collected from the data source.","zh":"來源數據：我們從數據來源收集的數據或資訊。","kind":"note"},{"en":"**Raw data:** the type of data that is originally produced by the origin.","zh":"原始數據：由來源最初產生的數據。","kind":"note"},{"en":"Source data and raw data come from the same data source → data.","zh":"來源數據和原始數據來自同一來源 → 數據。","kind":"note"},{"en":"**Data:** create & record it for a {phenomenon|現象}.","zh":"數據：為某現象建立及記錄的東西。","kind":"note"},{"en":"**Data source:** the origin that the data comes from.","zh":"數據來源：數據的出處。","kind":"note"},{"en":"Data ≠ meaning; **information** = data with meaning (the data after processing).","zh":"數據不等於意義；資訊＝有意義的數據（經處理後的數據）。","kind":"note"},{"en":"The foundation of creating apps is having open data.","zh":"建立應用程式的基礎是擁有開放數據。","kind":"note"}]},"3":{"n":3,"en":"Data in Smart Cities – Data in Cloud","zh":"智慧城市中的數據——雲端數據","p":[{"en":"Pay for actual usage","zh":"按實際用量付費","lvl":0,"num":false},{"en":"{Centralized|集中的} & remote management","zh":"集中及遙距管理","lvl":0,"num":false},{"en":"Accessible in different locations","zh":"可在不同地點存取","lvl":0,"num":false},{"en":"Diagram: cloud & services linked to municipal command centre, smart grid, hospital, home energy, traffic flow, factory, logistics, medical devices, connected ambulances, digital signage, traffic cameras","zh":"圖示：雲端服務連接市政指揮中心、智能電網、醫院、家居能源、交通流量、工廠、物流、醫療裝置、聯網救護車、數碼廣告牌、交通攝影機","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Data in cloud is backed up and stored around the world.","zh":"雲端數據在世界各地備份和儲存。","kind":"note"}]},"4":{"n":4,"en":"Data in Smart Cities – Big Data","zh":"智慧城市中的數據——大數據","p":[{"en":"Large and complex data sets","zh":"龐大而複雜的數據集","lvl":0,"num":false},{"en":"Difficult to be handled by traditional technologies like {Relational Database|關聯式數據庫}","zh":"傳統技術（如關聯式數據庫）難以處理","lvl":0,"num":false},{"en":"Requires new technologies and processing applications like Hadoop to deal with","zh":"需要 Hadoop 等新技術和處理程式","lvl":0,"num":false},{"en":"Image: Big Data as an iceberg – \"what we know…\" is the tip; \"the rest…\" is hidden underwater","zh":"圖片：大數據像冰山——「我們知道的」只是尖端，「其餘的」藏在水下","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Big data = a collection of data, including {unstructured|非結構化的} data. Relational database example: SQL (Microsoft). Hadoop stores big data.","zh":"大數據＝數據的集合，包括非結構化數據。關聯式數據庫例子：SQL（微軟）。Hadoop 用來儲存大數據。","kind":"note"}]},"5":{"n":5,"en":"Data in Smart Cities – Spatial Data","zh":"智慧城市中的數據——空間數據","p":[{"en":"80% of data generated in our daily lives are spatial data","zh":"日常生活中產生的數據有 80% 是空間數據","lvl":0,"num":false},{"en":"Identifies the geographic location of features and boundaries on Earth","zh":"標示地球上地物和邊界的地理位置","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Spatial data has a location (coordinates): x, y, z → 3D data. It can be real-time information.","zh":"空間數據有位置（坐標）：x、y、z → 三維數據，可以是實時資訊。","kind":"note"}]},"6":{"n":6,"en":"Data in Smart Cities – Real-time Data","zh":"智慧城市中的數據——實時數據","p":[{"en":"Real-time data: collected from devices, sensor networks, Internet of Things","zh":"實時數據：從裝置、感應器網絡及物聯網收集","lvl":0,"num":false},{"en":"Sources of real-time data: parking spaces; city trash bins; vehicles; energy turbines, etc.","zh":"實時數據來源：泊車位；城市垃圾桶；車輛；發電風機等","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"It is really \"nearly real-time\": when a sensor generates data, processing time is needed → {latency|延遲} (how long is the latency?).","zh":"其實是「接近實時」：感應器產生數據後需要處理時間 → 延遲（延遲有多長？）。","kind":"note"},{"en":"Sensors sense changes in the environment and collect them for further use.","zh":"感應器偵測環境變化並收集起來以作進一步使用。","kind":"note"},{"en":"Vehicles install a GPS receiver to receive/detect the satellite signal.","zh":"車輛安裝 GPS 接收器以接收／偵測衞星訊號。","kind":"note"}]},"7":{"n":7,"en":"Data in Smart Cities – Value of Data in Developing Smart City","zh":"智慧城市中的數據——數據對發展智慧城市的價值","p":[{"en":"To understand Where, When, How and Why","zh":"了解何地、何時、如何及為何","lvl":0,"num":false},{"en":"To support policy-making","zh":"支援政策制定","lvl":0,"num":false},{"en":"To {optimize|優化} operations","zh":"優化運作","lvl":0,"num":false},{"en":"To enable smart apps and services","zh":"支援智慧應用程式及服務","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Where/When/How/Why → for the phenomena of the city.","zh":"何地／何時／如何／為何 → 針對城市中的現象。","kind":"note"},{"en":"Optimize operations → especially with real-time data (make decisions promptly).","zh":"優化運作 → 特別是實時數據（迅速作決定）。","kind":"note"},{"en":"Smart apps → {responsiveness|反應能力} (high response rate; real-time).","zh":"智慧應用 → 反應能力（反應快；實時）。","kind":"note"}]},"9":{"n":9,"en":"What is Open Data","zh":"甚麼是開放數據","p":[{"en":"Open Data refers to information that can be **freely used, modified, & shared by anyone for any purpose**. It must be available under an **open licence** & provided in a convenient and modifiable form that is **machine readable**. (Source: \"Creating Value through Open Data\", Publications Office of the European Union, Nov 2015)","zh":"開放數據指任何人都可以為任何目的自由使用、修改及分享的資訊。它必須以開放授權提供，並以方便、可修改及機器可讀的形式提供。（資料來源：《以開放數據創造價值》，歐盟出版辦公室，2015 年 11 月）","lvl":0,"num":false},{"en":"Open Data is not just about sharing data; it is also about using it in innovative ways, such as creating apps and solutions with it and helping stakeholders make data-driven decisions. Setting up an open data site allows citizens, government employees, developers, startups, and more, to launch new solutions and applications almost immediately. (Source: \"What's Next for Open Data\", Esri)","zh":"開放數據不只是分享數據，還要以創新方式使用數據，例如開發應用程式和方案，並協助持份者作出以數據為本的決定。設立開放數據網站，讓市民、政府僱員、開發者、初創企業等幾乎可以立即推出新方案和應用程式。（資料來源：《開放數據的下一步》，Esri）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Open data helps citizens make their life easier, and helps the city become more efficient.","zh":"開放數據令市民生活更方便，亦令城市更有效率。","kind":"note"}]},"10":{"n":10,"en":"8 Principles of Open Data","zh":"開放數據的八大原則","p":[{"en":"Complete","zh":"完整","lvl":0,"num":true},{"en":"Primary","zh":"原始","lvl":0,"num":true},{"en":"Timely","zh":"及時","lvl":0,"num":true},{"en":"Accessible","zh":"可存取","lvl":0,"num":true},{"en":"Machine Processable","zh":"機器可處理","lvl":0,"num":true},{"en":"Non-discriminatory","zh":"無歧視","lvl":0,"num":true},{"en":"Non-proprietary","zh":"非專有","lvl":0,"num":true},{"en":"License-free","zh":"免授權","lvl":0,"num":true},{"h":2,"kind":"note","en":"","zh":""},{"en":"1. Complete – cover all HK territory.","zh":"1. 完整——覆蓋全港。","kind":"note"},{"en":"2. Primary – the open data should be the source data or raw data.","zh":"2. 原始——開放數據應是來源數據或原始數據。","kind":"note"},{"en":"3. Timely – updated data.","zh":"3. 及時——數據有更新。","kind":"note"},{"en":"4. Accessible – by everyone.","zh":"4. 可存取——人人可用。","kind":"note"},{"en":"5. Machine processable – able to be processed by computer (can process PDF by using AI).","zh":"5. 機器可處理——可由電腦處理（可用 AI 處理 PDF）。","kind":"note"},{"en":"6. Non-discriminatory – no registration required, free (registration is usually used for Chinese data). Not compulsory.","zh":"6. 無歧視——毋須登記、免費（內地數據通常要登記）。非強制。","kind":"note"},{"en":"7. Non-proprietary – should be usable in all GIS software.","zh":"7. 非專有——應可在所有 GIS 軟件使用。","kind":"note"},{"en":"8. License-free – end user does not need to apply for a licence. Not compulsory; some would charge (open data → earn money for commercial use → generate profit to keep it ongoing).","zh":"8. 免授權——用戶毋須申請授權。非強制；有些會收費（開放數據 → 商業用途賺錢 → 產生利潤以持續運作）。","kind":"note"}]},"11":{"n":11,"en":"Advantages of Open Data – Summary","zh":"開放數據的好處——總結","p":[{"en":"**Individual:** make more informed decisions & new services","zh":"個人：作出更明智的決定，享用新服務","lvl":0,"num":false},{"en":"**Business:** cost-effective resource to combine with {proprietary|專有的} databases","zh":"企業：具成本效益的資源，可與專有數據庫結合","lvl":0,"num":false},{"en":"**Government:** increase transparency & collaboration; direct improved city planning & job creation; driving economy","zh":"政府：提高透明度及協作；改善城市規劃及創造職位；推動經濟","lvl":0,"num":false},{"en":"**Global:** location-based open data could suggest sustainable solutions to address the problems","zh":"全球：以位置為本的開放數據可提出可持續方案以解決問題","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Business: every company would build its own database (they can use open data to combine with their own database).","zh":"企業：每間公司都會建立自己的數據庫（可把開放數據與自家數據庫結合）。","kind":"note"},{"en":"Government: e.g., Buildings Department ↔ Lands Department; without sharing → waste of time.","zh":"政府：例如屋宇署與地政總署；不共享 → 浪費時間。","kind":"note"},{"en":"Global: open data is useful, especially for economics.","zh":"全球：開放數據很有用，特別是對經濟。","kind":"note"}]},"13":{"n":13,"en":"Making Use of Open Data – Sectors Most Conducive to Open Data","zh":"善用開放數據——最適合開放數據的行業","p":[{"en":"Chart (data.gov.uk / Deloitte): number of sectors to which data is applicable – Geospatial and Environment are highest, followed by economy, transport, energy/resources/utilities, demographics, agriculture, business, planning, crime & justice, health & social care, social conditions, arts/sports/recreation, population health, education, housing, labour market","zh":"圖表（data.gov.uk／德勤）：數據可應用於多少個行業——地理空間和環境最高，其次是經濟、交通、能源／資源／公用事業、人口統計、農業、商業、規劃、罪案與司法、醫療與社會護理、社會狀況、藝術／體育／康樂、人口健康、教育、房屋、勞動市場","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Why are geospatial and environment the top 2? Because we live in the city, the environment changes very fast, and it relates to space.","zh":"為甚麼地理空間和環境排首兩位？因為我們住在城市，環境變化很快，而且與空間有關。","kind":"note"},{"en":"Economy and transport usually require personal information.","zh":"經濟和交通通常涉及個人資料。","kind":"note"}]},"14":{"n":14,"en":"The Value Created through Open Data (European Commission 2020)","zh":"開放數據創造的價值（歐盟委員會 2020）","p":[{"en":"**Increase open data market size:** €184.45 billion in 2019; €199.51–€334.20 billion forecast for 2025","zh":"開放數據市場規模增加：2019 年 1,844.5 億歐元；2025 年預測 1,995.1–3,342 億歐元","lvl":0,"num":false},{"en":"**Increase open data employment:** 1.09 million employees in 2019; 1.12–1.97 million forecast for 2025","zh":"開放數據就業增加：2019 年 109 萬人；2025 年預測 112–197 萬人","lvl":0,"num":false},{"en":"**Cost saving:** healthcare costs e.g. €312–€400 thousand via faster first aid by {bystanders|旁觀者}; labour costs e.g. €13.7–€20 billion by cutting time in traffic; energy bills e.g. €79.6 billion from more solar power","zh":"節省成本：醫療開支，例如旁人更快施救可節省 31.2–40 萬歐元；勞工成本，例如減少塞車時間可節省 137–200 億歐元；能源開支，例如更多太陽能可節省 796 億歐元","lvl":0,"num":false},{"en":"**Increase efficiency gains:** saving 54–202 thousand lives via faster emergency response; saving 27 million hours in public transport; saving 5.8 Mtoe by reducing household energy use","zh":"提升效率：更快的緊急應變可拯救 5.4–20.2 萬條生命；公共交通節省 2,700 萬小時；減少家居能源使用節省 580 萬噸油當量","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"(Lecturer said: know this slide with examples.)","zh":"（講師提示：要記住這張投影片和例子。）","kind":"note"}]},"15":{"n":15,"en":"National Open Data Portals Around The World","zh":"世界各地的國家開放數據平台","p":[{"en":"In 2020, 79% of UN Member States had a national open government data (OGD) portal.","zh":"2020 年，79% 聯合國成員國設有國家政府開放數據平台。","lvl":0,"num":false},{"en":"This indicates an increase from 47 percent in 2018.","zh":"比 2018 年的 47% 有所增加。","lvl":0,"num":false},{"en":"Increased from ~90 countries to ~152 countries","zh":"由約 90 個國家增至約 152 個","lvl":0,"num":false},{"en":"Examples: Canada open.canada.ca; USA data.gov; EU data.europa.eu; UK data.gov.uk; Saudi Arabia data.gov.sa; Japan data.go.jp; Australia data.gov.au; more…","zh":"例子：加拿大 open.canada.ca；美國 data.gov；歐盟 data.europa.eu；英國 data.gov.uk；沙特阿拉伯 data.gov.sa；日本 data.go.jp；澳洲 data.gov.au；及更多","lvl":0,"num":false}]},"17":{"n":17,"en":"Open Data – A Worldwide Trend (Singapore)","zh":"開放數據——全球趨勢（新加坡）","p":[{"en":"Singapore: Data.gov.sg","zh":"新加坡：Data.gov.sg","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Singapore calls itself a \"smart **nation**\", not a \"smart city\".","zh":"新加坡稱自己為「智慧國家」，而不是「智慧城市」。","kind":"note"}]},"18":{"n":18,"en":"Open Data – A Worldwide Trend in USA (DATA.GOV)","zh":"開放數據——美國的全球趨勢（DATA.GOV）","p":[{"en":"Launched in 2009","zh":"2009 年推出","lvl":0,"num":false},{"en":"Free public access to over 190,000 data sets","zh":"免費公開超過 190,000 個數據集","lvl":0,"num":false},{"en":"Public engagement is encouraged by providing tools for web and app development","zh":"提供網頁及應用程式開發工具，鼓勵公眾參與","lvl":0,"num":false},{"en":"Example – Improve Safety at Sea by U.S. Coast Guard: Marine {Casualty|傷亡事故} & Pollution Data for Researchers","zh":"例子——美國海岸警衞隊改善海上安全：供研究人員使用的海上事故及污染數據","lvl":0,"num":false},{"en":"After an incident has been reported, it is entered into a national database of all marine casualty and pollution incidents.","zh":"事故報告後會輸入全國海上事故及污染事件數據庫。","lvl":1,"num":false},{"en":"Historical records can then be accessed to understand maritime safety, accident prevention, or trends in certain types of maritime incidents through time.","zh":"之後可查閱歷史紀錄，以了解海上安全、預防意外，或某類海上事故隨時間的趨勢。","lvl":1,"num":false},{"en":"Data categories: agriculture, climate, consumer, ecosystems, education, energy, finance, health, local government, manufacturing, maritime, ocean, public safety, science & research","zh":"數據類別：農業、氣候、消費者、生態系統、教育、能源、金融、健康、地方政府、製造業、海事、海洋、公共安全、科學研究","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"The government encourages the public to create apps, and also provides workshops to teach the public how to create apps.","zh":"政府鼓勵公眾開發應用程式，亦舉辦工作坊教公眾如何開發。","kind":"note"}]},"19":{"n":19,"en":"Open Data – A Worldwide Trend in France","zh":"開放數據——法國的全球趨勢","p":[{"en":"Collaboration between public authorities and civil society","zh":"公共機構與公民社會的合作","lvl":0,"num":false},{"en":"Collaborative National Address Database \"Base Adresse Nationale\" – BAN (adresse.data.gouv.fr)","zh":"協作式全國地址數據庫「Base Adresse Nationale」（BAN）","lvl":0,"num":false},{"en":"To improve emergency response times","zh":"改善緊急應變時間","lvl":0,"num":false},{"en":"25 million addresses with their geographic coordinates","zh":"2,500 萬個地址及其地理坐標","lvl":0,"num":false},{"en":"Data produced by the Government with citizens' further contributions","zh":"數據由政府製作，並由市民進一步補充","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Problem before: no complete address database, and unclear places (even in HK).","zh":"以前的問題：沒有完整的地址數據庫，有些地方不清楚（香港也一樣）。","kind":"note"}]},"20":{"n":20,"en":"Open Data – A Worldwide Trend in Sweden (Trafikverket)","zh":"開放數據——瑞典的全球趨勢（瑞典運輸管理局）","p":[{"en":"Make real-time transport data available to companies or individuals upon free subscription, which is {exploited|利用} by third-party apps allowing travelers to make to-the-minute transport decisions.","zh":"免費訂閱即可向公司或個人提供實時交通數據，第三方應用程式利用這些數據，讓旅客作出精確到分鐘的出行決定。","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Need to subscribe → registration is needed.","zh":"需要訂閱 → 需要登記。","kind":"note"}]},"21":{"n":21,"en":"Open Data – A Worldwide Trend (London Datastore)","zh":"開放數據——全球趨勢（倫敦數據庫）","p":[{"en":"London Datastore: search 828 datasets; topics – jobs & economy, transport, environment, community safety, housing, communities, health, London as a world city","zh":"倫敦數據庫：可搜尋 828 個數據集；主題——就業與經濟、交通、環境、社區安全、房屋、社區、健康、倫敦作為國際城市","lvl":0,"num":false}]},"22":{"n":22,"en":"Open Data – A Worldwide Trend in Auckland (Auckland Transport Open GIS Data)","zh":"開放數據——奧克蘭的全球趨勢（奧克蘭交通開放 GIS 數據）","p":[{"en":"Auckland Transport's Open GIS Data website enables access, view, download and use of datasets about Auckland, to stimulate innovative ideas, services, apps and business","zh":"奧克蘭交通的開放 GIS 數據網站讓人存取、檢視、下載及使用奧克蘭數據集，以激發創新意念、服務、應用程式及商機","lvl":0,"num":false},{"en":"Themes: bus, train, ferry, roading, mooring, driving & parking, cycling","zh":"主題：巴士、火車、渡輪、道路、泊船、駕駛及泊車、單車","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Open data can be designed by theme (thematic open data), e.g., transport data only (air, road, sea).","zh":"開放數據可按主題設計（主題式開放數據），例如只包括交通數據（航空、道路、海上）。","kind":"note"}]},"23":{"n":23,"en":"App Built on Open Data – San Francisco Travel Guide","zh":"以開放數據建立的應用程式——三藩市旅遊指南","p":[{"en":"To show information of public facilities: parks, libraries, hospitals, bicycle rental stations (e.g., SF Recreation & Parks app: park map, park list, news, volunteer)","zh":"顯示公共設施資訊：公園、圖書館、醫院、單車租賃站（例如三藩市康樂及公園應用程式：公園地圖、公園列表、新聞、義工）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Helps businesses promote themselves → earn money.","zh":"幫助商戶宣傳 → 賺錢。","kind":"note"},{"en":"How app stores earn money: free apps vs. paid apps; *advertisement.","zh":"應用程式商店的賺錢方式：免費應用程式與收費應用程式；*廣告。","kind":"note"}]},"24":{"n":24,"en":"App Built on Open Data – CityMapper","zh":"以開放數據建立的應用程式——CityMapper","p":[{"en":"To provide real-time information of public transportation","zh":"提供公共交通的實時資訊","lvl":0,"num":false},{"en":"Based on open information from public transport operators in different cities","zh":"以不同城市公共交通營辦商的開放資訊為基礎","lvl":0,"num":false}]},"25":{"n":25,"en":"App Built on Open Data – Restaurant Inspection (Florida Apps)","zh":"以開放數據建立的應用程式——餐廳衞生巡查（佛羅里達州應用程式）","p":[{"en":"To alert citizens about restaurants with {undesirable|不理想的} conditions","zh":"提醒市民哪些餐廳衞生情況欠佳","lvl":0,"num":false},{"en":"Based on open data of inspection results of restaurants by Government","zh":"以政府餐廳巡查結果的開放數據為基礎","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"The app collects feedback from citizens. The developer did not have restaurant locations, so they downloaded the data from another source for users to plot and mark the feedback.","zh":"應用程式收集市民意見。開發者沒有餐廳位置，所以從其他來源下載數據，讓用戶在地圖上標示意見。","kind":"note"},{"en":"*Advertisement to earn money.","zh":"*以廣告賺錢。","kind":"note"}]},"26":{"n":26,"en":"Challenges of Open Data","zh":"開放數據的挑戰","p":[{"en":"Privacy concerns","zh":"私隱問題","lvl":0,"num":false},{"en":"Lose control over {confidential|機密的} information","zh":"失去對機密資料的控制","lvl":0,"num":false},{"en":"Expense of creating and {curating|整理管理} an open data portal","zh":"建立和管理開放數據平台的開支","lvl":0,"num":false},{"en":"Data must be machine-readable (API)","zh":"數據必須機器可讀（API）","lvl":0,"num":false},{"en":"Constant updating and promotion","zh":"不斷更新及推廣","lvl":0,"num":false},{"en":"Effort must be spent engaging the community","zh":"必須投入資源讓社區參與","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Privacy → according to laws!!!","zh":"私隱 → 必須依法！！！","kind":"note"},{"en":"Update frequency should be shown.","zh":"應註明更新頻率。","kind":"note"},{"en":"Google Maps shows when and where traffic congestion happens (Android OS comes from Google / Google apps on iPhones: too many phones in one place → calculation → road congested).","zh":"Google 地圖顯示何時何地塞車（Android 系統來自 Google／iPhone 上的 Google 應用程式：同一地點手機太多 → 計算 → 道路擠塞）。","kind":"note"}]},"27":{"n":27,"en":"Aggregate Information","zh":"匯總資訊","p":[{"en":"\"Collective data that relates to a group or category of services or customers, from which individual customer identities & characteristics have been removed\" – United States legislation","zh":"「與一組或一類服務或客戶有關的集體數據，當中已移除個別客戶的身份及特徵」——美國法例","lvl":0,"num":false},{"en":"To utilize these data can promote efficiency and create opportunities to the community","zh":"善用這些數據可提升效率，並為社會創造機會","lvl":0,"num":false}]},"28":{"n":28,"en":"Aggregate Information in Smart Mobility","zh":"智慧出行中的匯總資訊","p":[{"en":"{Crowdsource|群眾外包} drivers' information over mobile networks for real-time navigation service & traffic guide","zh":"透過流動網絡以群眾外包方式收集司機資料，提供實時導航及交通指引","lvl":0,"num":false},{"en":"Widely adopted in many countries, the service has a serious limitation – the data mainly depends on the no. of service subscribers, & cannot be {comprehensive|全面的}.","zh":"這種服務在很多國家廣泛使用，但有嚴重局限——數據主要取決於用戶數目，未能全面。","lvl":0,"num":false},{"en":"If the government can facilitate the opening up and sharing of big data on traffic, data from public transport companies and government road sensors would be useful sources of information. Together with drivers' input, this can form a complete traffic picture.","zh":"如政府能促進開放和共享交通大數據，公共交通公司和政府道路感應器的數據會是有用的資訊來源。再加上司機提供的數據，便能構成完整的交通圖像。","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Getting information from the public without consent.","zh":"在未經同意下從公眾取得資料。","kind":"note"}]},"29":{"n":29,"en":"Aggregate Data & Open Data Legislation – Singapore","zh":"匯總數據及開放數據立法——新加坡","p":[{"en":"Aggregate data from 3 telephone companies: Singtel, Starhub, M1","zh":"來自 3 間電話公司的匯總數據：新加坡電信、星和、M1","lvl":0,"num":false},{"en":"Predict commuting patterns for new retail outlet locations","zh":"預測通勤模式以決定新零售店選址","lvl":0,"num":false},{"en":"Crowd management for shopping malls","zh":"商場人流管理","lvl":0,"num":false},{"en":"Anonymous medical transactions for disease patterns analysis","zh":"以匿名醫療交易紀錄分析疾病模式","lvl":0,"num":false},{"en":"\"Big data is a valuable economic resource that lets authorities 'overcome its {intrinsic|固有的} limitations on land, human capital and natural resources'.\" – Chan Chun Sing, member of Singapore's Committee on the Future Economy","zh":"「大數據是寶貴的經濟資源，讓當局能『克服土地、人力資本和天然資源方面的固有限制』。」——陳振聲，新加坡未來經濟委員會成員","lvl":0,"num":false}]},"30":{"n":30,"en":"Aggregate Data & Open Data Legislation – Japan","zh":"匯總數據及開放數據立法——日本","p":[{"en":"Renewed Privacy Law: enables organizations to process or transfer customer information after data is {anonymized|匿名化}.","zh":"修訂私隱法：數據匿名化後，機構可處理或轉移客戶資料。","lvl":0,"num":false}]},"31":{"n":31,"en":"Aggregate Data & Open Data Legislation – Dubai","zh":"匯總數據及開放數據立法——杜拜","p":[{"en":"Aggregate data: anonymous cellular data to analyze traffic flow & {formulate|制定} measures to reduce congestion","zh":"匯總數據：以匿名手機數據分析交通流量，並制定措施減少擠塞","lvl":0,"num":false}]},"32":{"n":32,"en":"Aggregate Data & Open Data Legislation – New York","zh":"匯總數據及開放數據立法——紐約","p":[{"en":"Aggregate information: allows the use and sharing after removal of individual identities and characteristics","zh":"匯總資訊：移除個人身份及特徵後可使用及分享","lvl":0,"num":false},{"en":"Open Data Law legislated in 2012 {mandates|強制規定} all public information \"to be made available on a single web portal\" by end of 2018","zh":"2012 年立法的《開放數據法》強制規定所有公共資訊須在 2018 年底前「於單一網站提供」","lvl":0,"num":false}]},"33":{"n":33,"en":"Reforms on Open Data Issue – Australia (1 May 2018)","zh":"開放數據改革——澳洲（2018 年 5 月 1 日）","p":[{"en":"Establish a National Data Commissioner","zh":"設立國家數據專員","lvl":0,"num":false},{"en":"Introduce a Consumer Data Right (CDR)","zh":"引入消費者數據權","lvl":0,"num":false},{"en":"Set up a new National Data Advisory Council","zh":"成立新的國家數據諮詢委員會","lvl":0,"num":false}]}},"secs":{"A1":{"en":"A1. Basic Data Terms (Your Class Notes)","zh":"基本數據術語（你的課堂筆記）","p":[{"en":"Data 數據 · What we create & record about a {phenomenon|現象}.","zh":"為某個現象而建立及記錄的東西。","row":1},{"en":"Data source 數據來源 · The origin that the data comes from.","zh":"數據的出處。","row":1},{"en":"Raw data 原始數據 · Data in the form it was originally produced by the origin (not processed).","zh":"由來源最初產生、未經處理的數據。","row":1},{"en":"Source data 來源數據 · The data / information we collect from the data source. Source data and raw data come from the same data source.","zh":"我們從數據來源收集的數據／資訊。來源數據和原始數據來自同一來源。","row":1},{"en":"Information 資訊 · Data with meaning = data after processing.","zh":"有意義的數據＝經處理後的數據。","row":1},{"h":2,"kind":"key","en":"","zh":""},{"en":"The foundation of creating apps is having **open data**.","zh":"建立應用程式的基礎是擁有開放數據。","kind":"key"}],"terms":[["Data","數據","為某個現象建立及記錄下來的原始事實或數字。"],["Data source","數據來源","數據的出處，例如感應器、問卷、政府部門。"],["Raw data","原始數據","由來源最初產生、未經任何處理的數據。"],["Source data","來源數據","我們從數據來源收集回來的數據；與原始數據來自同一來源。"],["Information","資訊","經過處理、帶有意義的數據。數據本身沒有意義，處理後才變成資訊。"]]},"A2":{"en":"A2. Four Forms of Data in Smart Cities","zh":"智慧城市中的四種數據形式","p":[{"en":"Data in Cloud · Pay for actual usage; centralized & remote management; accessible in different locations · Backed up and stored around the world","zh":"雲端數據 · 按實際用量付費；集中及遙距管理；可在不同地方存取 · 在世界各地備份和儲存","row":1},{"en":"Big Data · Large and complex data sets (incl. {unstructured|非結構化的} data); too hard for traditional {relational databases|關聯式數據庫} (SQL); needs new tools like Hadoop · 龐大複雜的數據集（包括非結構化數據）；傳統關聯式數據庫（SQL）難以處理；需要 Hadoop 等新工具 · The \"iceberg\": what we know is only the top","zh":"大數據 · 「冰山」：我們知道的只是頂部","row":1},{"en":"Spatial Data · 80% of data in daily life is spatial; identifies geographic location of features and boundaries on Earth · Has coordinates (x, y, z → 3D)","zh":"空間數據 · 日常生活中 80% 數據是空間數據；標示地球上地物和邊界的地理位置 · 有坐標（x、y、z → 三維）","row":1},{"en":"Real-time Data · Collected from devices, sensor networks, IoT; e.g., parking spaces, trash bins, vehicles (GPS), energy turbines · 從裝置、感應器網絡、物聯網收集；例如車位、垃圾桶、車輛（GPS）、發電風機 · Really \"nearly real-time\" – there is always some {latency|延遲} (processing time)","zh":"實時數據 · 其實是「接近實時」——總有一些延遲（處理時間）","row":1},{"h":1,"en":"Why is data valuable for a smart city?","zh":"數據對智慧城市有何價值？"},{"en":"To understand **Where, When, How and Why** (of city phenomena)","zh":"了解城市現象的「何地、何時、如何、為何」","lvl":0,"num":true},{"en":"To support policy-making","zh":"支援政策制定","lvl":0,"num":true},{"en":"To optimize operations (especially with real-time data → make decisions promptly)","zh":"優化運作（特別是實時數據 → 迅速作決定）","lvl":0,"num":true},{"en":"To enable smart apps and services ({responsiveness|反應能力}: high response rate, real-time)","zh":"支援智慧應用及服務（反應快、實時）","lvl":0,"num":true}],"terms":[["Data in cloud","雲端數據","儲存在遠端伺服器（雲端）的數據；按用量付費、集中管理、在不同地點都可存取。"],["Big data","大數據","龐大而複雜、包括非結構化數據的數據集，傳統關聯式數據庫難以處理，需要 Hadoop 等新工具。"],["Relational database (SQL)","關聯式數據庫","以多個互相連結的表格儲存數據的傳統數據庫，用 SQL 語言查詢。"],["Hadoop","Hadoop 大數據平台","一種開源軟件，把大數據分散在多部電腦上儲存和處理。"],["Unstructured data","非結構化數據","沒有固定表格格式的數據，例如相片、影片、社交媒體文字。"],["Spatial data","空間數據","帶有坐標（x、y、z）的數據，可標示地物和邊界在地球上的位置。"],["Real-time data","實時數據","由感應器、物聯網即時產生的數據，例如車位、垃圾桶容量、車輛 GPS 位置。"],["Latency","延遲","數據產生到可以使用之間所需的處理時間；所以實時數據其實是「接近實時」。"]]},"A3":{"en":"A3. What Is Open Data?","zh":"甚麼是開放數據？","p":[{"h":2,"kind":"key","en":"Definition (European Union, 2015)","zh":""},{"en":"Open data is information that can be **freely used, modified and shared by anyone for any purpose**. It must be available under an **open licence** and provided in a convenient, modifiable form that is **machine readable**.","zh":"開放數據是任何人都可以為任何目的自由使用、修改及分享的資訊。它必須以開放授權提供，並以方便、可修改及機器可讀的形式提供。","kind":"key"},{"en":"Esri adds: open data is not just about sharing; it is about **using** data in innovative ways – creating apps, solutions and helping {stakeholders|持份者} make data-driven decisions. It helps citizens make life easier and helps the city become more efficient.","zh":"Esri 補充：開放數據不只是分享，更重要是以創新方式「使用」數據——開發應用程式和方案，協助持份者作出以數據為本的決定。它令市民生活更方便，亦令城市運作更有效率。"},{"h":1,"en":"The 8 Principles of Open Data","zh":"開放數據的八大原則"},{"en":"1. Complete 完整 · Covers the whole area, e.g., all HK territory","zh":"覆蓋整個地區，例如全港","row":1},{"en":"2. Primary 原始 · Should be the source data or raw data","zh":"應是來源數據或原始數據","row":1},{"en":"3. Timely 及時 · Data is updated","zh":"數據有更新","row":1},{"en":"4. Accessible 可存取 · Available to everyone","zh":"人人可取得","row":1},{"en":"5. Machine Processable 機器可處理 · Can be processed by computer (AI can now even process PDFs) · 可由電腦處理（現在 AI 甚至可處理 PDF）","zh":"","row":1},{"en":"6. Non-discriminatory 無歧視 · No registration required – free for anyone (registration is common for Chinese data). Not {compulsory|強制性的}.","zh":"毋須登記——任何人都可免費使用（內地數據常要求登記）。非強制。","row":1},{"en":"7. Non-proprietary 非專有 · Usable in all GIS software (not tied to one company's format) · 可在所有 GIS 軟件使用（不受單一公司格式限制）","zh":"","row":1},{"en":"8. License-free 免授權 · End users do not need to apply for a licence. Not compulsory – some data may be charged so the provider can earn money and keep the service going.","zh":"用戶毋須申請授權。非強制——有些數據可收費，讓提供者賺錢以維持服務。","row":1},{"h":2,"kind":"tip","en":"Memory trick","zh":""},{"en":"\"**C-P-T-A-M-N-N-L**\": **C**omplete, **P**rimary, **T**imely, **A**ccessible, **M**achine processable, **N**on-discriminatory, **N**on-proprietary, **L**icence-free.","zh":"記住英文首字母 C-P-T-A-M-N-N-L：完整、原始、及時、可存取、機器可處理、無歧視、非專有、免授權。","kind":"tip"}],"terms":[["Open data","開放數據","任何人都可以為任何目的自由使用、修改及分享的資訊，須以開放授權和機器可讀形式提供（歐盟定義）。"],["Open licence","開放授權","容許別人自由使用和再分發數據的法律許可。"],["Machine readable / processable","機器可讀／可處理","電腦可以直接讀取和處理的格式（例如 CSV、API），而不是只能用眼看的掃描文件。"],["Primary (principle)","原始（原則）","開放數據應是來源數據或原始數據，而不是經過加工的摘要。"],["Non-discriminatory","無歧視","任何人都可以使用，毋須登記或申請。"],["Non-proprietary","非專有","數據格式不受單一公司控制，可在所有 GIS 軟件中使用。"],["License-free","免授權","用戶毋須申請授權；但非強制，部分數據可收費以維持服務。"]]},"A4":{"en":"A4. Advantages, Value and Challenges of Open Data","zh":"開放數據的好處、價值與挑戰","p":[{"en":"Individual 個人 · Make more informed decisions & new services","zh":"作出更明智的決定，享用新服務","row":1},{"en":"Business 企業 · Cost-effective resource to combine with {proprietary|專有的} databases (companies combine open data with their own data)","zh":"具成本效益的資源，可與自家數據庫結合","row":1},{"en":"Government 政府 · Increase transparency & collaboration (e.g., Buildings Dept ↔ Lands Dept); direct improved city planning & job creation; drive the economy (avoid waste of time)","zh":"提高透明度及協作（例如屋宇署與地政總署）；改善城市規劃及創造職位；推動經濟（避免浪費時間）","row":1},{"en":"Global 全球 · Location-based open data could suggest sustainable solutions to address problems (especially useful for economics)","zh":"以位置為本的開放數據可提出可持續方案解決問題（對經濟尤其有用）","row":1},{"en":"**Highest-value domain = Geographic information** (can be used in 13 other data categories through maps). Then meteorological & environmental, economic & business, social, traffic & transport.","zh":"價值最高的範疇＝地理資訊（可透過地圖用於其他 13 類數據）。其次是氣象及環境、經濟及商業、社會、交通及運輸。","lvl":0,"num":false},{"en":"Sectors most applicable to open data (Deloitte, UK): **geospatial** and **environment** are top 2 – because city environments change very fast and relate to space. Economy and transport often involve personal information.","zh":"最適合開放數據的行業（德勤，英國）：首兩位是地理空間和環境——因為城市環境變化很快，且與空間有關。經濟和交通常涉及個人資料。","lvl":0,"num":false},{"en":"Value in the EU (European Commission 2020): market €184.45 bn (2019) → €199.51–334.20 bn (2025 forecast); 1.09 m jobs (2019) → 1.12–1.97 m (2025).","zh":"在歐盟的價值（歐盟委員會 2020）：市場規模 1,844.5 億歐元（2019）→ 1,995.1–3,342 億歐元（2025 預測）；就業 109 萬（2019）→ 112–197 萬（2025）。","lvl":0,"num":false},{"h":1,"en":"Six challenges of open data","zh":"開放數據的六大挑戰"},{"en":"Privacy concerns (must follow laws!)","zh":"私隱問題（必須依法！）","lvl":0,"num":false},{"en":"Lose control over {confidential|機密的} information","zh":"失去對機密資料的控制","lvl":0,"num":false},{"en":"Expense of creating and {curating|整理管理} an open data portal","zh":"建立和管理開放數據平台的開支","lvl":0,"num":false},{"en":"Data must be machine-readable (e.g., via API)","zh":"數據必須機器可讀（例如透過 API）","lvl":0,"num":false},{"en":"Constant updating and promotion (update frequency should be shown)","zh":"需要不斷更新及推廣（應註明更新頻率）","lvl":0,"num":false},{"en":"Effort must be spent engaging the community","zh":"必須投入資源讓社區參與","lvl":0,"num":false}],"terms":[["High value data domain","高價值數據範疇","商業再用價值最高的數據類別；地理資訊排第一，可用於其他 13 類數據。"],["Proprietary database","專有數據庫","公司自己擁有、不公開的數據庫；企業可把開放數據與之結合。"],["Transparency","透明度","政府公開資料，讓市民知道和監察政府工作。"],["National open government data (OGD) portal","國家政府開放數據平台","政府公開數據的官方網站；2020 年 79% 聯合國成員國設有此平台。"],["Thematic open data","主題式開放數據","只集中某一主題的開放數據，例如奧克蘭只提供交通數據。"],["Curating a data portal","管理數據平台","持續挑選、整理、更新和維護平台上的數據，需要人手和成本。"]]},"A5":{"en":"A5. Aggregate Information – Sharing Data Without Losing Privacy","zh":"匯總資訊——在保障私隱下共享數據","p":[{"h":2,"kind":"key","en":"Definition (US legislation)","zh":""},{"en":"Aggregate information = \"collective data that relates to a group or category of services or customers, from which **individual customer identities & characteristics have been removed**.\"","zh":"匯總資訊＝「與一組或一類服務或客戶有關的集體數據，當中已移除個別客戶的身份及特徵」。","kind":"key"},{"en":"Using it can promote efficiency and create opportunities for the community.","zh":"善用匯總資訊可提升效率，為社會創造機會。","lvl":0,"num":false},{"en":"**Smart mobility example:** apps crowdsource drivers' data for real-time navigation, but this is limited by the number of subscribers. If government opens traffic big data (public transport companies + road sensors) and combines it with drivers' input → a complete traffic picture.","zh":"智慧出行例子：應用程式透過群眾外包收集司機數據作實時導航，但受用戶數目限制。如政府開放交通大數據（公共交通公司＋道路感應器）並結合司機數據 → 可得到完整的交通情況。","lvl":0,"num":false},{"en":"Singapore 新加坡 · Aggregate data from 3 telcos (Singtel, Starhub, M1): predict commuting patterns for new shops, crowd management in malls, anonymous medical data for disease patterns","zh":"匯總 3 間電訊公司數據：預測通勤模式以選址開店、商場人流管理、以匿名醫療數據分析疾病模式","row":1},{"en":"Japan 日本 · Renewed privacy law: organisations can process/transfer customer data after it is {anonymized|匿名化}","zh":"修訂私隱法：數據匿名化後機構可處理／轉移客戶資料","row":1},{"en":"Dubai 杜拜 · Anonymous cellular data to analyse traffic flow and reduce congestion","zh":"以匿名手機數據分析交通流量、減少擠塞","row":1},{"en":"New York 紐約 · Aggregate information can be used after removing identities; Open Data Law (2012) required all public information on a single web portal by end of 2018","zh":"移除身份後可使用匯總資訊；《開放數據法》（2012）要求 2018 年底前所有公共資訊放在單一網站","row":1},{"en":"Australia 澳洲 · Reforms (1 May 2018): National Data Commissioner; Consumer Data Right (CDR); National Data Advisory Council","zh":"改革（2018 年 5 月 1 日）：國家數據專員；消費者數據權；國家數據諮詢委員會","row":1}],"terms":[["Aggregate information","匯總資訊","把一群人的數據合併，並移除個人身份及特徵後的集體數據（美國法例定義）。"],["Anonymize","匿名化","刪除姓名、身份證號碼等可識別個人的資料，令數據無法追溯到個人。"],["Crowdsourcing","群眾外包","從大量公眾收集數據或意見，例如導航應用程式收集司機的位置。"],["Open Data Law (New York, 2012)","《開放數據法》（紐約）","要求所有公共資訊在 2018 年底前放在單一網站公開的法律。"],["Consumer Data Right (CDR)","消費者數據權","澳洲 2018 年改革引入的權利，讓消費者可以取得和轉移自己的數據。"],["National Data Commissioner","國家數據專員","澳洲設立、負責監管數據共享的官員。"]]}}},"L3":{"slides":{"35":{"n":35,"en":"Data is \"New Oil\" – Data is Infrastructure","zh":"數據是「新石油」——數據就是基建","p":[{"en":"Data is a form of resources","zh":"數據是一種資源","lvl":0,"num":false},{"en":"Purpose of data infrastructure is \"To Protect & To Serve\"","zh":"數據基建的目的是「保護及服務」","lvl":0,"num":false},{"en":"\"Data are a valuable government asset, and should be thought of as infrastructure. We need to invest in it, protect it, and treat it as a platform for scientific discovery, economic growth, and private-sector innovation.\" (Sinai, 2014)","zh":"「數據是寶貴的政府資產，應被視為基建。我們需要投資、保護它，並把它視為科學發現、經濟增長及私營機構創新的平台。」（Sinai，2014）","lvl":0,"num":false},{"en":"How to deploy? The answer is… (SDI)","zh":"如何部署？答案是⋯⋯（SDI）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Data relates to the network (as infrastructure). Data → resource → infrastructure → smart city.","zh":"數據與網絡相關（作為基建）。數據 → 資源 → 基建 → 智慧城市。","kind":"note"}]},"37":{"n":37,"en":"What is SDI?","zh":"甚麼是 SDI？","p":[{"en":"The term Spatial Data Infrastructure was {coined|創造（術語）} in 1993 by the U.S. National Research Council to denote a framework of technologies, policies and institutional arrangements that together facilitate the creation, exchange, and use of geospatial data and related information resources across an information-sharing community.","zh":"「空間數據基礎設施」一詞由美國國家研究委員會於 1993 年提出，指由技術、政策及機構安排組成的框架，共同促進地理空間數據及相關資訊資源在資訊共享社群中的建立、交換和使用。","lvl":0,"num":true},{"en":"Such a framework can be implemented narrowly to enable the sharing of geospatial information within an organization or more broadly for use at a national, regional, or global level.","zh":"這個框架可狹義地在一個機構內共享地理空間資訊，或廣義地在國家、區域或全球層面使用。","lvl":0,"num":true},{"en":"In all cases, an SDI will provide an {institutionally sanctioned|經機構認可的}, automated means for posting, discovering, evaluating, and exchanging geospatial information by participating information producers and users.","zh":"在所有情況下，SDI 都會提供經機構認可的自動化方式，讓參與的資訊生產者和使用者發布、搜尋、評估及交換地理空間資訊。","lvl":0,"num":true},{"en":"SDI extends a GIS by ensuring geospatial data and standards are used to create {authoritative|權威的} datasets and policies that support it.","zh":"SDI 擴展 GIS，確保以地理空間數據和標準建立權威數據集及支援政策。","lvl":0,"num":true},{"h":2,"kind":"note","en":"","zh":""},{"en":"SDI = tech + policy + institution.","zh":"SDI ＝技術＋政策＋機構。","kind":"note"}]},"38":{"n":38,"en":"Digital Earth (1)","zh":"數碼地球（一）","p":[{"en":"Al Gore (31 Jan 1998): \"Now we have an {insatiable|無法滿足的} hunger for knowledge. Yet a great deal of data remains unused.\"","zh":"戈爾（1998 年 1 月 31 日）：「現在我們對知識有無法滿足的渴求，但大量數據仍然沒被使用。」","lvl":0,"num":false},{"en":"\"We need a 'Digital Earth'. A multi-resolution, three-dimensional representation of the planet, into which we can embed vast quantities of {geo-referenced|有地理參照的} data.\"","zh":"「我們需要一個『數碼地球』——一個多解像度、三維的地球模型，可嵌入大量有地理參照的數據。」","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"The US stored a lot of data, but it was unused and not public. Digital Earth → a spatial database.","zh":"美國儲存了大量數據，但未被使用、亦未公開。數碼地球 → 空間數據庫。","kind":"note"}]},"39":{"n":39,"en":"Digital Earth (2) – Key Developments","zh":"數碼地球（二）——主要發展","p":[{"en":"Promotion of Spatial Data Infrastructure (SDI) by Federal Geographic Data Committee (FGDC)","zh":"聯邦地理數據委員會（FGDC）推廣空間數據基礎設施","lvl":0,"num":false},{"en":"US Geological Survey (USGS): development of new methods and tools to supply timely, relevant, and useful information about the Earth and its processes","zh":"美國地質調查局（USGS）：開發新方法和工具，提供有關地球及其變化過程的及時、相關和有用資訊","lvl":0,"num":false},{"en":"The rise of Geobrowsers: NASA World Wind, Google Earth, Microsoft Bing Maps 3D, Esri ArcGIS Earth","zh":"地理瀏覽器興起：NASA World Wind、Google Earth、微軟 Bing Maps 3D、Esri ArcGIS Earth","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"FGDC: formulate the data format → let the data be shared → facilitate everyone to use / provide data.","zh":"FGDC：制定數據格式 → 令數據可共享 → 方便所有人使用／提供數據。","kind":"note"}]},"40":{"n":40,"en":"International Geospatial Effort – UN-GGIM: IGIF (The Integrated Geospatial Information Framework)","zh":"國際地理空間工作——聯合國全球地理空間資訊管理：綜合地理空間資訊框架（IGIF）","p":[{"en":"UN-GGIM = United Nations Global Geospatial Information Management","zh":"UN-GGIM ＝聯合國全球地理空間資訊管理","lvl":0,"num":false},{"en":"\"Geospatial information is a nation's 'digital currency' for evidence-based decision-making\"","zh":"「地理空間資訊是國家用於循證決策的『數碼貨幣』」","lvl":0,"num":false},{"en":"IGIF 9 pathways – **Governance:** Governance & Institutions; Legal & Policy; Financial. **Technology:** Data; Innovation; Standards. **People:** Partnerships; Capacity & Education; Communication & Engagement","zh":"IGIF 九條路徑——管治：管治與機構；法律與政策；財務。技術：數據；創新；標準。人：夥伴關係；能力建設與教育；溝通與參與","lvl":0,"num":false},{"en":"Framework around: Knowledge · Decisions · Development; Value · Applications · Technology; Users · Citizens · Access; Society · Economy · Environment","zh":"框架圍繞：知識、決策、發展；價值、應用、技術；用戶、市民、存取；社會、經濟、環境","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Governance: set a set of policies/procedures; look for partnerships (China's source is transformed from other countries, e.g., US – the accuracy).","zh":"管治：訂立一套政策／程序；尋找夥伴（中國的來源從其他國家轉化而來，例如美國——準確度）。","kind":"note"},{"en":"Technology: how to use the data to create apps. Standards: e.g., ISO.","zh":"技術：如何用數據開發應用程式。標準：例如 ISO。","kind":"note"},{"en":"People: open & proprietary software (open – users can keep it, all can use; proprietary – need a licence, keeps users, retains its own group of users). Partnerships → find NGOs. Capacity → server size, meet requests from the general public. Education → teach & engage the public.","zh":"人：開源及專有軟件（開源——用戶可保留、人人可用；專有——需授權、留住用戶、保有自己的用戶群）。夥伴 → 尋找非政府組織。能力 → 伺服器容量、滿足公眾需求。教育 → 教導公眾並讓他們參與。","kind":"note"}]},"41":{"n":41,"en":"The Roadmap for Open Data Infrastructure – 10 Key Steps","zh":"開放數據基建路線圖——十個關鍵步驟","p":[{"en":"1. Understand & Advocate 理解及倡導 · 6. Build Capacity 建立能力","zh":"","row":1},{"en":"2. Resource & Govern 資源及管治 · 7. Prioritise & Crowdsource 排優先次序及群眾外包","zh":"","row":1},{"en":"3. Align & Integrate 協調及整合 · 8. Connect & Communicate 連繫及溝通","zh":"","row":1},{"en":"4. Create & Commit 創建及承諾 · 9. Maintain & Sustain 維護及持續","zh":"","row":1},{"en":"5. Secure & Protect 保安及保護 · 10. Listen, Adjust & Share 聆聽、調整及分享","zh":"","row":1},{"en":"Part of the United Nations \"Making Cities Resilient Campaign – My City is Getting Ready\" (source: unisdr.org)","zh":"屬聯合國「建設具抗災能力城市運動——我的城市正在準備」的一部分（資料來源：unisdr.org）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Step 5: data leaking / protect privacy. Step 7: ask the public for their data (e.g., drones) – the data may be incorrect, so check accuracy; prioritise the resources to share/collect the data.","zh":"步驟 5：數據外洩／保護私隱。步驟 7：向公眾收集數據（例如無人機）——數據可能不準確，要檢查準確度；按優先次序分配資源以共享／收集數據。","kind":"note"},{"en":"Step 10: listen to hot topics from the general public.","zh":"步驟 10：聆聽公眾關注的熱門話題。","kind":"note"}]},"42":{"n":42,"en":"UK's National Location Data Framework","zh":"英國國家位置數據框架","p":[{"en":"One of the countries to adopt the UN Integrated Geospatial Information Framework (IGIF)","zh":"採用聯合國綜合地理空間資訊框架（IGIF）的國家之一","lvl":0,"num":false},{"en":"UK's Geospatial Strategy 2020 to 2025 (Jun 2020) – \"Unlocking the power of location\" by the Geospatial Commission","zh":"英國地理空間策略 2020–2025（2020 年 6 月）——地理空間委員會《釋放位置的力量》","lvl":0,"num":false},{"en":"UK has chosen to adopt the UN IGIF by implementing a national location data framework that is consistent with the IGIF.","zh":"英國選擇採用聯合國 IGIF，實施與 IGIF 一致的國家位置數據框架。","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"The UK follows the IGIF framework, but in the real world it does not follow all of the principles.","zh":"英國跟隨 IGIF 框架，但在現實中並未遵從所有原則。","kind":"note"}]},"43":{"n":43,"en":"What is Behind to Build a SDI?","zh":"建立 SDI 需要甚麼？","p":[{"en":"Policy & Institutional framework","zh":"政策及機構框架","lvl":0,"num":false},{"en":"Data & Technical standard","zh":"數據及技術標準","lvl":0,"num":false},{"en":"Technologies & Applications","zh":"技術及應用","lvl":0,"num":false},{"en":"People & Sharing","zh":"人及共享","lvl":0,"num":false},{"en":"Spatial Data Infrastructure (SDI) provides government departments as well as public and private organisations with an information infrastructure to share spatial data, supporting smart city applications","zh":"空間數據基礎設施為政府部門以及公私營機構提供資訊基建以共享空間數據，支援智慧城市應用","lvl":0,"num":false},{"en":"Diagram: GIS layers (real-time traffic, street, land use, elevation, real world) support governance & security, emergency & disaster, resource management, public health, education, sciences, economic development, more","zh":"圖示：GIS 圖層（實時交通、街道、土地用途、高度、真實世界）支援管治與保安、緊急事故與災害、資源管理、公共衞生、教育、科學、經濟發展等","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Policy → ↑ budget, ↑ resources. Data & standards → ↑ time cost to study the data.","zh":"政策 → ↑ 預算、↑ 資源。數據及標準 → ↑ 研究數據的時間成本。","kind":"note"},{"en":"Data can be shared through SDI. Tech: GIS (especially server-side GIS).","zh":"數據可透過 SDI 共享。技術：GIS（特別是伺服器端 GIS）。","kind":"note"}]},"44":{"n":44,"en":"CSDI is the Critical Component of the Digital Framework for Smart City Development","zh":"空間數據共享平台是智慧城市發展數碼框架的關鍵組成部分","p":[{"en":"Smart services (top): Smart Economy, Mobility, Environment, People, Living, Government","zh":"智慧服務（頂層）：智慧經濟、出行、環境、市民、生活、政府","lvl":0,"num":false},{"en":"Digital infrastructure – **Data Layer:** Big Data, Open Data, Common Spatial Data (= CSDI). **Integration Layer:** identity & access control; IoT/SCADA network; sensor asset management; data interconnect (message bus/API); administration. **Connectivity Layer:** fixed networks, mobile networks, Wi-Fi, RF mesh, LPWAN","zh":"數碼基建——數據層：大數據、開放數據、共用空間數據（＝CSDI）。整合層：身份及存取控制；物聯網／SCADA 網絡；感應器資產管理；數據互連（訊息匯流排／API）；行政管理。連接層：固網、流動網絡、Wi-Fi、射頻網狀網絡、低功耗廣域網","lvl":0,"num":false},{"en":"Data sources (bottom): data from sensors and actuators (roads, built environment, power, water, public spaces, transport, social infrastructure); data from citizens; data from B/D or public/private databases","zh":"數據來源（底層）：感應器及執行器數據（道路、建築環境、電力、水務、公共空間、交通、社會基建）；市民數據；政策局／部門或公私營數據庫","lvl":0,"num":false},{"en":"Digital enablers (side): data centre (cloud & application architecture); digital persona; standards; security/privacy protection","zh":"數碼賦能（旁側）：數據中心（雲端及應用架構）；數碼身份；標準；保安／私隱保護","lvl":0,"num":false},{"en":"Source: Report of Consultancy Study on Smart City Blueprint for Hong Kong, June 2017","zh":"資料來源：《香港智慧城市藍圖顧問研究報告》，2017 年 6 月","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Why do we need to separate open data and big data? Open data may include data that is not spatial; common spatial data focuses on spatial / location data.","zh":"為甚麼要分開開放數據和大數據？開放數據可能包括非空間數據；共用空間數據專注於空間／位置數據。","kind":"note"},{"en":"Private databases: e.g., bus companies (GPS locations, time and timetables).","zh":"私營數據庫：例如巴士公司（GPS 位置、時間及時間表）。","kind":"note"}]},"45":{"n":45,"en":"Why CSDI is so Important? The Backbone of Smart City","zh":"為甚麼空間數據共享平台如此重要？智慧城市的骨幹","p":[{"en":"80% of data is spatial – any data with a location…","zh":"80% 數據是空間數據——任何有位置的數據⋯⋯","lvl":0,"num":false},{"en":"Its importance: better city planning & management; unlock the wealth of existing knowledge & boost the economy; make right and {agile|靈活敏捷的} decisions","zh":"重要性：改善城市規劃與管理；釋放現有知識的價值並推動經濟；作出正確而靈活的決定","lvl":0,"num":false},{"en":"Many potential applications: Common Operation Picture (COP); risk assessment; pattern and hotspots analysis; route planning & navigation; spatial market research; … more","zh":"大量潛在應用：共用運作圖；風險評估；模式及熱點分析；路線規劃及導航；空間市場研究；⋯⋯及更多","lvl":0,"num":false}]},"46":{"n":46,"en":"Backbone Technology for Spatial Data Management is GIS","zh":"空間數據管理的骨幹技術是 GIS","p":[{"en":"GIS provides the location platform","zh":"GIS 提供位置平台","lvl":0,"num":false},{"en":"Integrating people, processes, things, and data about them","zh":"整合人、流程、事物及相關數據","lvl":0,"num":false},{"en":"Using the power of \"where\" to integrate everything","zh":"以「位置」的力量整合一切","lvl":0,"num":false},{"en":"System of Record; System of Insight; System of Engagement","zh":"紀錄系統；洞察系統；參與系統","lvl":0,"num":false}]},"47":{"n":47,"en":"National Geospatial Policy – Geospatial Data Management","zh":"國家地理空間政策——地理空間數據管理","p":[{"en":"1990 · U.S. 美國 · Federal Geographic Data Committee 聯邦地理數據委員會","zh":"","row":1},{"en":"2001 · Australia 澳洲 · Geoscience Australia 澳洲地球科學局","zh":"","row":1},{"en":"2007 · Japan 日本 · Geospatial Information Authority 國土地理院","zh":"","row":1},{"en":"2009 · Canada 加拿大 · The Canadian GeoSecretariat 加拿大地理秘書處","zh":"","row":1},{"en":"2016 · India 印度 · The Ministry of Communications and IT 通訊及資訊科技部","zh":"","row":1},{"en":"2017 · UK 英國 · Geospatial Commission 地理空間委員會","zh":"","row":1},{"en":"+ more…","zh":"及更多⋯⋯","lvl":0,"num":false}]},"48":{"n":48,"en":"The Release of OS MasterMap Data – 1st Project by Geospatial Commission","zh":"公開地形測量局 MasterMap 數據——地理空間委員會首個項目","p":[{"en":"Release some of the Ordnance Survey's MasterMap datasets for free, through API","zh":"透過 API 免費公開部分英國地形測量局 MasterMap 數據集","lvl":0,"num":false},{"en":"Estimated to boost the UK economy at least £130m each year","zh":"估計每年為英國經濟帶來至少 1.3 億英鎊","lvl":0,"num":false},{"en":"Layers: Topography Layer (including building heights & functional sites); Greenspace Layer; Highways Network; Water Network Layer; Detailed Path Network","zh":"圖層：地形圖層（包括建築物高度及功能場所）；綠化空間圖層；公路網絡；水網圖層；詳細路徑網絡","lvl":0,"num":false},{"en":"Partners: HM Land Registry, British Geological Survey, Valuation Office Agency, UK Hydrographic Office, The Coal Authority, Ordnance Survey","zh":"合作機構：英國土地註冊處、英國地質調查局、估價辦事處、英國水文辦公室、煤炭管理局、地形測量局","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Survey & mapping office (e.g., topographic maps).","zh":"測量及製圖機構（例如地形圖）。","kind":"note"}]},"49":{"n":49,"en":"SDI around the World – GeoPlatform (USA)","zh":"世界各地的 SDI——GeoPlatform（美國）","p":[{"en":"GeoPlatform (www.geoplatform.gov): provides shared and trusted geospatial data, services, and applications for use by the public and by government agencies and partners to meet their mission needs.","zh":"GeoPlatform（www.geoplatform.gov）：提供共享及可信的地理空間數據、服務和應用程式，供公眾、政府機構及合作夥伴使用，以滿足其任務需要。","lvl":0,"num":false}]},"50":{"n":50,"en":"SDI around the World – INSPIRE (European Union)","zh":"世界各地的 SDI——INSPIRE（歐盟）","p":[{"en":"INSPIRE Geoportal (http://inspire-geoportal.ec.europa.eu/): provides the means to search for spatial data sets and spatial data services, and subject to access restrictions, to view spatial data sets from the EU Member States within the framework of the INSPIRE {Directive|指令}.","zh":"INSPIRE 地理門戶（http://inspire-geoportal.ec.europa.eu/）：提供搜尋空間數據集及空間數據服務的途徑，並在存取限制下，於 INSPIRE 指令框架內檢視歐盟成員國的空間數據集。","lvl":0,"num":false}]},"51":{"n":51,"en":"SDI around the World – Singapore OneMap","zh":"世界各地的 SDI——新加坡 OneMap","p":[{"en":"An integrated map system for government agencies to deliver location-based services and information","zh":"供政府機構提供位置服務和資訊的綜合地圖系統","lvl":0,"num":false},{"en":"Used by the private sector and the community to create useful and value-added services","zh":"私營機構及社區亦用它來開發有用的增值服務","lvl":0,"num":false}]},"52":{"n":52,"en":"SDI Dubai Pulse – The Oil of the Future","zh":"SDI 杜拜 Pulse——未來的石油","p":[{"en":"\"Making Dubai the happiest city on Earth\"","zh":"「令杜拜成為地球上最快樂的城市」","lvl":0,"num":false},{"en":"Data views: various ways of visualising and exploring Dubai's data from various sources; interactive displays generate insights to enhance decision making and create business value","zh":"數據視圖：以多種方式視覺化及探索來自不同來源的杜拜數據；互動顯示提供洞見，改善決策並創造商業價值","lvl":0,"num":false},{"en":"Themes: Housing (city flow, property land distribution, property development projects, property buildings distribution); Utilities & Bills (stability & activity); Transport/Land (public transport ridership)","zh":"主題：房屋（城市人流、物業土地分佈、物業發展項目、樓宇分佈）；公用事業及賬單（穩定度及活動）；交通／土地（公共交通乘客量）","lvl":0,"num":false}]},"53":{"n":53,"en":"SDI GeoHive in Ireland – Driving the Irish Economy","zh":"SDI 愛爾蘭 GeoHive——推動愛爾蘭經濟","p":[{"en":"Benefits of the agency's open data strategy: enables the public sector to annually save an estimated $92m (€82 million); frees up enough time equal to an estimated $316m (€279 million); provides competition benefits across the nation of an estimated $118m (€104 million)","zh":"開放數據策略的好處：公營部門每年估計節省 9,200 萬美元（8,200 萬歐元）；騰出的時間估計價值 3.16 億美元（2.79 億歐元）；為全國帶來估計 1.18 億美元（1.04 億歐元）的競爭效益","lvl":0,"num":false}]},"55":{"n":55,"en":"SDI around the World – Living Atlas and GeoHub in LA","zh":"世界各地的 SDI——Living Atlas 及洛杉磯 GeoHub","p":[{"en":"ArcGIS Living Atlas of the World: the foremost collection of geographic information from around the globe – maps, apps and data layers (transportation, environment, business, landscape, habitats, hydro, infrastructure, movement, basemaps, elevation, boundaries, land cover, traffic, imagery, oceans, POI, demographics, weather, hazards, soils, authoritative & community content…)","zh":"ArcGIS 世界活地圖集：全球最重要的地理資訊集，包括地圖、應用程式及數據圖層（交通、環境、商業、地貌、生境、水文、基建、移動、底圖、高度、邊界、土地覆蓋、交通流量、影像、海洋、興趣點、人口、天氣、災害、土壤、權威及社群內容⋯⋯）","lvl":0,"num":false},{"en":"GeoHub in Los Angeles (Mayor Eric Garcetti)","zh":"洛杉磯 GeoHub（市長 Eric Garcetti）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Living Atlas = global; GeoHub = city level.","zh":"Living Atlas ＝全球；GeoHub ＝城市層面。","kind":"note"}]},"56":{"n":56,"en":"City of Los Angeles – GeoHub","zh":"洛杉磯市——GeoHub","p":[{"en":"Los Angeles GeoHub website (data catalog, developer resources, blog, about the Mayor), e.g., LA Metro bus routes","zh":"洛杉磯 GeoHub 網站（數據目錄、開發者資源、網誌、關於市長），例如洛杉磯地鐵巴士路線","lvl":0,"num":false}]},"57":{"n":57,"en":"Chief Data Officer (CDO)","zh":"首席數據總監","p":[{"en":"International Society of CDO:","zh":"國際首席數據總監協會：","lvl":0,"num":false},{"en":"CDO is a senior executive who bears responsibilities of creating data governance policies and using Big Data strategically to identify new business opportunities and reduce operating costs","zh":"首席數據總監是高級行政人員，負責制定數據管治政策，並策略性運用大數據以找出新商機及降低營運成本","lvl":1,"num":false},{"en":"CDO must ensure that users have easy access to relevant data and reporting tools, and be able to trust in the data's quality","zh":"首席數據總監必須確保用戶能方便取得相關數據及報告工具，並信任數據質素","lvl":1,"num":false},{"en":"Gartner: 50% of all companies in regulated industries will have a CDO","zh":"Gartner：受規管行業中 50% 公司會設有首席數據總監","lvl":0,"num":false},{"en":"\"The new hero of big data and analytics\": needs a T-shaped skill set (business acumen + data/analytics skills); is a business executive (not a technician, programmer or data scientist); has technical knowledge of data and its potential as an asset","zh":"「大數據與分析的新英雄」：需要 T 型技能（商業觸覺＋數據分析技能）；是商業行政人員（不是技術員、程式員或數據科學家）；具備數據及其資產潛力的技術知識","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Which apps are needed by citizens?","zh":"市民需要哪些應用程式？","kind":"note"}]},"58":{"n":58,"en":"The L.A. GeoHub Ecosystem","zh":"洛杉磯 GeoHub 生態系統","p":[{"en":"Initiative pages – focused collaboration (**Rally**), e.g., Vision Zero","zh":"倡議頁面——重點協作（「凝聚」），例如零死亡願景","lvl":0,"num":false},{"en":"Public engagement experience – hub site: maps, data, apps & initiatives (**Engage** the public)","zh":"公眾參與體驗——平台網站：地圖、數據、應用程式及倡議（讓公眾「參與」）","lvl":0,"num":false},{"en":"Internal collaboration workspace – find, use, create, and collaborate (**Share & Collaborate**, city employees)","zh":"內部協作空間——尋找、使用、建立及協作（「共享及協作」，市政府僱員）","lvl":0,"num":false},{"en":"GIS infrastructure – hosted services, departmental servers or ArcGIS Online (**Serve & Power**): Bureau of Engineering, Bureau of Street Services, LA County","zh":"GIS 基建——託管服務、部門伺服器或 ArcGIS Online（「服務及支援」）：工程局、街道服務局、洛杉磯縣","lvl":0,"num":false},{"en":"Information & engagement products – \"open data in action\" (**Create & Innovate**): App Challenge (coming soon), apps & maps, curated policy map gallery","zh":"資訊及參與產品——「開放數據實踐」（「創造及創新」）：應用程式挑戰賽（即將推出）、應用程式及地圖、政策地圖精選","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Internal use. Facing the public → the public can download the data to use. Some sensitive data is not shared with the public (processed data).","zh":"內部使用。面向公眾 → 公眾可下載數據使用。部分敏感數據不向公眾共享（經處理數據）。","kind":"note"}]},"59":{"n":59,"en":"GeoHub Provides Open Data Portal and Open APIs for Developers to Access the Data Directly via Web Services","zh":"GeoHub 提供開放數據平台及開放 API，讓開發者透過網絡服務直接存取數據","p":[{"en":"Example: Metro Bus Lines dataset – download as spreadsheet, KML or shapefile; APIs: GeoJSON and GeoService (full or filtered dataset)","zh":"例子：地鐵巴士路線數據集——可下載為試算表、KML 或 shapefile；API：GeoJSON 及 GeoService（完整或篩選數據集）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"**API** = Application Programming Interface. Cannot ensure the API is always on.","zh":"API ＝應用程式介面。無法保證 API 永遠運作。","kind":"note"},{"en":"**SLA (service level agreement)** → availability of their service; they promise 99% / 99.9% / 99.99%, but never 100%.","zh":"SLA（服務水平協議）→ 服務可用性；承諾 99%／99.9%／99.99%，但永遠不是 100%。","kind":"note"},{"en":"Downloads (spreadsheet/KML/shapefile) = backup when the API is unavailable; but downloading has additional cost + is time-consuming – need to download the shapefile & update data regularly. With an API, no need to download data regularly.","zh":"下載（試算表／KML／shapefile）＝API 不可用時的後備；但下載有額外成本且費時——需要下載 shapefile 並定期更新數據。有 API 就毋須定期下載數據。","kind":"note"}]},"60":{"n":60,"en":"GeoHub – Clean Streets Index","zh":"GeoHub——街道清潔指數","p":[{"en":"As part of Mayor Eric Garcetti's Clean Streets initiative, the City Bureau of Sanitation quarterly drives all of LA's public streets and alleys (traveling over 22,000 miles!) and gives each block a \"cleanliness score\" from 1–3: 1. Clean; 2. Somewhat Clean; 3. Not Clean","zh":"作為市長 Eric Garcetti「清潔街道」計劃的一部分，市衞生局每季駕車走遍洛杉磯所有公共街道及小巷（行駛超過 22,000 英里！），為每段街道評「清潔分數」1–3：1. 清潔；2. 頗清潔；3. 不清潔","lvl":0,"num":false},{"en":"Each street score is based on four factors: litter, weeds, bulky items and illegal dumping","zh":"每條街道的分數基於四個因素：垃圾、雜草、大型廢物及非法棄置","lvl":0,"num":false},{"en":"Los Angeles is the only big city in the US conducting a regular cleanliness assessment of every city street","zh":"洛杉磯是美國唯一定期評估每條街道清潔度的大城市","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Quiz! Crowdsourcing (marks of the streets) → maybe accurate. Shows streets that need to be cleaned; prioritize the order of cleaning; encourage the public to provide data.","zh":"測驗重點！群眾外包（為街道評分）→ 可能準確。顯示需要清潔的街道；排列清潔的優先次序；鼓勵公眾提供數據。","kind":"note"}]},"61":{"n":61,"en":"GeoHub – Road to 2400","zh":"GeoHub——邁向 2400","p":[{"en":"Timeline map of LA's road repair programme: July 2013 Mayor Garcetti takes office with a \"Back to Basics\" agenda; June 2014 Bureau of Street Services completes 2,200 lane miles; July 2014 \"2400 Working Group\" formed; June 2015 2,400 lane-mile goal reached; Dec 2015 on track for another record year","zh":"洛杉磯道路維修計劃的時間線地圖：2013 年 7 月 Garcetti 市長以「回歸基本」議程上任；2014 年 6 月街道服務局完成 2,200 車道英里；2014 年 7 月成立「2400 工作小組」；2015 年 6 月達成 2,400 車道英里目標；2015 年 12 月有望再創紀錄","lvl":0,"num":false}]},"62":{"n":62,"en":"GeoHub – Street Wize","zh":"GeoHub——Street Wize","p":[{"en":"Map of current and upcoming street work (e.g., 65 projects within 0.5 mile): city capital improvement projects, street excavation, building materials lay-down areas","zh":"顯示現有及即將進行的道路工程地圖（例如 0.5 英里內 65 個項目）：市政基本工程、掘路工程、建築材料堆放區","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Shows how the road works – whether you should do construction or not. The public can use this data to create apps for whatever public/private use.","zh":"顯示道路工程情況——是否應進行施工。公眾可利用這些數據開發任何公私用途的應用程式。","kind":"note"}]},"63":{"n":63,"en":"L.A. GeoHub – A Successful Hub Strategy","zh":"洛杉磯 GeoHub——成功的平台策略","p":[{"en":"Success factors: explorable data; includes map and operational data; opens data internally and externally; launches apps for immediate use; provides context of issues through Story Maps; offers training and developer resources; {leverages|善用} a larger ecosystem","zh":"成功因素：可探索的數據；包括地圖及運作數據；對內對外開放數據；推出即時可用的應用程式；以 Story Maps 提供議題背景；提供培訓及開發者資源；善用更大的生態系統","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"(Skipped in class.)","zh":"（課堂上略過。）","kind":"note"}]},"64":{"n":64,"en":"Mayor's Dashboard","zh":"市長儀表板","p":[{"en":"To display a range of daily statistics covering areas such as public safety, city services, human services and economic development","zh":"顯示一系列每日統計數字，涵蓋公共安全、市政服務、社會服務及經濟發展等範疇","lvl":0,"num":false},{"en":"Let both the Mayor and the public track daily operations and progress on major strategic objectives","zh":"讓市長和公眾追蹤日常運作及主要策略目標的進度","lvl":0,"num":false},{"en":"Data from various open data sources including GeoHub (examples: LA \"Back to Basics\", City of Boston)","zh":"數據來自包括 GeoHub 在內的多個開放數據來源（例子：洛杉磯「回歸基本」、波士頓市）","lvl":0,"num":false}]},"66":{"n":66,"en":"What is COP (Common Operation Picture)","zh":"甚麼是共用運作圖","p":[{"en":"The Common Operational Picture provides a central location to access a suite of maps and applications for the various groups within the Emergency Operations Center (EOC). The applications support focused workflows and allow each group to contribute to a common operational dataset through a shared services catalog.","zh":"共用運作圖為緊急應變中心內的不同小組提供一個存取一系列地圖和應用程式的中央平台。這些應用程式支援專注的工作流程，讓每個小組透過共享服務目錄，為同一套運作數據集作出貢獻。","lvl":0,"num":false},{"en":"Example screen: police / fire / EMS views; incidents in past 60 minutes; Brooklyn, Bronx, Manhattan","zh":"例子畫面：警察／消防／救護視圖；過去 60 分鐘的事故；布魯克林、布朗克斯、曼哈頓","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Only numerical data.","zh":"只有數字數據。","kind":"note"}]},"67":{"n":67,"en":"COP for Public Safety & Security in Boston Marathon","zh":"波士頓馬拉松的公共安全及保安共用運作圖","p":[{"en":"Common Operating Picture (COP) – Online Operations Dashboard","zh":"共用運作圖——網上運作儀表板","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Can extend to other activities.","zh":"可應用到其他活動。","kind":"note"}]},"69":{"n":69,"en":"What is… Map-Centric City Dashboard","zh":"甚麼是⋯⋯以地圖為中心的城市儀表板","p":[{"en":"Provide at-a-glance views of KPI","zh":"一目了然地顯示關鍵績效指標","lvl":0,"num":false},{"en":"Interactive (trigger response in other elements)","zh":"互動（觸發其他元素作出反應）","lvl":0,"num":false},{"en":"Support real-time data feeds","zh":"支援實時數據","lvl":0,"num":false},{"en":"Data display includes a map or spatial context","zh":"數據顯示包括地圖或空間背景","lvl":0,"num":false},{"en":"Share with others","zh":"可與他人分享","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"The tech behind it is GIS.","zh":"背後的技術是 GIS。","kind":"note"}]},"70":{"n":70,"en":"Key Usage Pattern – Map-Centric City Dashboard","zh":"主要用途模式——以地圖為中心的城市儀表板","p":[{"en":"**Monitor and manage operations/assets:** IoT; CoP","zh":"監察及管理運作／資產：物聯網；共用運作圖","lvl":0,"num":false},{"en":"**Event management:** {situational awareness|態勢感知}; emergency management","zh":"事件管理：態勢感知；緊急事故管理","lvl":0,"num":false},{"en":"**Executive summaries:** visualize & compare; reporting dashboard","zh":"行政摘要：視覺化及比較；報告儀表板","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"Get data from (IoT) & make charts, identify the trend & changes rapidly.","zh":"從物聯網取得數據並製作圖表，迅速找出趨勢和變化。","kind":"note"}]},"71":{"n":71,"en":"Utilization of COP & Map-Centric Dashboard for Sharing Disaster Information – Kumamoto Earthquake 2016","zh":"運用共用運作圖及地圖儀表板共享災害資訊——2016 年熊本地震","p":[{"en":"Response & recovery management: damage estimation – rescue management – recovery progress (e.g., evacuation shelters, housing construction)","zh":"應變及復原管理：損毀估算——救援管理——復原進度（例如避難所、房屋重建）","lvl":0,"num":false},{"en":"Source: ArcGIS MapJournal (Esri Japan)","zh":"資料來源：ArcGIS MapJournal（Esri 日本）","lvl":0,"num":false}]},"74":{"n":74,"en":"Interactive Map Dashboards Track & Visualize the Coronavirus (COVID-19)","zh":"互動地圖儀表板追蹤及視覺化新冠病毒","p":[{"en":"Using GIS for mapping and sharing disease information","zh":"運用 GIS 繪製及分享疾病資訊","lvl":0,"num":false},{"en":"Local – Hong Kong (HK Government); Regional – China (China CDC); Global (JHU – Johns Hopkins University)","zh":"本地——香港（香港政府）；區域——中國（中國疾控中心）；全球（約翰霍普金斯大學）","lvl":0,"num":false},{"h":2,"kind":"note","en":"","zh":""},{"en":"2 days to set up the dashboard. SARS (2003) – took a month to set up.","zh":"兩天就建立了儀表板。沙士（2003）——花了一個月才建立。","kind":"note"}]},"76":{"n":76,"en":"Open Data in Hong Kong","zh":"香港的開放數據","p":[{"en":"3 ways of {dissemination|發放}: viewing only; downloadable; consumable by Application Programming Interfaces (APIs)","zh":"三種發放方式：只供瀏覽；可下載；可透過應用程式介面（API）使用","lvl":0,"num":false},{"en":"DATA.GOV.HK – applications developed by community with Data.gov.hk datasets (e.g., property, street, traffic, transport apps) + more…","zh":"資料一線通——社區以資料一線通數據集開發的應用程式（例如物業、街道、交通、運輸應用程式）及更多","lvl":0,"num":false}]},"78":{"n":78,"en":"Hong Kong Smart City Dashboards to Visualise Real-time & Dynamic City Data","zh":"香港智慧城市儀表板
